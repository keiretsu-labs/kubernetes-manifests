---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Generate and encrypt Talos secrets
    cmds:
      - |
        if [ ! -f "talsecret.sops.yaml" ]; then
            echo "Generating new Talos secrets..."
            talosctl gen secrets -o talsecret.yaml
            echo "Encrypting secrets with PGP key..."
            sops --encrypt --pgp FAC8E7C3A2BC7DEE58A01C5928E1AB8AF0CF07A5 talsecret.yaml > talsecret.sops.yaml
            rm talsecret.yaml
            echo "Secrets generated and encrypted"
        else
            echo "Secrets file already exists"
        fi

  genconfig:
    desc: Render Talos machine configs and talosconfig into clusterconfig/
    cmds:
      - topf render -o clusterconfig
      - topf talosconfig > clusterconfig/talosconfig
      - chmod 600 clusterconfig/talosconfig
    preconditions:
      - sh: test -f topf.yaml
        msg: Missing topf.yaml
      - sh: test -f talsecret.sops.yaml
        msg: Missing talsecret.sops.yaml - run 'mise run init' first

  diff:
    desc: Show what apply would change on each node (exit 2 when anything differs)
    cmd: topf apply --dry-run --confirm=false

  apply:
    desc: Apply Talos configuration node by node, waiting for each to stay Ready
    cmd: topf apply

  apply-insecure:
    desc: Apply Talos configuration to nodes in maintenance mode (initial install)
    cmd: topf apply

  apply-staged:
    desc: Stage Talos config — applied on each node's next reboot (no immediate disruption)
    cmd: topf apply --mode=staged

  bootstrap:
    desc: Bootstrap the etcd cluster on the first control-plane node
    cmd: topf apply --auto-bootstrap

  kubeconfig:
    desc: Fetch kubeconfig from Talos cluster
    cmds:
      - talosctl kubeconfig ../../ --force -n 192.168.169.118 -e 192.168.169.118
      - chmod 600 ../../kubeconfig
    preconditions:
      - sh: test -f clusterconfig/talosconfig
        msg: Missing clusterconfig/talosconfig - run 'mise run genconfig' first

  dashboard:
    desc: Open Talos dashboard
    cmd: talosctl dashboard --nodes rei,asuka,kaji

  health:
    desc: Check cluster health
    cmd: talosctl health --server=false

  reset:
    desc: Reset nodes back to maintenance mode (DESTRUCTIVE)
    prompt: This will destroy your cluster! Continue?
    cmd: topf reset --full=false --graceful=false

  upgrade:
    desc: Upgrade Talos on a node
    cmd: talosctl --nodes {{.node}} upgrade --image {{.image}} --wait=true --timeout=10m --preserve=true
    requires:
      vars: ["node", "image"]
    preconditions:
      - msg: Unable to connect to node
        sh: talosctl --nodes {{.node}} version

  upgrade-k8s:
    desc: Upgrade Kubernetes across the cluster
    cmd: talosctl --nodes {{.controller}} upgrade-k8s --to {{.to}}
    requires:
      vars: ["controller", "to"]
    preconditions:
      - msg: Unable to connect to controller
        sh: talosctl --nodes {{.controller}} version
