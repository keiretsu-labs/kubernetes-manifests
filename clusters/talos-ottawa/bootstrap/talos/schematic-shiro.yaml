---
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/gvisor
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/kata-containers
      - siderolabs/nut-client
      - siderolabs/binfmt-misc
      - siderolabs/util-linux-tools
  extraKernelArgs:
    - apparmor=0
    - init_on_alloc=0
    - init_on_free=0
    - intel_idle.max_cstate=0
    - intel_iommu=on
    - iommu=pt
    - mitigations=off
    - security=none
    - talos.auditd.disabled=1
    - net.ifnames=0
    - cpufreq.default_governor=performance
    - talos.logging.kernel=tcp://10.169.69.51:5170/
