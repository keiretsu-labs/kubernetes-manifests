---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-settings
  namespace: flux-system
data:
  COMMON_DOMAIN: keiretsu.top
  K8GB_EXT_GEO_TAGS: "ottawa,robbinsdale,stpetersburg"

  # Shared public/private LB space. Tailscale LBs stay on the per-site
  # CLUSTER_LOAD_BALANCER_CIDR (.69.x nameserver, .100.x PeerRelay).
  # UniFi: k8s-public 10.6.0.0/16 gw 10.6.0.254; k8s-private 10.7.0.0/16 gw 10.7.0.254.
  # 10.6.0.0/24 and 10.7.0.0/24 are UniFi-only. Cilium carves 10.{6,7}.${SITE_ID}.0/24.
  SHARED_PUBLIC_LB_CIDR: "10.6.0.0/16"
  SHARED_PUBLIC_LB_GATEWAY: "10.6.0.254"
  SHARED_PRIVATE_LB_CIDR: "10.7.0.0/16"
  SHARED_PRIVATE_LB_GATEWAY: "10.7.0.254"

  # Garage scheduling defaults — CRD rejects YAML null on these fields, so we
  # supply empty JSON object/array. Clusters with specific placement needs
  # override in their flux/vars/cluster-settings.yaml.
  GARAGE_REPLICAS: "1"
  GARAGE_GATEWAY_REPLICAS: "2"
  GARAGE_NODE_SELECTOR: '{}'
  GARAGE_GATEWAY_AFFINITY: '{}'
  GARAGE_TOPOLOGY_SPREAD: '[]'