---
apiVersion: v1
kind: ConfigMap
metadata:
  name: common-settings
  namespace: flux-system
data:
  COMMON_DOMAIN: keiretsu.top
  K8GB_EXT_GEO_TAGS: "ottawa,robbinsdale,stpetersburg"

  # Shared LB space for keiretsu-wide VIPs. One UniFi network, not public vs
  # private — those are Gateway listeners, and we already mix both on the
  # per-site /16. Tailscale (.69.50, .100.100) stays on CLUSTER_LOAD_BALANCER_CIDR.
  # Gateway 10.69.0.254; 10.69.0.0/24 is UniFi-only; Cilium carves 10.69.${SITE_ID}.0/24.
  SHARED_LOAD_BALANCER_CIDR: "10.69.0.0/16"
  SHARED_LOAD_BALANCER_GATEWAY: "10.69.0.254"

  # Garage scheduling defaults — CRD rejects YAML null on these fields, so we
  # supply empty JSON object/array. Clusters with specific placement needs
  # override in their flux/vars/cluster-settings.yaml.
  GARAGE_REPLICAS: "1"
  GARAGE_GATEWAY_REPLICAS: "2"
  GARAGE_NODE_SELECTOR: '{}'
  GARAGE_GATEWAY_AFFINITY: '{}'
  GARAGE_TOPOLOGY_SPREAD: '[]'