---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  LOCATION: eks-use1
  FAILOVER: ottawa
  SITE_ID: "4"
  TIMEZONE: America/New_York
  CLUSTER_NAME: eks-use1
  CLUSTER_DISPLAY_NAME: "EKS us-east-1 (peer-relay repro)"

  # EKS defaults (AWS VPC CNI). LB CIDR is unused on EKS — peer-relay uses NLB.
  CLUSTER_POD_CIDR: 10.80.0.0/16
  CLUSTER_SERVICE_CIDR: 172.20.0.0/16
  CLUSTER_LOAD_BALANCER_CIDR: 10.80.0.0/16
  LAN_CIDR: 10.80.0.0/16

  CLUSTER_DOMAIN: eks-use1.keiretsu.top
  STORAGECLASS_DEFAULT: gp2
  STORAGECLASS_LONGTERM: gp2
  STORAGECLASS_METADATA: gp2
