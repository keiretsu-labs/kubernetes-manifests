---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kubernetes-manifests
  namespace: flux-system
spec:
  interval: 1m
  url: "https://github.com/keiretsu-labs/kubernetes-manifests.git"
  ref:
    branch: "eks-use1-peer-relay-repro"
  secretRef:
    name: kubernetes-manifests-github-token
  ignore: |
    /*
    !/clusters/common
    !/clusters/eks-use1
    !/kubernetes
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/eks-use1/flux
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common-cluster
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/common/flux
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubernetes-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes/apps/eks-use1
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: common-settings
      - kind: Secret
        name: common-secrets
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          wait: false
          decryption:
            provider: sops
            secretRef:
              name: sops-gpg
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: common-settings
              - kind: Secret
                name: common-secrets
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets
                optional: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
