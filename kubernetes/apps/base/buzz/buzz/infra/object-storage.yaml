---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: buzz
spec:
  clusterRef:
    name: garage
    namespace: garage
  globalAlias: buzz
  quotas:
    maxSize: 200Gi
    maxObjects: 10000000
  keyPermissions:
    - keyRef:
        name: buzz-key
      read: true
      write: true
      owner: true
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: buzz-key
spec:
  clusterRef:
    name: garage
    namespace: garage
  name: Buzz Relay Key
  secretTemplate:
    name: buzz-s3
    accessKeyIdKey: BUZZ_S3_ACCESS_KEY
    secretAccessKeyKey: BUZZ_S3_SECRET_KEY
  bucketPermissions:
    - bucketRef:
        name: buzz
      read: true
      write: true
      owner: true
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: buzz-postgres
spec:
  clusterRef:
    name: garage
    namespace: garage
  globalAlias: buzz-postgres
  quotas:
    maxSize: 100Gi
    maxObjects: 1000000
  keyPermissions:
    - keyRef:
        name: buzz-postgres-key
      read: true
      write: true
      owner: true
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: buzz-postgres-key
spec:
  clusterRef:
    name: garage
    namespace: garage
  name: Buzz Postgres Backup Key
  secretTemplate:
    name: buzz-postgres-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: buzz-postgres
      read: true
      write: true
      owner: true
---
