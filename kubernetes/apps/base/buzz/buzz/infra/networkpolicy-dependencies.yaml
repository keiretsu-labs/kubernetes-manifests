---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-postgres-ingress
spec:
  description: Keep the dedicated Buzz database private to the relay, CNPG, and monitoring.
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: buzz-postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: buzz
            app.kubernetes.io/instance: buzz
            app.kubernetes.io/component: relay
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: buzz-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus-agent
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-redis-ingress
spec:
  description: Keep the dedicated Dragonfly service private to Buzz, its replicas, the operator, and monitoring.
  endpointSelector:
    matchLabels:
      app: dragonfly-buzz
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: buzz
            app.kubernetes.io/instance: buzz
            app.kubernetes.io/component: relay
        - matchLabels:
            app: dragonfly-buzz
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dragonfly-operator-system
            io.cilium.k8s.policy.serviceaccount: dragonfly-operator-controller-manager
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "9999"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus-agent
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-minio-ingress
spec:
  description: Keep Buzz's authoritative object store private to the relay, bucket initializer, and backup worker.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: buzz
      app.kubernetes.io/component: object-storage
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: buzz
            app.kubernetes.io/instance: buzz
            app.kubernetes.io/component: relay
        - matchLabels:
            app.kubernetes.io/name: minio
            app.kubernetes.io/instance: buzz
            app.kubernetes.io/component: bucket-init
        - matchLabels:
            app.kubernetes.io/name: buzz
            app.kubernetes.io/instance: buzz
            app.kubernetes.io/component: object-backup
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /minio/health/live$
              - method: GET
                path: /minio/health/ready$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-minio-bucket-init-egress
spec:
  description: Allow the declarative bucket initializer to reach only MinIO and cluster DNS.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: buzz
      app.kubernetes.io/component: bucket-init
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: minio
            app.kubernetes.io/instance: buzz
            app.kubernetes.io/component: object-storage
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-object-backup-egress
spec:
  description: Allow the object backup worker to reach only Buzz MinIO, Garage's S3 gateway, and cluster DNS.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buzz
      app.kubernetes.io/instance: buzz
      app.kubernetes.io/component: object-backup
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: buzz
            app.kubernetes.io/name: minio
            app.kubernetes.io/instance: buzz
            app.kubernetes.io/component: object-storage
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage
            app.kubernetes.io/name: garage
            app.kubernetes.io/instance: garage
            garage.rajsingh.info/tier: gateway
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
