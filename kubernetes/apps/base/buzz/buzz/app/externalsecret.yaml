---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-local
    kind: ClusterSecretStore
  target:
    name: buzz-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        BUZZ_RELAY_PRIVATE_KEY: "{{ .relayPrivateKey }}"
        BUZZ_GIT_HOOK_HMAC_SECRET: "{{ .gitHookHmacSecret }}"
        DATABASE_URL: "{{ .databaseUrl }}"
        REDIS_URL: redis://dragonfly-buzz:6379
        BUZZ_S3_ACCESS_KEY: "{{ .s3AccessKey }}"
        BUZZ_S3_SECRET_KEY: "{{ .s3SecretKey }}"
  data:
    - secretKey: relayPrivateKey
      remoteRef:
        key: buzz-identity
        property: BUZZ_RELAY_PRIVATE_KEY
    - secretKey: gitHookHmacSecret
      remoteRef:
        key: buzz-identity
        property: BUZZ_GIT_HOOK_HMAC_SECRET
    - secretKey: databaseUrl
      remoteRef:
        key: buzz-postgres-app
        property: uri
    - secretKey: s3AccessKey
      remoteRef:
        key: buzz-s3
        property: BUZZ_S3_ACCESS_KEY
    - secretKey: s3SecretKey
      remoteRef:
        key: buzz-s3
        property: BUZZ_S3_SECRET_KEY
