---
# One-time admission for Bhaiya's deployment connector. This uses the released
# relay image's own buzz-admin binary; no chart fork or custom Buzz image is
# required. Rename the Job (v2, v3, ...) after a database restore to run it
# again. The command is idempotent when the administrator already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-bhaiya-connector-bootstrap-v1
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buzz
        app.kubernetes.io/instance: buzz
        app.kubernetes.io/component: connector-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admit-connector
          image: ghcr.io/block/buzz:sha-ac4fa13
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              attempt=0
              until /usr/local/bin/buzz-admin add-member \
                --pubkey 895441d89f14296136e7b85ac6f9d170b6f3fe271eea68040a0c2d5a74851564 \
                --role admin; do
                attempt=$$((attempt + 1))
                if [ "$$attempt" -ge 60 ]; then
                  echo "Buzz connector enrollment did not become ready" >&2
                  exit 1
                fi
                sleep 10
              done
          envFrom:
            - secretRef:
                name: buzz-secrets
          env:
            - name: RELAY_URL
              value: wss://buzz.ottawa.keiretsu.top
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
