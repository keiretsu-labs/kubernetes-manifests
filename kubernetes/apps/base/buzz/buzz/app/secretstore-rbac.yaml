---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buzz-secret-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buzz-secret-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-store
subjects:
  - kind: ServiceAccount
    name: buzz-secret-store
    namespace: buzz
