---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: buzz-local
spec:
  provider:
    kubernetes:
      remoteNamespace: buzz
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-store
          namespace: external-secrets
