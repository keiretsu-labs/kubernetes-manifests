---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-buzz-public
spec:
  jobName: blackbox
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://buzz.ottawa.keiretsu.top
      labels:
        service: buzz
        target: public
        check: https
