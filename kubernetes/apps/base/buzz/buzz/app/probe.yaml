---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-buzz-public
spec:
  jobName: blackbox
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://buzz.ottawa.keiretsu.top
      labels:
        service: buzz
        target: public
        check: https
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-buzz-pairing-websocket
spec:
  jobName: blackbox
  module: buzz_pairing_websocket
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - buzz.ottawa.keiretsu.top:443
      labels:
        service: buzz
        target: pairing
        check: websocket
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-buzz-push-gateway
spec:
  jobName: blackbox
  module: http_buzz_push_gateway
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://push.buzz.xyz/v1/deliveries/apns
      labels:
        service: buzz
        target: push-gateway
        check: https
