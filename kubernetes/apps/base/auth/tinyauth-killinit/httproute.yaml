apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tinyauth-killinit
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: public, namespace: home }
    # MUST also attach to private + ts, unlike the primary instance. The apps this
    # gates (e.g. suwayomi) are on all three gateways, and *.killinit.cc resolves to
    # the ts gateway (100.76.8.70) from the tailnet. A tailnet browser redirected to
    # auth.killinit.cc would hit a gateway with no tinyauth route and get a 404.
    # auth.keiretsu.top does not need this because *.keiretsu.top resolves to the
    # public address even on the tailnet.
    - { group: gateway.networking.k8s.io, kind: Gateway, name: private, namespace: home }
    - { group: gateway.networking.k8s.io, kind: Gateway, name: ts, namespace: home }
  hostnames:
    # CLUSTER_DOMAIN = killinit.cc (Ottawa). This host's cookie domain is
    # killinit.cc, so extAuth for *.killinit.cc apps works without a loop.
    # ${CLUSTER_DOMAIN} hosts get DNS automatically via external-dns.
    - "auth.${CLUSTER_DOMAIN}"
  rules:
    # Forward everything to tinyauth-killinit, force no-store (an auth server
    # must never be cached — see the primary instance's httproute for the why).
    - backendRefs:
        - { group: "", kind: Service, name: tinyauth-killinit, port: 3000 }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Cache-Control, value: "no-store" }
