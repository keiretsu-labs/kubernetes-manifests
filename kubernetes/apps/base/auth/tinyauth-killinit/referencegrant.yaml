---
# Allow SecurityPolicies in app namespaces to point extAuth at tinyauth-killinit.
# media (Suwayomi) and garage (webadmin UI); add namespaces as more killinit.cc
# apps adopt cookie-based extAuth against this instance.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: extauth-to-tinyauth-killinit
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: media
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: garage
  to:
    - group: ""
      kind: Service
      name: tinyauth-killinit
