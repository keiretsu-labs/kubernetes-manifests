---
# Outbound Cloudflare Tunnel connector for public workspace SSH.
# The tunnel is remotely managed: its ingress (ssh-bhaiya.keiretsu.top ->
# tcp://bhaiya-ssh.bhaiya.svc.cluster.local:22) lives in Cloudflare, so this
# connector carries no local ingress. It dials out from Ottawa, so traffic never
# crosses the UniFi WAN port forward or the Envoy Gateway listeners (#661).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-bhaiya-ssh
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: bhaiya-ssh-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bhaiya-ssh-tunnel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: bhaiya-ssh-tunnel
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-bhaiya-ssh-token
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
