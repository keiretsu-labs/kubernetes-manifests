---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8s-gpu-dra-driver
spec:
  interval: 1h
  url: https://rocm.github.io/k8s-gpu-dra-driver
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gpu-dra-driver
spec:
  chart:
    spec:
      chart: k8s-gpu-dra-driver
      version: v1.0.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gpu-dra-driver
  interval: 1h
  values:
    cdi:
      dynamicPath: /var/cdi/dynamic
    kubeletPlugin:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/amdgpu
                    operator: Exists
