---
apiVersion: v1
kind: Service
metadata:
  name: jetkvm
spec:
  # Envoy Gateway does not accept ExternalName backends. Keep this as a
  # regular Service and pin the LAN endpoint below to the UniFi reservation.
  type: ClusterIP
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jetkvm-lan
  labels:
    kubernetes.io/service-name: jetkvm
    endpointslice.kubernetes.io/managed-by: kubernetes-manifests
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 192.168.169.69
    conditions:
      ready: true
