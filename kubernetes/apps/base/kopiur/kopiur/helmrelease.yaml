---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: kopiur-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kopiur
      # PIN chart version — kopiur is alpha (v1alpha1); docs record a breaking
      # 0.5.x → 0.6.0 CRD/values move. Do not float on latest.
      version: "0.10.12"
      sourceRef:
        kind: HelmRepository
        name: home-operations-kopiur
        namespace: kopiur-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # License: AGPL-3.0-only (chart annotation). Flag if that is a problem for
    # this fleet — see PR body.
    installScope: cluster

    # Temporary proof support: the Velero-owned repository credentials live in
    # velero-system while the fenced Restore mover runs in its scratch
    # namespace. The ClusterRepository grant remains namespace-scoped; this
    # feature flag supplies only the operator RBAC needed to project that
    # explicitly allowed copy.
    features:
      credentialProjection:
        enabled: true

    # The published chart carries release-matched, digest-pinned images for the
    # controller, webhook, and mover. Inherit those defaults so one chart PR
    # upgrades the complete operator; overriding them creates ineffective
    # tag-only Renovate PRs because the digest wins over the tag.

    # StP: tolerate control-plane so Direct movers can co-locate on orin-0
    # with the RWO local-path PVC (HA is pinned there).
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
