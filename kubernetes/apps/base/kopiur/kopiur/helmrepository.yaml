---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: home-operations-kopiur
  namespace: kopiur-system
spec:
  interval: 1h
  type: oci
  # Published OCI chart; the HelmRelease pins the chart, whose release bundle
  # carries the matching image digests for all Kopiur components.
  url: oci://ghcr.io/home-operations/charts
