---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: media-config
  namespace: media
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-robbinsdale
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  sources:
    # Active Ceph-backed application config PVCs. This includes the four
    # Bazarr claims that had a successful Velero PVB in the last complete run,
    # the current Velero opt-in set, and the known Kometa gap.
    - pvc: {name: autobrr-config}
      readOnly: true
    - pvc: {name: bazarr-1080p-config}
      readOnly: true
    - pvc: {name: bazarr-4k-config}
      readOnly: true
    - pvc: {name: bazarr-4kremux-config}
      readOnly: true
    - pvc: {name: bazarr-anime-config}
      readOnly: true
    - pvc: {name: kometa}
      readOnly: true
    - pvc: {name: lidarr-config}
      readOnly: true
    - pvc: {name: maintainerr-config}
      readOnly: true
    - pvc: {name: overseerr-config}
      readOnly: true
    - pvc: {name: plex-config-ceph}
      readOnly: true
    - pvc: {name: prowlarr-config}
      readOnly: true
    - pvc: {name: qbittorrent-config}
      readOnly: true
    - pvc: {name: qbittorrent-pvt-config}
      readOnly: true
    - pvc: {name: radarr-1080p-config}
      readOnly: true
    - pvc: {name: radarr-4k-config}
      readOnly: true
    - pvc: {name: radarr-4kremux-config}
      readOnly: true
    - pvc: {name: radarr-anime-config}
      readOnly: true
    - pvc: {name: sabnzbd-config}
      readOnly: true
    - pvc: {name: sonarr-1080p-config}
      readOnly: true
    - pvc: {name: sonarr-4k-config}
      readOnly: true
    - pvc: {name: sonarr-anime-config}
      readOnly: true
    - pvc: {name: tautulli-config}
      readOnly: true
    - pvc: {name: tracearr-backup}
      readOnly: true
    - pvc: {name: wizarr-config}
      readOnly: true
  # Deliberately absent: 20Ti SMB media-share and qbittorrent-downloads (the
  # storage layer owns bulk data), old prowlarr-config-unas, CNPG pgdata, and
  # Immich photo stores. The Velero checker remains Velero-only and media is
  # already in its Schedule, so no namespace exemption belongs in its ledger.
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
