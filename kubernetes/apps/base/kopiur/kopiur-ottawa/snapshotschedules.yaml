---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: home-config
  namespace: home
spec:
  policyRef:
    name: home-config
  schedule:
    cron: "0 1 * * *"
    jitter: 30m
