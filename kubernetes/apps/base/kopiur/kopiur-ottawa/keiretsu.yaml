---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: vault-data
  namespace: keiretsu
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  sources:
    - pvc:
        name: data-vault-0
      readOnly: true
  # Do not include the tsnet-state claims: they are rebuildable Tailscale
  # state, while this 5Gi claim is the custom Vault application's data.
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
