---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
    privilegedMode: true
  sources:
    # Git data volume. Postgres is CNPG/Barman on Garage. Runner caches are
    # rebuildable and are not included.
    - pvc:
        name: gitea-shared-storage
      readOnly: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
