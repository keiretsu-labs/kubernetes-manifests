---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  # Direct: CSI clone of gitea-shared-storage did not bind before the
  # staging deadline. Read-only Direct mounts the live PVC like St. Pete HA.
  copyMethod: Direct
  groupBy: None
  mover:
    # Git data has mixed 0700 dirs (git user, .ssh, bleve). Namespace is
    # opted into privileged movers; root + privilegedMode is the same
    # contract that succeeded for Ottawa home-config.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: true
      capabilities:
        add:
          - DAC_OVERRIDE
          - DAC_READ_SEARCH
    privilegedMode: true
  sources:
    # Git data volume. Postgres is CNPG/Barman on Garage. Runner caches are
    # rebuildable and are not included.
    - pvc:
        name: gitea-shared-storage
      readOnly: true
  files:
    # Explicit list replaces Kopiur defaults wholesale. Keep OS junk rules
    # and skip git's ephemeral incoming object dirs (mode 000 while receive
    # is in flight).
    ignoreRules:
      - "/lost+found"
      - "System Volume Information"
      - "$RECYCLE.BIN"
      - "@eaDir"
      - ".snapshot"
      - "**/tmp_objdir-incoming-*"
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
