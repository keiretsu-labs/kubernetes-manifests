---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  mover:
    # Forgejo's pod spec does not pin runAsUser (image USER 65532). Git
    # object dirs are uid 1000 / fsGroup 1000, so inherit-from-workload
    # would snapshot as 65532 and PermissionDenied. Pin the git uid.
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    privilegedMode: true
  sources:
    # Git data volume. Postgres is CNPG/Barman on Garage. Runner caches are
    # rebuildable and are not included.
    - pvc:
        name: gitea-shared-storage
      readOnly: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
