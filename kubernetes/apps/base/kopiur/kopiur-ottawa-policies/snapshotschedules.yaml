---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: cliproxy-data
  namespace: cliproxy
spec:
  policyRef:
    name: cliproxy-data
  schedule:
    cron: 30 1 * * *
    jitter: 30m
