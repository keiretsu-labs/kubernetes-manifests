---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: tinyauth-data
  namespace: tinyauth
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  # TinyAuth stores its OIDC private key owner-only. Use an explicit root
  # mover instead of ignoring the permission failure; the source PVCs remain
  # read-only and permission errors remain fatal.
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    privilegedMode: true
  sources:
    # Home Velero currently selects both SQLite session stores; keep the
    # Kopiur policy explicit rather than relying on a broad PVC selector.
    - pvc:
        name: tinyauth-data
      readOnly: true
    - pvc:
        name: tinyauth-killinit-data
      readOnly: true
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    privilegedMode: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
