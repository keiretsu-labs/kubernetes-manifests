---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: tinyauth-data
  namespace: tinyauth
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  # TinyAuth's OIDC private key is 0600 uid 1000. A root mover without
  # CAP_DAC_OVERRIDE still cannot read it; inherit the workload UID instead.
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  sources:
    # Home Velero currently selects both SQLite session stores; keep the
    # Kopiur policy explicit rather than relying on a broad PVC selector.
    - pvc:
        name: tinyauth-data
      readOnly: true
    - pvc:
        name: tinyauth-killinit-data
      readOnly: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
