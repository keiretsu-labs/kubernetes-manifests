---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: tinyauth-data
  namespace: tinyauth
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  sources:
    - pvc:
        name: tinyauth-data
      readOnly: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: tinyauth-killinit-data
  namespace: tinyauth
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-ottawa
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  sources:
    - pvc:
        name: tinyauth-killinit-data
      readOnly: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: tinyauth-data
  namespace: tinyauth
spec:
  policyRef:
    name: tinyauth-data
  schedule:
    cron: "15 1 * * *"
    jitter: 30m
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: tinyauth-killinit-data
  namespace: tinyauth
spec:
  policyRef:
    name: tinyauth-killinit-data
  schedule:
    cron: "15 1 * * *"
    jitter: 30m
