---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-config
  namespace: home
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-robbinsdale
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  sources:
    # These are the active Ceph RBD claims used by the live workloads. The
    # older *-unas claims are SMB copies and are not the active mounts.
    - pvc:
        name: homeassistant-config-ceph
      readOnly: true
    - pvc:
        name: frigate-config-ceph
      readOnly: true
    - pvc:
        name: mqtt-data-ceph
      readOnly: true
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    privilegedMode: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
