# Deliberately absent: SMB bulk shares, *-unas, CNPG, Immich.
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: autobrr-config
  namespace: media
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-robbinsdale
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  sources:
    - pvc:
        name: autobrr-config
      readOnly: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  deletion:
    onPolicyDelete: Retain
  adoption: Ignore
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
