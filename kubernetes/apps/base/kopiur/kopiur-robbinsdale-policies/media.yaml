  namespace: media
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-robbinsdale
  credentialProjection:
    enabled: true
  copyMethod: Snapshot
  groupBy: None
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: true
      capabilities:
        add:
          - DAC_OVERRIDE
