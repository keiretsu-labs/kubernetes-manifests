# Kopiur PVC→SnapshotPolicy coverage exemptions.
#
# Consumed only by tools/check-velero-pvc-coverage.sh (now Kopiur-backed).
# NOT a Flux resource — do not add this file to kustomization.yaml.
#
# The check fails when a namespace that declares durable volume intent in Git
# (PVC, VCT, CNPG storage, GarageCluster storage, Grafana PVC, Helm
# persistence, or a workload claimName) has no SnapshotPolicy on that cluster
# — unless listed here with a non-empty reason.
apiVersion: keiretsu.top/v1alpha1
kind: KopiurPVCPolicyExemptions
metadata:
  name: pvc-policy-exemptions
exemptions:
  # --- Ottawa ---
  - cluster: ottawa
    namespace: immich
    reason: >-
      Photo libraries deliberately not backed up per Raj 2026-09-07; see
      corp/bhaiya#718. immich-postgres remains protected via GarageBucket
      CNPG/Barman dumps.

  - cluster: ottawa
    namespace: garage
    reason: >-
      Garage is the Kopiur/CNPG destination (ADR 0007). Backing
      garage/data-garage-0 (2Ti smb) or Ceph metadata PVCs into Kopiur
      is circular. Data sits on smb while metadata is Ceph — a genuine
      if accidental failure-domain split; the independent-object-store
      question stays in corp/bhaiya#423 / #571 rather than a schedule
      here.

  - cluster: ottawa
    namespace: monitoring
    reason: >-
      Reconstructible observability: Grafana dashboards live in Git,
      Alertmanager PVC is 1Gi of silences/notification state, VictoriaLogs
      is short-retention (7d). Kopiur FSB of these volumes is not the
      restore path.

  - cluster: ottawa
    namespace: hermes
    reason: >-
      Deployment scaled to 0 after the Discord gateway moved to the
      Bhaiya teaspoon workspace. hermes-data is a leftover 10Gi claim
      kept as a rollback anchor, not a live data plane.

  - cluster: ottawa
    namespace: teslamate
    reason: >-
      Postgres-only namespace: CNPG ScheduledBackup to Garage. No app PVC
      beyond the database cluster.

  - cluster: ottawa
    namespace: litellm
    reason: >-
      Postgres-only namespace: CNPG ScheduledBackup and continuous WAL
      archiving to Garage protect the LiteLLM database. No application PVC
      beyond the database cluster.

  - cluster: ottawa
    namespace: mimir
    reason: >-
      Metrics TSDB is product-native multi-replica storage; Kopiur FSB of
      ingester PVCs is not the restore path.

  - cluster: ottawa
    namespace: tailscale-pam
    reason: >-
      Workshop lobby ts-state volumeClaimTemplate; not a production data plane.
      lobby-postgres holds registration and service-ownership state and is
      protected separately through CNPG/Barman on Garage.

  - cluster: ottawa
    namespace: bhaiya
    outOfBand: true
    reason: >-
      Former Velero Schedule bhaiya-backup fs-backed live workspace PVCs
      created by the foreign bhaiya GitRepository, not this repo. Those
      volumes are ephemeral session disks. bhaiya-postgres is CNPG/Barman
      on Garage. GitOps rebuilds the control plane.

  - cluster: ottawa
    namespace: zot
    outOfBand: true
    reason: >-
      Helm persistence is false; live registry writes Garage bucket zot
      via the S3 driver. zot-pvc-zot-0 is an orphan leftover, not the
      restore path. Durability is Garage RF3 (ADR 0007 / bhaiya#423/#571).

  - cluster: ottawa
    namespace: cartography
    outOfBand: true
    reason: >-
      data-neo4j-0 is a leftover 50Gi claim with no Git app and no live
      workload. Do not spend Kopiur budget on a retired volume; delete
      the claim if the app is not coming back.

  # --- Robbinsdale ---
  - cluster: robbinsdale
    namespace: immich
    reason: >-
      Photo libraries deliberately not backed up per Raj 2026-09-07; see
      corp/bhaiya#718. immich-postgres remains CNPG/Barman on Garage.

  - cluster: robbinsdale
    namespace: garage
    reason: >-
      Garage is the Kopiur/CNPG destination (ADR 0007). Backing the 2Ti
      smb data volume or Ceph metadata PVCs into Kopiur is circular. The
      smb-vs-Ceph split is the same failure-domain question as
      corp/bhaiya#423 / #571.

  - cluster: robbinsdale
    namespace: monitoring
    reason: >-
      Reconstructible observability: Alertmanager silences and
      VictoriaLogs short-retention local store. Not a Kopiur restore path.

  - cluster: robbinsdale
    namespace: woodpecker
    reason: >-
      Agent-only cluster: 1Gi agent.conf identity PVCs and ephemeral
      workflow workspace claims. Ottawa owns the Woodpecker server PVC
      (Kopiur) and woodpecker-postgres (CNPG/Barman).

  - cluster: robbinsdale
    namespace: tailscale-examples
    reason: >-
      Demo/sandbox tsidp volumeClaimTemplate; not a production data plane.

  - cluster: robbinsdale
    namespace: zot
    outOfBand: true
    reason: >-
      No Zot Git pointer on this cluster. zot-pvc-zot-0 is an orphan
      leftover; live registry data is the Garage zot bucket, not this PVC.

  # --- St Petersburg ---
  - cluster: stpetersburg
    namespace: ai
    reason: >-
      Model-weight caches on local-path (vLLM); rebuildable from registry,
      not application state.

  - cluster: stpetersburg
    namespace: garage
    reason: >-
      Garage is the Kopiur/CNPG destination (ADR 0007). Gateway metadata
      PVCs are node identity, not application data; backing them into
      Kopiur is circular. Independent-object-store work remains
      corp/bhaiya#423 / #571.

  - cluster: stpetersburg
    namespace: monitoring
    reason: >-
      Reconstructible observability: Alertmanager silences and
      VictoriaLogs short-retention local store. Not a Kopiur restore path.

  - cluster: stpetersburg
    namespace: zot
    outOfBand: true
    reason: >-
      No Zot Git pointer on this cluster. zot-pvc-zot-0 is an orphan
      leftover; live registry data is the Garage zot bucket, not this PVC.
