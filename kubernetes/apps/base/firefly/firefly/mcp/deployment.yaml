---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firefly-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firefly-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: firefly-mcp
          image: ghcr.io/daften/fireflyiii-mcp:0.5.2@sha256:8150a15323b9bf013e6e382e5a299c279c97f14ba0a1a9e09dc61cc984b079b9
          imagePullPolicy: IfNotPresent
          command: [node, dist/index.js]
          args:
            - --transport
            - http
            - --host
            - 0.0.0.0
            - --port
            - "3000"
            # Write access is required to manage the Bhaiya chart of accounts and
            # to correct ledger entries. Filtering is group-level only, so this
            # is the narrowest available scope: every other group is dropped
            # entirely, reads included. Reachable only from administrator-owned
            # workspaces via Bhaiya's compiled MCPRequiresAdmin boundary.
            - --groups
            - accounts,transactions
          env:
            - name: FIREFLY_URL
              valueFrom:
                secretKeyRef:
                  name: firefly-mcp
                  key: FIREFLY_III_URL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
