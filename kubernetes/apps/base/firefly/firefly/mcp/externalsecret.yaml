---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-local
    kind: ClusterSecretStore
  target:
    name: firefly-mcp
    creationPolicy: Owner
  data:
    - secretKey: FIREFLY_III_URL
      remoteRef:
        key: firefly-iii
        property: FIREFLY_III_URL
