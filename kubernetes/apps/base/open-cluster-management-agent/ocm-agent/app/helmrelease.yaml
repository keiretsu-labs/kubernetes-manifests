---
# OCM Klusterlet (Singleton mode) — registers this cluster with the OCM hub on Ottawa

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocm-klusterlet
  namespace: open-cluster-management-agent
spec:
  interval: 30m
  chart:
    spec:
      chart: klusterlet
      version: "1.3.1"
      sourceRef:
        kind: HelmRepository
        name: ocm
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # The chart mounts the bootstrap Secret without hashing it into the agent
  # pod template. Bump this explicit marker when the direct OCM endpoint
  # changes so every agent reloads the generated gRPC/API configuration.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: klusterlet-agent
            patch: |
              - op: add
                path: /spec/template/metadata/annotations/keiretsu.top~1ocm-grpc-endpoint
                value: ocm-grpc-mesh.open-cluster-management-hub.svc.clusterset.local
  valuesFrom:
    - kind: Secret
      name: ocm-bootstrap-kubeconfig
      valuesKey: bootstrapHubKubeConfig
      targetPath: bootstrapHubKubeConfig
    - kind: Secret
      name: ocm-bootstrap-kubeconfig
      valuesKey: grpcConfig
      targetPath: grpcConfig
  values:
    klusterlet:
      create: true
      mode: Singleton
      clusterName: "${CLUSTER_NAME}"
      registrationConfiguration:
        registrationDriver:
          authType: grpc
