# Direct, identity-preserving Services for the routed ClusterMesh path.
apiVersion: v1
kind: Service
metadata:
  name: robbinsdale-garage-mesh
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - {name: s3, port: 3900, protocol: TCP, targetPort: s3}
    - {name: rpc, port: 3901, protocol: TCP, targetPort: rpc}
    - {name: web, port: 3902, protocol: TCP, targetPort: web}
    - {name: admin, port: 3903, protocol: TCP, targetPort: admin}
  selector:
    garage.rajsingh.info/cluster: garage
    garage.rajsingh.info/tier: storage
---
