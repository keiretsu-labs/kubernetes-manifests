    - {name: web, port: 3902, protocol: TCP, targetPort: web}
    - {name: admin, port: 3903, protocol: TCP, targetPort: admin}
  selector:
    app.kubernetes.io/instance: garage
    app.kubernetes.io/name: garage
    garage.rajsingh.info/tier: gateway
---
