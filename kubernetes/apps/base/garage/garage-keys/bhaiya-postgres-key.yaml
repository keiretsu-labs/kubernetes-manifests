---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: bhaiya-postgres-key
  namespace: bhaiya
spec:
  clusterRef:
    name: garage
    namespace: garage
  name: Bhaiya Postgres Backup Key
  secretTemplate:
    name: bhaiya-postgres-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  bucketPermissions:
    - bucketRef:
        name: bhaiya-postgres
        namespace: garage
      read: true
      write: true
      owner: true
