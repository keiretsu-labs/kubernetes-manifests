---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: tracearr-postgres
spec:
  clusterRef:
    name: garage
  globalAlias: tracearr-postgres
  quotas:
    maxSize: 200Gi
    maxObjects: 1000000
  keyPermissions:
    - keyRef:
        name: tracearr-postgres-key
        namespace: media
      read: true
      write: true
      owner: true
