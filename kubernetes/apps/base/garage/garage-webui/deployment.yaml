---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  labels:
    app.kubernetes.io/name: garage-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-webui
    spec:
      containers:
        - name: garage-webui
          # renovate: datasource=docker depName=ghcr.io/keiretsu-labs/kubernetes-manifests/garage-webadmin
          image: ghcr.io/keiretsu-labs/kubernetes-manifests/garage-webadmin:d49c75d
          # digest sha256:50ce562c455c6ca0ebb8bfb909142e21df63cb8d9d8bbf02e852606407d3b1db
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_HOST
              value: "http://garage:3903"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-admin-token
                  key: admin-token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: garage-webadmin-sidecar
          # renovate: datasource=docker depName=ghcr.io/keiretsu-labs/kubernetes-manifests/garage-webadmin-sidecar
          image: ghcr.io/keiretsu-labs/kubernetes-manifests/garage-webadmin-sidecar:cfa1315
          # digest sha256:c1f457f66e233f90589dab311071efa6958e1a1d00004479838356ab40a11660
          ports:
            - containerPort: 8080
              name: sidecar
          envFrom:
            - secretRef:
                name: garage-webui-sidecar
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
