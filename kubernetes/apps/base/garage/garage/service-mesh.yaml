---
# The gateway Service is present in every Garage cluster. Exporting the same
# logical name lets Gateway API routes use the MCS ServiceImport for the
# multi-region CDN path while local/private routes continue to use the local
# Service.
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: garage-gateway
spec:
  exportedAnnotations:
    service.cilium.io/affinity: local
