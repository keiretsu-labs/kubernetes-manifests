---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: bhaiya-postgres
spec:
  clusterRef:
    name: garage
  globalAlias: bhaiya-postgres
  quotas:
    maxSize: 100Gi
    maxObjects: 1000000
  keyPermissions:
    - keyRef:
        name: bhaiya-postgres-key
        namespace: bhaiya
      read: true
      write: true
      owner: true
