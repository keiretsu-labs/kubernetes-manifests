---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: bhaiya-postgres
  annotations:
    # This bucket owns production PostgreSQL backups. Keep it in the cluster
    # while a Flux path/inventory migration is staged, and bind the recreated
    # CR to the existing Garage bucket instead of allowing a replacement.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  clusterRef:
    name: garage
  globalAlias: bhaiya-postgres
  quotas:
    maxSize: 100Gi
    maxObjects: 1000000
  keyPermissions:
    - keyRef:
        name: bhaiya-postgres-key
        namespace: bhaiya
      read: true
      write: true
      owner: true
