---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: woodpecker-postgres
  namespace: garage
spec:
  clusterRef:
    name: garage
  globalAlias: woodpecker-postgres
  quotas:
    # The previous 100Gi ceiling was reached with the archive bucket nearly
    # full. Raise the hard write cap for immediate recovery; this does not
    # reserve Garage disk space.
    maxSize: 200Gi
    maxObjects: 1000000
  keyPermissions:
    - keyRef:
        name: woodpecker-postgres-key
        namespace: woodpecker
      read: true
      write: true
      owner: true
