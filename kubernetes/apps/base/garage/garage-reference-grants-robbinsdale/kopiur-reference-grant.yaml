---
# Site-scoped grant: persist it before the dependent GarageBucket dry-run.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: garage-bucket-to-kopiur-robbinsdale-key
  namespace: home
spec:
  from:
    - kind: GarageBucket
      namespace: garage
  to:
    - kind: GarageKey
      name: kopiur-robbinsdale-key
