---
# Per-storage-pod Tailscale LB for cross-region RPC connectivity.
# Each stpetersburg storage pod needs its own routable address so other
# regions' Garage nodes can ConnectClusterNodes() to a specific peer.
# The shared garage-ts LB (service-ts.yaml) only routes to ONE storage pod
# at a time, leaving the second pod permanently "Not connected" from the
# perspective of remote regions — this breaks write quorum (RF=2 requires
# both storage nodes reachable) and causes S3 multipart uploads like
# Tailscale log streaming to fail with "Could not reach quorum of 2."
#
# Each of these per-pod LBs pins to exactly one storage pod via
# statefulset.kubernetes.io/pod-name.
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: stpetersburg-garage-spark-1
    tailscale.com/tags: "tag:k8s,tag:stpetersburg"
    tailscale.com/proxy-group: "common-ingress"
  name: garage-storage-spark-1-ts
spec:
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 3901
      protocol: TCP
      targetPort: 3901
  selector:
    statefulset.kubernetes.io/pod-name: stpetersburg-garage-localpath-spark-1-0
  type: LoadBalancer
  loadBalancerClass: tailscale
---
# Pre-stage one identity-specific endpoint per future node-local-pool member.
# These selectors do not match the current StatefulSets, so the existing
# endpoints above remain untouched until a later GitOps change adds the pool.
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: stpetersburg-garage-pool-spark-0
    tailscale.com/tags: "tag:k8s,tag:stpetersburg"
    tailscale.com/proxy-group: "common-ingress"
  name: garage-pool-spark-0-ts
spec:
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 3901
      protocol: TCP
      targetPort: rpc
  selector:
    app.kubernetes.io/instance: garage
    garage.rajsingh.info/node-local-pool: local-2ti
    garage.rajsingh.info/kubernetes-node: spark-0
  type: LoadBalancer
  loadBalancerClass: tailscale
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: stpetersburg-garage-pool-spark-1
    tailscale.com/tags: "tag:k8s,tag:stpetersburg"
    tailscale.com/proxy-group: "common-ingress"
  name: garage-pool-spark-1-ts
spec:
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 3901
      protocol: TCP
      targetPort: rpc
  selector:
    app.kubernetes.io/instance: garage
    garage.rajsingh.info/node-local-pool: local-2ti
    garage.rajsingh.info/kubernetes-node: spark-1
  type: LoadBalancer
  loadBalancerClass: tailscale
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: stpetersburg-garage-pool-orin-0
    tailscale.com/tags: "tag:k8s,tag:stpetersburg"
    tailscale.com/proxy-group: "common-ingress"
  name: garage-pool-orin-0-ts
spec:
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 3901
      protocol: TCP
      targetPort: rpc
  selector:
    app.kubernetes.io/instance: garage
    garage.rajsingh.info/node-local-pool: local-200
    garage.rajsingh.info/kubernetes-node: orin-0
  type: LoadBalancer
  loadBalancerClass: tailscale
