---
apiVersion: v1
kind: Service
metadata:
  name: stpetersburg-vllm
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Override
spec:
  type: ExternalName
  externalName: qwen38-mesh.ai.svc.clusterset.local
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: aperture
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    tailscale.com/tailnet-fqdn: aperture.keiretsu.ts.net
    tailscale.com/proxy-group: common-egress
spec:
  externalName: placeholder
  type: ExternalName
  ports:
    - name: http
      port: 80
      protocol: TCP
