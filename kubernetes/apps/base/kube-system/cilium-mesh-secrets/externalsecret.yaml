---
# Publish the shared internal CA to the Cilium namespace without putting
# certificate material in Git. Cilium uses this public bundle for Cluster Mesh
# and Hubble trust; the signing private key remains in cert-manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cilium-root-ca
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-local-cert-manager
    kind: ClusterSecretStore
  target:
    name: cilium-root-ca
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.crt
      remoteRef:
        key: kubernetes-internal-ca-key-pair
        property: tls.crt
