---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "k8s-pool"
spec:
  blocks:
    # Per-site pool: Tailscale (.69.x, .100.x), ClusterMesh, and existing
    # pinned LBs. UniFi gateway is 10.169.0.254 — keep it out of IPAM.
    - start: "10.169.0.0"
      stop: "10.169.0.253"
    - start: "10.169.0.255"
      stop: "10.169.255.254"
  serviceSelector:
    matchExpressions:
      - { key: somekey, operator: NotIn, values: ["never-used-value"] }
      - { key: lb.keiretsu.top/pool, operator: NotIn, values: ["shared"] }
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: k8s-shared
spec:
  blocks:
    - cidr: "${SHARED_LOAD_BALANCER_SITE_CIDR}"
  serviceSelector:
    matchLabels:
      lb.keiretsu.top/pool: shared
