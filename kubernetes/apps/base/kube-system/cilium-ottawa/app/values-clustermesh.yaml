cluster:
  name: ${LOCATION}
  id: ${SITE_ID}
tls:
  caBundle:
    enabled: true
    name: cilium-root-ca
    key: ca.crt
    useSecret: true
clustermesh:
  enabled: true
  maxConnectedClusters: 255
  enableEndpointSliceSynchronization: true
  mcsapi:
    enabled: true
  useAPIServer: true
  apiserver:
    replicas: 2
    podAnnotations:
      checksum/mesh-certificate: direct-loadbalancer-v1
    service:
      externallyCreated: true
    tls:
      authMode: cluster
      server:
        extraIpAddresses:
        - "10.169.10.20"
      auto:
        method: certmanager
        certManagerIssuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: internal
  config:
    enabled: true
    domain: kube-system
    clusters:
    - name: robbinsdale
      address: "10.50.10.20"
      port: 2379
    - name: stpetersburg
      address: "10.73.10.20"
      port: 2379
hubble:
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: internal
