---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "k8s-pool"
spec:
  blocks:
    # The UniFi gateway is 10.50.0.254. Keep it out of LB-IPAM while
    # retaining the existing pool addresses, including 10.50.0.0 in use.
    - start: "10.50.0.0"
      stop: "10.50.0.253"
    - start: "10.50.0.255"
      stop: "10.50.255.254"
  serviceSelector:
    matchExpressions:
      - { key: somekey, operator: NotIn, values: ["never-used-value"] }
