---
apiVersion: v1
kind: Service
metadata:
  name: clustermesh-apiserver
  annotations:
    tailscale.com/hostname: cilium-mesh-api-robbinsdale
    tailscale.com/proxy-group: cilium-mesh-ingress
    tailscale.com/tags: "tag:k8s,tag:robbinsdale"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  sessionAffinity: ClientIP
  selector:
    k8s-app: clustermesh-apiserver
  ports:
    - name: etcd-client
      port: 2379
      targetPort: 2379
      protocol: TCP
