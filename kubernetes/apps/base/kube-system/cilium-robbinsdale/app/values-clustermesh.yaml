cluster:
  name: ${LOCATION}
  id: ${SITE_ID}
tls:
  caBundle:
    enabled: true
    name: cilium-root-ca
    key: ca.crt
    useSecret: true
clustermesh:
  enabled: true
  maxConnectedClusters: 255
  enableEndpointSliceSynchronization: true
  enableMCSAPISupport: true
  useAPIServer: true
  apiserver:
    replicas: 2
    service:
      annotations:
        tailscale.com/hostname: cilium-mesh-api-${LOCATION}
        tailscale.com/proxy-group: cilium-mesh-ingress
        tailscale.com/tags: "tag:k8s,tag:${LOCATION}"
      type: LoadBalancer
      loadBalancerClass: tailscale
      externallyCreated: true
    tls:
      authMode: cluster
      server:
        extraDnsNames:
        - ${LOCATION}.keiretsu.ts.net
        - ${LOCATION}.kube-system
      auto:
        method: certmanager
        certManagerIssuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: internal
  config:
    enabled: true
    domain: kube-system
    clusters:
    - name: ottawa
      address: cilium-mesh-api-ottawa.kube-system
      port: 2379
    - name: stpetersburg
      address: cilium-mesh-api-stpetersburg.kube-system
      port: 2379
hubble:
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: internal
