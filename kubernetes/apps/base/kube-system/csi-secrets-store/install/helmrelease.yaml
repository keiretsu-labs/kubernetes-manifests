---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  interval: 1m
  chart:
    spec:
      chart: secrets-store-csi-driver
      version: "1.5.4"
      sourceRef:
        kind: HelmRepository
        name: secrets-store-csi-driver
        namespace: kube-system
      interval: 1m
  # The CSI node agent is required on every Linux node, including the
  # control-plane. Protect it from ordinary workloads when the small Orin
  # control-plane node is request-saturated.
  values:
    linux:
      priorityClassName: system-node-critical
