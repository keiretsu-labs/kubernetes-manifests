cluster:
  name: ${LOCATION}
cni:
  exclusive: false
kubeProxyReplacement: true
socketLB:
  enabled: true
  hostNamespaceOnly: true
autoDirectNodeRoutes: true
directRoutingSkipUnreachable: true
enableIPv4BIGTCP: true
enableIPv4Masquerade: true
routingMode: native
bpf:
  masquerade: true
  lbExternalClusterIP: true # https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#external-access-to-clusterip-services
  # Per-service LB mode / algorithm (service.cilium.io/forwarding-mode and
  # service.cilium.io/lb-algorithm). Only Services carrying the annotations
  # change behaviour; everything else stays on the defaults below.
  lbModeAnnotation: true
  lbAlgorithmAnnotation: true
# Exclude the ConnectX-7 RDMA rail (spark-0 ↔ spark-1) from SNAT so any TCP
# fallback for NCCL retains real source IPs. RDMA verbs traffic bypasses the
# kernel entirely, so this is preemptive insurance.
ipMasqAgent:
  enabled: true
  config:
    nonMasqueradeCIDRs:
      - 10.0.0.0/8
      - 192.168.74.0/30
ipv4:
  enabled: true
ipv4NativeRoutingCIDR: 10.0.0.0/8
# Flow-consistent forwarding for the public Envoy VIP (same as cilium-ottawa).
# The UDM ECMPs BGP-advertised LB VIPs (`maximum-paths 4`) and can move
# established flows between nodes; Maglev (same backend on every node) + DSR
# (client tuple preserved) keeps a moved flow on its existing socket. Defaults
# stay random/SNAT; only annotated Services opt in. dsrDispatch=opt: native
# routing + autoDirectNodeRoutes on one L2, option only on TCP SYN (no MTU
# change), BIG TCP compatible. See docs/ops/ottawa-public-envoy-maglev-dsr.md.
loadBalancer:
  mode: snat
  algorithm: random
  dsrDispatch: opt
maglev:
  # Explicit cluster-wide seed (every agent must share it). Not a credential.
  hashSeed: "vGwNbaYcNJIzFy0t"
bandwidthManager:
  enabled: true
  bbr: true
envoy:
  enabled: true
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
ipam:
  mode: "cluster-pool"
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.5.0.0/16"
    clusterPoolIPv4MaskSize: 24
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    metricRelabelings:
      - targetLabel: cluster
        replacement: ${CLUSTER_NAME}
operator:
  rollOutPods: true
  # 2 replicas with pod anti-affinity so a single node reboot doesn't leave the
  # cluster without an operator (which is what blocked auto-untaint after spark-1
  # rebooted under memory pressure — pods on the rebooted node couldn't schedule
  # because the agent-not-ready taint never got removed).
  replicas: 2
  # Make cilium-operator actively strip the `node.cilium.io/agent-not-ready` taint
  # from any node whose cilium-agent reports Ready. Default in Cilium ≥1.14 but
  # explicitly required by our chart version (1.18.x). Without this, manual
  # `kubectl taint nodes ... -` is needed after every node reboot.
  removeNodeTaints: true
  setNodeNetworkStatus: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
      metricRelabelings:
        - targetLabel: cluster
          replacement: ${CLUSTER_NAME}
rollOutCiliumPods: true
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
localRedirectPolicy: true
bgpControlPlane:
  enabled: true
hubble:
  relay:
    enabled: true
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: internal

# Talos specific settings
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE
