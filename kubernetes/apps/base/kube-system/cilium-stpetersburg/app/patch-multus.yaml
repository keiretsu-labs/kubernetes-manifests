---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
spec:
  template:
    spec:
      # CNI must survive soft memory eviction. orin-0 evicted Multus
      # (Burstable, no PriorityClass) ahead of Guaranteed HA — then
      # CmdAdd timed out and HomeKit stayed offline until Multus
      # recovered. Match cilium-agent: system-node-critical.
      priorityClassName: system-node-critical
      volumes:
        - name: host-run-netns
          hostPath:
            path: /var/run/netns/
      initContainers:
        - name: install-multus-binary
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.1-thick@sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
          command:
            - "cp"
            - "-f"
            - "/usr/src/multus-cni/bin/multus-shim"
            - "/host/opt/cni/bin/multus-shim"
        - command:
            - /install-cni.sh
          image: ghcr.io/siderolabs/install-cni:v1.9.0
          name: install-cni
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /host/opt/cni/bin
              mountPropagation: Bidirectional
              name: cnibin
      containers:
        - name: kube-multus
          # Keep the daemon and host-installed shim on the same immutable release.
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.1-thick@sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
          resources:
            # orin-0 usage ~28Mi; 200Mi request was pure schedulable waste on the
            # sole control-plane node that also pins Home Assistant.
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "3000Mi"
