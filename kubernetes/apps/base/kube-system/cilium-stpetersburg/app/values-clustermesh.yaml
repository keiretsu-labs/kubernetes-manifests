cluster:
  name: ${LOCATION}
  id: ${SITE_ID}
tls:
  caBundle:
    enabled: true
    name: cilium-root-ca
    key: ca.crt
    useSecret: true
clustermesh:
  enabled: true
  maxConnectedClusters: 255
  enableEndpointSliceSynchronization: true
  enableMCSAPISupport: true
  useAPIServer: true
  apiserver:
    replicas: 2
    podAnnotations:
      checksum/mesh-certificate: direct-clusterip-v1
    service:
      annotations:
        tailscale.com/hostname: cilium-mesh-api-${LOCATION}
        tailscale.com/proxy-group: cilium-mesh-ingress
        tailscale.com/tags: "tag:k8s,tag:${LOCATION}"
      type: LoadBalancer
      loadBalancerClass: tailscale
      externallyCreated: false
    tls:
      authMode: cluster
      server:
        extraDnsNames:
          - ${LOCATION}.keiretsu.ts.net
          - ${LOCATION}.kube-system
          - cilium-mesh-api-${LOCATION}.keiretsu.ts.net
          - cilium-mesh-api-${LOCATION}.kube-system
        extraIpAddresses:
          - "10.4.93.144"
          - "10.73.10.20"
      auto:
        method: certmanager
        certManagerIssuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: internal
  config:
    enabled: true
    domain: kube-system
    clusters:
      - name: ottawa
        address: "10.169.10.20"
        port: 2379
      - name: robbinsdale
        address: "10.50.10.20"
        port: 2379
