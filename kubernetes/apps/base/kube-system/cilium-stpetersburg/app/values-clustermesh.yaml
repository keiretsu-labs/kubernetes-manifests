cluster:
  name: ${LOCATION}
  id: ${SITE_ID}
tls:
  caBundle:
    enabled: true
    name: cilium-root-ca
    key: ca.crt
    useSecret: true
clustermesh:
  enabled: true
  maxConnectedClusters: 255
  # Envoy uses routingType: Service, so remote EndpointSlices are not required.
  enableEndpointSliceSynchronization: false
  mcsapi:
    enabled: true
  useAPIServer: true
  apiserver:
    replicas: 2
    # The chart's default is only preferred anti-affinity, which co-located
    # both replicas on spark-0. Require one replica per Spark worker.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                k8s-app: clustermesh-apiserver
            topologyKey: kubernetes.io/hostname
    podAnnotations:
      checksum/mesh-certificate: direct-loadbalancer-v1
    service:
      externallyCreated: true
    tls:
      authMode: cluster
      server:
        extraIpAddresses:
          - "10.73.10.20"
      auto:
        method: certmanager
        certManagerIssuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: internal
  config:
    enabled: true
    domain: kube-system
    clusters:
      - name: ottawa
        address: "10.169.10.20"
        port: 2379
      - name: robbinsdale
        address: "10.50.10.20"
        port: 2379
