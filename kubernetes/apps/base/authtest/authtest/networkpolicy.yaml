---
# Empty leftover namespace (whoami harness removed in 8c9653f74). First
# default-deny pair on a non-prod ns: any future pod is isolated until an
# explicit allow is added.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
