apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - kubeconfig-secret.yaml
  - sync-cronjob.yaml
configMapGenerator:
  - name: bhaiya-ops-bot-kubeconfig-sync
    namespace: bhaiya
    files:
      - sync.py
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: bhaiya-ops-bot
    app.kubernetes.io/part-of: bhaiya
