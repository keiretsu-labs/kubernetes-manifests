apiVersion: v1
kind: ServiceAccount
metadata:
  name: bhaiya-ops-bot
  namespace: bhaiya
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bhaiya-ops-bot-cluster-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bhaiya-ops-bot-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bhaiya-ops-bot-cluster-read
subjects:
  - kind: ServiceAccount
    name: bhaiya-ops-bot
    namespace: bhaiya
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bhaiya-ops-bot-workload-read
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bhaiya-ops-bot-workload-read
  namespace: bhaiya
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bhaiya-ops-bot-workload-read
subjects:
  - kind: ServiceAccount
    name: bhaiya-ops-bot
    namespace: bhaiya
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bhaiya-ops-bot-workload-read
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bhaiya-ops-bot-workload-read
subjects:
  - kind: ServiceAccount
    name: bhaiya-ops-bot
    namespace: bhaiya
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bhaiya-ops-bot-flux-read
  namespace: flux-system
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmrepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bhaiya-ops-bot-flux-read
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bhaiya-ops-bot-flux-read
subjects:
  - kind: ServiceAccount
    name: bhaiya-ops-bot
    namespace: bhaiya
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bhaiya-ops-bot-kubeconfig-sync
  namespace: bhaiya
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bhaiya-ops-bot-kubeconfig-sync
  namespace: bhaiya
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["bhaiya-ops-bot"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bhaiya-ops-bot-kubeconfig"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bhaiya-ops-bot-kubeconfig-sync
  namespace: bhaiya
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bhaiya-ops-bot-kubeconfig-sync
subjects:
  - kind: ServiceAccount
    name: bhaiya-ops-bot-kubeconfig-sync
    namespace: bhaiya
