apiVersion: batch/v1
kind: CronJob
metadata:
  name: bhaiya-ops-bot-kubeconfig-sync
  namespace: bhaiya
spec:
  schedule: "*/5 * * * *"
  # Enable only after the separately reviewed API egress policy is in place.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bhaiya-ops-bot-kubeconfig-sync
            app.kubernetes.io/part-of: bhaiya
        spec:
          serviceAccountName: bhaiya-ops-bot-kubeconfig-sync
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.14.5-alpine3.22
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/sync.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: api-credentials
                  mountPath: /var/run/ops-bot-sync
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: bhaiya-ops-bot-kubeconfig-sync
                defaultMode: 0444
            - name: api-credentials
              projected:
                defaultMode: 0444
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
