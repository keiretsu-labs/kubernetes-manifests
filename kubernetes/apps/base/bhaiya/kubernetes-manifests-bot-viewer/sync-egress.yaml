# The credential sync Job only needs the in-cluster API endpoint to patch its
# one target Secret. The bot's separate viewer policy remains read-only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubernetes-manifests-bot-viewer-sync-apiserver
  namespace: bhaiya
  labels:
    app.kubernetes.io/name: kubernetes-manifests-bot-viewer
    app.kubernetes.io/part-of: bhaiya
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-manifests-bot-viewer-sync
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
