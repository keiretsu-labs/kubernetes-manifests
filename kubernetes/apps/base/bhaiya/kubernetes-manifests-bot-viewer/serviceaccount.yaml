---
# Read-only identity for the Bhaiya V2 bot `kubernetes-manifests`.
# Used only for kubectl get/describe/logs/top-style inspection.
# Cluster changes still go through GitOps PRs in this repository.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-manifests-bot-viewer
  namespace: bhaiya
  labels:
    app.kubernetes.io/name: kubernetes-manifests-bot-viewer
    app.kubernetes.io/part-of: bhaiya
    bhaiya.corp/bot: kubernetes-manifests
automountServiceAccountToken: false
