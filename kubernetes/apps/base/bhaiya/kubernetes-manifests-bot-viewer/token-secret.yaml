---
# Long-lived SA token Secret (1.24+). Flux creates it; operators extract the
# token once and place a kubeconfig into the kubernetes-manifests bot as a private
# file (never commit the token). Prefer short-lived TokenRequest once a bot
# secret broker exists.
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-manifests-bot-viewer-token
  namespace: bhaiya
  labels:
    app.kubernetes.io/name: kubernetes-manifests-bot-viewer
    app.kubernetes.io/part-of: bhaiya
  annotations:
    kubernetes.io/service-account.name: kubernetes-manifests-bot-viewer
type: kubernetes.io/service-account-token
