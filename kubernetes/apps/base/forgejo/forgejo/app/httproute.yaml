---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  annotations:
    item.homer.rajsingh.info/name: "Forgejo"
    item.homer.rajsingh.info/subtitle: "Git Forge"
    item.homer.rajsingh.info/logo: "https://forgejo.org/favicon.svg"
    item.homer.rajsingh.info/keywords: "git, forge, code, repository"
    service.homer.rajsingh.info/name: "Infrastructure"
    service.homer.rajsingh.info/icon: "fas fa-code-branch"
spec:
  hostnames:
    - forgejo.${CLUSTER_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Split-horizon for forgejo.${COMMON_DOMAIN} on the private/ts gateways.
# Ottawa CoreDNS/NodeLocal pin this name to 10.169.10.14 (private Envoy VIP,
# eTP Local / SNAT) so in-cluster clients skip the public Maglev+DSR VIP.
# WAN/k8gb stays on HTTPRoute forgejo-cdn (gateway/public).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-internal
spec:
  hostnames:
    - forgejo.${COMMON_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: wildcard-keiretsu-top-https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: wildcard-keiretsu-top-https
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
