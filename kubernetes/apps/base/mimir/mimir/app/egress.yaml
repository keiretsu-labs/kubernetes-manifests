---
apiVersion: v1
kind: Service
metadata:
  name: mimir-gateway
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Override
spec:
  type: ExternalName
  externalName: mimir-gateway-mesh.mimir.svc.clusterset.local
  ports:
    - name: http
      port: 8080
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: mimir-qf
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Override
spec:
  type: ExternalName
  externalName: mimir-qf-mesh.mimir.svc.clusterset.local
  ports:
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
