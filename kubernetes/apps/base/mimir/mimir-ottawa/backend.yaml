---
# See ../mimir/app/backend.yaml. Ottawa resolves this FQDN to its local Mimir
# gateway; cross-cluster clients use the exported MCS gateway Service instead
# of sending internal traffic through Tailscale.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: mimir-gateway
spec:
  endpoints:
    - fqdn:
        hostname: mimir-gateway.mimir.svc.cluster.local
        port: 8080
