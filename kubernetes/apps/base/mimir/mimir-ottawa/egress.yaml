---
# The Ottawa Helm release owns the local mimir-gateway Service. This minimal
# declaration remains in the Kustomization so Flux can relinquish the legacy
# Tailscale egress fields without pruning and recreating the live Service.
# Override removes fields previously owned by this Flux Kustomization while
# leaving Helm-owned fields on the Service intact.
apiVersion: v1
kind: Service
metadata:
  name: mimir-gateway
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Override
