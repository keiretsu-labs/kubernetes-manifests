---
# The Ottawa Helm release owns the local mimir-gateway Service. This minimal
# declaration remains in the Kustomization so Flux can relinquish the legacy
# egress fields without pruning and recreating the live Service.
# Override removes the stale Tailscale externalName while leaving the
# Helm-owned selector, ports, and ClusterIP on the Service intact.
apiVersion: v1
kind: Service
metadata:
  name: mimir-gateway
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Override
spec:
  externalName: null
