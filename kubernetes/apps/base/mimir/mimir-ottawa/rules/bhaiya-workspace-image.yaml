# Workspace-image publication is checked by Bhaiya itself and remote-written
# into the per-cluster Mimir tenant. This must be a native Mimir ruler file;
# PrometheusRule objects in the bhaiya namespace are not evaluated in
# agent-mode Prometheus.
#
# Keep this namespace unique across every file passed to mimirtool. A repeated
# namespace aborts the complete rule sync for every tenant.
namespace: bhaiya-workspace-image
groups:
  - name: bhaiya-workspace-image.rules
    rules:
      - alert: BhaiyaWorkspaceImagePublicationStale
        expr: |
          max by (cluster, image, version) (
            bhaiya_workspace_image_intended_info{
              job="bhaiya",
              container="bhaiya"
            }
          )
          and on (cluster, image, version)
          max by (cluster, image, version) (
            bhaiya_workspace_image_registry_probe_status{
              job="bhaiya",
              container="bhaiya",
              status="missing"
            } == 1
          )
        for: 75m
        labels:
          severity: critical
        annotations:
          summary: Intended workspace image {{ $labels.version }} is not published
          description: >-
            Bhaiya's workspace-image dispatcher intended
            {{ $labels.image }}:{{ $labels.version }}, but its bounded registry
            probe has received a definitive HTTP 404 for at least 75 minutes.
            Inspect the workspace-image-v{{ $labels.version }} Woodpecker tag
            pipeline, especially admission failures and missing registry
            credentials, then verify the manifest and adoption handoff. This
            is distinct from a probe error: network, auth, and registry errors
            are reported by the separate unknown-state alert.

      - alert: BhaiyaWorkspaceImagePublicationProbeUnavailable
        expr: |
          max by (cluster, image, version) (
            bhaiya_workspace_image_intended_info{
              job="bhaiya",
              container="bhaiya"
            }
          )
          and on (cluster, image, version)
          max by (cluster, image, version) (
            bhaiya_workspace_image_registry_probe_status{
              job="bhaiya",
              container="bhaiya",
              status="probe_error"
            } == 1
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Workspace image publication status is unknown
          description: >-
            Bhaiya cannot determine whether the intended workspace image
            {{ $labels.image }}:{{ $labels.version }} is published. The
            registry probe is failing (network, authentication, or server
            error), so this alert does not claim the tag is missing. Restore
            registry reachability and inspect Bhaiya's probe status before
            treating the release as stale.

      - alert: BhaiyaWorkspaceImageAdoptionStale
        expr: |
          max by (cluster, queued_version, queued_digest, template_digest) (
            bhaiya_workspace_image_adoption_info{
              job="bhaiya",
              container="bhaiya",
              registry_status="published"
            } == 1
          )
          and on (cluster)
          max by (cluster) (
            bhaiya_workspace_image_adoption_status{
              job="bhaiya",
              container="bhaiya",
              status="behind"
            } == 1
          )
          and on (cluster)
          max by (cluster, image) (
            bhaiya_workspace_image_latest_alignment_status{
              job="bhaiya",
              container="bhaiya",
              status="mismatch"
            } == 1
          )
        for: 75m
        labels:
          severity: critical
        annotations:
          summary: Workspace image template adoption is behind
          description: >-
            Bhaiya has reported that the newest queued workspace-image release
            is not represented by the active workspace template for at least
            75 minutes. This alert requires a published queued release, a
            definitive behind adoption result, and a definitive template or
            registry-latest alignment mismatch. Query
            bhaiya_workspace_image_adoption_info for the queued version,
            immutable digests, and registry state. A missing publication or
            unavailable observation is handled by the separate publication or
            unknown alerts. Ready/idle curated workspace lag is expected after
            adoption and is reported by
            bhaiya_workspace_image_adoption_workspace_count, not by this alert.

      - alert: BhaiyaWorkspaceImageAdoptionUnknown
        expr: |
          max by (cluster) (
            bhaiya_workspace_image_adoption_status{
              job="bhaiya",
              container="bhaiya",
              status="unknown"
            } == 1
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Workspace image template adoption cannot be evaluated
          description: >-
            Bhaiya cannot establish workspace-image template adoption. Query
            bhaiya_workspace_image_adoption_info for the queued version,
            registry state, and template identity, then restore the Forgejo,
            registry, or durable template observation path. Unknown is kept
            separate from stale so this warning never claims a delivery
            failure without evidence. Fleet drift remains on
            bhaiya_workspace_image_adoption_workspace_count and does not
            page through this alert.

      # The release observer distinguishes a terminal tag-pipeline failure
      # from a release input that never queued. Keep these as separate alerts:
      # they have different causes and runbooks, even though one incident may
      # produce both signals.
      - alert: BhaiyaWorkspaceImageReleasePipelineFailed
        expr: |
          max by (cluster, image, version) (
            bhaiya_workspace_image_release_status{
              status="failed"
            } == 1
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Workspace image release pipeline {{ $labels.version }} failed
          description: >-
            The durable workspace-image tag pipeline for {{ $labels.image }}
            version {{ $labels.version }} has remained in a terminal failed
            state for at least five minutes. Inspect the release pipeline and
            its runbook first. A separate not-queued alert may identify a newer
            release input that never reached a tag pipeline.

      - alert: BhaiyaWorkspaceImageReleaseNotQueued
        expr: |
          max by (cluster, image, version) (
            bhaiya_workspace_image_release_status{
              status="not_queued"
            } == 1
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Workspace image release {{ $labels.version }} was not queued
          description: >-
            Bhaiya observed a workspace-image release input for {{ $labels.image }}
            version {{ $labels.version }} that remained unqueued for at least
            the observer's 3-minute grace plus this 2-minute alert hold. The
            effective source-to-alert delay is approximately 3m grace + up to
            5m observation interval + 2m hold, or about 10 minutes before
            scrape/evaluation jitter. Inspect the main-push dispatcher before
            treating a healthy 28–29 minute tag pipeline as stalled.

      # This is deliberately a separate alert from the release-state alerts:
      # a missing Woodpecker token makes the observer report unknown forever,
      # so neither a failed nor a not-queued release can be detected.
      - alert: BhaiyaWorkspaceImageReleaseObserverUnconfigured
        expr: |
          max by (cluster) (
            bhaiya_workspace_image_release_observer_configured == 0
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya workspace-image release observer is unconfigured
          description: >-
            Bhaiya's workspace-image release observer has reported that its
            required Woodpecker API token is not configured for at least 15
            minutes. While this gauge is zero, release status remains unknown
            and BhaiyaWorkspaceImageReleasePipelineFailed and
            BhaiyaWorkspaceImageReleaseNotQueued cannot fire. Restore the
            observer credential in corp/bhaiya, then verify that release
            status is reporting definitive states again.

      - alert: BhaiyaWoodpeckerMainQueueStalled
        expr: |
          max by (cluster, image) (
            bhaiya_woodpecker_main_queue_head_status{
              status="stalled"
            } == 1
          )
          and on (cluster)
          max by (cluster) (
            bhaiya_workspace_image_release_observer_configured == 1
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Woodpecker main release queue is stalled
          description: >-
            The oldest unstarted push to main has remained in Woodpecker's
            queue beyond the observer's 15-minute threshold for at least five
            minutes. Newer main pushes can accumulate behind it while release
            alerts remain green. Inspect the Woodpecker FIFO lane and project
            cancellation setting; do not cancel an active release blindly.

      - alert: BhaiyaWorkspaceImageReleasePublicationLagging
        expr: |
          max by (cluster, image) (
            bhaiya_workspace_image_release_publication_lag_releases > 1
          )
          and on (cluster)
          max by (cluster) (
            bhaiya_workspace_image_release_observer_configured == 1
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Workspace image releases are not reaching the registry
          description: >-
            The newest durable workspace-image tag is more than one semantic
            release ahead of the highest registry tag with a readable
            manifest for at least 15 minutes. Main and the dispatcher may be
            green while consumer-visible publication is behind. Inspect the
            tag pipeline's promote step, registry manifest, and publication
            credentials; do not hand-push a tag or registry image.

      - alert: BhaiyaWorkspaceImageLatestRollback
        expr: |
          max by (cluster, image) (
            bhaiya_workspace_image_latest_alignment_status{
              status="mismatch"
            } == 1
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Workspace image is not aligned with the newest release
          description: >-
            The {{ $labels.image }} active template or registry latest tag has
            not matched the highest published semantic release for at least
            five minutes. This may indicate a stalled template adoption,
            rollback, or incomplete promotion; inspect the alignment status and
            immutable registry manifests before changing any tag.
