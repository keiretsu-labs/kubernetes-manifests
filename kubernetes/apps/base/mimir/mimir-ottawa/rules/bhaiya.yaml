# Bhaiya fleet alerts are evaluated by the per-cluster Mimir ruler. The
# Bhaiya PrometheusAgent remote-writes these metrics but does not evaluate
# PrometheusRule resources itself, so alerts shipped as PrometheusRule CRs
# in the bhaiya namespace apply cleanly and then never fire. They live here
# instead, alongside rules/payments.yaml which already followed this pattern.
#
# Covers the active control plane, SSH and payments edges, and workspace resources.
#
# The Mimir rule namespace below must be unique across every file listed in
# loader-job.yaml: mimirtool rejects the whole sync with "repeated namespace
# attempted to be loaded" if two files declare the same one, which takes down
# rule syncing for all tenants, not just this file. rules/payments.yaml
# already owns "bhaiya", so the fleet rules use "bhaiya-fleet".
namespace: bhaiya-fleet
groups:
- name: bhaiya.fleet.availability
  rules:
  - alert: BhaiyaServiceNoReadyReplicas
    expr: |
      (
        kube_deployment_spec_replicas{
          namespace="bhaiya",
          deployment=~"bhaiya-(ssh|payments)"
        } > 0
      )
      and on(namespace, deployment)
      (
        kube_deployment_status_replicas_ready{
          namespace="bhaiya",
          deployment=~"bhaiya-(ssh|payments)"
        } == 0
      )
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Bhaiya Deployment {{ $labels.deployment }} has no ready replicas
      description: The active {{ $labels.deployment }} Deployment has desired replicas but
        none are ready. Check the Deployment events, pod readiness probes, and the most recent
        rollout before traffic is lost.
  - alert: BhaiyaScrapeTargetDown
    expr: up{namespace="bhaiya"} == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Bhaiya scrape target {{ $labels.job }} is down
      description: Prometheus has been unable to scrape {{ $labels.job }} for five minutes.
        Inspect the ServiceMonitor target, Service endpoints, and the target pod before relying
        on its dashboard signals.
  - alert: BhaiyaPodCrashLooping
    expr: |
      max by (namespace, pod, container) (
        kube_pod_container_status_waiting_reason{
          namespace="bhaiya",
          reason="CrashLoopBackOff"
        }
      ) > 0
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Bhaiya pod {{ $labels.pod }} is crash-looping
      description: Container {{ $labels.container }} in {{ $labels.pod }} has been in CrashLoopBackOff
        for ten minutes. Inspect its logs and previous container termination reason, then
        roll back or fix the failing configuration.
  - alert: BhaiyaServiceHigh5xxRatio
    expr: |
      (
        sum by (service) (
          rate(
            bhaiya_http_requests_total{
              service=~"bhaiya-ssh|bhaiya-payments",
              code=~"5.."
            }[10m]
          )
        )
        /
        sum by (service) (
          rate(
            bhaiya_http_requests_total{
              service=~"bhaiya-ssh|bhaiya-payments"
            }[10m]
          )
        )
      ) > 0.05
      and on(service)
      sum by (service) (
        rate(
          bhaiya_http_requests_total{
            service=~"bhaiya-ssh|bhaiya-payments"
          }[10m]
        )
      ) > 0.1
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Bhaiya service {{ $labels.service }} has a sustained 5xx ratio
      description: More than five percent of {{ $labels.service }} requests have returned
        5xx for ten minutes with meaningful traffic. Inspect the service logs and route-level
        errors, then compare the current rollout with the last known good image.
  - alert: BhaiyaServiceP99LatencyRegression
    expr: |
      histogram_quantile(
        0.99,
        sum by (service, le) (
          rate(
            bhaiya_http_request_duration_seconds_bucket{
              service=~"bhaiya-ssh|bhaiya-payments"
            }[10m]
          )
        )
      ) > 2
      and on(service)
      sum by (service) (
        rate(
          bhaiya_http_requests_total{
            service=~"bhaiya-ssh|bhaiya-payments"
          }[10m]
        )
      ) > 0.1
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Bhaiya service {{ $labels.service }} p99 latency is high
      description: The p99 request latency for {{ $labels.service }} has stayed above two
        seconds for fifteen minutes. Inspect the route breakdown, downstream dependencies,
        CPU throttling, and the active rollout.
- name: bhaiya.fleet.ssh
  rules:
  - alert: BhaiyaSSHAuthorizationBackendUnavailable
    expr: |
      (
        sum by (cluster) (
          increase(
            bhaiya_ssh_authorization_unavailable_total{
              namespace="bhaiya",
              job="bhaiya-ssh"
            }[15m]
          )
        ) > 0
      )
      or
      (
        sum by (cluster) (
          increase(
            bhaiya_ssh_authentication_attempts_total{
              namespace="bhaiya",
              job="bhaiya-ssh",
              result="unavailable"
            }[15m]
          )
        ) > 0
      )
      or
      (
        sum by (cluster) (
          increase(
            bhaiya_ssh_reauthorization_attempts_total{
              namespace="bhaiya",
              job="bhaiya-ssh",
              result="unavailable"
            }[15m]
          )
        ) > 0
      )
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Bhaiya SSH authorization backend is unavailable
      description: >-
        The SSH edge has recorded an authorization or reauthorization request
        that could not reach the authoritative Bhaiya control plane in the last
        fifteen minutes. New logins and established sessions may be rejected;
        inspect the SSH edge and its private control-plane path.
  - alert: BhaiyaSSHSessionTerminationErrors
    expr: |
      (
        sum by (cluster) (
          increase(
            bhaiya_ssh_session_terminations_total{
              namespace="bhaiya",
              job="bhaiya-ssh",
              reason=~"authorization_unavailable|session_start_timeout|protocol_error|terminal_error"
            }[15m]
          )
        ) > 0
      )
      or
      (
        sum by (cluster) (
          increase(
            bhaiya_ssh_session_disconnects_total{
              namespace="bhaiya",
              job="bhaiya-ssh",
              cause="transport"
            }[15m]
          )
        ) > 0
      )
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Bhaiya SSH sessions are terminating unexpectedly
      description: >-
        The SSH edge has recorded an authorization, startup-timeout, protocol,
        terminal, or transport failure in the last fifteen minutes. Routine
        command completion, ordinary connection closure, drain shutdowns, and
        expected client disconnects are excluded; inspect the affected edge,
        session agent, and workspace stream.
- name: bhaiya.fleet.resources
  rules:
  # NOTE: no cAdvisor-based OOM rule here. Bhaiya workloads run under Kata, and
  # guest-kernel OOM kills are invisible to host cAdvisor:
  # container_oom_events_total{namespace="bhaiya"} stayed flat at 0 for 7 days
  # while forgejo-mcp recorded four OOMKilled terminations (corp/bhaiya#1162).
  # OOM coverage for bhaiya pods comes from the kube-state-metrics-based
  # OomKilled rule in rules/monitoring.yaml, which is namespace-agnostic and
  # verified firing for forgejo-mcp.
  - alert: BhaiyaWorkspaceRestarting
    expr: |
      max by (cluster, namespace, pod) (
        increase(kube_pod_container_status_restarts_total{
          namespace="bhaiya",
          pod=~"sandbox-.+",
          container="workspace"
        }[15m])
      ) > 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Bhaiya workspace {{ $labels.pod }} restarted
      description: >-
        The workspace container in {{ $labels.namespace }}/{{ $labels.pod }}
        restarted within the last 15 minutes. Check the previous termination
        reason, pod cgroup memory, Kata RuntimeClass overhead, and node OOM
        counters before restarting the workspace again.
  - alert: BhaiyaWorkspaceMemoryNearLimit
    expr: |
      (
        max by (cluster, namespace, pod) (
          container_memory_working_set_bytes{
            namespace="bhaiya",
            pod=~"sandbox-.+",
            container="",
            image=""
          }
        )
        /
        on (cluster, namespace, pod)
        sum by (cluster, namespace, pod) (
          kube_pod_container_resource_limits{
            namespace="bhaiya",
            pod=~"sandbox-.+",
            resource="memory",
            unit="byte"
          }
        )
      ) > 0.90
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Bhaiya workspace {{ $labels.pod }} is near its memory limit
      description: >-
        The Kata pod cgroup for {{ $labels.namespace }}/{{ $labels.pod }} has
        exceeded 90 percent of the declared workspace container memory limit
        for five minutes. The guest's apparent free RAM does not prove that
        the host cgroup has reclaimable headroom; correlate RuntimeClass
        overhead and node OOM counters.
  - alert: BhaiyaNodeOOMKill
    expr: increase(node_vmstat_oom_kill{cluster=~"talos-.+"}[15m]) > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Node {{ $labels.instance }} recorded a kernel OOM kill
      description: >-
        The node's kernel OOM-kill counter increased within the last 15
        minutes. Correlate this host signal with Bhaiya workspace restarts and
        pod-level cgroup usage before taking action.
  - alert: BhaiyaPVCNearFull
    expr: |
      (
        kubelet_volume_stats_used_bytes{namespace="bhaiya"}
        * on (cluster, namespace, persistentvolumeclaim) group_left(pod, volume)
        kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="bhaiya"}
      )
      / on (cluster, namespace, node, persistentvolumeclaim, pod, volume)
      (
        kubelet_volume_stats_capacity_bytes{namespace="bhaiya"}
        * on (cluster, namespace, persistentvolumeclaim) group_left(pod, volume)
        kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="bhaiya"}
      )
      > 0.85
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Bhaiya PVC {{ $labels.persistentvolumeclaim }} on {{ $labels.pod }} is near full
      description: PVC {{ $labels.persistentvolumeclaim }} mounted by {{ $labels.namespace }}/{{ $labels.pod }}
        as {{ $labels.volume }} is above 85 percent used for fifteen minutes. Inspect the
        owning workload and storage class, remove safe data or expand the claim before writes fail.
  - alert: BhaiyaNamespaceQuotaNearExhaustion
    expr: |
      (
        kube_resourcequota{namespace="bhaiya", type="used"}
        / on(namespace, resourcequota, resource)
        kube_resourcequota{namespace="bhaiya", type="hard"}
      ) > 0.85
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Bhaiya quota {{ $labels.resource }} is near exhaustion
      description: ResourceQuota {{ $labels.resourcequota }} is above 85 percent for {{ $labels.resource
        }}. Identify the largest consumers and remove or resize safe workloads before namespace
        admission is rejected.
