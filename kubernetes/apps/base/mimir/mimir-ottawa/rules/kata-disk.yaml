# Kata workloads do not emit named-container cAdvisor block-I/O (#2634 keeps
# only container!="" rows; live Kata pods have none). kubelet_volume_stats_*
# still reports PVC used/capacity but has no pod label. These rules join the
# volume stats to the mounting pod and surface the blkio gap as a series
# dashboards can chart. They do not invent physical-device writers; that
# still needs a cgroup-v2 recorder or kata-monitor (see #2639).
#
# Keep this namespace unique across every file passed to mimirtool.
namespace: kata-disk-attribution
groups:
  - name: kata-disk-attribution.rules
    rules:
      - record: kubelet:volume_stats_used_bytes:pod
        expr: |
          sum by (cluster, namespace, node, persistentvolumeclaim, pod, volume) (
            kubelet_volume_stats_used_bytes
            * on (cluster, namespace, persistentvolumeclaim) group_left(pod, volume)
            kube_pod_spec_volumes_persistentvolumeclaims_info
          )

      - record: kubelet:volume_stats_capacity_bytes:pod
        expr: |
          sum by (cluster, namespace, node, persistentvolumeclaim, pod, volume) (
            kubelet_volume_stats_capacity_bytes
            * on (cluster, namespace, persistentvolumeclaim) group_left(pod, volume)
            kube_pod_spec_volumes_persistentvolumeclaims_info
          )

      - record: kubelet:volume_stats_used_ratio:pod
        expr: |
          kubelet:volume_stats_used_bytes:pod
          / on (cluster, namespace, node, persistentvolumeclaim, pod, volume)
          kubelet:volume_stats_capacity_bytes:pod

      # Kata RuntimeClass overlay. Ordinary runc pods have no runtimeclass
      # series and are omitted rather than labelled empty.
      - record: kata:volume_stats_used_bytes
        expr: |
          sum by (cluster, namespace, node, persistentvolumeclaim, pod, volume, runtimeclass_name) (
            kubelet:volume_stats_used_bytes:pod
            * on (cluster, namespace, pod) group_left(runtimeclass_name)
            kube_pod_runtimeclass_name_info{runtimeclass_name=~"kata-.*"}
          )

      - record: kata:volume_stats_used_ratio
        expr: |
          kata:volume_stats_used_bytes
          / on (cluster, namespace, node, persistentvolumeclaim, pod, volume) group_left()
          kubelet:volume_stats_capacity_bytes:pod

      # Named-container physical-device I/O retained by #2634. Present for
      # runc; absent for Kata.
      - record: container:blkio_device_bytes:rate5m
        expr: |
          sum by (cluster, namespace, pod, container, node, device, operation) (
            rate(container_blkio_device_usage_total{container!=""}[5m])
          )

      # 1 for each running Kata pod that has no named-container blkio series.
      # Chart this instead of treating an empty I/O panel as "the sandbox is idle".
      - record: kata:blkio_attribution_missing
        expr: |
          (
            max by (cluster, namespace, pod, runtimeclass_name) (
              kube_pod_runtimeclass_name_info{runtimeclass_name=~"kata-.*"}
              * on (cluster, namespace, pod) group_left()
              (kube_pod_status_phase{phase="Running"} == 1)
            )
          )
          unless on (cluster, namespace, pod)
          container_blkio_device_usage_total{container!=""}

      - alert: KataPVCNearFull
        expr: kata:volume_stats_used_ratio > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Kata PVC {{ $labels.persistentvolumeclaim }} on
            {{ $labels.namespace }}/{{ $labels.pod }} is near full
          description: >-
            Workspace volume {{ $labels.volume }}
            ({{ $labels.persistentvolumeclaim }}) for Kata pod
            {{ $labels.namespace }}/{{ $labels.pod }}
            ({{ $labels.runtimeclass_name }} on {{ $labels.node }}) is above
            85 percent used for fifteen minutes. This is kubelet filesystem
            usage attributed through the PVC-to-pod join, not guest block-I/O
            on a physical host device.
