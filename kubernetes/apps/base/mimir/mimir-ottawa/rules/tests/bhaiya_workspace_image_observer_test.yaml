rule_files:
  - ../bhaiya-workspace-image.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_release_observer_configured{cluster="talos-ottawa"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: BhaiyaWorkspaceImageReleaseObserverUnconfigured
        exp_alerts: []
      - eval_time: 15m
        alertname: BhaiyaWorkspaceImageReleaseObserverUnconfigured
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              severity: critical
            exp_annotations:
              summary: Bhaiya workspace-image release observer is unconfigured
              description: >-
                Bhaiya's workspace-image release observer has reported that its
                required Woodpecker API token is not configured for at least 15
                minutes. While this gauge is zero, release status remains
                unknown and BhaiyaWorkspaceImageReleasePipelineFailed and
                BhaiyaWorkspaceImageReleaseNotQueued cannot fire. Restore the
                observer credential in corp/bhaiya, then verify that release
                status is reporting definitive states again.

  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_release_observer_configured{cluster="talos-ottawa"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: BhaiyaWorkspaceImageReleaseObserverUnconfigured
        exp_alerts: []

  # Replay the 14-hour delivery outage: the observer was unconfigured, so its
  # release state stayed unknown and the terminal failure/not-queued alerts had
  # no matching status series to evaluate.
  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_release_observer_configured{cluster="talos-ottawa"}'
        values: "0+0x840"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.412",status="unknown"}'
        values: "1+0x840"
    alert_rule_test:
      - eval_time: 840m
        alertname: BhaiyaWorkspaceImageReleaseObserverUnconfigured
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              severity: critical
            exp_annotations:
              summary: Bhaiya workspace-image release observer is unconfigured
              description: >-
                Bhaiya's workspace-image release observer has reported that its
                required Woodpecker API token is not configured for at least 15
                minutes. While this gauge is zero, release status remains
                unknown and BhaiyaWorkspaceImageReleasePipelineFailed and
                BhaiyaWorkspaceImageReleaseNotQueued cannot fire. Restore the
                observer credential in corp/bhaiya, then verify that release
                status is reporting definitive states again.
      - eval_time: 840m
        alertname: BhaiyaWorkspaceImageReleasePipelineFailed
        exp_alerts: []
      - eval_time: 840m
        alertname: BhaiyaWorkspaceImageReleaseNotQueued
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_release_observer_configured{cluster="talos-ottawa"}'
        values: "1+0x20"
      - series: 'bhaiya_woodpecker_main_queue_head_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",status="stalled"}'
        values: "1+0x20"
      - series: 'bhaiya_workspace_image_release_version_lag_releases{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace"}'
        values: "2+0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: BhaiyaWoodpeckerMainQueueStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: BhaiyaWoodpeckerMainQueueStalled
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              image: oci.cdn.keiretsu.top/corp/workspace
              severity: critical
            exp_annotations:
              summary: Woodpecker main release queue is stalled
              description: >-
                The oldest unstarted push to main has remained in Woodpecker's
                queue beyond the observer's 15-minute threshold for at least five
                minutes. Newer main pushes can accumulate behind it while release
                alerts remain green. Inspect the Woodpecker FIFO lane and project
                cancellation setting; do not cancel an active release blindly.
      - eval_time: 14m
        alertname: BhaiyaWorkspaceImageReleaseVersionLagging
        exp_alerts: []
      - eval_time: 15m
        alertname: BhaiyaWorkspaceImageReleaseVersionLagging
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              image: oci.cdn.keiretsu.top/corp/workspace
              severity: warning
            exp_annotations:
              summary: Workspace image releases are behind main
              description: >-
                main's semantic workspace-image/VERSION is more than one release
                ahead of the newest durable workspace-image tag for at least 15
                minutes. Inspect the main queue, dispatcher, tag pipeline, and
                registry before treating the semantic lag as a build failure.
