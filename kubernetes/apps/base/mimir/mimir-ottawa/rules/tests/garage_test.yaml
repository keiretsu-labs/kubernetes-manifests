rule_files:
  - ../garage.yaml

evaluation_interval: 1m

tests:
  # Quorum loss is a distinct escalation from under-replication: exercise the
  # same rule independently for every cluster identity. This is the failure
  # shape described by corp/bhaiya#725, where serving continued while some
  # partitions became unreachable.
  - interval: 1m
    input_series:
      - series: 'cluster_partitions{cluster="talos-ottawa"}'
        values: "256+0x10"
      - series: 'cluster_partitions_quorum{cluster="talos-ottawa"}'
        values: "255+0x10"
      - series: 'cluster_partitions{cluster="talos-robbinsdale"}'
        values: "256+0x10"
      - series: 'cluster_partitions_quorum{cluster="talos-robbinsdale"}'
        values: "254+0x10"
      - series: 'cluster_partitions{cluster="talos-stpetersburg"}'
        values: "256+0x10"
      - series: 'cluster_partitions_quorum{cluster="talos-stpetersburg"}'
        values: "253+0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: GarageClusterPartitionsWithoutQuorum
        exp_alerts: []
      - eval_time: 5m
        alertname: GarageClusterPartitionsWithoutQuorum
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: talos-ottawa
            exp_annotations:
              summary: Garage partitions have lost quorum in talos-ottawa
              description: >-
                cluster_partitions_quorum is below cluster_partitions: some
                partitions no longer have enough up nodes to serve. Under
                consistencyMode=degraded reads come from a single replica and
                may still succeed; writes to those partitions fail. Restore
                the missing storage nodes.
          - exp_labels:
              severity: critical
              cluster: talos-robbinsdale
            exp_annotations:
              summary: Garage partitions have lost quorum in talos-robbinsdale
              description: >-
                cluster_partitions_quorum is below cluster_partitions: some
                partitions no longer have enough up nodes to serve. Under
                consistencyMode=degraded reads come from a single replica and
                may still succeed; writes to those partitions fail. Restore
                the missing storage nodes.
          - exp_labels:
              severity: critical
              cluster: talos-stpetersburg
            exp_annotations:
              summary: Garage partitions have lost quorum in talos-stpetersburg
              description: >-
                cluster_partitions_quorum is below cluster_partitions: some
                partitions no longer have enough up nodes to serve. Under
                consistencyMode=degraded reads come from a single replica and
                may still succeed; writes to those partitions fail. Restore
                the missing storage nodes.

  # A short quorum dip must not page. Recovery before the five-minute hold
  # clears the pending alert, preserving the distinction from a sustained
  # unavailable-partition condition.
  - interval: 1m
    input_series:
      - series: 'cluster_partitions{cluster="talos-ottawa"}'
        values: "256+0x10"
      - series: 'cluster_partitions_quorum{cluster="talos-ottawa"}'
        values: "254+0x3 256+0x7"
    alert_rule_test:
      - eval_time: 4m
        alertname: GarageClusterPartitionsWithoutQuorum
        exp_alerts: []
      - eval_time: 10m
        alertname: GarageClusterPartitionsWithoutQuorum
  - interval: 1m
    input_series:
      - series: 'cluster_connected_nodes{cluster="talos-ottawa",container="garage",endpoint="admin",instance="10.3.0.1:3903",job="garage",namespace="garage",pod="garage-storage-local-700-ottawa",service="garage"}'
        values: "17+0x20"
      - series: 'cluster_connected_nodes{cluster="talos-robbinsdale",container="garage",endpoint="admin",instance="10.1.0.1:3903",job="garage",namespace="garage",pod="garage-storage-local-700-robbinsdale",service="garage"}'
        values: "16+0x20"
      - series: 'cluster_connected_nodes{cluster="talos-stpetersburg",container="garage",endpoint="admin",instance="10.5.0.1:3903",job="garage",namespace="garage",pod="garage-storage-local-200-stpetersburg",service="garage"}'
        values: "17+0x20"
      - series: 'cluster_connected_nodes{cluster="talos-ottawa",container="garage",endpoint="admin",instance="10.3.0.2:3903",job="garage",namespace="garage",pod="garage-storage-local-700-healthy",service="garage"}'
        values: "18+0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: GarageFederationPeerConnectivityDegraded
        exp_alerts: []
      - eval_time: 15m
        alertname: GarageFederationPeerConnectivityDegraded
        exp_alerts:
          - exp_labels:
              cluster: talos-robbinsdale
              severity: warning
            exp_annotations:
              summary: >-
                Garage federation connectivity degraded in talos-robbinsdale
              description: >-
                The best observed Garage admin vantage point in
                talos-robbinsdale has seen only 16 of the expected 18
                federation peers for 15m. A lower count from one pod alone is
                not sufficient because Garage reports this metric per scrape
                target. Check inter-site RPC transport (DNS, TCP 3901,
                Tailscale, routing, and policy).
          - exp_labels:
              cluster: talos-stpetersburg
              severity: warning
            exp_annotations:
              summary: >-
                Garage federation connectivity degraded in talos-stpetersburg
              description: >-
                The best observed Garage admin vantage point in
                talos-stpetersburg has seen only 17 of the expected 18
                federation peers for 15m. A lower count from one pod alone is
                not sufficient because Garage reports this metric per scrape
                target. Check inter-site RPC transport (DNS, TCP 3901,
                Tailscale, routing, and policy).

  - interval: 1m
    input_series:
      - series: 'cluster_connected_nodes{cluster="talos-robbinsdale",container="garage",endpoint="admin",instance="10.1.0.1:3903",job="garage",namespace="garage",pod="garage-storage-local-700-robbinsdale",service="garage"}'
        values: "16+0x5 18+0x15"
    alert_rule_test:
      - eval_time: 4m
        alertname: GarageFederationPeerConnectivityDegraded
        exp_alerts: []
      - eval_time: 5m
        alertname: GarageFederationPeerConnectivityDegraded
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'cortex_ingester_shipper_upload_failures_total{cluster="talos-ottawa",namespace="mimir",pod="mimir-ingester-0"}'
        values: "0+1x30"
      - series: 'cortex_ingester_shipper_upload_failures_total{cluster="talos-ottawa",namespace="mimir",pod="mimir-ingester-1"}'
        values: "3+0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: MimirIngesterBlockShippingFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: MimirIngesterBlockShippingFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              cluster: talos-ottawa
              namespace: mimir
              pod: mimir-ingester-0
            exp_annotations:
              summary: Mimir ingester mimir-ingester-0 is failing to ship blocks to Garage
              description: >-
                mimir-ingester-0 has failed TSDB block uploads to long-term
                storage within the last hour. Unshipped blocks only exist on
                the ingester PVC (RF=1). Check the ingester log for "uploading
                new block to long-term storage failed" and the Garage gateway
                logs.
