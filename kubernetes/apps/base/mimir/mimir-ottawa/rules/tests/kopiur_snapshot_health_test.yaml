rule_files:
  - ../kopiur.yaml

evaluation_interval: 1m

tests:
  # This is the outage shape that the migration lost coverage for: a current
  # Snapshot remains Pending. The fixture uses the live Mimir label contract
  # (controller namespace plus exported protected namespace), not the raw
  # controller endpoint's namespace label.
  - interval: 1m
    input_series:
      - series: 'kopiur_resource_phase{cluster="talos-ottawa",kind="Snapshot",name="bhaiya-actionable-1789721339",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-actionable",phase="Pending"}'
        values: "1+0x80"
    alert_rule_test:
      - eval_time: 59m
        alertname: KopiurSnapshotNotCompleting
        exp_alerts: []
      - eval_time: 1h1m
        alertname: KopiurSnapshotNotCompleting
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              exported_namespace: bhaiya
              kind: Snapshot
              namespace: bhaiya
              policy: bhaiya-actionable
              name: bhaiya-actionable-1789721339
              phase: Pending
              severity: critical
            exp_annotations:
              summary: Kopiur snapshot bhaiya/bhaiya-actionable is not completing
              description: >-
                Kopiur snapshot bhaiya-actionable-1789721339 for
                bhaiya/bhaiya-actionable has remained in Pending for at least one
                hour. Inspect the Snapshot, SnapshotPolicy, mover Job, and
                controller events. This catches a stalled Pending or Running
                snapshot; a failure-state alert alone would not catch this
                outage.

  # A current Succeeded Snapshot is healthy and must stay silent on the
  # stalled-state alert, even after the one-hour hold.
  - interval: 1m
    input_series:
      - series: 'kopiur_resource_phase{cluster="talos-ottawa",kind="Snapshot",name="bhaiya-actionable-1789721339",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-actionable",phase="Succeeded"}'
        values: "1+0x80"
    alert_rule_test:
      - eval_time: 1h1m
        alertname: KopiurSnapshotNotCompleting
        exp_alerts: []

  # Explicit failure remains covered independently of the Pending/Running
  # guard, using the controller's current per-policy failure metric.
  - interval: 1m
    input_series:
      - series: 'kopiur_leader_is_leader{cluster="talos-ottawa"}'
        values: "1+0x20"
      - series: 'kopiur_snapshot_consecutive_failures{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",name="bhaiya-actionable"}'
        values: "1+0x20"
      - series: 'kopiur_snapshotpolicy_last_backup_success{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-actionable"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: KopiurSnapshotFailureState
        exp_alerts: []
      - eval_time: 6m
        alertname: KopiurSnapshotFailureState
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              exported_namespace: bhaiya
              namespace: bhaiya
              policy: bhaiya-actionable
              name: bhaiya-actionable
              severity: critical
            exp_annotations:
              summary: Kopiur policy bhaiya/bhaiya-actionable has failed snapshots
              description: >-
                Kopiur reports 1 consecutive failed snapshots for
                bhaiya/bhaiya-actionable since its latest success. Inspect the
                current Snapshot, mover Job, repository, and controller events.
                This is separate from the stalled-state alert because Pending
                is not Failed.
      - eval_time: 1m
        alertname: KopiurSnapshotFailed
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              exported_namespace: bhaiya
              namespace: bhaiya
              policy: bhaiya-actionable
              severity: critical
            exp_annotations:
              summary: Kopiur policy bhaiya-actionable reports a failed snapshot
              description: >-
                Kopiur's latest terminal snapshot for bhaiya/bhaiya-actionable is
                failed. This is a per-policy current-result signal; an old Failed
                Snapshot object alone does not keep the alert firing after a later
                success. Inspect the current Snapshot, SnapshotPolicy, mover Job, and
                repository logs.

  # A previous success older than the 24-hour freshness window fires, while a
  # recent success stays silent. The metric is a Unix timestamp, so the test
  # pins both cases away from the exact boundary.
  - interval: 1m
    input_series:
      - series: 'kopiur_leader_is_leader{cluster="talos-ottawa"}'
        values: "1+0x2250"
      - series: 'kopiur_policy_last_backup_success_timestamp_seconds{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-old"}'
        values: "1+0x2250"
      - series: 'kopiur_policy_last_backup_success_timestamp_seconds{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-fresh"}'
        values: "89000+0x2250"
      - series: 'kopiur_snapshotpolicy_last_backup_success{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-old"}'
        values: "1+0x2250"
    alert_rule_test:
      - eval_time: 25h
        alertname: KopiurSnapshotSuccessStale
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              exported_namespace: bhaiya
              namespace: bhaiya
              policy: bhaiya-old
              severity: critical
            exp_annotations:
              summary: Kopiur policy bhaiya/bhaiya-old has no recent successful snapshot
              description: >-
                No successful Kopiur snapshot for bhaiya/bhaiya-old has
                completed within 24 hours. This is a freshness guard distinct
                from current Pending/Running and failure state; inspect the
                SnapshotSchedule, current Snapshot, mover Job, repository, and
                controller metrics.
      - eval_time: 37h
        alertname: KopiurSnapshotStale
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              exported_namespace: bhaiya
              namespace: bhaiya
              policy: bhaiya-old
              severity: critical
            exp_annotations:
              summary: Kopiur policy bhaiya-old has a stale snapshot
              description: >-
                No successful Kopiur snapshot for bhaiya/bhaiya-old has completed
                within 36 hours (the daily schedule, jitter, and operational margin).
                The timestamp must be positive, so a controller restart/reset cannot
                turn a zero gauge into an immediate stale alert. Inspect the
                SnapshotSchedule, current Snapshot, mover Job, and repository
                reachability.

  # Teaspoon remains suspended by policy even while its Sandbox is Running.
  # Even pathological failure, stale, or Pending metrics must not page for
  # either intentionally suspended policy.
  - interval: 1m
    input_series:
      - series: 'kopiur_leader_is_leader{cluster="talos-ottawa"}'
        values: "1+0x2250"
      # The production rule has a documented Teaspoon intent exception because
      # its Sandbox remains ready while its two policies are suspended.
      - series: 'bhaiya_workspace_state{cluster="talos-ottawa",workspace="teaspoon",state="ready"}'
        values: "1+0x2250"
      - series: 'kopiur_resource_phase{cluster="talos-ottawa",kind="Snapshot",name="bhaiya-teaspoon-1789721339",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-teaspoon",phase="Pending"}'
        values: "1+0x2250"
      - series: 'kopiur_resource_phase{cluster="talos-ottawa",kind="Snapshot",name="bhaiya-teaspoon-tailscale-state-1789721339",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-teaspoon-tailscale-state",phase="Pending"}'
        values: "1+0x2250"
      - series: 'kopiur_snapshot_consecutive_failures{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",name="bhaiya-teaspoon"}'
        values: "1+0x2250"
      - series: 'kopiur_snapshot_consecutive_failures{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",name="bhaiya-teaspoon-tailscale-state"}'
        values: "1+0x2250"
      - series: 'kopiur_snapshotpolicy_last_backup_success{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-teaspoon"}'
        values: "1+0x2250"
      - series: 'kopiur_snapshotpolicy_last_backup_success{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-teaspoon-tailscale-state"}'
        values: "1+0x2250"
      - series: 'kopiur_policy_last_backup_success_timestamp_seconds{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-teaspoon"}'
        values: "1+0x2250"
      - series: 'kopiur_policy_last_backup_success_timestamp_seconds{cluster="talos-ottawa",namespace="kopiur-system",exported_namespace="bhaiya",policy="bhaiya-teaspoon-tailscale-state"}'
        values: "1+0x2250"
    alert_rule_test:
      - eval_time: 37h
        alertname: KopiurSnapshotNotCompleting
        exp_alerts: []
      - eval_time: 37h
        alertname: KopiurSnapshotFailureState
        exp_alerts: []
      - eval_time: 37h
        alertname: KopiurSnapshotSuccessStale
        exp_alerts: []
      - eval_time: 37h
        alertname: KopiurSnapshotFailed
        exp_alerts: []
      - eval_time: 37h
        alertname: KopiurSnapshotStale
        exp_alerts: []
