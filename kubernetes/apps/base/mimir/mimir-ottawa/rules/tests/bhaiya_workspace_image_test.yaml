rule_files:
  - ../bhaiya-workspace-image.yaml

evaluation_interval: 1m

tests:
  # Replay the original #2646 publication gap: intended 0.3.243 is a
  # definitive registry 404. The stale alert waits 75m so a normal tag
  # pipeline does not page. probe_error must stay a separate unknown.
  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_intended_info{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243",status="missing"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243",status="published"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243",status="probe_error"}'
        values: "0+0x80"
    alert_rule_test:
      - eval_time: 74m
        alertname: BhaiyaWorkspaceImagePublicationStale
        exp_alerts: []
      - eval_time: 75m
        alertname: BhaiyaWorkspaceImagePublicationStale
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              image: oci.cdn.keiretsu.top/corp/workspace
              version: "0.3.243"
              severity: critical
            exp_annotations:
              summary: Intended workspace image 0.3.243 is not published
              description: >-
                Bhaiya's workspace-image dispatcher intended
                oci.cdn.keiretsu.top/corp/workspace:0.3.243, but its bounded registry
                probe has received a definitive HTTP 404 for at least 75 minutes.
                Inspect the workspace-image-v0.3.243 Woodpecker tag
                pipeline, especially admission failures and missing registry
                credentials, then verify the manifest and adoption handoff. This
                is distinct from a probe error: network, auth, and registry errors
                are reported by the separate unknown-state alert.
      - eval_time: 75m
        alertname: BhaiyaWorkspaceImagePublicationProbeUnavailable
        exp_alerts: []

  # A known published intended tag stays quiet for both publication alerts.
  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_intended_info{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.242"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.242",status="published"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.242",status="missing"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.242",status="probe_error"}'
        values: "0+0x80"
    alert_rule_test:
      - eval_time: 75m
        alertname: BhaiyaWorkspaceImagePublicationStale
        exp_alerts: []
      - eval_time: 75m
        alertname: BhaiyaWorkspaceImagePublicationProbeUnavailable
        exp_alerts: []

  # Auth/network/registry failure is unknown. It must never page as stale.
  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_intended_info{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243"}'
        values: "1+0x20"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243",status="probe_error"}'
        values: "1+0x20"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243",status="missing"}'
        values: "0+0x20"
      - series: 'bhaiya_workspace_image_registry_probe_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.243",status="published"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: BhaiyaWorkspaceImagePublicationProbeUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: BhaiyaWorkspaceImagePublicationProbeUnavailable
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              image: oci.cdn.keiretsu.top/corp/workspace
              version: "0.3.243"
              severity: warning
            exp_annotations:
              summary: Workspace image publication status is unknown
              description: >-
                Bhaiya cannot determine whether the intended workspace image
                oci.cdn.keiretsu.top/corp/workspace:0.3.243 is published. The
                registry probe is failing (network, authentication, or server
                error), so this alert does not claim the tag is missing. Restore
                registry reachability and inspect Bhaiya's probe status before
                treating the release as stale.
      - eval_time: 15m
        alertname: BhaiyaWorkspaceImagePublicationStale
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.299",status="failed"}'
        values: "1+0x20"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.300",status="not_queued"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: BhaiyaWorkspaceImageReleasePipelineFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: BhaiyaWorkspaceImageReleasePipelineFailed
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              image: oci.cdn.keiretsu.top/corp/workspace
              version: 0.3.299
              severity: critical
            exp_annotations:
              summary: Workspace image release pipeline 0.3.299 failed
              description: >-
                The durable workspace-image tag pipeline for
                oci.cdn.keiretsu.top/corp/workspace version 0.3.299 has
                remained in a terminal failed state for at least five minutes.
                Inspect the release pipeline and its runbook first. A separate
                not-queued alert may identify a newer release input that never
                reached a tag pipeline.
      - eval_time: 1m
        alertname: BhaiyaWorkspaceImageReleaseNotQueued
        exp_alerts: []
      - eval_time: 2m
        alertname: BhaiyaWorkspaceImageReleaseNotQueued
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              image: oci.cdn.keiretsu.top/corp/workspace
              version: 0.3.300
              severity: critical
            exp_annotations:
              summary: Workspace image release 0.3.300 was not queued
              description: >-
                Bhaiya observed a workspace-image release input for
                oci.cdn.keiretsu.top/corp/workspace version 0.3.300 that
                remained unqueued for at least the observer's 3-minute grace
                plus this 2-minute alert hold. The effective source-to-alert
                delay is approximately 3m grace + up to 5m observation interval
                + 2m hold, or about 10 minutes before scrape/evaluation jitter.
                Inspect the main-push dispatcher before treating a healthy
                28–29 minute tag pipeline as stalled.

  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_latest_alignment_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",status="aligned"}'
        values: "0+0x20"
      - series: 'bhaiya_workspace_image_latest_alignment_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",status="mismatch"}'
        values: "1+0x20"
      - series: 'bhaiya_workspace_image_latest_alignment_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",status="unknown"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: BhaiyaWorkspaceImageLatestRollback
        exp_alerts: []
      - eval_time: 5m
        alertname: BhaiyaWorkspaceImageLatestRollback
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              image: oci.cdn.keiretsu.top/corp/workspace
              severity: critical
            exp_annotations:
              summary: Workspace image is not aligned with the newest release
              description: >-
                The oci.cdn.keiretsu.top/corp/workspace active template or
                registry latest tag has not matched the highest published
                semantic release for at least five minutes. This may indicate
                a stalled template adoption, rollback, or incomplete
                promotion; inspect the alignment status and immutable registry
                manifests before changing any tag.


  # Replay the real consecutive adoption failures. Each release was published,
  # the active template stayed on the older digest, and the control plane kept
  # exposing one definitive mismatch. The version is carried by adoption_info
  # so the alert proves all three releases, not just an anonymous cluster gap.
  - interval: 1m
    input_series:
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.350",status="ok"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.350",status="not_queued"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.350",status="failed"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.350",status="unknown"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.351",status="ok"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.351",status="not_queued"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.351",status="failed"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.351",status="unknown"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.352",status="ok"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.352",status="not_queued"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.352",status="failed"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_release_status{cluster="talos-ottawa",image="oci.cdn.keiretsu.top/corp/workspace",version="0.3.352",status="unknown"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_adoption_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",status="current"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_adoption_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",status="behind"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_adoption_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",status="unknown"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_adoption_info{cluster="talos-ottawa",job="bhaiya",container="bhaiya",queued_version="0.3.350",queued_digest="sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",template_digest="sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff",registry_status="published"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_adoption_info{cluster="talos-ottawa",job="bhaiya",container="bhaiya",queued_version="0.3.351",queued_digest="sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",template_digest="sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff",registry_status="published"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_adoption_info{cluster="talos-ottawa",job="bhaiya",container="bhaiya",queued_version="0.3.352",queued_digest="sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",template_digest="sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff",registry_status="published"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_latest_alignment_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",status="aligned"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_latest_alignment_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",status="mismatch"}'
        values: "1+0x80"
      - series: 'bhaiya_workspace_image_latest_alignment_status{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace",status="unknown"}'
        values: "0+0x80"
      - series: 'bhaiya_workspace_image_latest_alignment_last_definitive_timestamp_seconds{cluster="talos-ottawa",job="bhaiya",container="bhaiya",image="oci.cdn.keiretsu.top/corp/workspace"}'
        values: "1726400000+0x80"
    alert_rule_test:
      - eval_time: 74m
        alertname: BhaiyaWorkspaceImageAdoptionStale
        exp_alerts: []
      - eval_time: 75m
        alertname: BhaiyaWorkspaceImageAdoptionStale
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              queued_version: 0.3.350
              queued_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              template_digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
              severity: critical
            exp_annotations:
              summary: Workspace image template adoption is behind
              description: >-
                Bhaiya has reported that the newest queued workspace-image release
                is not represented by the active workspace template for at least
                75 minutes. This alert requires a published queued release, a
                definitive behind adoption result, and a definitive template or
                registry-latest alignment mismatch. Query
                bhaiya_workspace_image_adoption_info for the queued version,
                immutable digests, and registry state. A missing publication or
                unavailable observation is handled by the separate publication or
                unknown alerts. Ready/idle curated workspace lag is expected after
                adoption and is reported by
                bhaiya_workspace_image_adoption_workspace_count, not by this alert.
          - exp_labels:
              cluster: talos-ottawa
              queued_version: 0.3.351
              queued_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              template_digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
              severity: critical
            exp_annotations:
              summary: Workspace image template adoption is behind
              description: >-
                Bhaiya has reported that the newest queued workspace-image release
                is not represented by the active workspace template for at least
                75 minutes. This alert requires a published queued release, a
                definitive behind adoption result, and a definitive template or
                registry-latest alignment mismatch. Query
                bhaiya_workspace_image_adoption_info for the queued version,
                immutable digests, and registry state. A missing publication or
                unavailable observation is handled by the separate publication or
                unknown alerts. Ready/idle curated workspace lag is expected after
                adoption and is reported by
                bhaiya_workspace_image_adoption_workspace_count, not by this alert.
          - exp_labels:
              cluster: talos-ottawa
              queued_version: 0.3.352
              queued_digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
              template_digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
              severity: critical
            exp_annotations:
              summary: Workspace image template adoption is behind
              description: >-
                Bhaiya has reported that the newest queued workspace-image release
                is not represented by the active workspace template for at least
                75 minutes. This alert requires a published queued release, a
                definitive behind adoption result, and a definitive template or
                registry-latest alignment mismatch. Query
                bhaiya_workspace_image_adoption_info for the queued version,
                immutable digests, and registry state. A missing publication or
                unavailable observation is handled by the separate publication or
                unknown alerts. Ready/idle curated workspace lag is expected after
                adoption and is reported by
                bhaiya_workspace_image_adoption_workspace_count, not by this alert.
