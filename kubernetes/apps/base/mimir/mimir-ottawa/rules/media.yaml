groups:
  - name: media.rules
    rules:
      # The probe exits non-zero after it asks gluetun to re-pick a server, so a
      # failed Job means a rotation happened. One is routine; a stream of them
      # means every server being drawn has an unusable forwarded port.
      #
      # Count rotations in a window rather than testing a failed Job for presence:
      # kube_job_status_failed stays >0 for as long as failedJobsHistoryLimit
      # retains the Job, so `> 0` latches the alert on long after convergence.
      # kube-state-metrics carries no cronjob label, hence the label_replace.
      - alert: QbittorrentVpnRotated
        expr: >-
          count by (cronjob) (
            label_replace(
              max_over_time(
                kube_job_status_failed{namespace="media", job_name=~"qbittorrent(-pvt)?-portforward-probe-.*"}[1h]
              ) > 0,
              "cronjob", "$$1", "job_name", "(qbittorrent(?:-pvt)?-portforward-probe)-.*"
            )
          ) > 2
        for: 5m
        annotations:
          summary: >-
            {{ $labels.cronjob }} reports port forwarding is not working
          description: >-
            The port-forward probe failed more than twice in the last hour. Either it
            found the forwarded port unreachable on two rounds a minute apart and rotated
            the VPN without converging on a usable exit address, or gluetun has no
            forwarded port at all — its NAT-PMP request is refused when the Proton
            wireguard key was generated without NAT-PMP (Port Forwarding), which no
            rotation can fix. The Job logs distinguish the two. Only clusters that
            actually port forward run this to completion; Robbinsdale deliberately runs
            without port forwarding and short-circuits instead.
        labels:
          severity: warning

      # Dead man's switch. The probe short-circuits (exit 0) whenever the VPN is
      # down or the port sync has not caught up, so a broken probe looks exactly
      # like a healthy one. Absence of a recent success is the only real signal.
      - alert: QbittorrentPortForwardProbeStale
        expr: >-
          time() - kube_cronjob_status_last_successful_time{namespace="media", cronjob=~"qbittorrent(-pvt)?-portforward-probe"} > 1800
        for: 10m
        annotations:
          summary: >-
            {{ $labels.cronjob }} has not succeeded in 30 minutes
          description: >-
            The port-forward probe last completed successfully more than 30 minutes
            ago. Either it is failing to run at all, or it has been rotating
            continuously. Port-forward reachability is unmonitored until this clears.
        labels:
          severity: critical
