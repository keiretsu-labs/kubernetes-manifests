# The reconciler emits cycle-level results: success, blocked, or error. Keep the
# cycle alerts for compatibility while the bounded workspace gauge provides the
# actionable page. The gauge identifies the workspace whose reconcile operation
# returned ErrPendingReview; related stale provider objects can belong to other
# workspaces and must not be attributed to this label.
#
# last_success_timestamp is updated only after a complete successful pass. Take
# the newest value across replicas: the non-leader's value is harmless, and the
# maximum remains the last real success during a leader transfer. Do not gate
# this alert on bhaiya_reconcile_leader; no leader is itself a no-success
# condition and must not suppress the signal.
#
# Keep this namespace unique across every file passed to mimirtool. A repeated
# namespace aborts the complete sync for every Mimir tenant.
namespace: bhaiya-reconciler
groups:
  - name: bhaiya-reconciler.rules
    rules:
      - alert: BhaiyaReconcileBlocked
        expr: |
          sum by (cluster) (
            increase(
              bhaiya_reconcile_cycles_total{
                job="bhaiya",
                container="bhaiya",
                result="blocked"
              }[5m]
            )
          ) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya reconciliation is blocked pending operator review
          description: >-
            At least one review-blocked reconciliation cycle was recorded in
            the last five minutes. Blocked cycles do not advance the last
            successful-cycle timestamp and will not clear without operator
            action; inspect the reconciler logs for the affected workspace and
            the provider object that needs review.

      - alert: BhaiyaReconcileWorkspaceBlocked
        expr: |
          max by (cluster, workspace) (
            bhaiya_reconcile_blocked_workspaces{
              job="bhaiya",
              container="bhaiya",
              workspace!="__overflow__"
            }
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya reconciliation is blocked for workspace {{ $labels.workspace }}
          description: >-
            Workspace {{ $labels.workspace }} returned ErrPendingReview during
            its reconcile operation. This label names the blocked workspace;
            stale provider objects observed while reconciling another workspace
            can be a separate failure and are not attributed to this label.
            The block requires operator review and will not clear on its own.

      - alert: BhaiyaReconcileBlockedOverflow
        expr: |
          max by (cluster) (
            bhaiya_reconcile_blocked_workspaces{
              job="bhaiya",
              container="bhaiya",
              workspace="__overflow__"
            }
          ) > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Bhaiya has more blocked workspaces than the alert can name
          description: >-
            More than 64 workspaces returned ErrPendingReview in the current
            reconcile pass. The workspace gauge intentionally exposes only a
            bounded set of names plus this overflow signal; inspect Bhaiya
            logs and metrics to enumerate the affected workspaces.

      - alert: BhaiyaReconcileErrors
        expr: |
          sum by (cluster) (
            increase(
              bhaiya_reconcile_cycles_total{
                job="bhaiya",
                container="bhaiya",
                result="error"
              }[15m]
            )
          ) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Bhaiya reconciliation has sustained cycle errors
          description: >-
            More than two ordinary or mixed-error reconciliation cycles were
            recorded in every sustained fifteen-minute window. Inspect the
            reconciler logs and the affected provider or workspace operation;
            this is distinct from a review-only blocked cycle.

      - alert: BhaiyaReconcileLastSuccessStale
        expr: |
          time() - max by (cluster) (
            bhaiya_reconcile_last_success_timestamp_seconds{
              job="bhaiya",
              container="bhaiya"
            }
          ) > 10 * 60
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya reconciliation has stopped completing successful cycles
          description: >-
            No successful reconciliation cycle has completed for more than ten
            minutes. Check `kubectl logs -n bhaiya deploy/bhaiya | grep
            'reconcile workspace resources'` for the aggregated error, then
            inspect the cycle result and affected workspace before relying on
            desired-state convergence.
