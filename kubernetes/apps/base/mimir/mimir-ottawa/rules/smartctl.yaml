# Ported from clusters/*/apps/smartctl-exporter/config/prometheusrule.yaml.
# Loaded into every tenant. The smartctl_* rules are inert where the exporter
# is absent; the NVMe sensor recordings and alerts use node-exporter hwmon
# because smartctl-exporter v0.15.0 still mines only the top-level
# temperature object (upstream #303).
namespace: smartctl
groups:
  - name: smartctl-exporter.rules
    rules:
      # One series per nested NVMe sensor. The exporter has no sensor label;
      # node-exporter hwmon does: temp1 is Composite, temp2+ are Sensor N.
      # chip "nvme_nvme0" becomes device "nvme0" to match smartctl labels.
      - record: smartctl_nvme_sensor_temperature_celsius
        expr: |-
          label_replace(
            node_hwmon_temp_celsius{chip=~"nvme_.*",sensor!="temp1"}
            * on (cluster, instance, chip, sensor) group_left(label)
              node_hwmon_sensor_label{
                chip=~"nvme_.*",
                sensor!="temp1",
                label=~"Sensor .*",
              }
          , "device", "$1", "chip", "nvme_(.+)")

      # Hottest reading per node+device: nested sensors, else the smartctl
      # composite. Joined onto Kubernetes node via the exporter pod, with a
      # nodename:9100 fallback for the Ottawa nagato ScrapeConfig.
      - record: smartctl_device_temperature:hottest
        expr: |-
          max by (cluster, node, device) (
            (
              smartctl_nvme_sensor_temperature_celsius
              * on (cluster, pod) group_left(node)
                max by (cluster, pod, node) (kube_pod_info{namespace="monitoring"})
            )
            or
            (
              smartctl_nvme_sensor_temperature_celsius
              * on (cluster, instance) group_left(node)
                label_replace(
                  max by (cluster, node) (kube_node_info),
                  "instance", "$1:9100", "node", "(.*)"
                )
            )
            or
            (
              smartctl_device_temperature{temperature_type="current"}
              * on (cluster, pod) group_left(node)
                max by (cluster, pod, node) (kube_pod_info{namespace="monitoring"})
            )
          )

      - record: smartctl_device_temperature:warning_limit
        expr: |-
          max by (cluster, node, device) (
            (
              smartctl_device_temperature{temperature_type="op_limit_max"}
              * on (cluster, pod) group_left(node)
                max by (cluster, pod, node) (kube_pod_info{namespace="monitoring"})
            )
            or
            label_replace(
              node_hwmon_temp_max_celsius{chip=~"nvme_.*",sensor="temp1"}
              * on (cluster, pod) group_left(node)
                max by (cluster, pod, node) (kube_pod_info{namespace="monitoring"})
            , "device", "$1", "chip", "nvme_(.+)")
            or
            label_replace(
              node_hwmon_temp_max_celsius{chip=~"nvme_.*",sensor="temp1"}
              * on (cluster, instance) group_left(node)
                label_replace(
                  max by (cluster, node) (kube_node_info),
                  "instance", "$1:9100", "node", "(.*)"
                )
            , "device", "$1", "chip", "nvme_(.+)")
          )

      - record: smartctl_device_temperature:critical_limit
        expr: |-
          max by (cluster, node, device) (
            (
              smartctl_device_temperature{temperature_type="critical_limit_max"}
              * on (cluster, pod) group_left(node)
                max by (cluster, pod, node) (kube_pod_info{namespace="monitoring"})
            )
            or
            label_replace(
              node_hwmon_temp_crit_celsius{chip=~"nvme_.*",sensor="temp1"}
              * on (cluster, pod) group_left(node)
                max by (cluster, pod, node) (kube_pod_info{namespace="monitoring"})
            , "device", "$1", "chip", "nvme_(.+)")
            or
            label_replace(
              node_hwmon_temp_crit_celsius{chip=~"nvme_.*",sensor="temp1"}
              * on (cluster, instance) group_left(node)
                label_replace(
                  max by (cluster, node) (kube_node_info),
                  "instance", "$1:9100", "node", "(.*)"
                )
            , "device", "$1", "chip", "nvme_(.+)")
          )

      # Composite current temperature vs a fleet-wide 65°C, but only for
      # devices that do not export an operating limit. v0.15.0 adds
      # temperature_type="op_limit_max" / "critical_limit_max" once smartctl
      # is invoked with --capabilities; applying 65°C to those NVMe
      # composites pages chronically (stone nvme0, #2737 / #2936).
      - alert: SmartDeviceHighTemperature
        expr: |-
          smartctl_device_temperature{temperature_type="current"} > 65
          unless on (device, instance, namespace, pod)
            smartctl_device_temperature{temperature_type="op_limit_max"}
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has a temperature higher than 65°C
          description: >-
            Composite current temperature is above 65°C and this device does
            not export an operating-limit series. NVMe drives that report
            op_limit_max use SmartDeviceOverOperatingLimit instead, which
            compares the hottest nested sensor against that limit.
        labels:
          severity: critical

      - alert: SmartDeviceOverOperatingLimit
        expr: |-
          smartctl_device_temperature:hottest
          >= on (cluster, node, device) group_left
            smartctl_device_temperature:warning_limit
        for: 5m
        annotations:
          summary: >-
            Drive {{ $labels.device }} on {{ $labels.node }} is at or above
            its reported operating temperature limit
          description: >-
            Hottest reading (nested NVMe sensors from node-exporter hwmon,
            else the smartctl composite) is at or above this device's
            warning limit (smartctl op_limit_max, else hwmon temp1 max).
            smartctl-exporter v0.15.0 still omits
            nvme_smart_health_information_log.temperature_sensors; see #2936.
        labels:
          severity: warning

      - alert: SmartDeviceOverCriticalLimit
        expr: |-
          smartctl_device_temperature:hottest
          >= on (cluster, node, device) group_left
            smartctl_device_temperature:critical_limit
        for: 5m
        annotations:
          summary: >-
            Drive {{ $labels.device }} on {{ $labels.node }} is at or above
            its reported critical temperature limit
          description: >-
            Hottest reading (nested NVMe sensors from node-exporter hwmon,
            else the smartctl composite) is at or above this device's
            critical limit (smartctl critical_limit_max, else hwmon temp1
            crit). See #2936.
        labels:
          severity: critical

      # Per-sensor path for the nested NVMe array that smartctl-exporter
      # still omits (v0.15.0 mines only the top-level temperature object;
      # upstream #303). node-exporter labels the NVMe hwmon sensors
      # explicitly: temp1 is the composite, while temp2/temp3 are Sensor
      # 1/Sensor 2. The temp_max and temp_crit series on temp1 carry each
      # device's own reported component limits, so these comparisons do
      # not use one fleet-wide temperature. This also supplies thermal
      # coverage if a cluster has no smartctl-exporter.
      - alert: SmartDeviceNVMeSensorHigh
        expr: |-
          (
            node_hwmon_temp_celsius{chip=~"nvme_.*",sensor!="temp1"}
            >= on (cluster, instance, chip) group_left
              node_hwmon_temp_max_celsius{chip=~"nvme_.*",sensor="temp1"}
          )
          * on (cluster, instance, chip, sensor) group_left(label)
            node_hwmon_sensor_label{
              chip=~"nvme_.*",
              sensor!="temp1",
              label=~"Sensor .*",
            }
        for: 5m
        annotations:
          summary: >-
            NVMe {{ $labels.chip }} on {{ $labels.instance }} has
            {{ $labels.label }} at or above its device-reported warning temperature
          description: >-
            The {{ $labels.label }} reading for {{ $labels.chip }} is at or above
            that device's node-exporter hwmon warning/component limit. This is
            an interim per-sensor alert because smartctl-exporter v0.15.0
            still omits nested NVMe sensors; see manifests issue #2936 and
            upstream smartctl-exporter issue #303.
        labels:
          severity: warning

      - alert: SmartDeviceNVMeSensorCritical
        expr: |-
          (
            node_hwmon_temp_celsius{chip=~"nvme_.*",sensor!="temp1"}
            >= on (cluster, instance, chip) group_left
              node_hwmon_temp_crit_celsius{chip=~"nvme_.*",sensor="temp1"}
          )
          * on (cluster, instance, chip, sensor) group_left(label)
            node_hwmon_sensor_label{
              chip=~"nvme_.*",
              sensor!="temp1",
              label=~"Sensor .*",
            }
        for: 5m
        annotations:
          summary: >-
            NVMe {{ $labels.chip }} on {{ $labels.instance }} has
            {{ $labels.label }} at or above its device-reported critical
            temperature
          description: >-
            The {{ $labels.label }} reading for {{ $labels.chip }} is at or above
            that device's node-exporter hwmon critical/component limit. This
            is an interim per-sensor alert because smartctl-exporter v0.15.0
            still omits nested NVMe sensors; see manifests issue #2936 and
            upstream smartctl-exporter issue #303.
        labels:
          severity: critical

      - alert: SmartDeviceTestFailed
        expr: |-
          (smartctl_device_smart_status != 1 or smartctl_device_status != 1)
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} did not pass its SMART test
        labels:
          severity: critical

      - alert: SmartDevicePercentageUsedHigh
        expr: |-
          smartctl_device_percentage_used >= 80
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has used {{ printf "%.0f" $value }}% of its rated endurance
          description: >-
            NVMe Percentage Used is the device's estimate of consumed
            endurance, not a temperature reading. Plan replacement before
            this value reaches 100%.
        labels:
          severity: warning

      - alert: SmartDeviceCriticalWarning
        expr: |-
          smartctl_device_critical_warning != 0
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} is in a critical state
        labels:
          severity: critical

      - alert: SmartDeviceMediaErrors
        expr: |-
          smartctl_device_media_errors != 0
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has media errors
        labels:
          severity: critical

      - alert: SmartDeviceAvailableSpareUnderThreshold
        expr: |-
          smartctl_device_available_spare_threshold > smartctl_device_available_spare
        for: 5m
        annotations:
          summary: >-
            Device {{ $labels.device }} on instance {{ $labels.instance }} is under available spare threshold
        labels:
          severity: critical

      - alert: SmartDeviceInterfaceSlow
        expr: |-
          smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
        for: 5m
        annotations:
          summary: >-
            Device {{ $labels.device }} on instance {{ $labels.instance }} interface is slower than it should be
        labels:
          severity: critical

      # Early warning for HDD media wear before overall SMART status flips.
      # Metric/labels verified from live smartctl-exporter scrape on
      # Robbinsdale tank (10.1.0.24): smartctl_device_attribute with
      # attribute_name=Reallocated_Sector_Ct|Current_Pending_Sector and
      # attribute_value_type=raw. Mimir query API was unhealthy
      # (query_ingesters_within config fault) at authoring time, so the
      # expression was validated against the exporter /metrics surface that
      # Prometheus scrapes into the talos-robbinsdale tenant.
      #
      # Pages when raw realloc or pending-sector count rises by >=1 over 24h
      # and stays elevated for 6h. Flat-but-already-failed disks (tank sda/
      # sdb/sdc today) continue to page via SmartDeviceTestFailed; this rule
      # is for growth before that flip.
      - alert: SmartDeviceSectorCountGrowing
        expr: |-
          (
            increase(
              smartctl_device_attribute{
                attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector",
                attribute_value_type="raw"
              }[24h]
            ) >= 1
          )
        for: 6h
        annotations:
          summary: >-
            Drive {{ $labels.device }} on {{ $labels.instance }} is accumulating
            {{ $labels.attribute_name }} (raw +{{ printf "%.0f" $value }} over 24h)
          description: >-
            SMART attribute {{ $labels.attribute_name }} raw count grew by at
            least 1 over the last 24h and stayed elevated for 6h. This is the
            early-warning path for media failure before overall SMART status
            flips (SmartDeviceTestFailed). Plan replacement; do not silence
            while the count is still climbing.
        labels:
          severity: critical
