# Payment alerts are evaluated by the per-cluster Mimir ruler. The Bhaiya
# PrometheusAgent remote-writes these metrics but does not evaluate
# PrometheusRule resources itself.
namespace: bhaiya
groups:
  - name: bhaiya.payments
    rules:
      - alert: BhaiyaPaymentsUnavailable
        expr: |
          kube_deployment_spec_replicas{namespace="bhaiya",deployment="bhaiya-payments"} > 0
          and
          kube_deployment_status_replicas_available{namespace="bhaiya",deployment="bhaiya-payments"} < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments has no available replica
          description: The payments Deployment is configured to run but has no available replica.

      - alert: BhaiyaPaymentsMetricsAbsent
        expr: |
          absent(up{namespace="bhaiya",service="bhaiya-payments"} == 1)
          and on() kube_deployment_spec_replicas{namespace="bhaiya",deployment="bhaiya-payments"} > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments metrics are absent
          description: The payments service has not exposed a healthy scrape target for 10 minutes.

      - alert: BhaiyaPaymentsRolloutStalled
        expr: |
          kube_deployment_status_condition{
            namespace="bhaiya",
            deployment="bhaiya-payments",
            condition="Progressing",
            status="false",
            reason="ProgressDeadlineExceeded"
          } == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments rollout is stalled
          description: >-
            Kubernetes has not observed progress for the bhaiya-payments
            rollout within its deadline. Check image availability, required
            ExternalSecrets, PostgreSQL connectivity, and migration logs.

      - alert: BhaiyaPaymentsPDBAtRisk
        expr: |
          kube_poddisruptionbudget_status_current_healthy{
            namespace="bhaiya",
            poddisruptionbudget="bhaiya-payments"
          } < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments disruption budget is unavailable
          description: >-
            The bhaiya-payments PDB has had no healthy pod for 5 minutes;
            voluntary disruption protection cannot preserve webhook service.

      - alert: BhaiyaPaymentsWebhookFailures
        expr: increase(bhaiya_payments_webhook_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments webhook processing is failing
          description: >-
            At least one Stripe webhook failed in the last 10 minutes and
            should be retried by Stripe. Inspect the service logs and
            provider/accounting dependencies before acknowledging the alert.

      - alert: BhaiyaPaymentsStripeBackfillFailures
        expr: increase(bhaiya_payments_stripe_backfill_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments Stripe backfill is failing
          description: >-
            Authenticated Stripe event recovery failed to advance a durable
            stream cursor in the last 15 minutes. Inspect the stream and
            reconciliation state before accepting new payment recovery.

      - alert: BhaiyaPaymentsStripeBackfillManualHold
        expr: increase(bhaiya_payments_stripe_backfill_manual_holds_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments Stripe backfill requires manual review
          description: >-
            A Stripe event was held during authenticated backfill because its
            identity, lifecycle, or accounting facts require operator review.
            Resolve the hold before treating payment recovery as complete.

      - alert: BhaiyaPaymentsReconciliationFailures
        expr: increase(bhaiya_payments_reconciliation_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments reconciliation is failing
          description: >-
            A payment reconciliation operation failed in the last 15 minutes.
            Check reconciliation holds and Firefly/Stripe reachability; do not
            manually create a second ledger entry.

      - alert: BhaiyaPaymentsReconciliationQueueStalled
        expr: |
          increase(bhaiya_payments_reconciliation_operations_skipped_total[15m]) > 0
            and on()
          sum(bhaiya_payments_reconciliation_queue_depth{state=~"pending|processing|retry_scheduled"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments reconciliation queue is stalled
          description: >-
            Due reconciliation operations were skipped because the financial
            accounting accounts are not configured. The queue is not idle;
            configure the fee, dispute, and payout accounts and verify that
            reconciliation resumes.

      - alert: BhaiyaPaymentsReconciliationManualReviewBacklog
        expr: bhaiya_payments_reconciliation_queue_depth{state="manual_review"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Bhaiya payments has a reconciliation manual-review backlog
          description: >-
            Reconciliation operations have remained in manual review for 15
            minutes. Verify the Firefly posting evidence and resolve the
            cases before acknowledging the alert; do not create a second
            ledger entry.

      - alert: BhaiyaPaymentsReconciliationDeadLetterBacklog
        expr: bhaiya_payments_reconciliation_queue_depth{state="dead_letter"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya payments has a reconciliation dead-letter backlog
          description: >-
            Reconciliation operations have exhausted their retries and
            remained in dead-letter state for 15 minutes. Inspect the
            provider and accounting failures, then use the verified manual
            repair workflow; do not create a second ledger entry.

      - alert: BhaiyaPaymentsChargeFailures
        expr: increase(bhaiya_payments_payment_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Bhaiya payments charge failure detected
          description: At least one payment reached a failed state in the last 15 minutes.
