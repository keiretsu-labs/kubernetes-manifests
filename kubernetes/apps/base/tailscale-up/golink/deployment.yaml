apiVersion: apps/v1
kind: Deployment
metadata:
  name: sheep-adder-golink
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sheep-adder-golink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sheep-adder-golink
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: golink
          image: ghcr.io/tailscale/golink:main@sha256:8f5edd324d69b0e4da617f80777acaf2582ccc91095da054647f2027ee8b60a9
          imagePullPolicy: IfNotPresent
          args:
            - --sqlitedb
            - /home/nonroot/golink.db
            - --config-dir
            - /home/nonroot/tsnet-golink
            - --hostname
            - go
            - --verbose
          env:
            - name: TS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lobby-ts-oauth
                  key: TS_OAUTH_CLIENT_SECRET
            - name: TS_ADVERTISE_TAGS
              value: tag:lobby
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /home/nonroot
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sheep-adder-golink-data
