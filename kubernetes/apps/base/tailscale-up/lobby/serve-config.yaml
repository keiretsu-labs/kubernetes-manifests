apiVersion: v1
kind: ConfigMap
metadata:
  name: lobby-serve-config
  namespace: tailscale-up
data:
  serve.json: |
    {
      "TCP": {
        "80": { "HTTP": true },
        "443": { "HTTPS": true }
      },
      "Web": {
        "$${TS_CERT_DOMAIN}:80": {
          "Handlers": { "/": { "Proxy": "http://127.0.0.1:8080" } }
        },
        "$${TS_CERT_DOMAIN}:443": {
          "Handlers": { "/": { "Proxy": "http://127.0.0.1:8080" } }
        }
      },
      "AllowFunnel": {
        "$${TS_CERT_DOMAIN}:443": true
      }
    }
