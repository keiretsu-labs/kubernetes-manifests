apiVersion: v1
kind: ConfigMap
metadata:
  name: lobby-serve-config
  namespace: tailscale-up
data:
  # containerboot substitutes ${TS_CERT_DOMAIN} at runtime.
  # Funnel edges need AllowFunnel + HTTPS Web → local lobby.
  serve.json: |
    {
      "TCP": {
        "443": {
          "HTTPS": true
        }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {
            "/": {
              "Proxy": "http://127.0.0.1:8080"
            }
          }
        }
      },
      "AllowFunnel": {
        "${TS_CERT_DOMAIN}:443": true
      }
    }
