apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lobby-postgres
  namespace: tailscale-up
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  bootstrap:
    initdb:
      database: conference
      owner: conference
      dataChecksums: true
  monitoring:
    enablePodMonitor: true
  storage:
    size: 5Gi
    storageClass: ceph-block-replicated
