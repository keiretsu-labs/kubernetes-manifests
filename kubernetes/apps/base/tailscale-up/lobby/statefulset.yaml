apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lobby
  namespace: tailscale-up
  labels:
    app.kubernetes.io/name: lobby
spec:
  serviceName: lobby
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: lobby
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobby
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: lobby
          image: ghcr.io/rajsinghtech/tailscale-up-lobby:0.6.2
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: "127.0.0.1:8080"
            - name: TAILNET_NAME
              value: sheep-adder
            - name: TS_TAILNET
              value: "-"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lobby-postgres-app
                  key: uri
            - name: TS_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lobby-ts-oauth
                  key: TS_OAUTH_CLIENT_ID
            - name: TS_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lobby-ts-oauth
                  key: TS_OAUTH_CLIENT_SECRET
            - name: TS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lobby-ts-oauth
                  key: TS_API_KEY
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: lobby-ts-oauth
                  key: TS_AUTHKEY
            - name: TS_SOCKS_PROXY
              value: socks5://127.0.0.1:1055
            - name: ALL_PROXY
              value: socks5://127.0.0.1:1055
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://127.0.0.1:8080/healthz
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.3
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SOCKS5_SERVER
              value: ":1055"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_HOSTNAME
              value: lobby
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:lobby
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: lobby-ts-oauth
                  key: TS_AUTHKEY
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
          volumeMounts:
            - name: serve-config
              mountPath: /config
              readOnly: true
            - name: ts-state
              mountPath: /var/lib/tailscale
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: serve-config
          configMap:
            name: lobby-serve-config
  volumeClaimTemplates:
    - metadata:
        name: ts-state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block-replicated
        resources:
          requests:
            storage: 2Gi
