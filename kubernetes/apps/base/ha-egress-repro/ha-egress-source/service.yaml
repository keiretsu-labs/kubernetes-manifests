---
apiVersion: v1
kind: Service
metadata:
  name: ha-egress-source
  annotations:
    tailscale.com/hostname: ha-egress-stream
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: ha-egress-source
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
