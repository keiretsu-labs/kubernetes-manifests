---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-egress-source
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-egress-source
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-egress-source
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ha-egress-source
      containers:
        - name: source
          # yamllint disable-line rule:line-length
          image: python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
          command:
            - python
            - /app/server.py
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: ha-egress-source
