---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-egress-stream-probe
  namespace: ha-egress-repro
data:
  probe.py: |
    import collections
    import datetime
    import json
    import os
    import socket
    import threading
    import time

    POD_NAME = os.environ.get("POD_NAME", "unknown")
    TARGETS = {
        "direct": {
            "address": "stream.ha-egress-repro.svc.cluster.local",
            "host": "stream.ha-egress-repro.svc.cluster.local",
        },
        "gateway": {
            "address": "10.169.10.14",
            "host": "ha-egress-stream.killinit.cc",
        },
    }

    lock = threading.Lock()
    byte_counts = collections.Counter()
    disconnect_counts = collections.Counter()
    recovery_gaps = collections.defaultdict(list)

    def emit(event):
        event["time"] = datetime.datetime.now(datetime.UTC).isoformat()
        event["pod"] = POD_NAME
        print(json.dumps(event, sort_keys=True), flush=True)

    def worker(name, connection_id, target):
        last_data_at = None
        first_connection = True
        while True:
            connection = None
            try:
                connection = socket.create_connection(
                    (target["address"], 80), timeout=5
                )
                connection.settimeout(5)
                request = (
                    "GET / HTTP/1.1\r\n"
                    f"Host: {target['host']}\r\n"
                    "Accept: application/x-ndjson\r\n"
                    "Connection: keep-alive\r\n\r\n"
                )
                connection.sendall(request.encode())
                response = b""
                while b"\r\n\r\n" not in response:
                    chunk = connection.recv(4096)
                    if not chunk:
                        raise EOFError(
                            "connection closed before response headers"
                        )
                    response += chunk
                status_line = response.split(b"\r\n", 1)[0].decode(
                    errors="replace"
                )
                if " 200 " not in status_line:
                    raise RuntimeError(f"unexpected response: {status_line}")
                recovered_at = time.monotonic()
                if not first_connection and last_data_at is not None:
                    gap_ms = (recovered_at - last_data_at) * 1000
                    with lock:
                        recovery_gaps[name].append(gap_ms)
                    emit({
                        "event": "recovered",
                        "target": name,
                        "connection": connection_id,
                        "gap_ms": round(gap_ms, 3),
                    })
                first_connection = False
                emit({
                    "event": "connected",
                    "target": name,
                    "connection": connection_id,
                })
                while True:
                    chunk = connection.recv(4096)
                    if not chunk:
                        raise EOFError("stream closed")
                    last_data_at = time.monotonic()
                    with lock:
                        byte_counts[name] += len(chunk)
            except Exception as error:
                with lock:
                    disconnect_counts[name] += 1
                emit({
                    "event": "disconnected",
                    "target": name,
                    "connection": connection_id,
                    "error": f"{type(error).__name__}: {error}",
                })
                if connection is not None:
                    connection.close()
                time.sleep(0.1)

    for target_name, target_config in TARGETS.items():
        for index in range(3):
            threading.Thread(
                target=worker,
                args=(target_name, index, target_config),
                daemon=True,
            ).start()

    while True:
        time.sleep(1)
        with lock:
            current_bytes = dict(byte_counts)
            current_disconnects = dict(disconnect_counts)
            current_gaps = dict(recovery_gaps)
            byte_counts.clear()
            disconnect_counts.clear()
            recovery_gaps.clear()
        emit({
            "event": "summary",
            "targets": {
                target_name: {
                    "bytes": current_bytes.get(target_name, 0),
                    "disconnects": current_disconnects.get(target_name, 0),
                    "max_recovery_gap_ms": round(
                        max(current_gaps.get(target_name, [0])), 3
                    ),
                }
                for target_name in TARGETS
            },
        })
