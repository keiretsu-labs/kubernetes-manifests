---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-egress-probe
  namespace: ha-egress-repro
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-egress-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-egress-probe
        keiretsu.top/cilium-identity-shift: ha-egress-repro-v1
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ha-egress-probe
      containers:
        - name: probe
          # yamllint disable-line rule:line-length
          image: python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
          command:
            - python
            - /app/probe.py
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: probe
              mountPath: /app
              readOnly: true
      volumes:
        - name: probe
          configMap:
            name: ha-egress-probe
