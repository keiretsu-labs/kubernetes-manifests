---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.4
  policy:
    debug: true
    # force=false: keep talosctl etcd health/member checks.
    force: false
    # Bound eviction-based drain so a stuck PDB fails the node instead of hanging.
    # Longer than the largest pod terminationGracePeriodSeconds (CNPG 1800s,
    # mimir-ingester 1200s) so a graceful shutdown never fails the drain.
    drainTimeout: 35m
    rebootMode: default
    placement: soft
    # Drain plus install and reboot.
    timeout: 45m
