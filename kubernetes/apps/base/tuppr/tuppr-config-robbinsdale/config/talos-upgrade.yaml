---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.2
  policy:
    debug: true
    # force=false: keep talosctl etcd health/member checks.
    force: false
    # Bound eviction-based drain so a stuck PDB fails the node instead of hanging.
    # Longer than the largest pod terminationGracePeriodSeconds (CNPG 1800s,
    # mimir-ingester 1200s) so a graceful shutdown never fails the drain.
    drainTimeout: 35m
    rebootMode: default
    placement: soft
    # Drain plus install and reboot.
    timeout: 45m
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      description: All nodes must be Ready
      timeout: 10m
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: status.ceph.health != "HEALTH_ERR" && !(has(status.ceph.details) && ("PG_AVAILABILITY" in status.ceph.details || "PG_DEGRADED" in status.ceph.details || "MON_DOWN" in status.ceph.details || "OSD_DOWN" in status.ceph.details))
      description: Ceph fully recovered (no inactive/degraded PGs, all mons in quorum, no OSD down) before next node
      timeout: 30m
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: has(status.readyInstances) && status.readyInstances == object.spec.instances
      description: Every CNPG cluster has all instances ready before next node
      timeout: 15m
