---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
  annotations:
    tuppr.home-operations.com/suspend: "land-3613"
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.11
  policy:
    debug: true
    # force=false: keep talosctl etcd health/member checks.
    force: false
    # Bound eviction-based drain so a stuck PDB fails the node instead of hanging.
    # talosctl (v1.13+) owns the drain: it cordons and retries PDB-blocked
    # evictions until drainTimeout, giving Rook time to swap its OSD PDBs to
    # per-host ones. tuppr-owned drain (spec.drain) gave up on the first 429
    # and uncordoned, racing Rook forever (2026-10-11). Keep spec.drain unset
    # and waitForVolumeDetach off so tuppr does not take the drain back.
    drainTimeout: 20m
    rebootMode: default
    placement: soft
    timeout: 30m
  drain:
    enabled: true
    disableEviction: false
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      description: All nodes must be Ready
      timeout: 10m
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook
      namespace: rook-ceph
      expr: status.ceph.health != "HEALTH_ERR" && !(has(status.ceph.details) && ("PG_AVAILABILITY" in status.ceph.details || "PG_DEGRADED" in status.ceph.details || "MON_DOWN" in status.ceph.details || "OSD_DOWN" in status.ceph.details))
      description: Ceph fully recovered (no inactive/degraded PGs, all mons in quorum, no OSD down) before next node
      timeout: 30m
