# app-k8s-api-local (https://k8s.robbinsdale.internal:6443/readyz, the cluster-VIP)
# removed: the blackbox probe pod has no route to the robbinsdale LAN 192.168.50.0/24,
# so it could never connect (HTTP status 0 -> permanent false ProbeFailed). API
# liveness is covered by the in-cluster kubernetes.default.svc probe below/Gatus.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-cluster-services
spec:
  jobName: blackbox
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://kube-dns.kube-system:9153/metrics
        - http://source-controller.flux-system:80/
      labels:
        service: cluster-infra
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-mimir-gateway
spec:
  jobName: blackbox
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://mimir-gateway.mimir:8080/ready
      labels:
        service: mimir-gateway
        target: external-tailscale
