---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  config:
    log:
      mode: console
    server:
      root_url: https://grafana.${COMMON_DOMAIN}
      domain: grafana.${COMMON_DOMAIN}
    rendering:
      server_url: http://grafana-image-renderer.monitoring.svc:8081/render
      callback_url: http://grafana-service.monitoring.svc:3000/
    security:
      admin_user: admin
      admin_password: "${DEFAULT_PASSWORD}"
      cookie_secure: "true"
    auth:
      disable_login_form: "true"
      disable_signout_menu: "true"
    auth.basic:
      enabled: "true"
    auth.proxy:
      enabled: "true"
      header_name: Remote-Email
      header_property: email
      auto_sign_up: "true"
      sync_ttl: "0"
      headers: "Name:Remote-Name Login:Remote-User Email:Remote-Email"
      headers_encoded: "false"
      enable_login_token: "false"
    users:
      allow_sign_up: "false"
      auto_assign_org: "true"
      auto_assign_org_role: Admin
  deployment:
    spec:
      strategy:
        type: Recreate
      replicas: 1
      template:
        spec:
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
