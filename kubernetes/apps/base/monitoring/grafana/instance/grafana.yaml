---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  config:
    log:
      mode: console
    server:
      root_url: https://grafana.${COMMON_DOMAIN}
      domain: grafana.${COMMON_DOMAIN}
    security:
      admin_user: admin
      admin_password: "${DEFAULT_PASSWORD}"
    auth.generic_oauth:
      enabled: "true"
      name: TailscaleIDP
      allow_sign_up: "true"
      client_id: "${TS_IDP_GRAFANA_CLIENT_ID}"
      scopes: openid email profile
      auth_url: https://${LOCATION}-idp.keiretsu.ts.net/authorize
      token_url: https://${LOCATION}-idp.keiretsu.ts.net/token
      api_url: https://${LOCATION}-idp.keiretsu.ts.net/userinfo
      redirect_uri: https://grafana.${COMMON_DOMAIN}/login/generic_oauth
      login_attribute: preferred_username
  deployment:
    spec:
      replicas: 1
