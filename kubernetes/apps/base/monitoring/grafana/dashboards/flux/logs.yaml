---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-logs
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: "168h"
  folder: Flux
  url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/logs.json
  datasources:
    - inputName: DS_MIMIR
      datasourceName: Mimir-${CLUSTER_DISPLAY_NAME}
    - inputName: DS_LOKI
      datasourceName: Loki
