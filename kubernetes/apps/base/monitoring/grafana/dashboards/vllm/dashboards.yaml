---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vllm-performance
  namespace: ai
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: AI
  # Refresh often enough that upstream panel drift is picked up; content still
  # caches for an hour. Prefer the local vllm-inference dashboard for day-to-day
  # ops — these upstream JSON imports ship a stale Deployment_id default
  # (granite-*) that only corrects after variable refresh against live labels.
  resyncPeriod: "6h"
  contentCacheDuration: "1h"
  # Datasource mapping: grafana-operator substitutes ${DS_PROMETHEUS} with this
  # string. Our panels use uid refs, so pass the GrafanaDatasource uid
  # (mimir-stpetersburg → tenant talos-stpetersburg), NOT the display name
  # "Mimir-StPetersburg". Wrong value = empty panels with no query error.
  url: https://raw.githubusercontent.com/vllm-project/vllm/main/examples/observability/dashboards/grafana/performance_statistics.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: mimir-stpetersburg
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vllm-queries
  namespace: ai
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: AI
  resyncPeriod: "6h"
  contentCacheDuration: "1h"
  url: https://raw.githubusercontent.com/vllm-project/vllm/main/examples/observability/dashboards/grafana/query_statistics.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: mimir-stpetersburg
