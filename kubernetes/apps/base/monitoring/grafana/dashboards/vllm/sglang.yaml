---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: sglang-inference
  namespace: ai
  labels:
    app.kubernetes.io/name: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: AI
  resyncPeriod: 30m
  # This dashboard uses SGLang's native metrics rather than the vLLM
  # dashboard imports above. Keep the model selector label-based so changing
  # the default model does not require changing dashboard expressions.
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape target",
          "description": "The qwen38 ServiceMonitor target. A value of 1 means the SGLang endpoint is currently reachable by the Prometheus agent.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}}},
                {"type": "value", "options": {"1": {"text": "UP", "color": "green"}}}
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{namespace=\"ai\",job=~\"$${target}\"})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Generation throughput",
          "description": "SGLang's current aggregate decode throughput in tokens per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(sglang:gen_throughput{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running requests",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(sglang:num_running_reqs{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Queued requests",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 4}
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(sglang:num_queue_reqs{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 5,
          "type": "gauge",
          "title": "KV token usage",
          "description": "SGLang's aggregate token usage. This is the pressure signal to watch before increasing concurrency or context settings.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 70},
                  {"color": "red", "value": 90}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "minVizHeight": 100,
            "minVizWidth": 100,
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "showThresholdLabels": true,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(sglang:token_usage{job=~\"$${target}\",model_name=~\"$${model}\"}) * 100",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Configured context",
          "description": "The effective context length reported by the running SGLang engine.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(sglang:context_len{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Generation throughput",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "custom": {"drawStyle": "line", "fillOpacity": 15, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (model_name) (sglang:gen_throughput{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "{{model_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Prompt and generation token rates",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "custom": {"drawStyle": "line", "fillOpacity": 15, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (model_name) (rate(sglang:prompt_tokens_total{job=~\"$${target}\",model_name=~\"$${model}\"}[$${__rate_interval}]))",
              "legendFormat": "Prompt {{model_name}}",
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum by (model_name) (rate(sglang:generation_tokens_total{job=~\"$${target}\",model_name=~\"$${model}\"}[$${__rate_interval}]))",
              "legendFormat": "Generation {{model_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Scheduler load",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (model_name) (sglang:num_running_reqs{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Running {{model_name}}",
              "range": true
            },
            {
              "refId": "B",
              "expr": "max by (model_name) (sglang:num_queue_reqs{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Queued {{model_name}}",
              "range": true
            },
            {
              "refId": "C",
              "expr": "max by (model_name) (sglang:num_grammar_queue_reqs{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Grammar queue {{model_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "HTTP request outcomes",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "custom": {"drawStyle": "bars", "fillOpacity": 65, "lineWidth": 1, "showPoints": "never", "spanNulls": true},
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status_code) (rate(sglang:http_responses_total{job=~\"$${target}\",endpoint=\"/v1/chat/completions\"}[$${__rate_interval}]))",
              "legendFormat": "HTTP {{status_code}}",
              "range": true
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "KV cache capacity",
          "description": "Used, free, and total KV token slots. A falling free-token line is expected during load; a sustained near-zero value is a capacity warning.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (model_name) (sglang:kv_used_tokens{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Used {{model_name}}",
              "range": true
            },
            {
              "refId": "B",
              "expr": "max by (model_name) (sglang:kv_available_tokens{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Available {{model_name}}",
              "range": true
            },
            {
              "refId": "C",
              "expr": "max by (model_name) (sglang:max_total_num_tokens{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Total {{model_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Request latency (p95)",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21},
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, model_name) (rate(sglang:time_to_first_token_seconds_bucket{job=~\"$${target}\",model_name=~\"$${model}\"}[$${__rate_interval}])))",
              "legendFormat": "TTFT {{model_name}}",
              "range": true
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le, model_name) (rate(sglang:e2e_request_latency_seconds_bucket{job=~\"$${target}\",model_name=~\"$${model}\"}[$${__rate_interval}])))",
              "legendFormat": "E2E {{model_name}}",
              "range": true
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.95, sum by (le, model_name) (rate(sglang:queue_time_seconds_bucket{job=~\"$${target}\",model_name=~\"$${model}\"}[$${__rate_interval}])))",
              "legendFormat": "Queue {{model_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Aborts and HTTP errors",
          "description": "Aborted requests include client cancellations. A sustained increase should be correlated with queueing and gateway logs.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 29},
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (model_name) (rate(sglang:num_aborted_requests_total{job=~\"$${target}\",model_name=~\"$${model}\"}[$${__rate_interval}]))",
              "legendFormat": "Aborted {{model_name}}",
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum(rate(sglang:http_responses_total{job=~\"$${target}\",endpoint=\"/v1/chat/completions\",status_code=~\"4..|5..\"}[$${__rate_interval}]))",
              "legendFormat": "HTTP errors",
              "range": true
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Speculative decoding acceptance",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 29},
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (model_name) (sglang:spec_accept_rate{job=~\"$${target}\",model_name=~\"$${model}\"}) * 100",
              "legendFormat": "Accepted drafts {{model_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Inference memory",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 37},
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "decgbytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (model_name) (sglang:weight_memory_usage_gb{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Weights {{model_name}}",
              "range": true
            },
            {
              "refId": "B",
              "expr": "max by (model_name) (sglang:kv_cache_memory_usage_gb{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "KV cache {{model_name}}",
              "range": true
            }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "DGX Spark GPU utilization",
          "description": "DCGM exporter telemetry for the St. Petersburg GPUs. The separate NVIDIA DCGM dashboard has the full hardware breakdown.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 37},
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_GPU_UTIL{cluster=\"talos-stpetersburg\"}",
              "legendFormat": "{{Hostname}} GPU {{gpu}}",
              "range": true
            }
          ]
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "GPU framebuffer memory",
          "description": "Framebuffer usage from DCGM. A sudden rise toward the device limit is an OOM warning even when Kubernetes memory remains healthy.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 45},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "mbytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_FB_USED{cluster=\"talos-stpetersburg\"}",
              "legendFormat": "{{Hostname}} GPU {{gpu}}",
              "range": true
            }
          ]
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "SGLang engine queues",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir-stpetersburg"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 45},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {"drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "showPoints": "never", "spanNulls": true},
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (model_name) (sglang:num_prefill_bootstrap_queue_reqs{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Prefill bootstrap {{model_name}}",
              "range": true
            },
            {
              "refId": "B",
              "expr": "max by (model_name) (sglang:num_prefill_inflight_queue_reqs{job=~\"$${target}\",model_name=~\"$${model}\"})",
              "legendFormat": "Prefill inflight {{model_name}}",
              "range": true
            },
            {
