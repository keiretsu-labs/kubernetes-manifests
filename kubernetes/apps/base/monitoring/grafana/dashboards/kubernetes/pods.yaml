---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-pods
  annotations:
    monitoring.keiretsu.top/source-url: https://grafana.com/api/dashboards/15760/revisions/39/download
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: "168h"
  folder: Kubernetes
  configMapRef:
    name: kubernetes-pods-dashboard
    key: dashboard.json
