---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-kubeprism
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: Kubernetes
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: mimir-local
  json: |
    {
      "title": "KubePrism node-local API proxy",
      "uid": "kubeprism-client-path",
      "tags": ["kubernetes", "kubeprism", "talos"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Mimir-Ottawa", "value": "mimir-ottawa" }
          },
          {
            "name": "cluster",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "query": "label_values(rest_client_requests_total{host=\"127.0.0.1:7445\"}, cluster)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$$__all" }
          },
          {
            "name": "job",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "query": "label_values(rest_client_requests_total{host=\"127.0.0.1:7445\",cluster=~\"$$cluster\"}, job)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$$__all" }
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "KubePrism alerts",
            "datasource": { "type": "prometheus", "uid": "$${datasource}" },
            "enable": true,
            "expr": "ALERTS{alertname=~\"KubePrism.*\",alertstate=\"firing\",cluster=~\"$$cluster\"}",
            "iconColor": "red"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "KubePrism client request rate by code",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$${datasource}" },
          "gridPos": { "x": 0, "y": 0, "w": 16, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cluster, job, code) (kubeprism:client_requests:rate5m{cluster=~\"$$cluster\",job=~\"$$job\"})",
              "legendFormat": "{{cluster}} {{job}} {{code}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error ratio (5xx + transport)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$${datasource}" },
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.05 },
                  { "color": "red", "value": 0.2 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kubeprism:client_error_ratio5m{cluster=~\"$$cluster\",job=~\"$$job\"}",
              "legendFormat": "{{cluster}} {{job}} {{instance}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Dial/proxy errors (code=<error>)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$${datasource}" },
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "kubeprism:client_dial_errors:rate5m{cluster=~\"$$cluster\",job=~\"$$job\"}",
              "legendFormat": "{{cluster}} {{job}} {{instance}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "p99 client latency through KubePrism",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$${datasource}" },
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le, cluster, job) (rate(rest_client_request_duration_seconds_bucket{host=\"127.0.0.1:7445\",cluster=~\"$$cluster\",job=~\"$$job\"}[5m])))",
              "legendFormat": "{{cluster}} {{job}} p99"
            }
          ]
        },
        {
          "id": 5,
          "title": "Worker kubelet path (node labelled)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$${datasource}" },
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cluster, node, code) (kubeprism:client_requests:rate5m{cluster=~\"$$cluster\",job=\"kubelet\",node!=\"\"})",
              "legendFormat": "{{cluster}} {{node}} {{code}}"
            }
          ]
        }
      ]
    }
