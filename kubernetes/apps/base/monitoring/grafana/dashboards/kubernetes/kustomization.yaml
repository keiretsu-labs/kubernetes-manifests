---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api-server.yaml
  - coredns.yaml
  - global.yaml
  - namespaces.yaml
  - nodes.yaml
  - pods.yaml
  - volumes.yaml
  - node-exporter.yaml
  - prometheus.yaml
configMapGenerator:
  - name: kubernetes-global-dashboard
    files:
      - dashboard.json=global.json
  - name: kubernetes-namespaces-dashboard
    files:
      - dashboard.json=namespaces.json
  - name: kubernetes-nodes-dashboard
    files:
      - dashboard.json=nodes.json
  - name: kubernetes-pods-dashboard
    files:
      - dashboard.json=pods.json
  - name: node-exporter-full-dashboard
    files:
      - dashboard.json=node-exporter.json
generatorOptions:
  disableNameSuffixHash: true
