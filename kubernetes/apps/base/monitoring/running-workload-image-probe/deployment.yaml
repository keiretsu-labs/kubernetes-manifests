---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: running-workload-image-probe
  labels:
    app.kubernetes.io/name: running-workload-image-probe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: running-workload-image-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: running-workload-image-probe
    spec:
      serviceAccountName: running-workload-image-probe
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: python:3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
          imagePullPolicy: IfNotPresent
          command: [python3, /scripts/probe.py]
          env:
            - name: CLUSTER_NAME
              value: "${CLUSTER_NAME}"
            - name: METRICS_PORT
              value: "9095"
            - name: SCAN_INTERVAL_SECONDS
              value: "300"
            - name: PROBE_WORKERS
              value: "8"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: metrics
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: running-workload-image-probe
            defaultMode: 0555
