apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  labels:
    team: monitoring
  name: alertmanager
  namespace: monitoring
spec:
  route:
    groupBy:
      - alertname
      - cluster
      - job
    groupInterval: 5m
    groupWait: 1m
    receiver: discord
    repeatInterval: 12h
    routes:
      # Must-never-die apps (media, Immich, Home Assistant, MQTT, Frigate,
      # DNS): first so no blackhole route can swallow them, short group wait
      # and hourly re-notify while firing. Same Discord receiver as everything
      # else; it is the only paging path configured.
      - matchers:
          - matchType: "="
            name: tier
            value: critical-app
        receiver: discord
        groupBy:
          - alertname
          - cluster
          - namespace
        groupWait: 30s
        groupInterval: 2m
        repeatInterval: 1h
      # Silenced alerts - must come BEFORE severity route
      - matchers:
          - matchType: "="
            name: alertname
            value: DockerhubRateLimitRisk
        receiver: blackhole
      - matchers:
          - matchType: "="
            name: alertname
            value: ProbeFailed
        receiver: blackhole
      # Note: ProbeSlowResponse is intentionally NOT silenced - slow cross-cluster responses matter
      - matchers:
          - matchType: "="
            name: alertname
            value: NodeDiskIOSaturation
        receiver: blackhole
      - matchers:
          - matchType: "="
            name: alertname
            value: InfoInhibitor
        receiver: blackhole
      - matchers:
          - matchType: "="
            name: alertname
            value: K8gbNoHealthyRecords
        receiver: blackhole
      - matchers:
          - matchType: "="
            name: alertname
            value: K8gbEndpointNoTargets
        receiver: blackhole
      - matchers:
          - matchType: "="
            name: alertname
            value: Watchdog
        # The Gatus heartbeat endpoint was retired; retain the standard
        # liveness alert without repeatedly delivering it to a dead webhook.
        receiver: blackhole
      # All other alerts with severity go to Discord
      - matchers:
          - matchType: "=~"
            name: severity
            value: critical|error|warning
        receiver: discord
  receivers:
    - name: blackhole
    - discordConfigs:
        - apiURL:
            key: DISCORD_ALERTMANAGER_WEBHOOK_URL
            name: alertmanager-secret
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                Labels:
                {{- range .Labels.SortedPairs }}
                  {{ .Name }}: {{ .Value }}
                {{- end }}
              {{- end }}
            {{- end }}
          sendResolved: true
          title: >-
            [Alerts] [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{- if .GroupLabels.backup }}backup: {{ .GroupLabels.backup }}
            {{- else if .GroupLabels.schedule }}schedule: {{ .GroupLabels.schedule }}
            {{- else if .GroupLabels.alertname }}{{ .GroupLabels.alertname }}
            {{- else }}grouped alerts{{ end }}
      name: discord
  inhibitRules:
    - equal:
        - namespace
        - alertname
      sourceMatch:
        - matchType: "="
          name: severity
          value: critical
      targetMatch:
        - matchType: "=~"
          name: severity
          value: error|warning|info
    - equal:
        - namespace
        - alertname
      sourceMatch:
        - matchType: "="
          name: severity
          value: error
      targetMatch:
        - matchType: "=~"
          name: severity
          value: warning|info
    - equal:
        - namespace
      sourceMatch:
        - matchType: "="
          name: alertname
          value: InfoInhibitor
      targetMatch:
        - matchType: "="
          name: severity
          value: info
