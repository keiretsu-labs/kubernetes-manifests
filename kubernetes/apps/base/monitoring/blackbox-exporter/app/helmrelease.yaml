---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  interval: 1h
  values:
    fullnameOverride: *app
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        http_2xx_insecure:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: true
        http_401:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            valid_status_codes: [401]
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: true
        http_buzz_push_gateway:
          prober: http
          timeout: 5s
          http:
            # An unauthenticated request is intentionally rejected. Any of
            # these client-error responses proves DNS, TLS, and the exact push
            # delivery route are reachable; redirects and 5xx do not.
            valid_status_codes: [400, 401, 403, 405]
            follow_redirects: false
            preferred_ip_protocol: ip4
        buzz_pairing_websocket:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
            tls: true
            tls_config:
              server_name: buzz.ottawa.keiretsu.top
            query_response:
              - send: "GET /pair HTTP/1.1\r\nHost: buzz.ottawa.keiretsu.top\r\nConnection: Upgrade\r\nUpgrade: websocket\r\nSec-WebSocket-Version: 13\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n\r\n"
              - expect: "^HTTP/1\\.1 101"
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        dns_a:
          prober: dns
          timeout: 5s
          dns:
            query_name: google.com
            query_type: A
            preferred_ip_protocol: ip4
            valid_rcodes:
              - NOERROR
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: false
