---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest
spec:
  interval: 30m
  chart:
    spec:
      chart: openspeedtest
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: openspeedtest
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # values: {} # Original valuesFile was empty
  # Chart renders a LoadBalancer Service; force eTP Local so the backend sees
  # the real client source IP (no SNAT) and BGP is advertised only from the pod node.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: speedtest-openspeedtest
            patch: |
              - op: add
                path: /spec/externalTrafficPolicy
                value: Local
