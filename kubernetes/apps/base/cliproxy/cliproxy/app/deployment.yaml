---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: eceasy/cli-proxy-api:v7.2.99@sha256:7e828ffc1c56ff9fc9fb5e1cdeb802f902c1449c7a43b702c13a7b9bf26fca28
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              cat > /config/config.yaml <<EOF
              host: ""
              port: 8317
              auth-dir: /data/auth
              tls:
                enable: false
                cert: ""
                key: ""
              remote-management:
                allow-remote: true
                secret-key: "$${MANAGEMENT_KEY}"
                disable-control-panel: false
              api-keys:
                - "$${API_KEY}"
              debug: false
              pprof:
                enable: false
                addr: "127.0.0.1:8316"
              logging-to-file: false
              usage-statistics-enabled: false
              ws-auth: true
              routing:
                strategy: round-robin
                session-affinity: true
              EOF
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: api-key
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cliproxy
          image: eceasy/cli-proxy-api:v7.2.99@sha256:7e828ffc1c56ff9fc9fb5e1cdeb802f902c1449c7a43b702c13a7b9bf26fca28
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - --config
            - /config/config.yaml
          env:
            - name: HOME
              value: /data
            - name: MANAGEMENT_STATIC_PATH
              value: /data/static
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
            - name: codex-callback
              containerPort: 1455
              protocol: TCP
            - name: claude-callback
              containerPort: 54545
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: cliproxy-data
