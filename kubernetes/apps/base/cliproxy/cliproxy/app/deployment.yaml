---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: logs
      labels:
        app.kubernetes.io/name: cliproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-pi-bridge
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import hashlib
              import io
              import pathlib
              import urllib.request
              import zipfile

              url = "https://github.com/abix5/pi-cliproxyapi-bridge/releases/download/v0.9.1/pi-bridge_0.9.1_linux_amd64.zip"
              expected = "7cfea7b47888c870acc8afca73d8f78cb8454559040c401a2aa08a870107db26"
              archive = urllib.request.urlopen(url, timeout=60).read()
              if hashlib.sha256(archive).hexdigest() != expected:
                  raise RuntimeError("pi-bridge archive checksum mismatch")
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  members = [member for member in bundle.namelist() if not member.endswith("/")]
                  if members != ["pi-bridge.so"]:
                      raise RuntimeError("unexpected pi-bridge archive contents")
                  target = pathlib.Path("/plugins/pi-bridge-v0.9.1.so")
                  target.write_bytes(bundle.read("pi-bridge.so"))
                  target.chmod(0o755)
          volumeMounts:
            - name: plugin-dir
              mountPath: /plugins
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: seed-management-panel
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
          args:
            - |
              expected='c8c8a2cf2b4ca87b38ac885821c94f03601ae3c09eb2eca651bd0f82180e6743'
              panel=/data/static/management.html
              if [ ! -f "$panel" ] || ! echo "$expected  $panel" | sha256sum -c - >/dev/null 2>&1; then
                mkdir -p /data/static
                wget -q -O "$panel.tmp" \
                  https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/download/v1.19.1/management.html
                echo "$expected  $panel.tmp" | sha256sum -c -
                chmod 0644 "$panel.tmp"
                mv "$panel.tmp" "$panel"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-ai-models
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://ai.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "ai"',
                  '    prefix: "ai"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    headers:",
                  '      User-Agent: "Bhaiya-CLIProxy/1.0"',
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
              pathlib.Path("/provider/ai.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} ai models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-ai-kartik-models
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://ai-kartik.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "ai-kartik"',
                  '    prefix: "ai-kartik"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    headers:",
                  '      User-Agent: "Bhaiya-CLIProxy/1.0"',
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
              pathlib.Path("/provider/ai-kartik.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} ai-kartik models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-vllm-models
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import urllib.request

              # This external Service is the supported in-cluster route to the
              # tailnet endpoint. Do not advertise a vLLM model during a DSV4
              # rollout: it cannot accept requests, while the Codex
              # subscription remains the available fallback provider.
              upstream = "http://stpetersburg-vllm-upstream/v1"
              try:
                  with urllib.request.urlopen(upstream + "/models", timeout=5) as response:
                      payload = json.load(response)
                  models = []
                  seen = set()
                  for entry in payload.get("data", []):
                      model = str(entry.get("id", "")).strip()
                      if model and model not in seen:
                          seen.add(model)
                          models.append(model)
                  if not models:
                      raise RuntimeError("upstream returned no models")
              except Exception as error:
                  pathlib.Path("/provider/vllm.yaml").write_text("", encoding="utf-8")
                  print(f"vllm discovery unavailable; using Codex subscription fallback: {error}")
              else:
                  lines = [
                      "openai-compatibility:",
                      '  - name: "vllm"',
                      '    prefix: "vllm"',
                      f'    base-url: "{upstream}"',
                      "    disable-cooling: false",
                      "    models:",
                  ]
                  for model in models:
                      lines.append("      - name: " + json.dumps(model))
                      if model == "deepseek-v4-flash" and "DeepSeek-V4-Flash" not in seen:
                          lines.append('        alias: "DeepSeek-V4-Flash"')
                  pathlib.Path("/provider/vllm.yaml").write_text(
                      "\n".join(lines) + "\n", encoding="utf-8"
                  )
                  print(f"discovered {len(models)} vllm models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: render-config
          image: eceasy/cli-proxy-api:v7.2.133@sha256:944f8b1f5d23981244b5d482290d411d2623bf685749a74c5bca849c865c0ac8
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              cat > /config/config.yaml <<EOF
              host: ""
              port: 8317
              auth-dir: /data/auth
              tls:
                enable: false
                cert: ""
                key: ""
              remote-management:
                allow-remote: true
                secret-key: "$${MANAGEMENT_KEY}"
                disable-control-panel: false
                disable-auto-update-panel: true
              api-keys:
                - "$${API_KEY}"
              # Every credential owns its native route prefix. OAuth prefixes
              # live in auth metadata; the generated compatible providers
              # declare the Tailscale-backed routes below.
              force-model-prefix: true
              # Keep a stable, GitOps-owned fallback in the Codex subscription
              # pool while the DeepSeek route is omitted during a DSV4 outage.
              oauth-model-alias:
                codex:
                  - name: "gpt-5.3-codex-spark"
                    alias: "vllm-fallback"
                    display-name: "Codex subscription fallback"
                    fork: true
              plugins:
                enabled: true
                dir: "/CLIProxyAPI/plugins"
                configs:
                  pi-bridge:
                    enabled: true
                    priority: 3
                    store:
                      version: "0.9.1"
                    allow_all_api_keys: true
              debug: false
              pprof:
                enable: false
                addr: "127.0.0.1:8316"
              logging-to-file: true
              logs-max-total-size-mb: 0
              request-log: true
              usage-statistics-enabled: false
              ws-auth: true
              routing:
                strategy: round-robin
                session-affinity: true
              EOF
              cat /provider/ai.yaml >> /config/config.yaml
              tail -n +2 /provider/ai-kartik.yaml >> /config/config.yaml
              tail -n +2 /provider/vllm.yaml >> /config/config.yaml
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: api-key
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          volumeMounts:
            - name: config
              mountPath: /config
            - name: provider-config
              mountPath: /provider
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cliproxy
          image: eceasy/cli-proxy-api:v7.2.133@sha256:944f8b1f5d23981244b5d482290d411d2623bf685749a74c5bca849c865c0ac8
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - --config
            - /config/config.yaml
          env:
            - name: HOME
              value: /data
            - name: WRITABLE_PATH
              value: /var/lib/cliproxy
            - name: MANAGEMENT_STATIC_PATH
              value: /data/static
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
            - name: codex-callback
              containerPort: 1455
              protocol: TCP
            - name: claude-callback
              containerPort: 54545
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/lib/cliproxy
            - name: plugin-dir
              mountPath: /CLIProxyAPI/plugins
              readOnly: true
            - name: pi-bridge-state
              mountPath: /var/run/pi-bridge
              readOnly: true
        - name: pi-bridge-sync
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import fnmatch
              import json
              import os
              import pathlib
              import time
              import urllib.error
              import urllib.request

              base = "http://127.0.0.1:8317"
              api_key = os.environ["API_KEY"]
              management_key = os.environ["MANAGEMENT_KEY"]
              state = pathlib.Path("/state")
              ready = state / "ready"
              interval = 300

              def request(method, path, token, payload=None):
                  body = None if payload is None else json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
                  req = urllib.request.Request(
                      base + path,
                      data=body,
                      method=method,
                      headers={
                          "Accept": "application/json",
                          "Authorization": "Bearer " + token,
                          "Content-Type": "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return response.status, json.load(response)
                  except urllib.error.HTTPError as error:
                      return error.code, None

              def canonical(value):
                  return json.dumps(value, separators=(",", ":"), sort_keys=True)

              def catalog():
                  plain_status, plain = request("GET", "/v1/models", api_key)
                  rich_status, rich = request("GET", "/v1/models?client_version=1.0.0", api_key)
                  if plain_status != 200 or rich_status != 200:
                      raise RuntimeError("model catalog is not ready")
                  plain_rows = plain.get("data", [])
                  rich_rows = rich.get("models", [])
                  plain_ids = {
                      str(row.get("id", "")).strip()
                      for row in plain_rows
                      if isinstance(row, dict) and str(row.get("id", "")).strip()
                  }
                  rich_by_id = {
                      str(row.get("slug", "")).strip(): row
                      for row in rich_rows
                      if isinstance(row, dict) and str(row.get("slug", "")).strip()
                  }
                  if not plain_ids or plain_ids != set(rich_by_id):
                      raise RuntimeError("plain and rich model catalogs differ")

                  aliases = {}
                  overrides = {}
                  for model_id in sorted(plain_ids):
                      row = rich_by_id[model_id]
                      context_window = int(row.get("context_window") or row.get("max_context_window") or 0)
                      name = str(row.get("display_name", "")).strip()
                      if context_window <= 0 or not name:
                          raise RuntimeError("rich catalog has incomplete metadata")
                      override = {
                          "name": name,
                          "context_window": context_window,
                      }
                      levels = row.get("supported_reasoning_levels")
                      if isinstance(levels, list):
                          override["reasoning"] = bool(levels)
                      overrides[model_id] = override
                      if "/" in model_id:
                          aliases[model_id] = model_id.split("/", 1)[1]
                  return plain_ids, aliases, overrides

              def bridge_document():
                  status, document = request(
                      "GET",
                      "/v0/resource/plugins/pi-bridge/well-known",
                      api_key,
                  )
                  if status != 200 or not isinstance(document, dict):
                      return None
                  models = {}
                  for provider in (document.get("builtinProviders") or {}).values():
                      for model in provider.get("models", []):
                          if isinstance(model, dict) and model.get("id"):
                              models[model["id"]] = model
                  for model in document.get("customModelPool", []):
                      if isinstance(model, dict) and model.get("id"):
                          models[model["id"]] = model
                  return document, models

              def synchronized(ids, overrides):
                  result = bridge_document()
                  if result is None:
                      return None
                  document, models = result
                  patterns = [
                      pattern
                      for pattern in document.get("discoveryExcludes", [])
                      if isinstance(pattern, str)
                  ]
                  exposed_ids = {
                      model_id
                      for model_id in ids
                      if not any(fnmatch.fnmatchcase(model_id, pattern) for pattern in patterns)
                  }
                  if document.get("schemaVersion") != 1 or set(models) != exposed_ids:
                      return None
                  if not all(
                      models[model_id].get("contextWindow") == metadata["context_window"]
                      and models[model_id].get("name") == metadata["name"]
                      for model_id, metadata in overrides.items()
                      if model_id in exposed_ids
                  ):
                      return None
                  return len(exposed_ids)

              ready.unlink(missing_ok=True)
              while True:
                  try:
                      model_ids, aliases, overrides = catalog()
                      desired_advanced = {
                          "model_aliases": aliases,
                          "model_overrides": overrides,
                      }
                      config_status, plugin_config = request(
                          "GET",
                          "/v0/management/plugins/pi-bridge/config",
                          management_key,
                      )
                      if config_status != 200 or not isinstance(plugin_config, dict):
                          raise RuntimeError("pi-bridge management config is not ready")
                      current_advanced = plugin_config.get("advanced", "")
                      try:
                          current_advanced = json.loads(current_advanced) if current_advanced else {}
                      except (TypeError, ValueError):
                          current_advanced = {}
                      if not isinstance(current_advanced, dict):
                          current_advanced = {}
                      merged_advanced = dict(current_advanced)
                      merged_advanced.update(desired_advanced)
                      if canonical(current_advanced) != canonical(merged_advanced):
                          patch_status, _ = request(
                              "PATCH",
                              "/v0/management/plugins/pi-bridge/config",
                              management_key,
                              {"advanced": canonical(merged_advanced)},
                          )
                          if patch_status != 200:
                              raise RuntimeError("pi-bridge metadata update failed")
                      deadline = time.monotonic() + 90
                      exposed_count = None
                      while time.monotonic() < deadline:
                          exposed_count = synchronized(model_ids, overrides)
                          if exposed_count is not None:
                              break
                          time.sleep(2)
                      if exposed_count is None:
                          raise RuntimeError("pi-bridge did not expose the live metadata")
                      ready.write_text(str(exposed_count) + "/" + str(len(model_ids)) + "\n", encoding="ascii")
                      print(
                          "pi-bridge metadata ready for "
                          + str(exposed_count)
                          + " exposed models (of "
                          + str(len(model_ids))
                          + " live models)",
                          flush=True,
                      )
                  except Exception as error:
                      ready.unlink(missing_ok=True)
                      print("pi-bridge metadata waiting: " + str(error), flush=True)
                  time.sleep(interval if ready.exists() else 5)
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: api-key
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          volumeMounts:
            - name: pi-bridge-state
              mountPath: /state
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: log-forwarder
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /var/lib/cliproxy/logs

              cleanup_request_logs() {
                find /var/lib/cliproxy/logs -maxdepth 1 -type f \
                  -mmin +5760 ! -name main.log \
                  -exec rm -f -- {} \;
                find /var/lib/cliproxy/logs -maxdepth 1 -type d \
                  -name 'request-log-parts-*' -mmin +5760 \
                  -exec rm -rf -- {} \;
              }

              cleanup_request_logs
              while sleep 3600; do
                cleanup_request_logs
              done &

              while [ ! -f /var/lib/cliproxy/logs/main.log ]; do
                sleep 1
              done
              exec tail -n 0 -F /var/lib/cliproxy/logs/main.log
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /var/lib/cliproxy
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: provider-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: cliproxy-data
        - name: logs
          persistentVolumeClaim:
            claimName: cliproxy-logs
        - name: plugin-dir
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: pi-bridge-state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
