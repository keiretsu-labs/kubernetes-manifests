---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: logs
      labels:
        app.kubernetes.io/name: cliproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-management-panel
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
          args:
            - |
              expected='c8c8a2cf2b4ca87b38ac885821c94f03601ae3c09eb2eca651bd0f82180e6743'
              panel=/data/static/management.html
              if [ ! -f "$panel" ] || ! echo "$expected  $panel" | sha256sum -c - >/dev/null 2>&1; then
                mkdir -p /data/static
                wget -q -O "$panel.tmp" \
                  https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/download/v1.19.1/management.html
                echo "$expected  $panel.tmp" | sha256sum -c -
                chmod 0644 "$panel.tmp"
                mv "$panel.tmp" "$panel"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-aperture-corp-models
          image: python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://ai.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "ai"',
                  '    prefix: "ai"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    headers:",
                  '      User-Agent: "Bhaiya-CLIProxy/1.0"',
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
              pathlib.Path("/provider/ai.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} ai models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-aperture-kartik-models
          image: python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://ai-kartik.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "ai-kartik"',
                  '    prefix: "ai-kartik"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    headers:",
                  '      User-Agent: "Bhaiya-CLIProxy/1.0"',
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
              pathlib.Path("/provider/ai-kartik.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} ai-kartik models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-vllm-models
          image: python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://stpetersburg-vllm.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "vllm"',
                  '    prefix: "vllm"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
                  if model == "deepseek-v4-flash" and "DeepSeek-V4-Flash" not in seen:
                      lines.append('        alias: "DeepSeek-V4-Flash"')
              pathlib.Path("/provider/vllm.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} vllm models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: render-config
          image: eceasy/cli-proxy-api:v7.2.118@sha256:488d6ba68e55fe26f204df18ed3cd5c7a58aa8f7eacc4bd2e858d7629ad8094f
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              cat > /config/config.yaml <<EOF
              host: ""
              port: 8317
              auth-dir: /data/auth
              tls:
                enable: false
                cert: ""
                key: ""
              remote-management:
                allow-remote: true
                secret-key: "$${MANAGEMENT_KEY}"
                disable-control-panel: false
                disable-auto-update-panel: true
              api-keys:
                - "$${API_KEY}"
              # Every credential owns its native route prefix. OAuth prefixes
              # live in auth metadata; the generated compatible providers
              # declare the Tailscale-backed routes below.
              force-model-prefix: true
              debug: false
              pprof:
                enable: false
                addr: "127.0.0.1:8316"
              logging-to-file: true
              logs-max-total-size-mb: 0
              request-log: true
              usage-statistics-enabled: false
              ws-auth: true
              routing:
                strategy: round-robin
                session-affinity: true
              EOF
              cat /provider/ai.yaml >> /config/config.yaml
              tail -n +2 /provider/ai-kartik.yaml >> /config/config.yaml
              tail -n +2 /provider/vllm.yaml >> /config/config.yaml
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: api-key
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          volumeMounts:
            - name: config
              mountPath: /config
            - name: provider-config
              mountPath: /provider
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cliproxy
          image: eceasy/cli-proxy-api:v7.2.118@sha256:488d6ba68e55fe26f204df18ed3cd5c7a58aa8f7eacc4bd2e858d7629ad8094f
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - --config
            - /config/config.yaml
          env:
            - name: HOME
              value: /data
            - name: WRITABLE_PATH
              value: /var/lib/cliproxy
            - name: MANAGEMENT_STATIC_PATH
              value: /data/static
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
            - name: codex-callback
              containerPort: 1455
              protocol: TCP
            - name: claude-callback
              containerPort: 54545
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/lib/cliproxy
        - name: log-forwarder
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /var/lib/cliproxy/logs

              cleanup_request_logs() {
                find /var/lib/cliproxy/logs -maxdepth 1 -type f \
                  -mmin +5760 ! -name main.log \
                  -exec rm -f -- {} \;
                find /var/lib/cliproxy/logs -maxdepth 1 -type d \
                  -name 'request-log-parts-*' -mmin +5760 \
                  -exec rm -rf -- {} \;
              }

              cleanup_request_logs
              while sleep 3600; do
                cleanup_request_logs
              done &

              while [ ! -f /var/lib/cliproxy/logs/main.log ]; do
                sleep 1
              done
              exec tail -n 0 -F /var/lib/cliproxy/logs/main.log
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /var/lib/cliproxy
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: provider-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: cliproxy-data
        - name: logs
          persistentVolumeClaim:
            claimName: cliproxy-logs
