---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-management-panel
          image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
          command:
            - /bin/sh
            - -ec
          args:
            - |
              expected='c8c8a2cf2b4ca87b38ac885821c94f03601ae3c09eb2eca651bd0f82180e6743'
              panel=/data/static/management.html
              if [ ! -f "$panel" ] || ! echo "$expected  $panel" | sha256sum -c - >/dev/null 2>&1; then
                mkdir -p /data/static
                wget -q -O "$panel.tmp" \
                  https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/download/v1.19.1/management.html
                echo "$expected  $panel.tmp" | sha256sum -c -
                chmod 0644 "$panel.tmp"
                mv "$panel.tmp" "$panel"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-aperture-corp-models
          image: python:3.14-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://ai.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "aperture-corp"',
                  '    prefix: "aperture-corp"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
              pathlib.Path("/provider/aperture-corp.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} aperture-corp models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: render-config
          image: eceasy/cli-proxy-api:v7.2.99@sha256:7e828ffc1c56ff9fc9fb5e1cdeb802f902c1449c7a43b702c13a7b9bf26fca28
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              cat > /config/config.yaml <<EOF
              host: ""
              port: 8317
              auth-dir: /data/auth
              tls:
                enable: false
                cert: ""
                key: ""
              remote-management:
                allow-remote: true
                secret-key: "$${MANAGEMENT_KEY}"
                disable-control-panel: false
                disable-auto-update-panel: true
              api-keys:
                - "$${API_KEY}"
              debug: false
              pprof:
                enable: false
                addr: "127.0.0.1:8316"
              logging-to-file: false
              usage-statistics-enabled: false
              ws-auth: true
              routing:
                strategy: round-robin
                session-affinity: true
              EOF
              cat /provider/aperture-corp.yaml >> /config/config.yaml
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: api-key
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          volumeMounts:
            - name: config
              mountPath: /config
            - name: provider-config
              mountPath: /provider
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cliproxy
          image: eceasy/cli-proxy-api:v7.2.99@sha256:7e828ffc1c56ff9fc9fb5e1cdeb802f902c1449c7a43b702c13a7b9bf26fca28
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - --config
            - /config/config.yaml
          env:
            - name: HOME
              value: /data
            - name: MANAGEMENT_STATIC_PATH
              value: /data/static
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
            - name: codex-callback
              containerPort: 1455
              protocol: TCP
            - name: claude-callback
              containerPort: 54545
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: provider-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: cliproxy-data
