---
apiVersion: v1
kind: Service
metadata:
  name: cliproxy
spec:
  selector:
    app.kubernetes.io/name: cliproxy
  ports:
    - name: http
      port: 8317
      targetPort: http
      protocol: TCP
    - name: codex-callback
      port: 1455
      targetPort: codex-callback
      protocol: TCP
    - name: claude-callback
      port: 54545
      targetPort: claude-callback
      protocol: TCP
