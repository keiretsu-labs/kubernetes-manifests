---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempvm
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tempvm
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - create
      - delete
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tempvm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tempvm
subjects:
  - kind: ServiceAccount
    name: tempvm
