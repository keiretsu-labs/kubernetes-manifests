---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempvm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempvm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempvm
    spec:
      serviceAccountName: tempvm
      containers:
        - name: gateway
          image: ghcr.io/keiretsu-labs/tempvm-gateway:sha-d3606481d33e40dd32a80039e4b747c28b95620c@sha256:6889621089f3cf7efcaa89ed09be72875a15d872206921ba2b90e9db2b3afb65
          args:
            - --guest-image=ghcr.io/keiretsu-labs/tempvm-linux:sha-b430a7b22247578484081c08a8bbaf91958bf2e5@sha256:b371e749f4693f3dc4303c08db7cad26670e1901eaf2e8d3c971f10e732f4867
            - --runtime-class=kata-clh
            - --max-session-ttl=4h
            - --max-sessions=3
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
