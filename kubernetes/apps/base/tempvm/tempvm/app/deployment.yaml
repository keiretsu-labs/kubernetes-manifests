---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempvm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempvm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempvm
    spec:
      serviceAccountName: tempvm
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: runtime.keiretsu.top/kata
                    operator: DoesNotExist
      containers:
        - name: gateway
          image: ghcr.io/keiretsu-labs/tempvm-gateway:sha-185a9c6155b1db6453f7ac66e6e001db38df52e0@sha256:69827292cc17c3b37de24159ce78b6bdb50a21d8d4a3d747321855e8c795a6cf
          args:
            - --guest-image=ghcr.io/keiretsu-labs/tempvm-linux:sha-185a9c6155b1db6453f7ac66e6e001db38df52e0@sha256:8a53524a0e7716823bcd06cb6471bdfb1dbf7c60cf4a275c5559cabdcca2ac9f
            - --runtime-class=kata-clh
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
