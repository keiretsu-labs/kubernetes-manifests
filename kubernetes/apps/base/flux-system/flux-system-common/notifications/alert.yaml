---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: kubernetes-manifests
  namespace: flux-system
spec:
  type: github
  address: https://github.com/keiretsu-labs/kubernetes-manifests
  secretRef:
    name: kubernetes-manifests-github-token
  username: fluxcd-bot
  commitStatusExpr: "event.involvedObject.kind + '/' + '${LOCATION}/' + event.involvedObject.name"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: kubernetes-manifests
  namespace: flux-system
spec:
  providerRef:
    name: kubernetes-manifests
  eventSeverity: info
  eventSources:
    # Only child Kustomizations explicitly labeled enabled report GitHub
    # commit statuses. External GitRepository sources are labeled disabled
    # because their revisions belong to another repository.
    - kind: Kustomization
      name: '*'
      namespace: flux-system
      matchLabels:
        notifications.keiretsu.top/github-status: enabled
