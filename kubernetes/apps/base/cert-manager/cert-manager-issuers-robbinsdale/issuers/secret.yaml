---
# cloudflare-raj and the rajsingh-info ClusterIssuer live in
# cert-manager-common/issuers, which Robbinsdale also deploys. Declaring them
# here as well put one cluster-scoped object in two Flux inventories, so keep
# this set to what is genuinely Robbinsdale-only.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-luke
  namespace: cert-manager
type: Opaque
stringData:
  cert-manager-api-token: ${LUKEHOUGE_COM_CERTMANAGER_API_TOKEN}
