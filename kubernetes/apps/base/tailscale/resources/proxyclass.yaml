---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-unstable
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      tailscaleContainer:
        image: tailscale/tailscale:unstable-v1.101.284
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-dev
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      tailscaleContainer:
        image: ghcr.io/rajsinghtech/tailscale/tailscale:tun-service-metrics-551eb1060@sha256:042474523910fd40de5ec56ab8c530129c945e8a958fc785ea216ced8c5a2bb9
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-accept-routes
spec:
  tailscale:
    acceptRoutes: true
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-userspace
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        env:
          - name: TS_USERSPACE
            value: "true"
        securityContext:
          privileged: false
          capabilities:
            drop:
              - ALL
      tailscaleInitContainer:
        securityContext:
          privileged: false
          capabilities:
            drop:
              - ALL
