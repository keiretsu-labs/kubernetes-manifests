---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-unstable
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      tailscaleContainer:
        image: tailscale/tailscale:unstable-v1.101.284
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-dev
spec:
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      tailscaleContainer:
        image: ghcr.io/rajsinghtech/tailscale/tailscale:tun-service-metrics-a4a2240d4@sha256:62a482c2b9bd7963ad919887462301701dc4aa0a710d39d2bf87d4dda6f53719
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-accept-routes
spec:
  tailscale:
    acceptRoutes: true
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  statefulSet:
    pod:
      priorityClassName: "infra-high"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tailscale.com/managed: "true"
          matchLabelKeys:
            - tailscale.com/parent-resource
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: common-userspace
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        env:
          - name: TS_USERSPACE
            value: "true"
        securityContext:
          privileged: false
          capabilities:
            drop:
              - ALL
      tailscaleInitContainer:
        securityContext:
          privileged: false
          capabilities:
            drop:
              - ALL
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: k8s-proxy-l4-test
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        image: ghcr.io/rajsinghtech/tailscale/k8s-proxy:81
  metrics:
    enable: true
    serviceMonitor:
      enable: true
