---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: &name ${LOCATION}-subnetrouter
spec:
  replicas: 2
  proxyClass: common
  tags:
    - tag:k8s
    - tag:${LOCATION}
  hostnamePrefix: *name
  # exitNode: true
  subnetRouter:
    # UniFi/Cilium BGP is now the route for every cluster Pod, Service, and
    # LoadBalancer CIDR. Keep Tailscale subnet routing for LAN appliances and
    # the existing 4via6/app-connector traffic only.
    advertiseRoutes:
      - "${LAN_CIDR}" # LAN appliances
      - fd7a:115c:a1e0:b1a:0:${SITE_ID}::/96 # 4via6
---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: &name ${LOCATION}-appconnector
spec:
  replicas: 2
  proxyClass: common
  tags:
    - tag:k8s
    - tag:${LOCATION}
  hostnamePrefix: *name
  appConnector:
    routes:
      - "fd7a:115c:a1e0:b1a:0:${SITE_ID}::/96"
