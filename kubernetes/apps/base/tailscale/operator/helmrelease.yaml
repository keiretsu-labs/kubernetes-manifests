---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.1
      sourceRef:
        kind: HelmRepository
        name: tailscale
        # name: tailscale-unstable
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    apiServerProxyConfig:
      allowImpersonation: "true"
      mode: "true"
    operatorConfig:
      # extraEnv:
      #   - name: "TS_EXPERIMENTAL_KUBE_API_EVENTS"
      #     value: "true"
      # image:
      #   repo: ghcr.io/rajsinghtech/tailscale/k8s-operator
      #   tag: "80"
      # The kube-apiserver ProxyGroup (<location>-k8s) uses the operator's
      # K8S_PROXY_IMAGE, which defaults to tailscale/k8s-proxy:latest with
      # imagePullPolicy Always. Pin it to the operator's release (same bits
      # the pods already run) so a restart can't pull a different build.
      # Bump together with the chart version above.
      extraEnv:
        - name: K8S_PROXY_IMAGE
          # renovate: datasource=docker depName=tailscale/k8s-proxy
          value: tailscale/k8s-proxy:v1.104.1@sha256:09d8cc745913a5137a1928ffd83a8076c92ddd562e221085b68131b6a2a1619c
      hostname: "${LOCATION}-k8s-operator"
      logging: "info" # info, debug, dev
      priorityClassName: "infra-critical"
      defaultTags:
        - "tag:${LOCATION}"
        - "tag:k8s-operator"
    proxyConfig:
      defaultTags: "tag:k8s,tag:${LOCATION}"
      # image:
      #   repo: ghcr.io/rajsinghtech/tailscale/tailscale
      #   tag: "80"
