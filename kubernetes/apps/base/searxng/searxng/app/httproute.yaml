---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  annotations:
    item.homer.rajsingh.info/name: "SearXNG"
    item.homer.rajsingh.info/subtitle: "Meta Search"
    item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/searxng.svg"
    item.homer.rajsingh.info/keywords: "search, internet, utility"

    service.homer.rajsingh.info/name: "Utilities"
    service.homer.rajsingh.info/icon: "fas fa-search"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
  hostnames:
    - "searxng.${CLUSTER_DOMAIN}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: searxng
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
