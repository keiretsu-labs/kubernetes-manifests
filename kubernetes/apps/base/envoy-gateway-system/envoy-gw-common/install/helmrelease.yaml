---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: 1.9.1
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      interval: 1m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  releaseName: envoy-gateway
  values:
    deployment:
      # Keep the gateway control plane above default workloads under memory
      # pressure; the data-plane proxies carry the same class via their
      # EnvoyProxy CRs (home namespace).
      priorityClassName: infra-high
      # The chart mounts envoy-gateway-config but does not checksum it into
      # the pod template. Roll the controller when extension API settings
      # change so the process rereads the mounted configuration.
      pod:
        annotations:
          config.keiretsu.top/extension-apis: enable-lua-no-ai-gateway-ext-v2
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
          enableEnvoyPatchPolicy: true
          # The public auth routes use EnvoyExtensionPolicy Lua hooks to turn
          # TinyAuth's 401 challenge into the OAuth redirect. Envoy Gateway
          # disables Lua by default; leaving it off makes those routes render
          # as an Envoy-generated direct 500 instead of reaching their backend.
          enableLua: true
        # No extensionManager here on purpose. #3179 wired the Agent Router
        # xDS hook in with translation.*.includeAll, which routes every
        # gateway's listeners/routes/clusters through the AI controller, not
        # just the keiretsu-ai-gateway class. From the moment it rolled
        # (2026-09-23T23:26Z) Translate() returned an error on every pass, and
        # the xds runner only updates the snapshot cache when err == nil - so
        # all four gateways froze on their last good config and silently
        # stopped picking up route changes while still reporting
        # Accepted=True. Re-add only if scoped to the AI gateway class.
