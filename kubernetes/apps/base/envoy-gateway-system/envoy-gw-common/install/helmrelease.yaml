---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: 1.9.1
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      interval: 1m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  releaseName: envoy-gateway
  values:
    deployment:
      # Keep the gateway control plane above default workloads under memory
      # pressure; the data-plane proxies carry the same class via their
      # EnvoyProxy CRs (home namespace).
      priorityClassName: infra-high
      # The chart mounts envoy-gateway-config but does not checksum it into
      # the pod template. Roll the controller when extension API settings
      # change so the process rereads the mounted configuration.
      pod:
        annotations:
          config.keiretsu.top/extension-apis: enable-lua-ai-gateway-ext-v1
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
          enableEnvoyPatchPolicy: true
          # The public auth routes use EnvoyExtensionPolicy Lua hooks to turn
          # TinyAuth's 401 challenge into the OAuth redirect. Envoy Gateway
          # disables Lua by default; leaving it off makes those routes render
          # as an Envoy-generated direct 500 instead of reaching their backend.
          enableLua: true
        # Agent Router (envoy-ai-gateway-system) xDS translation hooks.
        # Controller must be Ready before AIGatewayRoute programs Envoy.
        # See docs/ops/ai-gateway.md and ai-gateway-extension/values-patch.yaml.
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
              port: 1063
