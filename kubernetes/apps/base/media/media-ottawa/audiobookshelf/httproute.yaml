---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  annotations:
    item.homer.rajsingh.info/name: Audiobookshelf
    item.homer.rajsingh.info/subtitle: Audiobook Library
    item.homer.rajsingh.info/logo: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/audiobookshelf.svg
    item.homer.rajsingh.info/keywords: audiobooks, reading, library
    service.homer.rajsingh.info/name: Reading
    service.homer.rajsingh.info/icon: fas fa-book
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    # Public: users authenticate with OIDC in the Audiobookshelf app and web UI
    # (ABS runs its own login, so no SecurityPolicy/extAuth here — a native
    # client cannot present a tinyauth cookie). Who may log in is gated by
    # TINYAUTH_OAUTH_WHITELIST at tinyauth; ABS auto-registers whitelisted
    # users as type 'user' with accessAllLibraries.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
  hostnames:
    - audiobookshelf.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: audiobookshelf
          port: 80
