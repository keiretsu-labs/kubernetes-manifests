---
# Manga request bridge — polls Omnibus Postgres for PENDING_APPROVAL manga
# requests and fulfils confident matches in Suwayomi via GraphQL. Internal
# poller: no Service, no route, only outbound calls.
# Full spec: /workspace/handoffs/manga-request-bridge.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manga-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: manga-bridge
  template:
    metadata:
      labels:
        app: manga-bridge
    spec:
      containers:
        - name: manga-bridge
          image: python:3.14-alpine
          # pg8000 is pure-Python (no build deps) — fast wheel install at start,
          # keeps this GitOps-native with no custom image. Script from configMap.
          command:
            - sh
            - -c
            - pip install --no-cache-dir --root-user-action=ignore pg8000 && exec python3 /app/bridge.py
          env:
            - name: SUWAYOMI_GRAPHQL
              value: http://suwayomi.media.svc:4567/api/graphql
            - name: OMNIBUS_PG_HOST
              value: omnibus-postgres-rw.media
            - name: OMNIBUS_PG_PORT
              value: "5432"
            - name: OMNIBUS_PG_DB
              value: omnibus
            - name: OMNIBUS_PG_USER
              value: omnibus
            - name: OMNIBUS_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omnibus-postgres-app
                  key: password
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: manga-bridge-secret
                  key: discord-webhook
            - name: POLL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: manga-bridge-app
            defaultMode: 0555
      restartPolicy: Always
