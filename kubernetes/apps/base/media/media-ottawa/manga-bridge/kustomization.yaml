---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - app.yaml
  - manga-bridge-secret.sops.yaml
# bridge.py delivered as a generated ConfigMap so its name carries a content
# hash: editing the script changes the name, rewrites the volume ref, and rolls
# the pod (same pattern as homepage/server.py).
configMapGenerator:
  - name: manga-bridge-app
    files:
      - bridge.py
