---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bookorbit-s3-store
  namespace: media
spec:
  configuration:
    destinationPath: s3://bookorbit-postgres/${LOCATION}/
    endpointURL: http://${COMMON_S3_ENDPOINT}
    data:
      compression: gzip
    s3Credentials:
      accessKeyId:
        name: bookorbit-s3-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: bookorbit-s3-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: zstd
      maxParallel: 8
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: garage
  retentionPolicy: "30d"
