---
# Browser route — native BookOrbit OIDC; no Gateway SecurityPolicy
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  annotations:
    item.homer.rajsingh.info/name: BookOrbit
    item.homer.rajsingh.info/subtitle: eBook Library
    item.homer.rajsingh.info/logo: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/calibre-web.svg
    item.homer.rajsingh.info/keywords: ebooks, reading, library
    service.homer.rajsingh.info/name: Reading
    service.homer.rajsingh.info/icon: fas fa-book
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    # Public: BookOrbit runs its own native OIDC login (provider `tinyauth`,
    # auto-provision on), so users self-serve in the browser/PWA. No Gateway
    # SecurityPolicy; the device/OPDS route below shares this hostname and stays
    # ungated for clients that authenticate in the application.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
  hostnames:
    - bookorbit.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bookorbit
          port: 3000
---
# Device/API route — NOT targeted by SecurityPolicy; Kobo/KOReader/OPDS carry
# their own application auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit-devices
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    # Public: a Kobo/KOReader is off-tailnet and cannot hold a cookie. These
    # endpoints authenticate themselves — Kobo via a device token in the path,
    # OPDS via per-user credentials the user creates for themselves.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
  hostnames:
    - bookorbit.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/kobo
      backendRefs:
        - name: bookorbit
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/koreader
      backendRefs:
        - name: bookorbit
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/opds
      backendRefs:
        - name: bookorbit
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2-callback
      backendRefs:
        - name: bookorbit
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: bookorbit
          port: 3000
