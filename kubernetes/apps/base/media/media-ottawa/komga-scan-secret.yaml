---
# Populated after Komga first boot: mint a second admin API key in Komga UI,
# then retrieve library IDs from GET /api/v1/libraries and update these values.
apiVersion: v1
kind: Secret
metadata:
  name: komga-scan-secret
  namespace: media
type: Opaque
stringData:
  api-key: "REPLACE_AFTER_FIRST_BOOT"
  manga-library-id: "REPLACE_AFTER_FIRST_BOOT"
  comics-library-id: "REPLACE_AFTER_FIRST_BOOT"
