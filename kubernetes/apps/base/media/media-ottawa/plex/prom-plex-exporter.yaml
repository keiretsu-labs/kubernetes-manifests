---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom-plex-exporter
  namespace: media
  labels:
    app: prom-plex-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prom-plex-exporter
  template:
    metadata:
      labels:
        app: prom-plex-exporter
    spec:
      containers:
        - name: prom-plex-exporter
          # renovate: datasource=docker depName=ghcr.io/timothystewart6/prometheus-plex-exporter
          # Upstream publishes only :latest and sha-<7> tags; pin the digest so a
          # new :latest push (this pod holds PLEX_TOKEN) arrives as a Renovate PR.
          image: ghcr.io/timothystewart6/prometheus-plex-exporter:latest@sha256:90dc0799601c334f2945a3d5b4b552a06352b208a8ce88a428cf90d6c9aa51cd
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: metrics
              protocol: TCP
          env:
            - name: PLEX_SERVER
              valueFrom:
                secretKeyRef:
                  name: prom-plex-exporter-secret
                  key: PLEX_SERVER
            - name: PLEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prom-plex-exporter-secret
                  key: PLEX_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: prom-plex-exporter
  namespace: media
  labels:
    app: prom-plex-exporter
spec:
  selector:
    app: prom-plex-exporter
  ports:
    - name: metrics
      port: 9000
      protocol: TCP
      targetPort: 9000
