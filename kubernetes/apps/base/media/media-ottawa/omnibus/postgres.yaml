---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: omnibus-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  enableSuperuserAccess: true
  superuserSecret:
    name: omnibus-postgres-superuser-creds
  inheritedMetadata:
    labels:
      app: omnibus-postgres
  instances: 2
  bootstrap:
    initdb:
      database: omnibus
      owner: omnibus
  nodeMaintenanceWindow:
    reusePVC: false
  storage:
    size: 10Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: omnibus-s3-store
        serverName: omnibus-postgres
  backup:
    retentionPolicy: "7d"
  externalClusters:
    - name: keiretsu
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: omnibus-s3-store
          serverName: omnibus-postgres
  # bootstrap:
  #   recovery:
  #     source: keiretsu
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: omnibus-postgres-s3
spec:
  schedule: "0 0 1 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: omnibus-postgres
