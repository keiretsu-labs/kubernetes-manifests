---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tracearr-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  enableSuperuserAccess: true
  superuserSecret:
    name: tracearr-postgres-superuser-creds
  inheritedMetadata:
    labels:
      app: tracearr-postgres
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: tracearr
      owner: tracearr
  nodeMaintenanceWindow:
    reusePVC: false
  storage:
    size: 40Gi
  postgresql:
    shared_preload_libraries:
      - timescaledb
    extensions:
      - name: timescaledb
        image:
          reference: ghcr.io/adampetrovic/timescaledb-cnpg:2.31.0-18-trixie@sha256:70cc9bbc66e5d94b83fa1dd1bc1f75cb619fda8bf08f63e76d1617155314ce57
    parameters:
      timescaledb.license: "timescale"
      timescaledb.telemetry_level: "off"
      timescaledb.max_tuples_decompressed_per_dml_transaction: "100000"
      max_locks_per_transaction: "4096"
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tracearr-s3-store
        serverName: tracearr-postgres
  backup:
    retentionPolicy: "7d"
  externalClusters:
  - name: keiretsu
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: tracearr-s3-store
        serverName: tracearr-postgres
  # bootstrap:
  #   recovery:
  #     source: keiretsu
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: tracearr-postgres-s3
spec:
  schedule: "0 0 23 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: tracearr-postgres
