---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  # Operator creates a Service of the same name; zot uses the separate
  # cluster-local 'zot-cache' alias below.
  name: dragonfly-zot
spec:
  replicas: 2
  args:
    - --maxmemory=2G
    - --proactor_threads=2
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 2.5Gi
