---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8gb
  namespace: k8gb
spec:
  interval: 30m
  chart:
    spec:
      chart: k8gb
      version: "v1.0.0"
      sourceRef:
        kind: HelmRepository
        name: k8gb
        namespace: flux-system
  # The k8gb chart exposes no priorityClassName for the controller Deployment
  # (only the bundled coredns does, set below), so patch it in post-render.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: k8gb
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: infra-high
          # K8GB v0.20 retains Prometheus GaugeVec labels for deleted GSLBs.
          # This one-time, GitOps-managed rollout clears that in-memory state
          # after moving monitoring GSLBs to Ottawa, without interrupting the
          # separately replicated CoreDNS service.
          - target:
              kind: Deployment
              name: k8gb
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: k8gb
              spec:
                template:
                  metadata:
                    annotations:
                      monitoring.keiretsu.top/gslb-state-reset: "2026-08-11"
          # k8gb v0.20.0 accepts dnsZones[].extraPlugins in its values schema
          # but no longer renders that field into the static Corefile. Keep the
          # delegated CDN ACME challenge reachable until the chart restores the
          # missing template behavior.
          - target:
              kind: ConfigMap
              name: k8gb-coredns
            patch: |
              - op: replace
                path: /data/Corefile
                value: |
                  (k8gbplugins) {
                      errors
                      health
                      reload 30s 15s
                      ready
                      prometheus 0.0.0.0:9153
                      forward . /etc/resolv.conf
                      k8s_crd {
                          filter k8gb.io/dnstype=local
                          negttl 30
                          loadbalance weight
                      }
                  }
                  import ../dynamic/*.conf
                  _acme-challenge.cdn.keiretsu.top:5353 {
                      template IN ANY _acme-challenge.cdn.keiretsu.top {
                          answer "_acme-challenge.cdn.keiretsu.top. 30 IN CNAME _acme-challenge-cdn.keiretsu.top."
                      }
                  }
                  # Every regional resolver answers every regional suffix.
                  # Keep each suffix pinned to its owning Envoy Gateway so a
                  # resolver failover cannot send a region-local route to a
                  # cluster that does not run its backend. The CNAME preserves
                  # the original Host/SNI for the HTTPRoute.
                  (tailnet-regional) {
                      template IN ANY killinit.cc {
                          match ^.+\.killinit\.cc\.$
                          answer "{{ .Name }} 30 IN CNAME ottawa-home-envoy-gateway.keiretsu.ts.net."
                      }
                      template IN ANY lukehouge.com {
                          match ^.+\.lukehouge\.com\.$
                          answer "{{ .Name }} 30 IN CNAME robbinsdale-home-envoy-gateway.keiretsu.ts.net."
                      }
                      template IN ANY rajsingh.info {
                          match ^.+\.rajsingh\.info\.$
                          answer "{{ .Name }} 30 IN CNAME stpetersburg-home-envoy-gateway.keiretsu.ts.net."
                      }
                  }
                  # Use one catch-all resolver block so every regional suffix
                  # is handled consistently. More-specific imported k8gb
                  # zones (notably cdn.keiretsu.top) still win by CoreDNS
                  # longest-zone matching.
                  .:5353 {
                      import tailnet-regional
                      forward . 1.1.1.1
                  }
          - target:
              kind: Deployment
              name: k8gb-coredns
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: k8gb-coredns
              spec:
                template:
                  metadata:
                    annotations:
                      dns-config-revision: "2026-09-15-regional-zones-v2"
                  spec:
                    topologySpreadConstraints:
                      - maxSkew: 1
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: ScheduleAnyway
                        labelSelector:
                          matchLabels:
                            app.kubernetes.io/instance: k8gb
                            app.kubernetes.io/name: coredns
  values:
    k8gb:
      clusterGeoTag: "${LOCATION}"
      extGslbClustersGeoTags: "${K8GB_EXT_GEO_TAGS}"
      dnsZones:
        - parentZone: "keiretsu.top"
          loadBalancedZone: "cdn.keiretsu.top"
          dnsZoneNegTTL: 30
          # cdn.keiretsu.top is NS-delegated here, which occludes the
          # _acme-challenge TXT cert-manager writes into cloudflare. Answer the
          # challenge name with a CNAME back into the undelegated parent zone
          # (cert-manager follows it via the issuer's cnameStrategy: Follow).
          extraPlugins:
            - |
              template IN ANY _acme-challenge.cdn.keiretsu.top {
                answer "_acme-challenge.cdn.keiretsu.top. 30 IN CNAME _acme-challenge-cdn.keiretsu.top."
              }
      edgeDNSServers:
        - "1.1.1.1"
      nsRecordTTL: 30
      reconcileRequeueSeconds: 60

      exposeMetrics: true
      serviceMonitor:
        enabled: true

    coredns:
      replicaCount: 3
      priorityClassName: infra-high
      serviceType: LoadBalancer
      service:
        loadBalancerIP: "${CLUSTER_LOAD_BALANCER_CIDR%.*.*/*}.10.53"

    extdns:
      enabled: false

    gatewayapi:
      enabled: true
