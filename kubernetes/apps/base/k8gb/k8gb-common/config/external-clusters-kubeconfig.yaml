---
# Shared by the multi-cluster Homer dashboards deployed in each cluster.
# Context names must match the Dashboard remoteClusters entries.
apiVersion: v1
kind: Secret
metadata:
  name: external-clusters-kubeconfig
  namespace: keiretsu-top
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    clusters:
    - cluster:
        server: https://ottawa-k8s-operator.keiretsu.ts.net
      name: ottawa
    - cluster:
        server: https://robbinsdale-k8s-operator.keiretsu.ts.net
      name: robbinsdale
    - cluster:
        server: https://stpetersburg-k8s-operator.keiretsu.ts.net
      name: stpetersburg
    contexts:
    - context:
        cluster: ottawa
        user: tailscale-auth
      name: ottawa
    - context:
        cluster: robbinsdale
        user: tailscale-auth
      name: robbinsdale
    - context:
        cluster: stpetersburg
        user: tailscale-auth
      name: stpetersburg
    kind: Config
    users:
    - name: tailscale-auth
      user:
        token: unused
