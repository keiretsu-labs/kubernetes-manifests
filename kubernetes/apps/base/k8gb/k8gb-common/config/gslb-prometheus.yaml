---
# Envoy Gateway does not support ExternalName Services as HTTPRoute backends.
# Resolve the service FQDN through the cluster DNS instead: it reaches Ottawa's
# local Mimir gateway there and the Tailscale egress proxy in the remote sites.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: mimir-gateway
  namespace: keiretsu-top
spec:
  endpoints:
    - fqdn:
        hostname: mimir-gateway.mimir.svc.cluster.local
        port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-cdn
  namespace: keiretsu-top
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
  hostnames:
    - "prometheus.cdn.${COMMON_DOMAIN}"
    - "prometheus.${COMMON_DOMAIN}"
  rules:
    # Prometheus runs in agent mode, so its local HTTP endpoint cannot answer
    # PromQL requests. Keep the public API useful by serving each site's tenant
    # through the Mimir gateway Backend (an egress proxy outside Ottawa).
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: mimir-gateway
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Scope-OrgID
                value: ${CLUSTER_NAME}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /prometheus/api/v1
    # Mimir deliberately has no Prometheus web UI. Send interactive users to
    # Grafana while preserving PromQL API compatibility above.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: "grafana.${COMMON_DOMAIN}"
            port: 443
            statusCode: 302
---
apiVersion: k8gb.absa.oss/v1beta1
kind: Gslb
metadata:
  name: prometheus
  namespace: keiretsu-top
  annotations:
    k8gb.io/exposed-hostnames: "${LOCATION}.${COMMON_DOMAIN}"
spec:
  resourceRef:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: prometheus-cdn
  strategy:
    type: roundRobin
    dnsTtlSeconds: 30
    weight:
      ottawa: 33
      robbinsdale: 33
      stpetersburg: 34
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prometheus-tinyauth
  namespace: keiretsu-top
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus-cdn
  extAuth:
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-for
      - user-agent
    http:
      backendRefs:
        - name: tinyauth
          namespace: tinyauth
          port: 3000
      path: "/api/auth/envoy?path="
      headersToBackend:
        - remote-user
        - remote-email
        - remote-name
        - remote-groups
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-raj-kartik
        action: Allow
        principal:
          headers:
            - name: Remote-Email
              values:
                - rajsinghcpre@gmail.com
                - kartikbharath@gmail.com
