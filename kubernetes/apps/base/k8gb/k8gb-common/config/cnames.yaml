---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: keiretsu-top-cnames
  namespace: cloudflare
  labels:
    dns-target: cloudflare
    # Every target here is the public WAN edge, which is the right answer only
    # from the internet. external-dns-unifi now watches keiretsu.top, so
    # without this label it would copy these CNAMEs into LAN DNS and shadow the
    # private-LB records it derives from the private gateway's own routes --
    # sending LAN and tailnet clients out to the WAN and back for services
    # sitting one hop away. Cloudflare still picks the object up via
    # dns-target==cloudflare.
    dns-scope: public-only
# Proxied records carry "true"; named aliases that must remain unproxied carry
# an explicit "false". Other records inherit external-dns's unproxied default.
spec:
  endpoints:
    - dnsName: "${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "keiretsu.cdn.${COMMON_DOMAIN}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
    - dnsName: "www.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "keiretsu.cdn.${COMMON_DOMAIN}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
    - dnsName: "auth.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    # home.keiretsu.top is a Python server behind the Envoy Gateway,
    # NOT a Garage/CDN site — point at the ottawa edge (envoy gateway IP).
    - dnsName: "home.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    # Webtop is deployed only in Ottawa; publish its common-domain alias at
    # the Ottawa edge and keep Cloudflare proxying disabled.
    - dnsName: "webtop.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    # Pin to the Ottawa edge, not forgejo.cdn (k8gb). Recursors cache
    # NS ns1.dns.cdn.keiretsu.top with no A glue, so the CNAME hop
    # NXDOMAINs in-cluster and breaks Woodpecker's Forgejo OAuth token
    # exchange. forgejo.cdn.keiretsu.top remains the GSLB name.
    - dnsName: "forgejo.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    # bhaiya admin console + per-workspace opencode instances live ONLY in
    # ottawa, so point straight at the ottawa edge (one healthy WAN IP) instead
    # of the k8gb cdn GSLB — the GSLB hands back a second, broken WAN edge that
    # 404s ~50% of requests. The *.bhaiya wildcard lives in keiretsu-top-wildcards
    # (below) because UniFi's static-DNS API rejects wildcard hostnames.
    - dnsName: "bhaiya.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "grafana.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "firefly.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "hubble.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "hubble.cdn.${COMMON_DOMAIN}"
    - dnsName: "logs.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "logs.cdn.${COMMON_DOMAIN}"
    - dnsName: "prometheus.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "prometheus.cdn.${COMMON_DOMAIN}"
    - dnsName: "opencost.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "opencost.cdn.${COMMON_DOMAIN}"
    - dnsName: "oci.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "oci.cdn.${COMMON_DOMAIN}"
    - dnsName: "status.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "status.cdn.${COMMON_DOMAIN}"
    - dnsName: "s3.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "s3.cdn.${COMMON_DOMAIN}"
    - dnsName: "tailscale-logs.s3.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "s3.cdn.${COMMON_DOMAIN}"
    # teslamate behind tinyauth on the public envoy gateway — same domain family
    - dnsName: "teslamate.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "litellm.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "woodpecker.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "infisical.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    # frigate NVR behind tinyauth on the public envoy gateway
    - dnsName: "frigate.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    # CLIProxyAPI browser UI; the API hostname uses ${CLUSTER_DOMAIN} and is
    # discovered from its private/ts HTTPRoute instead of public DNS.
    - dnsName: "cliproxy.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "frigate.${LOCATION}.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
---
# Wildcard CNAMEs that only Cloudflare can serve. UniFi's static-DNS API rejects
# wildcard hostnames (400 Invalid Hostname), so these are isolated under a
# dedicated DNSEndpoint tagged dns-scope=public-only. external-dns-unifi uses
# --label-filter=dns-scope!=public-only to skip this object entirely, while
# external-dns-cloudflare (--label-filter=dns-target==cloudflare) still picks
# it up. Add any future wildcard CNAMEs here — no other changes needed.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: keiretsu-top-wildcards
  namespace: cloudflare
  labels:
    dns-target: cloudflare
    dns-scope: public-only
spec:
  endpoints:
    - dnsName: "*.bhaiya.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "*.hermes.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "ottawa.${COMMON_DOMAIN}"
    - dnsName: "*.s3.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "s3.cdn.${COMMON_DOMAIN}"
    # per-location wildcard: *.ottawa.keiretsu.top → ottawa.keiretsu.top, etc.
    # each cluster manages its own entry via ${LOCATION} substitution
    - dnsName: "*.${LOCATION}.${COMMON_DOMAIN}"
      recordType: CNAME
      targets:
        - "${LOCATION}.${COMMON_DOMAIN}"
