---
# bhaiya admin console. bhaiya is ottawa-only, so DNS points straight at the
# ottawa edge (CNAME in cnames.yaml) — no k8gb GSLB, which handed back a broken
# second WAN edge that 404'd ~50% of requests. Access is gated by tinyauth
# (authN only); bhaiya's in-process users table handles authZ (admin/member
# roles, managed via the bhaiya admin UI). The route lives in keiretsu-top
# (where the apex hostnames and tinyauth ReferenceGrant already are);
# per-workspace routes are created in the bhaiya namespace by ExposeRoute.
#
# The public hostname is deliberately split into two routes. The existing
# bhaiya-cdn route is the upgrade lane: its header/method matches win Gateway
# API precedence for WebSocket and CONNECT traffic. bhaiya-cdn-plain is the
# catch-all for requests without an upgrade signal and is the only route that
# receives the request buffer and local rate limit below. Keeping the buffer
# off the broad upgrade route is required because Envoy request buffering can
# hang streaming and upgrade traffic indefinitely.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bhaiya-cdn
  namespace: keiretsu-top
  annotations:
    item.homer.rajsingh.info/name: "Bhaiya"
    item.homer.rajsingh.info/subtitle: "Sandbox Control Plane"
    item.homer.rajsingh.info/keywords: "sandbox, workspace, control-plane"
    service.homer.rajsingh.info/name: "Infrastructure"
    service.homer.rajsingh.info/icon: "fas fa-cubes"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: wildcard-keiretsu-top-https
  hostnames:
    - "bhaiya.${COMMON_DOMAIN}"
  rules:
    - matches:
        # HTTP/1 WebSocket and other RFC 9110 upgrades carry Upgrade. Match
        # every value conservatively so a new upgrade protocol is not buffered.
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: Upgrade
              type: RegularExpression
              value: .+
        # Preserve clients that signal an upgrade through Connection as well.
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: Connection
              type: RegularExpression
              value: (?i).*upgrade.*
        # HTTP/2 and HTTP/3 extended CONNECT do not use HTTP/1 Upgrade.
        - path:
            type: PathPrefix
            value: /
          method: CONNECT
      backendRefs:
        - name: bhaiya
          namespace: bhaiya
          port: 80
      timeouts:
        request: 3600s
---
# The plain lane intentionally has the same host and backend as bhaiya-cdn.
# Gateway API match precedence selects bhaiya-cdn for the upgrade matches above
# and this route for all remaining requests.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bhaiya-cdn-plain
  namespace: keiretsu-top
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: wildcard-keiretsu-top-https
  hostnames:
    - "bhaiya.${COMMON_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bhaiya
          namespace: bhaiya
          port: 80
      timeouts:
        request: 3600s
---
# admin console access control via tinyauth. tinyauth does authN (Google login,
# injects Remote-Email); bhaiya does its own authZ in-process against its users
# table (admin/member roles, per-owner workspace caps). No EG authorization
# block here — bhaiya returns 403 itself for unregistered users. Per-workspace
# routes (created by ExposeRoute) keep their own SecurityPolicy with owner +
# AllowedEmails + admin email authorization.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: bhaiya-tinyauth
  namespace: keiretsu-top
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bhaiya-cdn
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bhaiya-cdn-plain
  extAuth:
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-for
      - user-agent
    http:
      backendRefs:
        - name: tinyauth
          namespace: tinyauth
          port: 3000
      path: "/api/auth/envoy?path="
      headersToBackend:
        - remote-user
        - remote-email
        - remote-name
        - remote-groups
---
# Tinyauth returns 401 with x-tinyauth-location for unauthenticated requests.
# Convert that ext_authz response into the browser redirect expected by the
# public Bhaiya UI. This is route-scoped because the response filter must run
# after the route's ext_authz check.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: bhaiya-tinyauth-redirect
  namespace: keiretsu-top
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bhaiya-cdn
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bhaiya-cdn-plain
  lua:
    - inline: |
        function envoy_on_response(response_handle)
          local headers = response_handle:headers()
          if headers:get(":status") == "401" then
            local location = headers:get("x-tinyauth-location")
            if location then
              headers:replace(":status", "302")
              headers:add("Location", location)
              headers:remove("x-tinyauth-location")
            end
          end
        end
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: bhaiya-plain-http-limits
  namespace: keiretsu-top
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bhaiya-cdn-plain
  # 8MiB is above Bhaiya's 4MiB upload chunk plus JSON/envelope overhead, while
  # still bounding a single plain HTTP request before it reaches the slow
  # control-plane or workspace proxy.
  requestBuffer:
    limit: 8Mi
  # 600 requests/minute (10 requests/second) is a per-Envoy-instance admission
  # budget, large enough for a browser's burst of UI assets and polling. The
  # counter is charged on request admission only; it does not hold a token for
  # the 3600s route timeout or for a slow upstream response.
  rateLimit:
    local:
      rules:
        - limit:
            requests: 600
            unit: Minute
