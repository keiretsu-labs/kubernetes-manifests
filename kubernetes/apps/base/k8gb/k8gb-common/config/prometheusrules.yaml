---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8gb-alerts
  namespace: k8gb
spec:
  groups:
    - name: k8gb.rules
      rules:
        # k8gb v1.0.1 renamed ingress_hosts_per_status; the old metric is gone
        # and these two alerts silently stopped evaluating (2026-10-23 census).
        # service_status_num carries the same status label plus
        # exported_namespace/name for the GSLB object.
        - alert: K8gbGslbUnhealthy
          expr: |
            k8gb_gslb_service_status_num{status="Unhealthy"} > 0
          for: 5m
          annotations:
            summary: >-
              GSLB {{ $labels.exported_namespace }}/{{ $labels.name }} has {{ $value }}
              unhealthy host(s).
          labels:
            severity: warning

        - alert: K8gbGslbNotFound
          expr: |
            k8gb_gslb_service_status_num{status="NotFound"} > 0
          for: 5m
          annotations:
            summary: >-
              GSLB {{ $labels.exported_namespace }}/{{ $labels.name }} has {{ $value }}
              host(s) in NotFound status (single-home on another cluster is
              expected for geo-standby; page only if ottawa also flips).
          labels:
            severity: critical

        - alert: K8gbHighErrorRate
          expr: |
            sum(rate(k8gb_gslb_errors_total[5m])) by (namespace, name) > 0.1
          for: 10m
          annotations:
            summary: >-
              GSLB {{ $labels.name }} in {{ $labels.namespace }} is generating
              errors at {{ printf "%.2f" $value }}/s.
          labels:
            severity: warning

        - alert: K8gbNoHealthyRecords
          expr: |
            (
              k8gb_gslb_healthy_records{name!="init"} == 0
            )
            and on (namespace, name)
            (
              max by (namespace, name) (
                k8gb_gslb_service_status_num{status=~"Healthy|Unhealthy"} > 0
              ) > 0
            )
          for: 5m
          annotations:
            summary: >-
              GSLB {{ $labels.name }} in {{ $labels.namespace }} has zero healthy
              DNS records while k8gb still reports a serving or unhealthy backend.
          labels:
            severity: critical

        - alert: K8gbEndpointNoTargets
          expr: |
            k8gb_endpoint_status_num{name!="init"} == 0
          for: 5m
          annotations:
            summary: >-
              DNS endpoint {{ $labels.dns_name }} has zero targets.
          labels:
            severity: warning
