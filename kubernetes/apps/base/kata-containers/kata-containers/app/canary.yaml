---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kata-canary
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kata-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kata-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kata-canary
    spec:
      runtimeClassName: kata-clh
      containers:
        - name: canary
          image: docker.io/library/busybox:1.38
          command:
            - sleep
            - infinity
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
      securityContext:
        seccompProfile:
          type: RuntimeDefault
