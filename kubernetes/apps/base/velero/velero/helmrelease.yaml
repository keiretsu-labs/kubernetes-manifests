---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero
      version: 12.1.0
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: docker.io/velero/velero
      tag: v1.18.2

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.2
        volumeMounts:
          - mountPath: /target
            name: plugins

    credentials:
      useSecret: true
      existingSecret: velero-credentials

    configuration:
      clientQPS: 100
      clientBurst: 200
      # Fail a wedged file-system data path within the upstream default window.
      # `podVolumeOperationTimeout` is an obsolete chart value and rendered no
      # server flag with chart 12.1.0.
      fsBackupTimeout: 4h
      backupStorageLocation:
        - name: garage
          provider: aws
          bucket: velero
          # Per-cluster prefix. Must sit beside `bucket` (it renders into
          # spec.objectStorage.prefix); under `config` Velero silently ignores
          # it and every cluster shares the bucket root — which means shared
          # kopia repos per namespace across clusters.
          prefix: "${LOCATION}"
          default: true
          config:
            region: garage
            s3Url: "http://${COMMON_S3_ENDPOINT}"
            s3ForcePathStyle: "true"
          credential:
            name: velero-credentials
            key: cloud
        # Read-only view of the un-prefixed bucket root, where every cluster
        # wrote until 2026-07-25. Keeps those backups listed and restorable
        # (their kopia repos are at <root>/kopia/<ns>) while they age out.
        # REMOVE once the newest root-level backup has passed its TTL — the
        # longest is bhaiya-raj-trades at 720h, so after 2026-08-24.
        - name: garage-legacy
          provider: aws
          bucket: velero
          accessMode: ReadOnly
          default: false
          config:
            region: garage
            s3Url: "http://${COMMON_S3_ENDPOINT}"
            s3ForcePathStyle: "true"
          credential:
            name: velero-credentials
            key: cloud
      volumeSnapshotLocation: []

    deployNodeAgent: true
    nodeAgent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      uploaderType: kopia
      podVolumePath: /var/lib/kubelet/pods
      extraArgs:
        - --node-agent-configmap=node-agent-config
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi

    metrics:
      enabled: true
