---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero
      version: 12.1.0
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: docker.io/velero/velero
      tag: v1.18.2

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.2
        volumeMounts:
          - mountPath: /target
            name: plugins

    credentials:
      useSecret: true
      existingSecret: velero-credentials

    configuration:
      clientQPS: 100
      clientBurst: 200
      # Fail a wedged file-system data path within the upstream default window.
      # `podVolumeOperationTimeout` is an obsolete chart value and rendered no
      # server flag with chart 12.1.0.
      fsBackupTimeout: 4h
      backupStorageLocation:
        - name: garage
          provider: aws
          bucket: velero
          # Per-cluster prefix. Must sit beside `bucket` (it renders into
          # spec.objectStorage.prefix); under `config` Velero silently ignores
          # it and every cluster shares the bucket root — which means shared
          # kopia repos per namespace across clusters.
          prefix: "${LOCATION}"
          default: true
          config:
            region: garage
            s3Url: "http://${COMMON_S3_ENDPOINT}"
            s3ForcePathStyle: "true"
          credential:
            name: velero-credentials
            key: cloud
        # Frozen pre-2026-07-25 history. Until that date every cluster wrote to
        # the bucket root (the prefix above was nested under `config`, where
        # Velero ignores it), so the root held one shared kopia repo per
        # namespace. That tree was moved to legacy/ so it stays listable and
        # restorable — a BSL pointed at the root itself will NOT validate, since
        # Velero rejects the now-present ottawa/ and robbinsdale/ as unknown
        # top-level directories.
        #
        # ReadOnly so no cluster writes here and Velero runs no kopia
        # maintenance against it — two clusters GC-ing one shared repo is what
        # wedged backups in the first place.
        #
        # Velero will NOT garbage-collect a read-only location, so expired
        # entries linger and this 77 GiB is never reclaimed on its own. RETIRE
        # after 2026-08-24 (last 720h bhaiya-raj-trades entry) by following
        # docs/runbook-velero-legacy-bsl-retire.md.
        - name: garage-legacy
          provider: aws
          bucket: velero
          prefix: legacy
          accessMode: ReadOnly
          default: false
          config:
            region: garage
            s3Url: "http://${COMMON_S3_ENDPOINT}"
            s3ForcePathStyle: "true"
          credential:
            name: velero-credentials
            key: cloud
      volumeSnapshotLocation: []

    deployNodeAgent: true
    nodeAgent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      uploaderType: kopia
      podVolumePath: /var/lib/kubelet/pods
      extraArgs:
        - --node-agent-configmap=node-agent-config
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi

    metrics:
      enabled: true
