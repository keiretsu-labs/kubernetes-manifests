---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-operator
  namespace: garage-operator-system
spec:
  interval: 30m
  chart:
    spec:
      chart: garage-operator
      version: "0.7.12"
      sourceRef:
        kind: HelmRepository
        name: garage-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  values:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 128Mi
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
    # The chart rejects enabling both monitors because that double-scrapes
    # every operator replica. Keep the existing ServiceMonitor path.
    podMonitor:
      enabled: false
    prometheusRules:
      enabled: true
      labels:
        release: monitoring
      # v0.7.11 adds garage.quota to this enabled rule set.
    grafanaDashboard:
      enabled: true
      labels:
        grafana_dashboard: "1"
    webhooks:
      enabled: true
