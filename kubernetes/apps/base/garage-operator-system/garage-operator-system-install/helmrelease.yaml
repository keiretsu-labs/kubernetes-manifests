---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-operator
  namespace: garage-operator-system
spec:
  interval: 30m
  chart:
    spec:
      chart: garage-operator
      version: "0.7.10"
      sourceRef:
        kind: HelmRepository
        name: garage-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  postRenderers:
    - kustomize:
        patches:
          # The chart now labels the metrics Service and selects that label in
          # its ServiceMonitor. Keep only the independent aggregation fix for
          # GarageNodeDisconnected: each node reports its own self-observation
          # as 0, so the alert must aggregate by id and fire only when no peer
          # sees that node.
          #
          # The current pin is 0.7.10, whose rules have no garage.quota group;
          # keep its numeric path scoped to that chart label until the release
          # containing quota rules is available.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: PrometheusRule
              name: garage-operator-garage
              labelSelector: helm.sh/chart=garage-operator-0.7.10
            patch: |
              - op: replace
                path: /spec/groups/2/rules/4/expr
                value: sum by (id) (cluster_layout_node_connected{job="garage"}) == 0
          # The garage.quota group in v0.7.11 is inserted before garage.cluster,
          # moving GarageNodeDisconnected to groups/3/rules/4. Keep this patch
          # explicitly version-scoped so the valid JSON path cannot silently
          # land on a different alert.
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: PrometheusRule
              name: garage-operator-garage
              labelSelector: helm.sh/chart=garage-operator-0.7.11
            patch: |
              - op: replace
                path: /spec/groups/3/rules/4/expr
                value: sum by (id) (cluster_layout_node_connected{job="garage"}) == 0
  values:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 128Mi
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
    # The chart rejects enabling both monitors because that double-scrapes
    # every operator replica. Keep the existing ServiceMonitor path.
    podMonitor:
      enabled: false
    prometheusRules:
      enabled: true
      labels:
        release: monitoring
      # v0.7.11 adds garage.quota to this enabled rule set.
    grafanaDashboard:
      enabled: true
      labels:
        grafana_dashboard: "1"
    webhooks:
      enabled: true
