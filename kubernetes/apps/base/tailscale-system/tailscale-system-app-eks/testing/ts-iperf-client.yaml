---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${LOCATION}-sidecar-iperf-client
spec:
  replicas: 1
  serviceName: ${LOCATION}-sidecar-iperf-client
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ${LOCATION}-sidecar-iperf-client
  template:
    metadata:
      labels:
        app: ${LOCATION}-sidecar-iperf-client
    spec:
      serviceAccountName: tailscale
      initContainers:
      - args:
        - sysctl -w net.ipv4.ip_forward=1 && if sysctl net.ipv6.conf.all.forwarding;
          then sysctl -w net.ipv6.conf.all.forwarding=1; fi
        command:
        - /bin/sh
        - -c
        image: ghcr.io/tailscale/tailscale:v1.102.2
        imagePullPolicy: IfNotPresent
        name: sysctler
        securityContext:
          privileged: true
      containers:
      - name: iperf-client
        image: nicolaka/netshoot:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "set +e\nTARGET_HOST=\"ottawa-sidecar-iperf-server.tailscale-system.svc.cluster.local\"\
          \necho \"Will continuously test to $TARGET_HOST\"\nwhile true; do\n  # Check\
          \ DNS resolution first\n  RESOLVED_IP=$(dig +short \"$TARGET_HOST\" 2>/dev/null\
          \ | head -1)\n  if [ -z \"$RESOLVED_IP\" ]; then\n    echo \"[$(date)] WARNING:\
          \ DNS resolution failed for $TARGET_HOST\"\n    echo \"[$(date)] Trying\
          \ nslookup...\"\n    nslookup \"$TARGET_HOST\" 2>&1 || true\n    sleep 1\n\
          \    continue\n  fi\n  echo \"[$(date)] Resolved $TARGET_HOST -> $RESOLVED_IP\"\
          \n  echo \"[$(date)] Connecting to $TARGET_HOST...\"\n  iperf3 -c $TARGET_HOST\
          \ -t 10 2>&1 || echo \"Connection failed, retrying...\"\ndone\n"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: LOCATION
          value: ${LOCATION}
        - name: FAILOVER
          value: ${FAILOVER}
      - name: tailscale
        imagePullPolicy: IfNotPresent
        image: ghcr.io/tailscale/tailscale:v1.102.2
        securityContext:
          privileged: true
        ports:
        - name: metrics
          containerPort: 9002
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: TS_KUBE_SECRET
          value: ''
        - name: TS_USERSPACE
          value: 'false'
        - name: TS_STATE_DIR
          value: /dev/shm
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: ts-oauth
              key: TS_AUTHKEY_EPHEMERAL
              optional: true
        - name: TS_ACCEPT_DNS
          value: 'true'
        - name: TS_EXTRA_ARGS
          value: --advertise-tags=tag:k8s,tag:${LOCATION} --accept-routes --ssh
        - name: TS_ENABLE_METRICS
          value: 'true'
        - name: TS_LOCAL_ADDR_PORT
          value: $$(POD_IP):9002
        - name: TS_HOSTNAME
          value: $$(POD_NAME)
