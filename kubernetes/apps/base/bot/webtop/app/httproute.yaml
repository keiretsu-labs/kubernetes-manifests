---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webtop
  annotations:
    item.homer.rajsingh.info/name: "Webtop"
    item.homer.rajsingh.info/subtitle: "Debian XFCE Desktop"
    item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/linuxserver-io.svg"
    item.homer.rajsingh.info/keywords: "desktop, browser, utility, bot"

    service.homer.rajsingh.info/name: "Utilities"
    service.homer.rajsingh.info/icon: "fas fa-desktop"
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ts
    namespace: home
    sectionName: ${CLUSTER_DOMAIN_LISTENER}
  hostnames:
  - "webtop.${CLUSTER_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: webtop
      port: 3000
      weight: 1
