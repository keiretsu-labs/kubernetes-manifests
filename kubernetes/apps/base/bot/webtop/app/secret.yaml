---
# CLIPROXY_API_KEY comes from ottawa cluster-secrets (sops) via Flux
# substitution -- the same value as cliproxy-credentials/api-key in the
# cliproxy namespace. Substitution is how this repo shares one credential
# across namespaces without a second copy of the ciphertext in git.
apiVersion: v1
kind: Secret
metadata:
  name: webtop-cliproxy
type: Opaque
stringData:
  api-key: "${CLIPROXY_API_KEY}"
