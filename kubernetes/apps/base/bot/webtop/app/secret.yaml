---
# CLIPROXY_API_KEY comes from ottawa cluster-secrets (sops) via Flux
# substitution -- the same value as cliproxy-credentials/api-key in the
# cliproxy namespace. Substitution is how this repo shares one credential
# across namespaces without a second copy of the ciphertext in git.
#
# The `:=` default is load-bearing: this cluster runs envsubst in strict mode,
# so a bare ${CLIPROXY_API_KEY} fails the whole Kustomization until the key
# exists rather than degrading. Defaulting to empty keeps the desktop
# deployable, and the image's 10-bot-environment init warns at boot that
# agents will get 401.
apiVersion: v1
kind: Secret
metadata:
  name: webtop-cliproxy
type: Opaque
stringData:
  api-key: "${CLIPROXY_API_KEY:=}"
