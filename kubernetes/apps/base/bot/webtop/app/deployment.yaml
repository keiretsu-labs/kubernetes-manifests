---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webtop
  template:
    metadata:
      labels:
        app: webtop
    spec:
      enableServiceLinks: false
      containers:
      - name: webtop
        # Built from ./kubernetes/apps/base/bot/webtop/image by
        # .github/workflows/webtop-bot-build.yaml. This pins the immutable
        # flavor-SHA tag; change WEBTOP_BASE_TAG in versions.env to switch
        # the LinuxServer desktop flavor.
        image: ghcr.io/keiretsu-labs/kubernetes-manifests/webtop-bot:debian-xfce-323cfa9
        # Resolve the registry tag when the pod starts.
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        # One desktop, one user, and that user is root: PUID/PGID 0 makes
        # LinuxServer's `abc` account uid 0, so sudo, apt and the toolchains
        # all work in-session without a second identity to reason about.
        - name: PUID
          value: '0'
        - name: PGID
          value: '0'
        - name: TZ
          value: ${TIMEZONE}
        - name: TITLE
          value: bot
        - name: DISABLE_IPV6
          value: 'true'
        # cliproxy wiring: the image's custom-cont-init.d/10-bot-environment
        # fans these two values out into OPENAI_*, ANTHROPIC_* and GEMINI_*,
        # and seeds ~/.codex/config.toml to read the key from the environment.
        - name: CLIPROXY_BASE_URL
          value: http://cliproxy.cliproxy.svc.cluster.local:8317
        - name: CLIPROXY_API_KEY
          valueFrom:
            secretKeyRef:
              name: webtop-cliproxy
              key: api-key
        # The codex-subscription route is Codex's own backend, so cliproxy
        # passes /v1/responses straight through. The `ai` route is an
        # openai-compatible provider that cliproxy reaches over chat/completions,
        # and the gpt-*-codex models there reject that endpoint -- `ai/gpt-5.3-codex`
        # is in the catalog but 400s for this CLI. Matches the model cliproxy's
        # own oauth-model-alias names for the codex pool.
        - name: CLIPROXY_CODEX_MODEL
          value: codex-subscription/gpt-5.6-luna
        # Hermes uses cliproxy's OpenAI-compatible chat/completions route.
        # The model is seeded into ~/.hermes/config.yaml without writing a key.
        - name: CLIPROXY_HERMES_MODEL
          value: ai/deepseek/deepseek-v4-flash
        volumeMounts:
        # /config is the single user's ~. See the image's 20-bot-home init.
        - name: config
          mountPath: /config
        # Selkies' encoder needs real shared memory; the container default 64Mi
        # is not enough and the desktop dies mid-session without this.
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '8'
            memory: 16Gi
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      # Disposable home by design. Bounded so a runaway module cache cannot
      # eat the node's ephemeral storage.
      - name: config
        emptyDir:
          sizeLimit: 50Gi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
