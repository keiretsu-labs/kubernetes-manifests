---
# Stable in-cluster DNS for canary workers.
# EG places the data-plane LoadBalancer in envoy-gateway-system, named by the
# EnvoyProxy in gateway.yaml. Alias it into cliproxy so
# OPENAI_BASE_URL=http://ai-gateway.cliproxy.svc.cluster.local/v1 works.
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: cliproxy
  labels:
    app.kubernetes.io/name: ai-gateway
spec:
  type: ExternalName
  externalName: ai-gateway-dataplane.envoy-gateway-system.svc.cluster.local
