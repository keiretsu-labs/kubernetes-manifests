---
# External front door for the AI gateway: ai.${COMMON_DOMAIN} on the private
# and tailnet gateways.
#
# The AI gateway runs its own Envoy data plane (the `ai-gateway` Gateway in
# this namespace) because AIGatewayRoute needs the extensionManager-enabled
# control plane and a listener we can roll independently. Rather than attach
# AIGatewayRoutes to the shared `private`/`ts` gateways and change their filter
# chains, this chains into it: the shared gateway terminates TLS for
# *.${COMMON_DOMAIN} and forwards to the AI data plane, which does model
# routing.
#
# The backendRef is the data-plane Service in envoy-gateway-system, named by
# the EnvoyProxy in gateway.yaml rather than Envoy Gateway's generated
# envoy-<ns>-<name>-<hash>. A ReferenceGrant authorizes the cross-namespace
# reference; it ships in ../grants because this KS sets
# targetNamespace: cliproxy and a grant only counts in the target namespace.
#
# This was an Envoy Gateway `Backend` until it turned out to be the only
# Backend-backed route in the fleet attached to private/ts, and the only one
# that never reached a data plane. Backend works on public (prometheus-cdn)
# and on the ai-gateway class (sp-vllm); on private/ts the route reported
# Accepted=True and ResolvedRefs=True on all four parentRefs, the Backend
# reported Accepted=True, the controller logged it into the resource tree
# with no error or warning, and the virtual host still never appeared.
# Services are what the other 43 routes on those two gateways use.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway-external
  namespace: cliproxy
spec:
  # Two hostnames, because only one of them resolves today.
  #
  #   ai.${CLUSTER_DOMAIN}  works now. external-dns watches HTTPRoutes and
  #                         publishes cluster-domain names automatically, and
  #                         tailnet split DNS resolves them. This is exactly
  #                         what cliproxy-api.${CLUSTER_DOMAIN} already does
  #                         on the same two gateways.
  #
  #   ai.${COMMON_DOMAIN}   needs a DNS decision first. Every other
  #                         *.keiretsu.top name in the fleet is served by the
  #                         `public` gateway, because keiretsu.top resolves to
  #                         ottawa.keiretsu.top -> the WAN address, and the
  #                         edge forwards :443 to the public data plane.
  #                         Attaching it here makes the listener serve it; it
  #                         does not make public DNS point at private. Either
  #                         add `public` to the parentRefs below (and a
  #                         SecurityPolicy -- unlike CLIProxy this gateway has
  #                         no api-keys of its own), or publish an internal
  #                         record for ai.keiretsu.top -> the private LB.
  #                         Deliberately no cnames.yaml entry: a CNAME to
  #                         ottawa.keiretsu.top would resolve and then 404.
  # No sectionName. The hostnames below span two zones, so no single listener
  # covers both, and pinning one sectionName per (gateway, listener) pair is
  # what kept this route out of every data plane: Envoy Gateway counted it in
  # attachedRoutes and reported Accepted=True on all four parentRefs while
  # emitting no virtual host on either private or ts.
  #
  # The two other multi-zone routes in the fleet -- tailscale-examples/tsflow
  # and the bhaiya trades route -- both omit sectionName and both resolve.
  # Without it the gateway attaches the route to every compatible listener and
  # intersects the hostnames itself, which is the behaviour we want here.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
  hostnames:
    - "ai.${CLUSTER_DOMAIN}"
    - "ai.${COMMON_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: ai-gateway-dataplane
          namespace: envoy-gateway-system
          port: 80
          weight: 1
      timeouts:
        # A completion can think for minutes before the first token, and the
        # default 15s request timeout would cut it off. This is the outer hop
        # of two Envoys, so it has to be at least as patient as the inner one.
        #
        # request only, matching the bhaiya workspace routes. An earlier
        # revision claimed backendRequest: "0s" was what kept this route out
        # of the data plane; that was wrong -- removing it changed nothing and
        # the route still 404'd.
        request: "0s"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: ai-gateway-external
  namespace: cliproxy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-gateway-external
  timeout:
    http:
      # Streaming responses idle between tokens; the default would drop a slow
      # generation mid-stream.
      requestTimeout: 0s
      connectionIdleTimeout: 900s
      maxConnectionDuration: 0s
