---
# Front door for in-region SP inference.
#
# Clients address the model by the name SP actually serves, namespaced by the
# route prefix: `vllm/GLM-5.3-Flash-EXL3`. There is deliberately no
# `vllm/default` / `vllm/auto` alias. An alias makes a model swap a one-line
# GitOps change, but it costs the only key a metadata catalog can match on:
# models.dev, LiteLLM's registry and every harness's built-in table are keyed
# by model id, so a request for `vllm/default` resolves to nothing and the
# client falls back to a generic default context window. Worker configs are
# generated from the serving profile instead, so a swap regenerates them
# rather than being absorbed by an alias that hides which model answered.
#
# Phase-1 backend = existing cliproxy ExternalName to ClusterMesh:
#   stpetersburg-vllm-upstream → qwen38-mesh.ai.svc.clusterset.local
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: sp-vllm
  namespace: cliproxy
spec:
  endpoints:
    - fqdn:
        hostname: stpetersburg-vllm-upstream.cliproxy.svc.cluster.local
        port: 80
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: sp-vllm
  namespace: cliproxy
spec:
  schema:
    name: OpenAI
  backendRef:
    name: sp-vllm
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: sp-vllm
  namespace: cliproxy
spec:
  parentRefs:
    - name: ai-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    # `vllm/` is a route namespace, not an alias: the prefix selects this
    # backend and modelNameOverride strips it back to the served name. The id
    # a client sends still names the model that answers.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: vllm/GLM-5.3-Flash-EXL3
      backendRefs:
        - name: sp-vllm
          modelNameOverride: GLM-5.3-Flash-EXL3
    # Unprefixed served name, for clients that send it verbatim.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: GLM-5.3-Flash-EXL3
      backendRefs:
        - name: sp-vllm
          modelNameOverride: GLM-5.3-Flash-EXL3
