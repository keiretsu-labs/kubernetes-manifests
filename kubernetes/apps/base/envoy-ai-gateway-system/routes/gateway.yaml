---
# Dedicated AI gateway listener on Ottawa. Separate from home/public gateways
# so we can roll Auth/ClientTrafficPolicy without touching existing routes.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: keiretsu-ai-gateway
  namespace: envoy-gateway-system
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: cliproxy
  labels:
    app.kubernetes.io/name: ai-gateway
spec:
  gatewayClassName: keiretsu-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ai-gateway-buffer
  namespace: cliproxy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  connection:
    # Default EG buffer (32Ki) is too small for LLM bodies.
    bufferLimit: 50Mi
