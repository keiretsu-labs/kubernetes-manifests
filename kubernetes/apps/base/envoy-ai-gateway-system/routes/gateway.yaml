---
# Dedicated AI gateway listener on Ottawa. Separate from home/public gateways
# so we can roll Auth/ClientTrafficPolicy without touching existing routes.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: keiretsu-ai-gateway
  namespace: envoy-gateway-system
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: ai-gateway
    namespace: cliproxy
---
# Exists for one reason: to name the data-plane Service ourselves.
#
# Left alone, Envoy Gateway generates envoy-<gateway-ns>-<gateway-name>-<hash>.
# That name is stable, but it is an implementation detail of the controller
# rather than anything we publish, and every reference to it has to repeat a
# hash nobody can derive by reading the manifests. envoyService.name is the
# supported way to pin it ("When unset, this defaults to an autogenerated
# name"), so the FQDN callers use is one we own.
#
# Only the name is set. Every other field keeps its default, so the Service
# stays a LoadBalancer exactly as the generated one was.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ai-gateway
  namespace: cliproxy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: ai-gateway-dataplane
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: cliproxy
  labels:
    app.kubernetes.io/name: ai-gateway
spec:
  gatewayClassName: keiretsu-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ai-gateway-buffer
  namespace: cliproxy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  connection:
    # Default EG buffer (32Ki) is too small for LLM bodies.
    bufferLimit: 50Mi
