---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
  namespace: envoy-ai-gateway-system
spec:
  interval: 30m
  chart:
    spec:
      chart: ai-gateway-helm
      version: "v1.1.0"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      interval: 12h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  dependsOn:
    - name: ai-gateway-crds
      namespace: envoy-ai-gateway-system
  releaseName: aieg
  values:
    # Talk to the existing Ottawa Envoy Gateway control plane.
    envoyGateway:
      namespace: envoy-gateway-system
