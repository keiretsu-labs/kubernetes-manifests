---
# Lets ai-gateway-external (cliproxy) backend the AI data-plane Service, which
# Envoy Gateway creates in envoy-gateway-system.
#
# This needs its own Flux Kustomization. The routes KS sets
# targetNamespace: cliproxy, which rewrites every object it renders, so a
# grant declared alongside the route would land in the wrong namespace -- a
# ReferenceGrant only counts in the namespace being referenced *to*.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ai-gateway-dataplane
  namespace: envoy-gateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: cliproxy
  to:
    - group: ""
      kind: Service
      name: ai-gateway-dataplane
