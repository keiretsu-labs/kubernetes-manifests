---
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-disable-network-library-watch
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/cloudnative-pg/postgresql:16
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              psql -v ON_ERROR_STOP=1 -c \
                "UPDATE system_metadata SET value = jsonb_set(value, '{library,watch,enabled}', 'false'::jsonb, true) WHERE key = 'system-config';"
              test "$(psql -Atc "SELECT value #>> '{library,watch,enabled}' FROM system_metadata WHERE key = 'system-config';")" = "false"
          env:
            - name: PGHOST
              value: immich-postgres-rw
            - name: PGDATABASE
              value: immich
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-app
                  key: password
