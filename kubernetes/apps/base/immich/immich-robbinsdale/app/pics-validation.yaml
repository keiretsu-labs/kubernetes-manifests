---
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-pics-v2-validation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: validate
          image: alpine:3.23.3
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              count="$(find /pics -mindepth 1 -maxdepth 1 | wc -l)"
              hash="$(find /pics -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
              test "$count" = "300"
              test "$hash" = "71a18d8286762735b8844bd02373b8d443f4cfbe27ca788753c478ef276283aa"
              echo "validated count=$count hash=$hash"
          volumeMounts:
            - name: pics
              mountPath: /pics
              readOnly: true
      volumes:
        - name: pics
          persistentVolumeClaim:
            claimName: immich-pics-v2
