---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tsflow
  namespace: tailscale-examples
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
  hostnames:
    - tsflow.killinit.cc
    - tsflow.lukehouge.com
    - tsflow.rajsingh.info
  rules:
    - backendRefs:
        - group: multicluster.x-k8s.io
          kind: ServiceImport
          name: tsflow
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
