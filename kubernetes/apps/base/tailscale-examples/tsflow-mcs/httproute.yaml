---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tsflow
  namespace: tailscale-examples
  annotations:
    item.homer.rajsingh.info/name: "TSFlow"
    item.homer.rajsingh.info/subtitle: "Tailscale Flow Logs"
    item.homer.rajsingh.info/logo: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/tailscale.svg"
    item.homer.rajsingh.info/keywords: "tailscale, network, logs"
    service.homer.rajsingh.info/name: "Utilities"
    service.homer.rajsingh.info/icon: "fas fa-tools"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
  hostnames:
    - tsflow.killinit.cc
    - tsflow.lukehouge.com
    - tsflow.rajsingh.info
  rules:
    - backendRefs:
        - group: multicluster.x-k8s.io
          kind: ServiceImport
          name: tsflow
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Public-only route: same hostnames on the public gateway. The poller
# refresh trigger is answered locally with 403; everything else proxies.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tsflow-public
  namespace: tailscale-examples
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
  hostnames:
    - tsflow.killinit.cc
    - tsflow.lukehouge.com
    - tsflow.rajsingh.info
  rules:
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /api/poller/trigger
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: tsflow-forbidden
    - backendRefs:
        - group: multicluster.x-k8s.io
          kind: ServiceImport
          name: tsflow
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: tsflow-forbidden
  namespace: tailscale-examples
spec:
  directResponse:
    contentType: text/plain
    statusCode: 403
    body:
      type: Inline
      inline: "Forbidden\n"
