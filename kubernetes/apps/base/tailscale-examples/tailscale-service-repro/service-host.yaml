---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-service-repro
data:
  serve.json: |
    {
      "Services": {
        "svc:test": {
          "TCP": {
            "8080": {
              "TCPForward": "127.0.0.1:8080"
            }
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-service-repro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-service-repro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-service-repro
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: backend
          image: python:3.14-alpine
          command:
            - /bin/sh
            - -c
          args:
            - |
              printf '%s\n' "$POD_NAME" > /tmp/index.html
              exec python3 -m http.server 8080 --bind 127.0.0.1 --directory /tmp
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.98.9
          env:
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "true"
            - name: TS_STATE_DIR
              value: /tmp/tailscale
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-oauth
                  key: TS_AUTHKEY_EPHEMERAL
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:k8s,tag:ottawa
            - name: TS_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
            - name: TS_EXPERIMENTAL_SERVICE_AUTO_ADVERTISEMENT
              value: "true"
          volumeMounts:
            - name: serve-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: serve-config
          configMap:
            name: tailscale-service-repro
