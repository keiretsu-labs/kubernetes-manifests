---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${LOCATION}-sidecar-userspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${LOCATION}-sidecar-userspace
  template:
    metadata:
      labels:
        app: ${LOCATION}-sidecar-userspace
    spec:
      serviceAccountName: "tailscale"
      containers:
      - name: netshoot
        image: nicolaka/netshoot:v0.16 # renovate: container
        # digest sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
        command: ["python3", "-m", "http.server", "8080", "--bind", "127.0.0.1"]
      - name: tailscale
        imagePullPolicy: Always
        image: "ghcr.io/tailscale/tailscale:v1.102.5"
        env:
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_USERSPACE
          value: "true"
        - name: TS_SOCKS5_SERVER
          value: ":1055"
        - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
          value: ":1055"
        - name: TS_DEBUG_FIREWALL_MODE
          value: auto
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: ts-oauth
              key: TS_AUTHKEY_EPHEMERAL
              optional: true
        - name: TS_ACCEPT_DNS
          value: "true"
        - name: TS_EXTRA_ARGS
          value: "--advertise-tags=tag:k8s,tag:${LOCATION} --accept-routes --ssh"
        - name: POD_NAME
          value: "${LOCATION}-sidecar-userspace"
        - name: TS_HOSTNAME
          value: "${LOCATION}-sidecar-userspace"
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid