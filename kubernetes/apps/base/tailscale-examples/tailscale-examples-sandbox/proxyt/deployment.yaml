---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxyt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxyt
  template:
    metadata:
      labels:
        app: proxyt
    spec:
      containers:
      - name: proxyt
        # renovate: datasource=docker depName=ghcr.io/jaxxstorm/proxyt
        image: ghcr.io/jaxxstorm/proxyt:v0.1.2
        # digest sha256:c92a39918672f8e9fed36ea87e228f2f4c0228789d1264546dfccf1735ba9d73
        ports:
        - containerPort: 80
        command: ["proxyt"]
        args:
        - "serve"
        - "--domain"
        - "proxyt.${CLUSTER_DOMAIN}"
        - "--http-only"
        - "--debug"
        - "--port"
        - "80"
        - "--bind"
        - "0.0.0.0"