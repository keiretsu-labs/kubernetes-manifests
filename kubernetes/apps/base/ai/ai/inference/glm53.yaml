#
# GLM-5.3-Flash EXL3 on 2× DGX Spark — vLLM TP=2.
#
# The model recipe and serving image are published by MiaAI-Lab:
# https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
# The image contains the SM121 sparse-MLA and EXL3 runtime; this repository
# deliberately consumes that image instead of building a serving image.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glm53-download-script
  namespace: ai
data:
  download.py: |
    from pathlib import Path
    import os
    import shutil

    from huggingface_hub import snapshot_download


    MODELS = (
        {
            "repo": "Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw",
            "revision": "25a44fdbf16862a46b7cc9921142c6c81350af2f",
            "path": Path("/models/glm53"),
            "shards": 120,
        },
        {
            "repo": "incoai/GLM-5.3-Flash-DFlash2",
            "revision": "dc77ff1c99eeb2df044ee3d4f0094eb033fee410",
            "path": Path("/models/dflash2"),
            "shards": 1,
        },
    )

    token = os.environ.get("HUGGING_FACE_HUB_TOKEN") or None


    def clear_directory(path):
        if not path.exists():
            return
        for child in path.iterdir():
            if child.is_dir():
                shutil.rmtree(child)
            else:
                child.unlink()


    def is_complete(model, marker):
        path = model["path"]
        try:
            current = marker.read_text(encoding="utf-8").strip()
        except FileNotFoundError:
            return False
        return (
            current == model["repo"] + "@" + model["revision"]
            and (path / "config.json").is_file()
            and len(tuple(path.glob("*.safetensors"))) >= model["shards"]
        )


    for model in MODELS:
        path = model["path"]
        marker = path / ".model-revision"
        expected = model["repo"] + "@" + model["revision"]
        path.mkdir(parents=True, exist_ok=True)
        if is_complete(model, marker):
            print("[download] already complete: " + expected, flush=True)
            continue

        try:
            current = marker.read_text(encoding="utf-8").strip()
        except FileNotFoundError:
            current = ""
        if current and current != expected:
            print("[download] clearing old revision: " + current, flush=True)
            clear_directory(path)
            path.mkdir(parents=True, exist_ok=True)

        print("[download] fetching " + expected, flush=True)
        snapshot_download(
            repo_id=model["repo"],
            revision=model["revision"],
            local_dir=str(path),
            token=token,
            max_workers=8,
        )
        shards = len(tuple(path.glob("*.safetensors")))
        if not (path / "config.json").is_file() or shards < model["shards"]:
            raise RuntimeError(
                "incomplete download for "
                + expected
                + ": "
                + str(shards)
                + " safetensor files"
            )
        marker.write_text(expected + "\n", encoding="utf-8")
        print("[download] validated " + expected, flush=True)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glm53-head-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glm53-worker-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: glm53
  namespace: ai
  labels:
    app: glm53
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    # The two independent 200Gi caches can take many minutes to initialize.
    # Keep a pending member alive while the other rank retries rendezvous;
    # once the group has started, restore whole-group restart semantics.
    restartPolicy: RecreateGroupAfterStart
    leaderTemplate:
      metadata:
        annotations:
          keiretsu.top/restarted-for: glm53-exl3-image-9bb1557a
        labels:
          app: glm53
          role: head
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: spark-0
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks@sha256:9bb1557a4234fce63d59599e44d10747eabd742beb337eebf9e7070be8a0fd58
          command: [python3, /scripts/download.py]
          env:
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
          - { name: HF_HOME, value: "/models/huggingface" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks@sha256:9bb1557a4234fce63d59599e44d10747eabd742beb337eebf9e7070be8a0fd58
          command: [/bin/sh, -ec]
          args:
          - |
            # The published image ships this GB10 overlay, but does not run
            # it in its entrypoint. Apply it in the serving container so the
            # persistent_topk path is disabled before vLLM imports the model.
            python3 /opt/glm53/patch_glm_video_placeholders.py
            exec vllm serve "$${@}"
          - glm53-exl3
          - /models/glm53
          - --served-model-name
          - GLM-5.3-Flash-EXL3
          - --host
          - 0.0.0.0
          - --port
          - "8000"
          - --tensor-parallel-size
          - "2"
          - --nnodes
          - "2"
          - --node-rank
          - "0"
          - --master-addr
          - 192.168.74.1
          - --master-port
          - "29521"
          - --distributed-executor-backend
          - mp
          - --quantization
          - exl3
          - --kv-cache-dtype
          - fp8
          - --max-model-len
          - "1000000"
          # The published recipe uses 0.87, but Spark's Kubernetes CUDA
          # runtime reserves about 28Gi on each 128Gi UMA device. 0.75 is
          # the qualified budget that clears vLLM's startup preflight.
          - --gpu-memory-utilization
          - "0.75"
          - --max-num-seqs
          - "4"
          - --max-num-batched-tokens
          - "2048"
          - --enable-prefix-caching
          - --no-enable-flashinfer-autotune
          - --cudagraph-capture-sizes
          - "1"
          - "2"
          - "4"
          - "8"
          - "16"
          - "24"
          - "32"
          - --speculative-config
          - '{"method":"dflash","model":"/models/dflash2","num_speculative_tokens":7,"kv_cache_dtype":"auto","draft_sample_method":"probabilistic","rejection_sample_method":"standard","draft_tensor_parallel_size":1}'
          - --chat-template
          - /opt/glm53/chat_template.jinja
          - --tool-call-parser
          - glm47
          - --enable-auto-tool-choice
          - --reasoning-parser
          - glm45
          - --limit-mm-per-prompt
          - '{"image":4,"video":1}'
          - --skip-mm-profiling
          ports:
          - { containerPort: 8000, name: http, protocol: TCP }
          env:
          - { name: VLLM_HOST_IP, value: "192.168.74.1" }
          - { name: MASTER_ADDR, value: "192.168.74.1" }
          - { name: MASTER_PORT, value: "29521" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_NET_PLUGIN, value: "none" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_IB_MERGE_NICS, value: "0" }
          - { name: NCCL_CROSS_NIC, value: "0" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1" }
          - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          - { name: VLLM_ENGINE_READY_TIMEOUT_S, value: "3600" }
          - { name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS, value: "1800" }
          - { name: VLLM_NO_USAGE_STATS, value: "1" }
          - { name: DO_NOT_TRACK, value: "1" }
          - { name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS, value: "1" }
          - { name: GLM53_SUPPRESS_STOPS_IN_REASONING, value: "1" }
          - { name: GLM53_MIXED_PREFILL_CHUNK, value: "skip" }
          - { name: EXL3_FUSED_MOE, value: "1" }
          - { name: EXL3_MOE_ROW_TILE, value: "0" }
          - { name: EXL3_TEMP_ROWS_FUSED, value: "128" }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: TRANSFORMERS_OFFLINE, value: "1" }
          - { name: VLLM_CACHE_ROOT, value: "/models/vllm-cache" }
          - { name: TRITON_CACHE_DIR, value: "/models/triton-cache" }
          - { name: TILELANG_CACHE_DIR, value: "/models/tilelang-cache" }
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          resources:
            requests: { memory: "94Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "96Gi", cpu: "12000m", nvidia.com/gpu: "1" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: Directory }
        - name: models
          persistentVolumeClaim: { claimName: glm53-head-models }
        - name: download-script
          configMap:
            name: glm53-download-script
    workerTemplate:
      metadata:
        annotations:
          keiretsu.top/restarted-for: glm53-exl3-image-9bb1557a
        labels:
          app: glm53
          role: worker
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: spark-1
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks@sha256:9bb1557a4234fce63d59599e44d10747eabd742beb337eebf9e7070be8a0fd58
          command: [python3, /scripts/download.py]
          env:
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
          - { name: HF_HOME, value: "/models/huggingface" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks@sha256:9bb1557a4234fce63d59599e44d10747eabd742beb337eebf9e7070be8a0fd58
          command: [/bin/sh, -ec]
          args:
          - |
            # Keep the published image's GB10 persistent_topk fix active on
            # the headless rank as well as the API rank.
            python3 /opt/glm53/patch_glm_video_placeholders.py
            exec vllm serve "$${@}"
          - glm53-exl3
          - /models/glm53
          - --served-model-name
          - GLM-5.3-Flash-EXL3
          - --host
          - 0.0.0.0
          - --port
          - "8000"
          - --tensor-parallel-size
          - "2"
          - --nnodes
          - "2"
          - --node-rank
          - "1"
          - --master-addr
          - 192.168.74.1
          - --master-port
          - "29521"
          - --distributed-executor-backend
          - mp
          - --headless
          - --quantization
          - exl3
          - --kv-cache-dtype
          - fp8
          - --max-model-len
          - "1000000"
          - --gpu-memory-utilization
          - "0.75"
          - --max-num-seqs
          - "4"
          - --max-num-batched-tokens
          - "2048"
          - --enable-prefix-caching
          - --no-enable-flashinfer-autotune
          - --cudagraph-capture-sizes
          - "1"
          - "2"
          - "4"
          - "8"
          - "16"
          - "24"
          - "32"
          - --speculative-config
          - '{"method":"dflash","model":"/models/dflash2","num_speculative_tokens":7,"kv_cache_dtype":"auto","draft_sample_method":"probabilistic","rejection_sample_method":"standard","draft_tensor_parallel_size":1}'
          - --chat-template
          - /opt/glm53/chat_template.jinja
          - --tool-call-parser
          - glm47
          - --enable-auto-tool-choice
          - --reasoning-parser
          - glm45
          - --limit-mm-per-prompt
          - '{"image":4,"video":1}'
          - --skip-mm-profiling
          env:
          - { name: VLLM_HOST_IP, value: "192.168.74.2" }
          - { name: MASTER_ADDR, value: "192.168.74.1" }
          - { name: MASTER_PORT, value: "29521" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_NET_PLUGIN, value: "none" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_IB_MERGE_NICS, value: "0" }
          - { name: NCCL_CROSS_NIC, value: "0" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
