---
apiVersion: v1
kind: Service
metadata:
  name: glm53
  namespace: ai
  labels:
    app: glm53
spec:
  selector:
    app: glm53
    role: head
  ports:
  - { name: http, port: 8000, protocol: TCP, targetPort: http }
---
# Stable in-cluster compatibility name used by existing AI clients.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ai
  labels:
    app: vllm
spec:
  ports:
  - { name: http, port: 8000, protocol: TCP, targetPort: http }
  selector:
    app: glm53
    role: head
---
# Stable tailnet name used by CLIProxy and Hermes.
apiVersion: v1
kind: Service
metadata:
  name: vllm-ts
  namespace: ai
  annotations:
    tailscale.com/hostname: "${LOCATION}-vllm"
    tailscale.com/proxy-group: common-ingress
    tailscale.com/tags: "tag:k8s,tag:${LOCATION}"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
  - { name: http, port: 80, protocol: TCP, targetPort: 8000 }
  selector:
    app: glm53
    role: head
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: glm53
  namespace: ai
  labels:
    app: glm53
    release: kube-prometheus-stack
spec:
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    metricRelabelings:
    - action: replace
      replacement: talos-stpetersburg
      targetLabel: cluster
  selector:
    matchLabels:
      app: glm53
  namespaceSelector:
    matchNames:
    - ai
