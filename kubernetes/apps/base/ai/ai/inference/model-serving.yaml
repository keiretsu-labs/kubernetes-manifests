# GLM-5.3-Flash EXL3 (Mia quant) on 2x DGX Spark — TensorFold recipe v1.7 profile.
#
# The workload and service identity is generic so future model swaps do not
# bake a retired model name into the in-cluster Service, mesh export, or probes.
# Upstream recipe: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks-TensorFold
# Model (ABLIT=0): Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold@078455ffe6472f9a52fbc1139f58b9db2881b25c
# Model (ABLIT=1): Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold-Ablit@57edefd2f5d9b371c8345883304d5af68b52fa24 (gated; needs HF_TOKEN + terms)
# Runtime image digest: sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
# Drafter: MTP (--drafter none). DFlash2 is CC BY-NC-ND; REQUIRE_DFLASH=0.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-serving-download-script
  namespace: ai
data:
  download-and-validate.sh: |
    #!/bin/bash
    set -euo pipefail
    # ABLIT=0 (default): Mia published EXL3 quant. ABLIT=1: gated Ablit (HF_TOKEN + terms).
    ABLIT="$${ABLIT:-0}"
    MODEL_DIR="$${MODEL_DIR:-/models/qwen38}"
    if [ "$${ABLIT}" = "1" ]; then
      MODEL_REPO="$${MODEL_REPO:-Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold-Ablit}"
      MODEL_REVISION="$${MODEL_REVISION:-57edefd2f5d9b371c8345883304d5af68b52fa24}"
      if [ -z "$${HUGGING_FACE_HUB_TOKEN:-}$${HF_TOKEN:-}" ]; then
        echo "[download] ABLIT=1 requires HF_TOKEN (Secret hf-secret) and accepted Ablit terms" >&2
        exit 1
      fi
    else
      MODEL_REPO="$${MODEL_REPO:-Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold}"
      MODEL_REVISION="$${MODEL_REVISION:-078455ffe6472f9a52fbc1139f58b9db2881b25c}"
    fi
    # DFlash2 is CC BY-NC-ND; keep REQUIRE_DFLASH=0 unless licensing is cleared.
    REQUIRE_DFLASH="$${REQUIRE_DFLASH:-0}"
    DFLASH_REPO="$${DFLASH_REPO:-incoai/GLM-5.3-Flash-DFlash2}"
    DFLASH_REVISION="$${DFLASH_REVISION:-bf582e4eacc1810f76656d1811693ff6c6737d2a}"
    MODEL_MARKER="$${MODEL_DIR}/.model-revision"
    EXPECTED_MARKER="$${MODEL_REPO}@$${MODEL_REVISION}"
    DFLASH_MARKER="$${MODEL_DIR}/dflash2/.model-revision"
    EXPECTED_DFLASH_MARKER="$${DFLASH_REPO}@$${DFLASH_REVISION}"
    TOKEN="$${HUGGING_FACE_HUB_TOKEN:-}$${HF_TOKEN:-}"
    export HUGGING_FACE_HUB_TOKEN="$${TOKEN}"
    mkdir -p "$${MODEL_DIR}"
    current="$$(cat "$${MODEL_MARKER}" 2>/dev/null || true)"
    count="$$(find "$${MODEL_DIR}" -maxdepth 1 -type f -name '*.safetensors' | wc -l)"
    if [ "$${current}" != "$${EXPECTED_MARKER}" ] || [ "$${count}" -lt 100 ] || [ ! -f "$${MODEL_DIR}/config.json" ]; then
      echo "[download] fetching $${MODEL_REPO}@$${MODEL_REVISION} (was $${current:-unmarked}; resume-safe, no wipe)"
      python3 - "$${MODEL_DIR}" "$${MODEL_REPO}" "$${MODEL_REVISION}" <<'PY'
    import os, sys
    from huggingface_hub import snapshot_download
    snapshot_download(repo_id=sys.argv[2], revision=sys.argv[3], local_dir=sys.argv[1], token=os.environ.get("HUGGING_FACE_HUB_TOKEN") or None, max_workers=8)
    PY
    fi
    count="$$(find "$${MODEL_DIR}" -maxdepth 1 -type f -name '*.safetensors' | wc -l)"
    [ "$${count}" -ge 120 ]
    test -s "$${MODEL_DIR}/config.json"
    test -s "$${MODEL_DIR}/model.safetensors.index.json"
    printf '%s\n' "$${EXPECTED_MARKER}" > "$${MODEL_MARKER}"
    if [ "$${REQUIRE_DFLASH}" = "1" ]; then
      mkdir -p "$${MODEL_DIR}/dflash2"
      dcurrent="$$(cat "$${DFLASH_MARKER}" 2>/dev/null || true)"
      if [ "$${dcurrent}" != "$${EXPECTED_DFLASH_MARKER}" ] || [ ! -f "$${MODEL_DIR}/dflash2/config.json" ]; then
        echo "[download] fetching $${DFLASH_REPO}@$${DFLASH_REVISION} (REQUIRE_DFLASH=1)"
        python3 - "$${MODEL_DIR}/dflash2" "$${DFLASH_REPO}" "$${DFLASH_REVISION}" <<'PY'
    import os, sys
    from huggingface_hub import snapshot_download
    snapshot_download(repo_id=sys.argv[2], revision=sys.argv[3], local_dir=sys.argv[1], token=os.environ.get("HUGGING_FACE_HUB_TOKEN") or None, max_workers=8)
    PY
        printf '%s\n' "$${EXPECTED_DFLASH_MARKER}" > "$${DFLASH_MARKER}"
      fi
      test -s "$${MODEL_DIR}/dflash2/config.json"
      echo "[validate] GLM model files=$${count} and DFlash2 present"
    else
      echo "[validate] GLM model files=$${count}; DFlash2 skipped (REQUIRE_DFLASH=0, MTP drafter)"
    fi

  patch_glm_video_placeholders.py: |
    # Align GLM-5.3 video prompt placeholders to encoder grid_t.
    # glm4_1v builds one image-block per timestamp; a 1s clip can yield 3 timestamps
    # while video_grid_thw T=1, so vLLM assigns 100 encoder tokens to 300 slots.
    #
    # Glm5NextVideoProcessor has no max_duration. TRANSFORMERS_WITH_GA + a Glm4v
    # processor wrapper still routed 5.3 through _get_video_second_idx_glm4v.
    from __future__ import annotations

    import sys
    from pathlib import Path


    KPOOL = Path(
        "/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/"
        "sparse_attn_indexer_kpool.py"
    )
    KPOOL_OLD = "if current_platform.is_cuda() and select_k in (512, 1024, 2048):"
    KPOOL_NEW = (
        "if False and current_platform.is_cuda() and "
        "select_k in (512, 1024, 2048):  # GB10 persistent_topk smem"
    )


    def _align_timestamps(timestamps: list, t_groups: int) -> list:
        if t_groups < 1:
            t_groups = 1
        if not timestamps:
            return [0] * t_groups
        n = len(timestamps)
        if n == t_groups:
            return timestamps
        if t_groups == 1:
            return [timestamps[0]]
        if n < t_groups:
            return timestamps + [timestamps[-1]] * (t_groups - n)
        last = n - 1
        return [timestamps[int(round(i * last / (t_groups - 1)))] for i in range(t_groups)]


    def _use_glm4v_timestamps(hf_processor) -> bool:
        """True only for classic Glm4v video processors that expose max_duration."""
        from vllm.model_executor.models.glm4_1v import Glm4vProcessor

        name = type(hf_processor).__name__
        vp = getattr(hf_processor, "video_processor", None)
        vp_name = type(vp).__name__ if vp is not None else ""
        if "Glm5" in name or "Glm5" in vp_name:
            return False
        if vp is not None and not hasattr(vp, "max_duration"):
            return False
        return isinstance(hf_processor, Glm4vProcessor)


    def apply() -> None:
        from vllm.model_executor.models.glm4_1v import Glm4vProcessingInfo

        if getattr(Glm4vProcessingInfo, "_glm53_video_t_aligned", False):
            return

        def _construct_video_placeholder(self, video_array, metadata, grid_thw):
            hf_processor = self.get_hf_processor()
            tokenizer = self.get_tokenizer()
            image_processor = hf_processor.image_processor
            hf_config = self.get_hf_config()
            merge_length = image_processor.merge_size**2
            t_hw = grid_thw.reshape(-1)
            t_groups, height, width = int(t_hw[0]), int(t_hw[1]), int(t_hw[2])
            n_per = int(height * width) // merge_length

            if _use_glm4v_timestamps(hf_processor):
                timestamps = self._get_video_second_idx_glm4v(metadata, len(video_array))
                ts_fmt = "{}"
            elif self._is_glmga_model(hf_processor):
                timestamps = self._get_video_second_idx_glmga(metadata, len(video_array))
                ts_fmt = "{:.1f} seconds"
            else:
                # Glm5NextProcessor / Glm5NextVideoProcessor: glm46v timestamps.
                timestamps = self._get_video_second_idx_glm46v(metadata, len(video_array))
                ts_fmt = "{:.1f} seconds"

            timestamps = _align_timestamps(list(timestamps), t_groups)
            embed_id = self._get_video_frame_embed_token_id(hf_processor)
            placeholder = [hf_config.video_start_token_id]
            for ts in timestamps:
                placeholder.append(hf_config.image_start_token_id)
                placeholder.extend([embed_id] * n_per)
                placeholder.append(hf_config.image_end_token_id)
                placeholder.extend(
                    tokenizer.encode(ts_fmt.format(ts), add_special_tokens=False)
                )
            placeholder.append(hf_config.video_end_token_id)
            return placeholder

        Glm4vProcessingInfo._construct_video_placeholder = _construct_video_placeholder
        Glm4vProcessingInfo._glm53_video_t_aligned = True
        print(
            "glm53: video placeholders aligned to encoder grid_t (Glm5Next→glm46v)",
            file=sys.stderr,
        )


    def _install_import_hook() -> None:
        import builtins
        import importlib

        if getattr(builtins, "_glm53_video_hook", False):
            return
        builtins._glm53_video_hook = True
        real_import = builtins.__import__
        applying = False

        def _maybe_apply(name: str) -> None:
            nonlocal applying
            if applying or "glm4_1v" not in name:
                return
            applying = True
            try:
                apply()
            except Exception as exc:
                print(f"glm53: video apply() failed: {exc!r}", file=sys.stderr)
            finally:
                applying = False

        def _import(name, globals=None, locals=None, fromlist=(), level=0):
            mod = real_import(name, globals, locals, fromlist, level)
            _maybe_apply(name)
            return mod

        builtins.__import__ = _import
        real_im = importlib.import_module

        def _im(name, package=None):
            mod = real_im(name, package)
            _maybe_apply(name)
            return mod

        importlib.import_module = _im


    def _disable_gb10_persistent_topk() -> None:
        """Decode-path persistent_topk oversubscribes GB10 smem on long seqs."""
        if not KPOOL.is_file():
            raise FileNotFoundError(f"glm53: missing {KPOOL}")
        text = KPOOL.read_text()
        if KPOOL_NEW in text:
            print("glm53: persistent_topk already disabled in kpool", file=sys.stderr)
        elif KPOOL_OLD in text:
            KPOOL.write_text(text.replace(KPOOL_OLD, KPOOL_NEW, 1))
            print(
                "glm53: disabled GB10 persistent_topk (use top_k_per_row_decode)",
                file=sys.stderr,
            )
        else:
            raise RuntimeError(
                "glm53: kpool persistent_topk pattern not found — patch the file by hand"
            )
        cache = KPOOL.parent / "__pycache__"
        if cache.is_dir():
            for pyc in cache.glob("sparse_attn_indexer_kpool*.pyc"):
                pyc.unlink(missing_ok=True)


    _install_import_hook()
    try:
        apply()
    except Exception:
        pass


    if __name__ == "__main__":
        import shutil

        src = Path(__file__).resolve()
        dst = Path("/usr/local/lib/python3.12/dist-packages/glm53_video_patch.py")
        shutil.copy(src, dst)
        Path("/usr/local/lib/python3.12/dist-packages/glm53_video.pth").write_text(
            "import glm53_video_patch\n"
        )
        _disable_gb10_persistent_topk()
        print("glm53: overlay install ok aligned=True", file=sys.stderr)

  preflight-memory.sh: |
    #!/bin/bash
    # Refuse to start when unified host/GPU memory cannot satisfy the conservative
    # serving profile plus safety headroom. Other workloads share both Sparks.
    set -euo pipefail
    total_kib="$$(awk '$$1 == "MemTotal:" { print $$2; exit }' /proc/meminfo)"
    available_kib="$$(awk '$$1 == "MemAvailable:" { print $$2; exit }' /proc/meminfo)"
    : "$${total_kib:?missing MemTotal}"
    : "$${available_kib:?missing MemAvailable}"
    util="$${GPU_MEM_UTIL:-0.70}"
    headroom_kib="$${GLM53_PREFLIGHT_MEMORY_HEADROOM_KIB:-8388608}"
    required_kib="$$(awk -v total="$${total_kib}" -v util="$${util}" -v headroom="$${headroom_kib}" 'BEGIN { printf "%.0f", total * util + headroom }')"
    if [ "$${available_kib}" -lt "$${required_kib}" ]; then
      echo "PREFLIGHT FAIL: MemAvailable=$${available_kib} KiB; required=$${required_kib} KiB (GPU_MEM_UTIL=$${util}, headroom=$${headroom_kib} KiB)" >&2
      exit 78
    fi
    echo "PREFLIGHT OK: MemAvailable=$${available_kib} KiB; required=$${required_kib} KiB (GPU_MEM_UTIL=$${util}, headroom=$${headroom_kib} KiB)"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-head-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-worker-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm
  namespace: ai
  labels:
    app: model-serving
spec:
  replicas: 1
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
      partition: 0
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    # Keep the existing per-rank model PVCs intact during the in-place runtime swap.
    restartPolicy: None
    leaderTemplate:
      metadata:
        labels:
          app: model-serving
          role: head
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        priorityClassName: ai-inference
        nodeSelector:
          kubernetes.io/hostname: spark-0
        initContainers:
        - name: download-model
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [/bin/bash]
          args: [/scripts/download-and-validate.sh]
          env:
          - { name: ABLIT, value: "0" }
          - { name: REQUIRE_DFLASH, value: "0" }
          - { name: MODEL_DIR, value: "/models/qwen38" }
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
                optional: true
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "2Gi", cpu: "500m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        - name: validate-model
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [/bin/bash, -ec]
          args:
          - |
            ABLIT="$${ABLIT:-0}"
            if [ "$${ABLIT}" = "1" ]; then
              EXPECTED="Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold-Ablit@57edefd2f5d9b371c8345883304d5af68b52fa24"
            else
              EXPECTED="Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold@078455ffe6472f9a52fbc1139f58b9db2881b25c"
            fi
            test "$$(cat /models/qwen38/.model-revision)" = "$${EXPECTED}"
            test "$$(find /models/qwen38 -maxdepth 1 -type f -name '*.safetensors' | wc -l)" -ge 120
            test -s /models/qwen38/config.json
            test -s /models/qwen38/model.safetensors.index.json
            HF_HUB_OFFLINE=1 tensorfold info /models/qwen38
          env:
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: ABLIT, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          resources:
            requests: { memory: "2Gi", cpu: "500m" }
            limits: { memory: "4Gi", cpu: "2000m" }
        - name: preflight-memory
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [/bin/bash]
          args: [/scripts/preflight-memory.sh]
          env:
          - { name: GPU_MEM_UTIL, value: "0.70" }
          - { name: GLM53_PREFLIGHT_MEMORY_HEADROOM_KIB, value: "8388608" }
          volumeMounts:
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        containers:
        - name: tensorfold
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [bash, -c]
          ports:
          - { name: http, containerPort: 8888, protocol: TCP }
          args:
          - |
            set -euo pipefail
            # ABLIT=1 defaults thinking off (recipe v1.7); THINKING=1 forces it on.
            THINKING_FLAG=--thinking
            if [ "$${ABLIT:-0}" = "1" ] && [ "$${THINKING:-0}" != "1" ]; then
              THINKING_FLAG=--no-thinking
            elif [ "$${THINKING:-1}" = "0" ]; then
              THINKING_FLAG=--no-thinking
            fi
            exec tensorfold serve /models/qwen38 \
              --tp 2 --rank 0 --master 192.168.74.1 --master-port 29551 \
              --name GLM-5.3-Flash-EXL3 --host 0.0.0.0 --port 8888 \
              --drafter none --context 1048576 --parallel 1 $${THINKING_FLAG}
          env:
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: TENSORFOLD_NO_UPDATE_CHECK, value: "1" }
          - { name: TENSORFOLD_MEMORY_RESERVE_GIB, value: "6.0" }
          - { name: TF_GLM_CACHE_GIB, value: "1" }
          - { name: TF_GLM_KV, value: "fp8" }
          # Prefill speed-ups from the upstream recipe (scripts/config.sh SPLIT=1, KDA_CHUNKED=1). Both ranks must match.
          - { name: TF_GLM_HC_SPLIT, value: "1" }
          - { name: TF_GLM_PREFILL_OVERLAP, value: "2" }
          - { name: TF_GLM_KDA_CHUNKED, value: "1" }
          - { name: TF_GLM_DENSE, value: "q4" }
          - { name: TF_GLM_COMM, value: "roce" }
          - { name: TF_ROCE_MAX_KB, value: "512" }
          - { name: TF_ROCE_WAIT_S, value: "300" }
          - { name: TF_GLM_SHARED_PREFIX, value: "1" }
          - { name: TF_GLM_CACHE_ENTRIES, value: "32" }
          - { name: TF_GLM_ASSISTANT_ENDS, value: "1" }
          - { name: TF_GLM_L2PF, value: "1" }
          - { name: TF_GLM_EXL3_LOADS, value: "nc" }
          - { name: TF_GLM_CLEAR_THINKING, value: "0" }
          - { name: TF_GLM_STREAM_SMOOTH, value: "1" }
          - { name: TF_GLM_STREAM_SMOOTH_MS, value: "400" }
          - { name: TF_GLM_FILL_BUDGET_MS, value: "200" }
          - { name: TF_GLM_FILL_DRAFTS, value: "1" }
          - { name: TF_GLM_MULTI_PREFILL, value: "1" }
          - { name: ABLIT, value: "0" }
          - { name: THINKING, value: "1" }
          - { name: REQUIRE_DFLASH, value: "0" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: TP_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_MIN_NCHANNELS, value: "4" }
          - { name: NCCL_MAX_NCHANNELS, value: "4" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: LANGUAGE_MODEL_ONLY, value: "1" }
          - { name: TRANSFORMERS_OFFLINE, value: "1" }
          - { name: GLM53_INDEXER_WORKSPACE, value: "rightsize" }
          - { name: EXL3_FAT_GROUPED, value: "1" }
          - { name: EXL3_TEMP_ROWS_FUSED, value: "32" }
          - { name: GLM53_EXL3_MOE_FAST, value: "1" }
          - { name: GLM53_KDA_BF16_LARGE_M, value: "0" }
          - { name: GLM53_DENSE_FP8, value: "dense,kda" }
          - { name: GLM53_SPINWAIT_MS, value: "16" }
          - { name: GLM53_ADAPTIVE_K, value: "off" }
          - { name: GLM53_MIXED_PREFILL_CHUNK, value: "fair" }
          - { name: GLM53_FAIR_PREFILL_CHUNK, value: "256" }
          - { name: GLM53_FAIR_PREFILL_SHARE, value: "0.30" }
          - { name: GLM53_FAIR_PREFILL_MAX_INTERVAL_MS, value: "2000" }
          - { name: GLM53_FAIR_PREFILL_MAX_STEP_MS, value: "2000" }
          - { name: GLM53_FAIR_PREFILL_MAX_CHUNKS, value: "1" }
          - { name: GLM53_KV_CAPACITY_LOG, value: "1" }
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          resources:
            requests: { memory: "96Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "112Gi", cpu: "12000m", nvidia.com/gpu: "1" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          startupProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            periodSeconds: 15
            timeoutSeconds: 10
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: Directory }
        - name: models
          persistentVolumeClaim: { claimName: qwen38-head-models }
        - name: download-script
          configMap:
            name: model-serving-download-script
    workerTemplate:
      metadata:
        labels:
          app: model-serving
          role: worker
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        priorityClassName: ai-inference
        nodeSelector:
          kubernetes.io/hostname: spark-1
        initContainers:
        - name: download-model
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [/bin/bash]
          args: [/scripts/download-and-validate.sh]
          env:
          - { name: ABLIT, value: "0" }
          - { name: REQUIRE_DFLASH, value: "0" }
          - { name: MODEL_DIR, value: "/models/qwen38" }
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
                optional: true
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "2Gi", cpu: "500m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        - name: validate-model
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [/bin/bash, -ec]
          args:
          - |
            ABLIT="$${ABLIT:-0}"
            if [ "$${ABLIT}" = "1" ]; then
              EXPECTED="Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold-Ablit@57edefd2f5d9b371c8345883304d5af68b52fa24"
            else
              EXPECTED="Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold@078455ffe6472f9a52fbc1139f58b9db2881b25c"
            fi
            test "$$(cat /models/qwen38/.model-revision)" = "$${EXPECTED}"
            test "$$(find /models/qwen38 -maxdepth 1 -type f -name '*.safetensors' | wc -l)" -ge 120
            test -s /models/qwen38/config.json
            test -s /models/qwen38/model.safetensors.index.json
            HF_HUB_OFFLINE=1 tensorfold info /models/qwen38
          env:
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: ABLIT, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          resources:
            requests: { memory: "2Gi", cpu: "500m" }
            limits: { memory: "4Gi", cpu: "2000m" }
        - name: preflight-memory
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [/bin/bash]
          args: [/scripts/preflight-memory.sh]
          env:
          - { name: GPU_MEM_UTIL, value: "0.70" }
          - { name: GLM53_PREFLIGHT_MEMORY_HEADROOM_KIB, value: "8388608" }
          volumeMounts:
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        containers:
        - name: tensorfold
          image: ghcr.io/miaai-lab/glm-5.3-flash-exl3-2x-dgx-sparks-tensorfold@sha256:b47c19d66633f27cbe37da13fbc580363f466c08b9529feab1eecb1a4b904bf1
          command: [bash, -c]
          args:
          - |
            set -euo pipefail
            # ABLIT=1 defaults thinking off (recipe v1.7); THINKING=1 forces it on.
            THINKING_FLAG=--thinking
            if [ "$${ABLIT:-0}" = "1" ] && [ "$${THINKING:-0}" != "1" ]; then
              THINKING_FLAG=--no-thinking
            elif [ "$${THINKING:-1}" = "0" ]; then
              THINKING_FLAG=--no-thinking
            fi
            exec tensorfold serve /models/qwen38 \
              --tp 2 --rank 1 --master 192.168.74.1 --master-port 29551 \
              --drafter none --context 1048576 --parallel 1 $${THINKING_FLAG}
          env:
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: TENSORFOLD_NO_UPDATE_CHECK, value: "1" }
          - { name: TENSORFOLD_MEMORY_RESERVE_GIB, value: "6.0" }
          - { name: TF_GLM_CACHE_GIB, value: "1" }
          - { name: TF_GLM_KV, value: "fp8" }
          # Prefill speed-ups from the upstream recipe (scripts/config.sh SPLIT=1, KDA_CHUNKED=1). Both ranks must match.
          - { name: TF_GLM_HC_SPLIT, value: "1" }
          - { name: TF_GLM_PREFILL_OVERLAP, value: "2" }
          - { name: TF_GLM_KDA_CHUNKED, value: "1" }
          - { name: TF_GLM_DENSE, value: "q4" }
          - { name: TF_GLM_COMM, value: "roce" }
          - { name: TF_ROCE_MAX_KB, value: "512" }
          - { name: TF_ROCE_WAIT_S, value: "300" }
          - { name: TF_GLM_SHARED_PREFIX, value: "1" }
          - { name: TF_GLM_CACHE_ENTRIES, value: "32" }
          - { name: TF_GLM_ASSISTANT_ENDS, value: "1" }
          - { name: TF_GLM_L2PF, value: "1" }
          - { name: TF_GLM_EXL3_LOADS, value: "nc" }
          - { name: TF_GLM_CLEAR_THINKING, value: "0" }
          - { name: TF_GLM_STREAM_SMOOTH, value: "1" }
          - { name: TF_GLM_STREAM_SMOOTH_MS, value: "400" }
          - { name: TF_GLM_FILL_BUDGET_MS, value: "200" }
          - { name: TF_GLM_FILL_DRAFTS, value: "1" }
          - { name: TF_GLM_MULTI_PREFILL, value: "1" }
          - { name: ABLIT, value: "0" }
          - { name: THINKING, value: "1" }
          - { name: REQUIRE_DFLASH, value: "0" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: TP_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_MIN_NCHANNELS, value: "4" }
          - { name: NCCL_MAX_NCHANNELS, value: "4" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          resources:
            requests: { memory: "96Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "112Gi", cpu: "12000m", nvidia.com/gpu: "1" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          # Worker rank is headless and has no HTTP probes.
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: Directory }
        - name: models
          persistentVolumeClaim: { claimName: qwen38-worker-models }
        - name: download-script
          configMap:
            name: model-serving-download-script
---
apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ai
  labels:
    app: model-serving
spec:
  selector:
    app: model-serving
    role: head
  ports:
  - { name: http, port: 8888, protocol: TCP, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: model-serving
  namespace: ai
  labels:
    app: model-serving
    release: kube-prometheus-stack
spec:
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    metricRelabelings:
    - action: replace
      replacement: talos-stpetersburg
      targetLabel: cluster
    - action: replace
      replacement: GLM-5.3-Flash-EXL3
      targetLabel: model_name
  selector:
    matchLabels:
      app: model-serving
  namespaceSelector:
    matchNames:
    - ai
