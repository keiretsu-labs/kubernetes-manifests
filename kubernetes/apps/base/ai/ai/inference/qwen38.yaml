# GLM-5.3-Flash EXL3/TR3 on 2× DGX Spark — MiaAI-Lab TP=2 + DFlash2.
#
# The qwen38 resource/service identity is retained so the existing in-cluster
# Service, mesh export, probes, and consumers cut over atomically.
# Upstream recipe: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
# Model: Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw@25a44fdbf16862a46b7cc9921142c6c81350af2f
# Image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3-instanttensor
# Image digest: sha256:447114ee77d14c9b4732ee23978ada2a0ee9027868a231d6fd42700a8b25be1d
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-download-script
  namespace: ai
data:
  download-and-validate.sh: |
    #!/bin/bash
    set -euo pipefail
    MODEL_DIR="$${MODEL_DIR:-/models/qwen38}"
    MODEL_REPO="$${MODEL_REPO:-Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw}"
    MODEL_REVISION="$${MODEL_REVISION:-25a44fdbf16862a46b7cc9921142c6c81350af2f}"
    DFLASH_REPO="$${DFLASH_REPO:-incoai/GLM-5.3-Flash-DFlash2}"
    DFLASH_REVISION="$${DFLASH_REVISION:-dc77ff1c99eeb2df044ee3d4f0094eb033fee410}"
    MODEL_MARKER="$${MODEL_DIR}/.model-revision"
    EXPECTED_MARKER="$${MODEL_REPO}@$${MODEL_REVISION}"
    DFLASH_MARKER="$${MODEL_DIR}/dflash2/.model-revision"
    EXPECTED_DFLASH_MARKER="$${DFLASH_REPO}@$${DFLASH_REVISION}"
    mkdir -p "$${MODEL_DIR}"
    current="$$(cat "$${MODEL_MARKER}" 2>/dev/null || true)"
    if [ "$${current}" != "$${EXPECTED_MARKER}" ]; then
      echo "[download] replacing previous model $${current:-unmarked} with $${EXPECTED_MARKER}"
      find "$${MODEL_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      mkdir -p "$${MODEL_DIR}"
    fi
    count="$$(find "$${MODEL_DIR}" -maxdepth 1 -type f -name '*.safetensors' | wc -l)"
    if [ "$${count}" -lt 100 ] || [ ! -f "$${MODEL_DIR}/config.json" ]; then
      echo "[download] fetching $${MODEL_REPO}@$${MODEL_REVISION}"
      python3 - "$${MODEL_DIR}" "$${MODEL_REPO}" "$${MODEL_REVISION}" <<'PY'
    import os, sys
    from huggingface_hub import snapshot_download
    snapshot_download(repo_id=sys.argv[2], revision=sys.argv[3], local_dir=sys.argv[1], token=os.environ.get("HUGGING_FACE_HUB_TOKEN") or None, max_workers=8)
    PY
    fi
    count="$$(find "$${MODEL_DIR}" -maxdepth 1 -type f -name '*.safetensors' | wc -l)"
    [ "$${count}" -ge 100 ]
    test -f "$${MODEL_DIR}/config.json"
    printf '%s\n' "$${EXPECTED_MARKER}" > "$${MODEL_MARKER}"
    mkdir -p "$${MODEL_DIR}/dflash2"
    dcurrent="$$(cat "$${DFLASH_MARKER}" 2>/dev/null || true)"
    if [ "$${dcurrent}" != "$${EXPECTED_DFLASH_MARKER}" ]; then
      echo "[download] fetching $${DFLASH_REPO}@$${DFLASH_REVISION}"
      python3 - "$${MODEL_DIR}/dflash2" "$${DFLASH_REPO}" "$${DFLASH_REVISION}" <<'PY'
    import os, sys
    from huggingface_hub import snapshot_download
    snapshot_download(repo_id=sys.argv[2], revision=sys.argv[3], local_dir=sys.argv[1], token=os.environ.get("HUGGING_FACE_HUB_TOKEN") or None, max_workers=8)
    PY
      printf '%s\n' "$${EXPECTED_DFLASH_MARKER}" > "$${DFLASH_MARKER}"
    fi
    test -f "$${MODEL_DIR}/dflash2/config.json"
    echo "[validate] GLM model files=$${count} and DFlash2 present"

  patch_glm_video_placeholders.py: |
    # Align GLM-5.3 video prompt placeholders to encoder grid_t.
    # glm4_1v builds one image-block per timestamp; a 1s clip can yield 3 timestamps
    # while video_grid_thw T=1, so vLLM assigns 100 encoder tokens to 300 slots.
    #
    # Glm5NextVideoProcessor has no max_duration. TRANSFORMERS_WITH_GA + a Glm4v
    # processor wrapper still routed 5.3 through _get_video_second_idx_glm4v.
    from __future__ import annotations

    import sys
    from pathlib import Path


    KPOOL = Path(
        "/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/"
        "sparse_attn_indexer_kpool.py"
    )
    KPOOL_OLD = "if current_platform.is_cuda() and select_k in (512, 1024, 2048):"
    KPOOL_NEW = (
        "if False and current_platform.is_cuda() and "
        "select_k in (512, 1024, 2048):  # GB10 persistent_topk smem"
    )


    def _align_timestamps(timestamps: list, t_groups: int) -> list:
        if t_groups < 1:
            t_groups = 1
        if not timestamps:
            return [0] * t_groups
        n = len(timestamps)
        if n == t_groups:
            return timestamps
        if t_groups == 1:
            return [timestamps[0]]
        if n < t_groups:
            return timestamps + [timestamps[-1]] * (t_groups - n)
        last = n - 1
        return [timestamps[int(round(i * last / (t_groups - 1)))] for i in range(t_groups)]


    def _use_glm4v_timestamps(hf_processor) -> bool:
        """True only for classic Glm4v video processors that expose max_duration."""
        from vllm.model_executor.models.glm4_1v import Glm4vProcessor

        name = type(hf_processor).__name__
        vp = getattr(hf_processor, "video_processor", None)
        vp_name = type(vp).__name__ if vp is not None else ""
        if "Glm5" in name or "Glm5" in vp_name:
            return False
        if vp is not None and not hasattr(vp, "max_duration"):
            return False
        return isinstance(hf_processor, Glm4vProcessor)


    def apply() -> None:
        from vllm.model_executor.models.glm4_1v import Glm4vProcessingInfo

        if getattr(Glm4vProcessingInfo, "_glm53_video_t_aligned", False):
            return

        def _construct_video_placeholder(self, video_array, metadata, grid_thw):
            hf_processor = self.get_hf_processor()
            tokenizer = self.get_tokenizer()
            image_processor = hf_processor.image_processor
            hf_config = self.get_hf_config()
            merge_length = image_processor.merge_size**2
            t_hw = grid_thw.reshape(-1)
            t_groups, height, width = int(t_hw[0]), int(t_hw[1]), int(t_hw[2])
            n_per = int(height * width) // merge_length

            if _use_glm4v_timestamps(hf_processor):
                timestamps = self._get_video_second_idx_glm4v(metadata, len(video_array))
                ts_fmt = "{}"
            elif self._is_glmga_model(hf_processor):
                timestamps = self._get_video_second_idx_glmga(metadata, len(video_array))
                ts_fmt = "{:.1f} seconds"
            else:
                # Glm5NextProcessor / Glm5NextVideoProcessor: glm46v timestamps.
                timestamps = self._get_video_second_idx_glm46v(metadata, len(video_array))
                ts_fmt = "{:.1f} seconds"

            timestamps = _align_timestamps(list(timestamps), t_groups)
            embed_id = self._get_video_frame_embed_token_id(hf_processor)
            placeholder = [hf_config.video_start_token_id]
            for ts in timestamps:
                placeholder.append(hf_config.image_start_token_id)
                placeholder.extend([embed_id] * n_per)
                placeholder.append(hf_config.image_end_token_id)
                placeholder.extend(
                    tokenizer.encode(ts_fmt.format(ts), add_special_tokens=False)
                )
            placeholder.append(hf_config.video_end_token_id)
            return placeholder

        Glm4vProcessingInfo._construct_video_placeholder = _construct_video_placeholder
        Glm4vProcessingInfo._glm53_video_t_aligned = True
        print(
            "glm53: video placeholders aligned to encoder grid_t (Glm5Next→glm46v)",
            file=sys.stderr,
        )


    def _install_import_hook() -> None:
        import builtins
        import importlib

        if getattr(builtins, "_glm53_video_hook", False):
            return
        builtins._glm53_video_hook = True
        real_import = builtins.__import__
        applying = False

        def _maybe_apply(name: str) -> None:
            nonlocal applying
            if applying or "glm4_1v" not in name:
                return
            applying = True
            try:
                apply()
            except Exception as exc:
                print(f"glm53: video apply() failed: {exc!r}", file=sys.stderr)
            finally:
                applying = False

        def _import(name, globals=None, locals=None, fromlist=(), level=0):
            mod = real_import(name, globals, locals, fromlist, level)
            _maybe_apply(name)
            return mod

        builtins.__import__ = _import
        real_im = importlib.import_module

        def _im(name, package=None):
            mod = real_im(name, package)
            _maybe_apply(name)
            return mod

        importlib.import_module = _im


    def _disable_gb10_persistent_topk() -> None:
        """Decode-path persistent_topk oversubscribes GB10 smem on long seqs."""
        if not KPOOL.is_file():
            raise FileNotFoundError(f"glm53: missing {KPOOL}")
        text = KPOOL.read_text()
        if KPOOL_NEW in text:
            print("glm53: persistent_topk already disabled in kpool", file=sys.stderr)
        elif KPOOL_OLD in text:
            KPOOL.write_text(text.replace(KPOOL_OLD, KPOOL_NEW, 1))
            print(
                "glm53: disabled GB10 persistent_topk (use top_k_per_row_decode)",
                file=sys.stderr,
            )
        else:
            raise RuntimeError(
                "glm53: kpool persistent_topk pattern not found — patch the file by hand"
            )
        cache = KPOOL.parent / "__pycache__"
        if cache.is_dir():
            for pyc in cache.glob("sparse_attn_indexer_kpool*.pyc"):
                pyc.unlink(missing_ok=True)


    _install_import_hook()
    try:
        apply()
    except Exception:
        pass


    if __name__ == "__main__":
        import shutil

        src = Path(__file__).resolve()
        dst = Path("/usr/local/lib/python3.12/dist-packages/glm53_video_patch.py")
        shutil.copy(src, dst)
        Path("/usr/local/lib/python3.12/dist-packages/glm53_video.pth").write_text(
            "import glm53_video_patch\n"
        )
        _disable_gb10_persistent_topk()
        print("glm53: overlay install ok aligned=True", file=sys.stderr)

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-head-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-worker-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: qwen38
  namespace: ai
  labels:
    app: qwen38
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    # Keep the head downloader alive if the worker has a transient failure; the
    # 200Gi PVCs are resumable and the group must not erase active downloads.
    restartPolicy: None
    leaderTemplate:
      metadata:
        labels:
          app: qwen38
          role: head
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: spark-0
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3-instanttensor@sha256:447114ee77d14c9b4732ee23978ada2a0ee9027868a231d6fd42700a8b25be1d
          command: [/bin/bash]
          args: [/scripts/download-and-validate.sh]
          env:
          - { name: MODEL_DIR, value: "/models/qwen38" }
          - { name: MODEL_REPO, value: "Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw" }
          - { name: MODEL_REVISION, value: "25a44fdbf16862a46b7cc9921142c6c81350af2f" }
          - { name: DFLASH_REPO, value: "incoai/GLM-5.3-Flash-DFlash2" }
          - { name: DFLASH_REVISION, value: "dc77ff1c99eeb2df044ee3d4f0094eb033fee410" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "0" }
          - { name: TRANSFORMERS_OFFLINE, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3-instanttensor@sha256:447114ee77d14c9b4732ee23978ada2a0ee9027868a231d6fd42700a8b25be1d
          # Upstream MiaAI-Lab arm64 image with the recipe runtime baked in.
          command: [bash, -c]
          args:
          - |
            set -euo pipefail
            cp /glm-patches/patch_glm_video_placeholders.py /tmp/patch_glm_video_placeholders.py
            python3 /tmp/patch_glm_video_placeholders.py
            exec vllm serve /models/qwen38 \
              --served-model-name GLM-5.3-Flash-EXL3 \
              --host 0.0.0.0 --port 8000 \
              --tensor-parallel-size 2 --nnodes 2 --node-rank 0 \
              --master-addr 192.168.74.1 --master-port 26400 \
              --distributed-executor-backend mp --quantization exl3 \
              --load-format instanttensor --gpu-memory-utilization 0.74 \
              --enforce-eager \
              --language-model-only \
              --max-model-len 1000000 --max-num-seqs 1 --max-num-batched-tokens 1024 \
              --kv-cache-dtype fp8 --enable-prefix-caching --enable-chunked-prefill \
              --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice \
              --limit-mm-per-prompt '{"image":48,"video":1}' \
              --mm-processor-kwargs '{"max_image_tokens":2048}' \
              --mm-processor-cache-gb 1 --skip-mm-profiling
          env:
          - { name: VLLM_HOST_IP, value: "192.168.74.1" }
          - { name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: TP_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: TRANSFORMERS_OFFLINE, value: "1" }
          - { name: GLM53_INDEXER_WORKSPACE, value: "rightsize" }
          - { name: EXL3_FAT_GROUPED, value: "0" }
          - { name: EXL3_TEMP_ROWS_FUSED, value: "256" }
          - { name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS, value: "0" }
          - { name: GLM53_MIXED_PREFILL_CHUNK, value: "fair" }
          - { name: GLM53_FAIR_PREFILL_CHUNK, value: "256" }
          - { name: GLM53_FAIR_PREFILL_SHARE, value: "0.30" }
          - { name: GLM53_FAIR_PREFILL_MAX_INTERVAL_MS, value: "2000" }
          - { name: GLM53_FAIR_PREFILL_MAX_STEP_MS, value: "2000" }
          - { name: GLM53_FAIR_PREFILL_MAX_CHUNKS, value: "1" }
          - { name: GLM53_KV_CAPACITY_LOG, value: "1" }
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          resources:
            requests: { memory: "90Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "96Gi", cpu: "12000m", nvidia.com/gpu: "1" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          - { name: glm-patches, mountPath: /glm-patches }
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: Directory }
        - name: glm-patches
          configMap:
            name: qwen38-download-script
            items:
            - key: patch_glm_video_placeholders.py
              path: patch_glm_video_placeholders.py
        - name: models
          persistentVolumeClaim: { claimName: qwen38-head-models }
        - name: download-script
          configMap:
            name: qwen38-download-script
    workerTemplate:
      metadata:
        labels:
          app: qwen38
          role: worker
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: spark-1
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3-instanttensor@sha256:447114ee77d14c9b4732ee23978ada2a0ee9027868a231d6fd42700a8b25be1d
          command: [/bin/bash]
          args: [/scripts/download-and-validate.sh]
          env:
          - { name: MODEL_DIR, value: "/models/qwen38" }
          - { name: MODEL_REPO, value: "Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw" }
          - { name: MODEL_REVISION, value: "25a44fdbf16862a46b7cc9921142c6c81350af2f" }
          - { name: DFLASH_REPO, value: "incoai/GLM-5.3-Flash-DFlash2" }
          - { name: DFLASH_REVISION, value: "dc77ff1c99eeb2df044ee3d4f0094eb033fee410" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "0" }
          - { name: TRANSFORMERS_OFFLINE, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3-instanttensor@sha256:447114ee77d14c9b4732ee23978ada2a0ee9027868a231d6fd42700a8b25be1d
          # Upstream MiaAI-Lab arm64 image with the recipe runtime baked in.
          command: [bash, -c]
          args:
          - |
            set -euo pipefail
            cp /glm-patches/patch_glm_video_placeholders.py /tmp/patch_glm_video_placeholders.py
            python3 /tmp/patch_glm_video_placeholders.py
            exec vllm serve /models/qwen38 \
              --served-model-name GLM-5.3-Flash-EXL3 \
              --host 0.0.0.0 --port 8000 \
              --tensor-parallel-size 2 --nnodes 2 --node-rank 1 \
              --master-addr 192.168.74.1 --master-port 26400 \
              --distributed-executor-backend mp --headless --quantization exl3 \
              --load-format instanttensor --gpu-memory-utilization 0.74 \
              --enforce-eager \
              --language-model-only \
              --max-model-len 1000000 --max-num-seqs 1 --max-num-batched-tokens 1024 \
              --kv-cache-dtype fp8 --enable-prefix-caching --enable-chunked-prefill \
              --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice \
              --limit-mm-per-prompt '{"image":48,"video":1}' \
              --mm-processor-kwargs '{"max_image_tokens":2048}' \
              --mm-processor-cache-gb 1 --skip-mm-profiling
          env:
          - { name: VLLM_HOST_IP, value: "192.168.74.2" }
          - { name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: TP_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: TRANSFORMERS_OFFLINE, value: "1" }
          - { name: GLM53_INDEXER_WORKSPACE, value: "rightsize" }
          - { name: EXL3_FAT_GROUPED, value: "0" }
          - { name: EXL3_TEMP_ROWS_FUSED, value: "256" }
          - { name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS, value: "0" }
          - { name: GLM53_MIXED_PREFILL_CHUNK, value: "fair" }
          - { name: GLM53_FAIR_PREFILL_CHUNK, value: "256" }
          - { name: GLM53_FAIR_PREFILL_SHARE, value: "0.30" }
          - { name: GLM53_FAIR_PREFILL_MAX_INTERVAL_MS, value: "2000" }
          - { name: GLM53_FAIR_PREFILL_MAX_STEP_MS, value: "2000" }
          - { name: GLM53_FAIR_PREFILL_MAX_CHUNKS, value: "1" }
          - { name: GLM53_KV_CAPACITY_LOG, value: "1" }
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          resources:
            requests: { memory: "90Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "96Gi", cpu: "12000m", nvidia.com/gpu: "1" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          - { name: glm-patches, mountPath: /glm-patches }
          # Worker rank is headless and has no HTTP probes.
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: Directory }
        - name: glm-patches
          configMap:
            name: qwen38-download-script
            items:
            - key: patch_glm_video_placeholders.py
              path: patch_glm_video_placeholders.py
        - name: models
          persistentVolumeClaim: { claimName: qwen38-worker-models }
        - name: download-script
          configMap:
            name: qwen38-download-script
---
apiVersion: v1
kind: Service
metadata:
  name: qwen38
  namespace: ai
  labels:
    app: qwen38
spec:
  selector:
    app: qwen38
    role: head
  ports:
  - { name: http, port: 8000, protocol: TCP, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qwen38
  namespace: ai
  labels:
    app: qwen38
    release: kube-prometheus-stack
spec:
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    metricRelabelings:
    - action: replace
      replacement: talos-stpetersburg
      targetLabel: cluster
  selector:
    matchLabels:
      app: qwen38
  namespaceSelector:
    matchNames:
    - ai
