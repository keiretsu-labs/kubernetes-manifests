---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tensorfold-rules
spec:
  groups:
    - name: tensorfold.rules
      rules:
        - alert: TensorFoldGenerationFlatline
          expr: |
            max by (cluster, namespace, pod, model_name) (tensorfold:requests_running{namespace="ai"}) > 0
            and
            sum by (cluster, namespace, pod, model_name) (increase(tensorfold_health:completion_tokens_total{namespace="ai"}[2m])) == 0
          for: 8m
          annotations:
            summary: TensorFold has running requests but no new completion tokens ({{ $$labels.model_name }})
            description: >-
              requests_running has been positive while the health endpoint's
              completion_tokens_total has not increased for 8m on {{ $$labels.pod }}.
              This counter includes tokens from in-flight replies, so this points
              to a stalled prefill or decode rather than a normal long completion.
          labels:
            severity: critical

        - alert: TensorFoldKVPoolExhausted
          expr: |
            tensorfold_health:pool_free_tokens{namespace="ai"} == 0
          for: 5m
          annotations:
            summary: TensorFold KV pool has no free tokens on {{ $$labels.pod }}
            description: >-
              TensorFold's shared cache pool has had no free token rows for 5m.
              New prompts may be unable to make progress; inspect MemAvailable,
              tensorfold_health:pool_tokens, and the configured context/cache budget.
          labels:
            severity: warning
