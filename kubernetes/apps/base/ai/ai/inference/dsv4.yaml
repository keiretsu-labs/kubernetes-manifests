            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          volumeMounts:
          - { name: miaai-hotfixes, mountPath: /patches }
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          resources:
            requests: { memory: "95Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "95Gi", nvidia.com/gpu: "1" }
        volumes:
        - name: miaai-hotfixes
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "64Gi"
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: "" }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: "" }
        - name: models
          persistentVolumeClaim: { claimName: dsv4-worker-models }
        - name: download-script
          configMap:
            name: dsv4-download-script
---
apiVersion: v1
kind: Service
metadata:
  name: dsv4
  namespace: ai
  labels: { app: dsv4 }
spec:
  type: ClusterIP
  selector: { app: dsv4, role: head }
  ports:
  - { name: http, port: 8000, protocol: TCP, targetPort: 8000 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dsv4
  namespace: ai
  labels:
    app: dsv4
    release: kube-prometheus-stack
spec:
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    metricRelabelings:
    - action: replace
      replacement: talos-stpetersburg
      targetLabel: cluster
  selector:
    matchLabels:
      app: dsv4
  namespaceSelector:
    matchNames:
    - ai
