#
# DeepSeek-V4-Flash-0731 DSpark on 2× DGX Spark.
# Runtime: MiaAI/Anemll dspark-vllm-gx10 0.1.1, TP=2 over host-network RoCE.
# Safety profile: 1M ceiling, DSpark k=5, NVFP4 DS-MLA KV, eager first boot,
# 0.76 GPU utilization and 4096 prefill tokens to stay inside the 95Gi cgroup.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsv4-download-script
  namespace: ai
data:
  download-and-validate.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    MODEL_DIR="$${MODEL_DIR:-/models/dsv4}"
    HF_REPO="$${HF_REPO:-deepseek-ai/DeepSeek-V4-Flash-0731}"
    HF_REVISION="$${HF_REVISION:-9e165c30e2704aec5d9d593cce3eebd58bbef1cb}"
    EXPECTED_MARKER="$${HF_REPO}@$${HF_REVISION}"
    mkdir -p "$${MODEL_DIR}"
    marker="$${MODEL_DIR}/.model-revision"
    count="$$(find "$${MODEL_DIR}" -maxdepth 1 -name 'model-*.safetensors' | wc -l)"
    current="$$(cat "$${marker}" 2>/dev/null || true)"
    if [ "$${count}" -eq 48 ] && [ "$${current}" = "$${EXPECTED_MARKER}" ] && [ -f "$${MODEL_DIR}/encoding/encoding_dsv4.py" ]; then
      echo "[download] exact 0731 snapshot already present ($count shards)"
      exit 0
    fi
    if [ "$current" != "$EXPECTED_MARKER" ]; then
      echo "[download] snapshot changed: ${current:-unmarked} -> $EXPECTED_MARKER"
      find "$MODEL_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
    fi
    hf download "$HF_REPO" --revision "$HF_REVISION" --local-dir "$MODEL_DIR"
    count=$(find "$MODEL_DIR" -maxdepth 1 -name 'model-*.safetensors' | wc -l)
    [ "$count" -eq 48 ] || { echo "[fatal] expected 48 shards, found $count" >&2; exit 1; }
    [ -f "$MODEL_DIR/encoding/encoding_dsv4.py" ] || { echo "[fatal] missing encoding/encoding_dsv4.py" >&2; exit 1; }
    printf '%s\n' "$EXPECTED_MARKER" > "$marker"
    echo "[validate] 0731 snapshot OK ($count shards + encoder)"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsv4-head-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsv4-worker-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: dsv4
  namespace: ai
  labels: { app: dsv4 }
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels: { app: dsv4, role: head }
      spec:
        terminationGracePeriodSeconds: 60
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector: { kubernetes.io/hostname: spark-0 }
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext: { privileged: true }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: ghcr.io/anemll/dspark-vllm-gx10@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
          command: [/bin/bash, /scripts/download-and-validate.sh]
          env:
          - { name: MODEL_DIR, value: "/models/dsv4" }
          - { name: HF_REPO, value: "deepseek-ai/DeepSeek-V4-Flash-0731" }
          - { name: HF_REVISION, value: "9e165c30e2704aec5d9d593cce3eebd58bbef1cb" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "0" }
          - { name: TRANSFORMERS_OFFLINE, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext: { privileged: true }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: ghcr.io/anemll/dspark-vllm-gx10@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
          command: [bash, -c]
          args:
          - |
            set -euo pipefail
            echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            nvidia-smi --gpu-reset -i 0 >/dev/null 2>/dev/null || true
            encoding=/models/dsv4/encoding/encoding_dsv4.py
            if [ -f "$encoding" ]; then
              cp "$encoding" /usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py
            fi
            python3 - <<'PY'
            from pathlib import Path
            p = Path('/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4.py')
            if p.exists():
                s = p.read_text()
                s = s.replace('reasoning_effort = "high"', 'reasoning_effort = "low"', 1)
                p.write_text(s)
            PY
            exec /usr/local/bin/vllm serve /models/dsv4 \
              --revision 9e165c30e2704aec5d9d593cce3eebd58bbef1cb \
              --served-model-name deepseek-v4-flash-0731 deepseek-v4-flash deepseek-v4-flash-dspark \
              --host 0.0.0.0 --port 8000 --trust-remote-code \
              --tensor-parallel-size 2 --pipeline-parallel-size 1 \
              --distributed-executor-backend mp \
              --kv-cache-dtype nvfp4_ds_mla --block-size 256 \
              --max-model-len 1048576 \
              --max-num-seqs 6 --max-num-batched-tokens 4096 \
              --long-prefill-token-threshold 1024 \
              --gpu-memory-utilization 0.76 --enforce-eager \
              --enable-prefix-caching --enable-chunked-prefill \
              --tokenizer-mode deepseek_v4 \
              --tool-call-parser deepseek_v4 --enable-auto-tool-choice \
              --reasoning-parser deepseek_v4 \
              --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
              --default-chat-template-kwargs '{"thinking":false}' \
              --generation-config vllm --enable-flashinfer-autotune \
              --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}' \
              --moe-backend flashinfer_b12x \
              --nnodes 2 --node-rank 0 --master-addr 192.168.74.1 --master-port 25002
          env:
          - { name: NODE_RANK, value: "0" }
          - { name: VLLM_HOST_IP, value: "192.168.74.1" }
          - { name: MASTER_ADDR, value: "192.168.74.1" }
          - { name: VLLM_ENGINE_READY_TIMEOUT_S, value: "3600" }
          - { name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1" }
          - { name: VLLM_USE_FLASHINFER_SAMPLER, value: "1" }
          - { name: VLLM_USE_B12X_MOE, value: "1" }
          - { name: VLLM_USE_BREAKABLE_CUDAGRAPH, value: "0" }
          - { name: VLLM_SPARSE_INDEXER_MAX_LOGITS_MB, value: "256" }
          - { name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS, value: "0" }
          - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_NET_GDR_LEVEL, value: "5" }
          - { name: NCCL_IB_TIMEOUT, value: "22" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: NCCL_CROSS_NIC, value: "1" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: VLLM_PORT, value: "25100" }
          - { name: TRANSFORMERS_OFFLINE, value: "1" }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: VLLM_CACHE_ROOT, value: "/models/vllm-cache" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
          securityContext:
            privileged: true
            capabilities: { add: ["IPC_LOCK", "SYS_RESOURCE"] }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          resources:
            requests: { memory: "95Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "95Gi", nvidia.com/gpu: "1" }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 1200, periodSeconds: 30, timeoutSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 1200, periodSeconds: 15, timeoutSeconds: 10 }
        volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: "64Gi" }
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: "" }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: "" }
        - name: models
          persistentVolumeClaim: { claimName: dsv4-head-models }
        - name: download-script
          configMap: { name: dsv4-download-script }
    workerTemplate:
      metadata:
        labels: { app: dsv4, role: worker }
      spec:
        terminationGracePeriodSeconds: 60
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector: { kubernetes.io/hostname: spark-1 }
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext: { privileged: true }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: ghcr.io/anemll/dspark-vllm-gx10@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
          command: [/bin/bash, /scripts/download-and-validate.sh]
          env:
          - { name: MODEL_DIR, value: "/models/dsv4" }
          - { name: HF_REPO, value: "deepseek-ai/DeepSeek-V4-Flash-0731" }
          - { name: HF_REVISION, value: "9e165c30e2704aec5d9d593cce3eebd58bbef1cb" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "0" }
          - { name: TRANSFORMERS_OFFLINE, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext: { privileged: true }
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: ghcr.io/anemll/dspark-vllm-gx10@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
          command: [bash, -c]
          args:
          - |
            set -euo pipefail
            echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            nvidia-smi --gpu-reset -i 0 >/dev/null 2>/dev/null || true
            encoding=/models/dsv4/encoding/encoding_dsv4.py
            if [ -f "$encoding" ]; then
              cp "$encoding" /usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py
            fi
            python3 - <<'PY'
            from pathlib import Path
            p = Path('/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4.py')
            if p.exists():
                s = p.read_text()
                s = s.replace('reasoning_effort = "high"', 'reasoning_effort = "low"', 1)
                p.write_text(s)
            PY
            exec /usr/local/bin/vllm serve /models/dsv4 \
              --revision 9e165c30e2704aec5d9d593cce3eebd58bbef1cb \
              --served-model-name deepseek-v4-flash-0731 deepseek-v4-flash deepseek-v4-flash-dspark \
              --host 0.0.0.0 --port 8000 --trust-remote-code \
              --tensor-parallel-size 2 --pipeline-parallel-size 1 --distributed-executor-backend mp \
              --kv-cache-dtype nvfp4_ds_mla --block-size 256 --max-model-len 1048576 \
              --max-num-seqs 6 --max-num-batched-tokens 4096 --long-prefill-token-threshold 1024 \
              --gpu-memory-utilization 0.76 --enforce-eager --enable-prefix-caching --enable-chunked-prefill \
              --tokenizer-mode deepseek_v4 --tool-call-parser deepseek_v4 --enable-auto-tool-choice \
              --reasoning-parser deepseek_v4 --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
              --default-chat-template-kwargs '{"thinking":false}' --generation-config vllm --enable-flashinfer-autotune \
              --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}' \
              --moe-backend flashinfer_b12x --nnodes 2 --node-rank 1 --master-addr 192.168.74.1 --master-port 25002 --headless
          env:
          - { name: NODE_RANK, value: "1" }
          - { name: VLLM_HOST_IP, value: "192.168.74.2" }
          - { name: MASTER_ADDR, value: "192.168.74.1" }
          - { name: HEADLESS, value: "1" }
          - { name: VLLM_ENGINE_READY_TIMEOUT_S, value: "3600" }
          - { name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1" }
          - { name: VLLM_USE_FLASHINFER_SAMPLER, value: "1" }
          - { name: VLLM_USE_B12X_MOE, value: "1" }
          - { name: VLLM_USE_BREAKABLE_CUDAGRAPH, value: "0" }
          - { name: VLLM_SPARSE_INDEXER_MAX_LOGITS_MB, value: "256" }
          - { name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS, value: "0" }
          - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_NET_GDR_LEVEL, value: "5" }
          - { name: NCCL_IB_TIMEOUT, value: "22" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: NCCL_CROSS_NIC, value: "1" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: VLLM_PORT, value: "25100" }
          - { name: TRANSFORMERS_OFFLINE, value: "1" }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: VLLM_CACHE_ROOT, value: "/models/vllm-cache" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
