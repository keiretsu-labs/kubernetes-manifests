---
# GLM-5.3-Flash EXL3 TensorFold OpenAI-compatible inference server.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-tensorfold
spec:
  jobName: blackbox
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://model-serving.ai:8888/health
        - http://model-serving.ai:8888/v1/models
        - http://model-serving.ai:8888/metrics
      labels:
        service: ai-inference
        target: tensorfold
