---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-home-services
spec:
  jobName: blackbox
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://homeassistant.home:8123
        - http://frigate.home:5000
      labels:
        service: "home-automation"
        critical: "true"
---
# Outside-in: the public HTTPRoute through the gateway, so a broken route,
# gateway or certificate pages even when the Service itself answers.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: app-home-routes
spec:
  jobName: blackbox
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # frigate.${CLUSTER_DOMAIN} is attached only to the ts gateway, which the
        # in-cluster prober can't reach (404 from the private gateway); probe the
        # Ottawa-local public route instead (tinyauth login page = 200).
        - https://frigate.${LOCATION}.${COMMON_DOMAIN}
        # homeassistant.${CLUSTER_DOMAIN} is dropped until Ottawa HA has
        # http.use_x_forwarded_for/trusted_proxies set: it 400s every proxied
        # request today (real misconfig, tracked separately). In-cluster
        # app-home-services still pages if HA itself goes down.
      labels:
        service: "home-automation"
        target: "route"
        critical: "true"
