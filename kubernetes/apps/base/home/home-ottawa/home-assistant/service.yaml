---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: home
spec:
  selector:
    app: homeassistant
  ports:
  - name: homeassistant-web
    port: 8123
    targetPort: 8123
  - name: homekit-udp
    port: 5353
    targetPort: 5353
  - name: homekit-tcp
    port: 21084
    targetPort: 21084
  type: LoadBalancer
  # Local: preserve real client source IP (no SNAT), BGP only from the HA node.
  externalTrafficPolicy: Local
  loadBalancerIP: 10.169.10.13
