---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-http-config
  namespace: home
data:
  # Mounted over /config/configuration.yaml. Mirrors the PVC file plus the
  # http block so HA accepts X-Forwarded-For from the Envoy Gateway proxies.
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        # Ottawa Cilium cluster-pool pod CIDR (cluster-pool-ipv4-cidr);
        # envoy-home-private/-ts pods in envoy-gateway-system live here.
        - 10.3.0.0/16
