---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt
spec:
  replicas: 1
  # RWO PVC: RollingUpdate deadlocks on Multi-Attach (see #3823).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      containers:
      - name: mosquitto
        # renovate: datasource=docker depName=eclipse-mosquitto versioning=docker
        image: eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
        command: ['sh', '-c', 'mosquitto -c /etc/mosquitto/mosquitto.conf']
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        ports:
        - containerPort: 1883
        volumeMounts:
        - mountPath: /etc/mosquitto/
          name: config
        - mountPath: /mosquitto/data/
          name: data
      volumes:
      - name: config
        configMap:
          name: mqtt-config
      - name: data
        persistentVolumeClaim:
          claimName: mqtt-data-ceph