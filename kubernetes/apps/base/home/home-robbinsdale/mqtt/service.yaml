---
apiVersion: v1
kind: Service
metadata:
  name: mqtt
spec:
  selector:
    app: mqtt
  ports:
    - name: mqtt
      port: 1883
      protocol: TCP
      targetPort: 1883
  type: LoadBalancer
  # Local: preserve real client source IP (no SNAT); BGP only from the mqtt node, so
  # UDM ECMP cannot move long-lived MQTT connections between nodes (reset).
  externalTrafficPolicy: Local
  loadBalancerIP: 10.50.10.11
