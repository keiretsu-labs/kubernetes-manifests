---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ts
  labels:
    gateway: tailscale
spec:
  gatewayClassName: home-ts
  listeners:
    - name: wildcard-killinit-cc-https
      protocol: HTTPS
      port: 443
      hostname: "*.killinit.cc"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
        - group: ''
          kind: Secret
          name: wildcard-killinit-cc
    - name: wildcard-lukehouge-com-https
      protocol: HTTPS
      port: 443
      hostname: "*.lukehouge.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
        - group: ''
          kind: Secret
          name: wildcard-lukehouge-com
    - name: wildcard-rajsingh-info-https
      protocol: HTTPS
      port: 443
      hostname: "*.rajsingh.info"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
        - group: ''
          kind: Secret
          name: wildcard-rajsingh-info
    # The wildcard-keiretsu-top cert is already issued by this app's
    # certificate-wildcard.yaml and exists in all three clusters; ts simply
    # never declared a listener for it, so a *.keiretsu.top route attached
    # here would fail with NoMatchingListenerHostname.
    - name: wildcard-keiretsu-top-https
      protocol: HTTPS
      port: 443
      hostname: "*.keiretsu.top"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
        - group: ''
          kind: Secret
          name: wildcard-keiretsu-top
    - name: http
      port: 80
      protocol: HTTP
    - name: forgejo-ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        kinds:
        - kind: TCPRoute
        namespaces:
          from: All
    - name: bhaiya-workspace-ssh
      protocol: TCP
      port: 6922
      allowedRoutes:
        kinds:
        - kind: TCPRoute
        namespaces:
          from: All
