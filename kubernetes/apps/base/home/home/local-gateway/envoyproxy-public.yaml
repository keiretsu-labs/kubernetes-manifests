---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
spec:
  # Route ServiceImports through their ClusterSetIP so Cilium owns
  # cross-cluster endpoint selection and Envoy does not need to consume
  # synthesized EndpointSlices from every member cluster.
  routingType: Service
  telemetry:
    accessLog:
      settings:
        # A custom accessLog settings list replaces Envoy Gateway's default
        # setting. Keep it untyped so the default JSON route logger and its
        # unmatched-listener (NR) fallback remain in place.
        - sinks:
            - type: File
              file:
                path: /dev/stdout
        # Gateway port 22 is shifted to Envoy's unprivileged port 10022.
        # Envoy Gateway 1.9.1 has no listener-name selector; this listener
        # CEL match is therefore the bounded forgejo-ssh selector.
        - type: Listener
          matches:
            - "destination.port == 10022"
          format:
            type: JSON
            json:
              listener: "forgejo-ssh"
              gateway: "public"
              connection_id: "%CONNECTION_ID%"
              start_time: "%START_TIME%"
              duration: "%DURATION%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              downstream_detected_close_type: "%DOWNSTREAM_DETECTED_CLOSE_TYPE%"
              upstream_detected_close_type: "%UPSTREAM_DETECTED_CLOSE_TYPE%"
              downstream_local_close_reason: "%DOWNSTREAM_LOCAL_CLOSE_REASON%"
              upstream_local_close_reason: "%UPSTREAM_LOCAL_CLOSE_REASON%"
              downstream_transport_failure_reason: "%DOWNSTREAM_TRANSPORT_FAILURE_REASON%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              response_flags: "%RESPONSE_FLAGS%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
        # Gateway port 6922 is unprivileged, so Envoy Gateway preserves the
        # listener port. Preferred Bhaiya workspace CONNECT path; Forgejo
        # remains on forgejo-ssh:22. Restored 2026-10-05 after :22-only cutover
        # reintroduced public-path RemoteReset kicks (#661 / Kartik).
        - type: Listener
          matches:
            - "destination.port == 6922"
          format:
            type: JSON
            json:
              listener: "bhaiya-workspace-ssh"
              gateway: "public"
              connection_id: "%CONNECTION_ID%"
              start_time: "%START_TIME%"
              duration: "%DURATION%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              downstream_detected_close_type: "%DOWNSTREAM_DETECTED_CLOSE_TYPE%"
              upstream_detected_close_type: "%UPSTREAM_DETECTED_CLOSE_TYPE%"
              downstream_local_close_reason: "%DOWNSTREAM_LOCAL_CLOSE_REASON%"
              upstream_local_close_reason: "%UPSTREAM_LOCAL_CLOSE_REASON%"
              downstream_transport_failure_reason: "%DOWNSTREAM_TRANSPORT_FAILURE_REASON%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              response_flags: "%RESPONSE_FLAGS%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    metrics:
      prometheus:
        compression:
          type: Gzip
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          priorityClassName: infra-high
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            # Fail over off a dead node in ~120s instead of the 300s
            # DefaultTolerationSeconds. 30s (#3452) turned short kubelet /
            # control-plane blips (rei NotReady ~2 min, 2026-10-06) into forced
            # Envoy evictions that cut every live public session. A truly dead
            # node already stops advertising the VIP over BGP, so 120s is enough.
            - key: node.kubernetes.io/not-ready
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 120
            - key: node.kubernetes.io/unreachable
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 120
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: public
      envoyService:
        # Local keeps the real client IP. Each node with a ready public Envoy
        # advertises the VIP over BGP, and the UDM does ECMP across those next
        # hops and moves established flows between them mid-stream. The node
        # that receives a moved flow has no socket for it and answers RST
        # (#661/#677). Plain Cluster/SNAT does not fix that (A/B #2761 /
        # #2980): SNAT changes the source tuple the backend sees.
        # Ottawa therefore runs one public replica so there is a single next
        # hop (see kubernetes/apps/ottawa/home/home.yaml).
        externalTrafficPolicy: Local
        loadBalancerIP: ${CLUSTER_LOAD_BALANCER_CIDR%.*.*/*}.10.15
