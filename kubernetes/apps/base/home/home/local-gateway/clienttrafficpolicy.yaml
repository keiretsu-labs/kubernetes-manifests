---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: wildcard-lan
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
  clientIPDetection:
    # Trust X-Forwarded-For only when the peer is an in-cluster hop (pods /
    # services / LB IPs live in 10.0.0.0/8). The public gateway takes WAN
    # clients directly (eTP Local / DSR keep the real source), so
    # numTrustedHops: 1 let any Internet client pick its own "client IP" by
    # sending X-Forwarded-For (verified 2026-10-06: XFF 203.0.113.7 became
    # downstream_remote_address). LAN clients (192.168.x) are not trusted
    # either, so their real address is used.
    xForwardedFor:
      trustedCIDRs:
        - 10.0.0.0/8
  timeout:
    http:
      requestReceivedTimeout: 0s 
      idleTimeout: 3600s
      streamIdleTimeout: 900s
  headers:
    requestID: PreserveOrGenerate
    # Do NOT blanket-set Cache-Control here. addIfAbsent caches every response
    # whose backend doesn't send its own — which silently cached tinyauth's
    # OAuth init and broke login. Routes that want caching set it per-route
    # (garage-web, cdn-site, agent web UIs, plex).
  http2:
    initialStreamWindowSize: 64Ki 
    initialConnectionWindowSize: 1Mi 
    maxConcurrentStreams: 100