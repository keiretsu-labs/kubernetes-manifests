---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-logs-single
      version: "0.13.9"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    server:
      persistentVolume:
        enabled: true
        # Keep template at 50Gi — STS volumeClaimTemplates size is immutable.
        # Expand the live PVC separately if needed (SC allowVolumeExpansion=true).
        size: 50Gi
      retentionPeriod: 7d
      # Cap disk usage so VL drops oldest partitions before PVC fills (default unit GiB).
      # Chart maps this to -retention.maxDiskSpaceUsageBytes.
      retentionDiskSpaceUsage: 40
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 2Gi
      extraArgs:
        maxConcurrentInserts: 8
        insert.maxQueueDuration: 2m
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: false
      annotations:
        grafana_folder: VictoriaMetrics
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
            patch: |
              - op: replace
                path: /spec/instanceSelector/matchLabels
                value:
                  grafana.internal/instance: grafana
              - op: add
                path: /spec/folder
                value: VictoriaMetrics
