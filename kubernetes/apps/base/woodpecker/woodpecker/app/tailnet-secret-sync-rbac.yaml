---
# Robbinsdale's ExternalSecret reads the chart-managed agent secret from
# Ottawa through the kubernetes-ottawa ClusterSecretStore. Keep the tailnet
# identity limited to that one source Secret in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woodpecker-agent-secret-reader
  namespace: woodpecker
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - woodpecker-default-agent-secret
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-agent-secret-reader
  namespace: woodpecker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woodpecker-agent-secret-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tailnet-secret-sync
