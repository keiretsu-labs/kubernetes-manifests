---
# UI route: everything not matched by woodpecker-api below. Protected by
# tinyauth (securitypolicy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: woodpecker
  annotations:
    item.homer.rajsingh.info/name: "Woodpecker CI"
    item.homer.rajsingh.info/subtitle: "CI/CD"
    item.homer.rajsingh.info/logo: "https://woodpecker-ci.org/media/logo.svg"
    item.homer.rajsingh.info/keywords: "ci, cd, pipeline, build, automation"
    service.homer.rajsingh.info/name: "Infrastructure"
    service.homer.rajsingh.info/icon: "fas fa-microchip"
spec:
  hostnames:
    - woodpecker.${COMMON_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: wildcard-keiretsu-top-https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: wildcard-keiretsu-top-https
  rules:
    - backendRefs:
        - name: woodpecker-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Machine paths, NOT behind tinyauth: forge webhooks (/api/hook, legacy
# /hook), API tokens (bhaiya-ci, ci-reader, ci-janitor), the UI XHR/SSE
# calls (/api/*, already authenticated by the Woodpecker session or token),
# and health/version probes. Agents use gRPC on woodpecker-server:9000
# in-cluster / via ClusterMesh, not this route. Longest-prefix match wins
# over the "/" UI route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: woodpecker-api
spec:
  hostnames:
    - woodpecker.${COMMON_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: wildcard-keiretsu-top-https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: home
      sectionName: wildcard-keiretsu-top-https
  rules:
    - backendRefs:
        - name: woodpecker-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /hook
        - path:
            type: Exact
            value: /healthz
        - path:
            type: Exact
            value: /version
