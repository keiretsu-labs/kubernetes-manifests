---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodpecker
spec:
  interval: 30m
  chart:
    spec:
      chart: woodpecker
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: woodpecker
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    force: true
    remediation:
      retries: 3
  values:
    server:
      enabled: true
      statefulSet:
        replicaCount: 1
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: ${STORAGECLASS_DEFAULT}
        mountPath: /var/lib/woodpecker
      env:
        WOODPECKER_ADMIN: raj
        WOODPECKER_OPEN: "true"
        WOODPECKER_HOST: https://woodpecker.${COMMON_DOMAIN}
        WOODPECKER_FORGEJO: "true"
        WOODPECKER_FORGEJO_URL: https://forgejo.${COMMON_DOMAIN}
        WOODPECKER_FORGEJO_CLIENT: ${WOODPECKER_FORGEJO_CLIENT}
        WOODPECKER_FORGEJO_SECRET: ${WOODPECKER_FORGEJO_SECRET}
        WOODPECKER_LOG_LEVEL: info
        WOODPECKER_DATABASE_DRIVER: postgres
        WOODPECKER_DATABASE_DATASOURCE:
          valueFrom:
            secretKeyRef:
              name: woodpecker-postgres-app
              key: uri
        # Persist the gRPC JWT signing secret across server restarts. When unset,
        # the server mints a fresh random secret on every boot, invalidating every
        # agent's cached JWT and forcing all agents to CrashLoop-reconnect (seen
        # during the 3.17 upgrade outage). Reuse the chart-managed agent secret —
        # it is already stable (createAgentSecret writes it once and keeps it), so
        # no new secret material is introduced.
        WOODPECKER_GRPC_SECRET:
          valueFrom:
            secretKeyRef:
              name: woodpecker-default-agent-secret
              key: WOODPECKER_AGENT_SECRET
      createAgentSecret: true
      service:
        type: ClusterIP
        port: 80
        # Publish the Ottawa server through Cilium ClusterMesh. The
        # Robbinsdale agent-only release carries the matching client-side
        # Service so this standard service DNS name resolves there too.
        annotations:
          service.cilium.io/global: "true"
          service.cilium.io/shared: "true"
          service.cilium.io/affinity: local
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
    agent:
      enabled: true
      replicaCount: 5
      env:
        WOODPECKER_SERVER: woodpecker-server:9000
        # Keep the release lane on Ottawa for its cluster-local Flux receiver.
        WOODPECKER_AGENT_LABELS: "cluster=ottawa"
        WOODPECKER_BACKEND: kubernetes
        WOODPECKER_MAX_WORKFLOWS: "4"
        WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
        # Every step pod in a workflow mounts the same workspace claim. The
        # RBD class is RWO, so parallel steps on different nodes otherwise
        # produce Multi-Attach failures and leave old claims attached during
        # cleanup. CephFS is the RWX backend in Ottawa.
        WOODPECKER_BACKEND_K8S_STORAGE_CLASS: rook-cephfs
        # The workspace-image Tode/Herdr closure needs more than the former
        # 128Gi was insufficient once the full Tode/Hermes/Pi closure and
        # OCI archive were realized together; retain headroom for GC and
        # registry preparation on cold releases.
        WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 256G
        WOODPECKER_BACKEND_K8S_STORAGE_RWX: true
        # Keep CI step pods off shiro. shiro hosts the raj-codes Kata
        # workspace sandbox, and on 2026-09-25 every CI burst that landed
        # there stalled the node runtime: the Kata VM and unrelated pods were
        # killed and recreated four times. Workspace claims are CephFS RWX,
        # so steps can run on any remaining node. The kube backend parses
        # this with sigs.k8s.io/yaml into a core/v1 Affinity; step-level
        # affinity stays disallowed (the default).
        WOODPECKER_BACKEND_K8S_POD_AFFINITY: >-
          {"nodeAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":{"nodeSelectorTerms":[{"matchExpressions":[{"key":"kubernetes.io/hostname","operator":"NotIn","values":["shiro"]}]}]}}}
        WOODPECKER_LOG_LEVEL: info
      persistence:
        enabled: false
      # Keep the agents themselves off shiro as well (see the step affinity above).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - shiro
      serviceAccount:
        create: true
        rbac:
          create: true
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
