---
# Copy the stable Ottawa chart-managed agent secret without materializing its
# value in Git or in the agent HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-default-agent-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-ottawa
    kind: ClusterSecretStore
  target:
    name: woodpecker-default-agent-secret
    creationPolicy: Owner
  data:
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: woodpecker-default-agent-secret
        property: WOODPECKER_AGENT_SECRET
