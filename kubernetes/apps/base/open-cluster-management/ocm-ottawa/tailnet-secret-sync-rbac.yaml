---
# Klusterlets on Robbinsdale and St. Petersburg fetch ocm-bootstrap-token from
# this namespace via the kubernetes-ottawa-ocm ClusterSecretStore, which reaches
# the hub through the Tailscale API-server proxy. That store carries no real
# credential ("bearerToken: unused"), so authorization comes from the groups the
# proxy impersonates for the calling tailnet identity. Grant that group read on
# secrets here only — it previously inherited system:masters from tag:k8s.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailnet-secret-sync
  namespace: open-cluster-management
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailnet-secret-sync
  namespace: open-cluster-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailnet-secret-sync
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tailnet-secret-sync
