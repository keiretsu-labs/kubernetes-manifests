---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-litellm
spec:
  replicas: 2
  args:
    - --maxmemory=512M
    - --proactor_threads=2
  authentication:
    passwordFromSecret:
      name: litellm-secrets
      key: DRAGONFLY_PASSWORD
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi
