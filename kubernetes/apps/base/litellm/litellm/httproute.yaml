---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: ${CLUSTER_DOMAIN_LISTENER}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: home
      sectionName: wildcard-keiretsu-top-https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ts
      namespace: home
      sectionName: wildcard-keiretsu-top-https
  # Canonical hostname is litellm.${COMMON_DOMAIN} (CNAME already published in
  # k8gb-common cnames.yaml). ai.${CLUSTER_DOMAIN} is a temporary alias kept
  # so existing clients keep working; drop it once they have moved.
  hostnames:
    - litellm.${COMMON_DOMAIN}
    - ai.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - group: ""
          kind: Service
          name: litellm
          port: 4000
      timeouts:
        request: 3600s
        backendRequest: 3600s
