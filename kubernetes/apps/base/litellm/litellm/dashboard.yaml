---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: litellm
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: 30m
  folder: LiteLLM
  configMapRef:
    name: litellm-dashboard
    key: dashboard.json
  datasources:
    - inputName: DS_MIMIR
      datasourceName: mimir
