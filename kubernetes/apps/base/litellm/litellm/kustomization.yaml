---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - namespace.yaml
  - secret.sops.yaml
  - virtual-keys.sops.yaml
  - postgres.yaml
  - dragonfly.yaml
  - upstreams.yaml
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml
  - dashboard.yaml

configMapGenerator:
  # Keep the content hash on the runtime config. The Deployment mounts it via
  # subPath, so a stable ConfigMap name would leave running pods on stale
  # model routes after a config edit.
  - name: litellm-config
    files:
      - config.yaml
  - name: litellm-dashboard
    files:
      - dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: litellm
