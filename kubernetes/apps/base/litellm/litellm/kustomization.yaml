---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.sops.yaml
  - postgres.yaml
  - dragonfly.yaml
  - upstreams.yaml
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml
  - dashboard.yaml

configMapGenerator:
  - name: litellm-dashboard
    files:
      - dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: litellm
generatorOptions:
  disableNameSuffixHash: true
