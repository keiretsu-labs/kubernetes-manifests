---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: border0
spec:
  interval: 1h
  url: https://borderzero.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailzero-connector
spec:
  interval: 30m
  chart:
    spec:
      chart: tailzero-connector
      version: 0.4.0
      sourceRef:
        kind: HelmRepository
        name: border0
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: tailzero-invite
      valuesKey: inviteCode
      targetPath: config.inviteCode
  values:
    image:
      repository: ghcr.io/borderzero/tailzero
      tag: v0.2-98-g433aa2b
      pullPolicy: IfNotPresent
    rbac:
      clusterRoleMode: api-admin
    config:
      hostname: ottawa-tailzero
