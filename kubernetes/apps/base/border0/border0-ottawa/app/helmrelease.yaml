---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailzero-connector
  namespace: border0
spec:
  interval: 30m
  chart:
    spec:
      chart: tailzero-connector
      version: 0.4.0
      sourceRef:
        kind: HelmRepository
        name: border0
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      # tailzero, not the legacy border0 binary
      repository: ghcr.io/borderzero/tailzero
      tag: latest
      pullPolicy: Always
    # required for Kubernetes API proxying
    rbac:
      clusterRoleMode: api-admin
    config:
      # placeholder; real creds seeded into tailzero-connector-credentials
      inviteCode: "seeded-via-credentials-secret-do-not-edit"
      hostname: ottawa-tailzero
