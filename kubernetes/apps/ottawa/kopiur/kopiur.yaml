---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur
  namespace: flux-system
spec:
  targetNamespace: kopiur-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur
      app.kubernetes.io/part-of: kopiur
  path: ./kubernetes/apps/base/kopiur/kopiur
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-production
  namespace: flux-system
spec:
  dependsOn:
    - name: kopiur
    - name: kopiur-ottawa-repo
    - name: garage-kopiur-ottawa-bucket
    - name: home-apps-ottawa
    - name: tinyauth
    - name: tinyauth-killinit
    - name: cliproxy
    - name: firefly
    - name: media-apps
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur-production
      app.kubernetes.io/part-of: kopiur
  path: ./kubernetes/apps/base/kopiur/kopiur-ottawa-policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  # Policies are intentionally not a readiness gate: a scheduled policy is
  # only proven after its first Succeeded Snapshot and restore drill.
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
