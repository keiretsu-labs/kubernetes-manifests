---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: buzz-infra
  namespace: flux-system
spec:
  targetNamespace: buzz
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: buzz
  dependsOn:
    - name: cnpg-system
    - name: dragonfly-operator-system
    - name: garage
    - name: garage-ottawa-reference-grants
    - name: rook-ceph-cluster-config
  path: ./kubernetes/apps/base/buzz/buzz/infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: buzz
  namespace: flux-system
spec:
  targetNamespace: buzz
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: buzz
  dependsOn:
    - name: buzz-infra
    - name: home-local-gateway
    - name: monitoring
  path: ./kubernetes/apps/base/buzz/buzz/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
