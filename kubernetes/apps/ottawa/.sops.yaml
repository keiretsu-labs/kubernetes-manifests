---
creation_rules:
  # Encrypted Secret manifests under the ottawa location tree (bhaiya
  # GitRepository credentials, external-secrets sources). The kubernetes-apps
  # Kustomization injects sops decryption for everything under
  # kubernetes/apps/<location>, so these resolve without a per-app rule file.
  - path_regex: .*.yaml
    encrypted_regex: ^(data|stringData)$
    pgp: FAC8E7C3A2BC7DEE58A01C5928E1AB8AF0CF07A5
