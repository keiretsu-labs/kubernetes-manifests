---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-mcs
  namespace: flux-system
spec:
  dependsOn:
    - name: gatus
  targetNamespace: gatus
  commonMetadata:
    labels:
      app.kubernetes.io/name: gatus-mcs
  path: ./kubernetes/apps/base/gatus/gatus-mcs
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
