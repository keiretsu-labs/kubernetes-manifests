---
# TEMPORARY bridge (2026-10-07): bhaiya-v2-control lists discovery.k8s.io
# EndpointSlices since corp/bhaiya dfe1d7327, but the Role shipped in the
# bhaiya-v2-deploy artifact only grants core endpoints, so control crash-loops
# on cache sync. corp/bhaiya PR #1584 adds the rule to the artifact; delete
# this file once a deploy containing #1584 is applied.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bhaiya-control-endpointslices
  namespace: bhaiya
  labels:
    app.kubernetes.io/part-of: bhaiya-v2
    app.kubernetes.io/component: control
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bhaiya-control-endpointslices
  namespace: bhaiya
  labels:
    app.kubernetes.io/part-of: bhaiya-v2
    app.kubernetes.io/component: control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bhaiya-control-endpointslices
subjects:
  - kind: ServiceAccount
    name: bhaiya-control
    namespace: bhaiya
