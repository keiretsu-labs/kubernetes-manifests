---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firefly-mcp
  namespace: flux-system
spec:
  targetNamespace: firefly
  commonMetadata:
    labels:
      app.kubernetes.io/name: firefly-mcp
  path: ./kubernetes/apps/base/firefly/firefly/mcp
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 5m
