---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app k8gb-prometheus
  namespace: flux-system
spec:
  targetNamespace: keiretsu-top
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: k8gb-config
    - name: mimir
  path: ./kubernetes/apps/base/k8gb/k8gb-prometheus-ottawa
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
