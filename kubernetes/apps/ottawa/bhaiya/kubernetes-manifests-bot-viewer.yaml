---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kubernetes-manifests-bot-viewer
  namespace: flux-system
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/part-of: bhaiya
spec:
  # SA lives in bhaiya; ClusterRole(Binding) are cluster-scoped.
  targetNamespace: bhaiya
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/part-of: bhaiya
  dependsOn:
    - name: bhaiya
  path: ./kubernetes/apps/base/bhaiya/kubernetes-manifests-bot-viewer
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
