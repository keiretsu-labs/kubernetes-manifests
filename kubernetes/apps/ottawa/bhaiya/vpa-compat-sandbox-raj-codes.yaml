---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sandbox-raj-codes-compat-probe
  namespace: bhaiya
  labels:
    app.kubernetes.io/name: bhaiya
    bhaiya.corp/purpose: vpa-compatibility-probe
    bhaiya.corp/workspace: raj-codes
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandbox-raj-codes-vpa-target
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: workspace
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "4"
          memory: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-raj-codes-vpa-target
  namespace: bhaiya
  labels:
    app.kubernetes.io/name: bhaiya
    bhaiya.corp/purpose: vpa-compatibility-probe
    bhaiya.corp/workspace: raj-codes
spec:
  replicas: 0
  selector:
    matchLabels:
      bhaiya.corp/workload: workspace
      bhaiya.corp/workspace: raj-codes
  template:
    metadata:
      labels:
        bhaiya.corp/workload: workspace
        bhaiya.corp/workspace: raj-codes
    spec:
      containers:
        - name: workspace
          image: registry.k8s.io/pause:3.10.1
