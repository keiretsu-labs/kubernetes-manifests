---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefly-mcp-bhaiya-secret
  namespace: bhaiya
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-local
    kind: ClusterSecretStore
  target:
    name: bhaiya-mcp
    creationPolicy: Merge
  data:
    - secretKey: FIREFLY_III_TOKEN
      remoteRef:
        key: firefly-iii
        property: FIREFLY_III_TOKEN
