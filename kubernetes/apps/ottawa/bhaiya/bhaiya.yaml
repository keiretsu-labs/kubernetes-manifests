---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bhaiya
  namespace: flux-system
  labels:
    notifications.keiretsu.top/github-status: disabled
spec:
  targetNamespace: bhaiya
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: garage
    - name: cnpg-system
    - name: garage-keys
    - name: agent-sandbox
    - name: cert-manager
    - name: buzz
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: bhaiya
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: common-settings
      - kind: ConfigMap
        name: cluster-settings
        optional: true
