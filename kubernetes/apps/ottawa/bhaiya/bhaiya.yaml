---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bhaiya
  namespace: flux-system
spec:
  targetNamespace: bhaiya
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: garage
    - name: cnpg-system
    - name: agent-sandbox
    - name: cert-manager
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: bhaiya
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  patches:
    # CloudNativePG's Barman plugin owns database recovery through daily base
    # backups plus continuous WAL archiving. Keep the Cluster and related
    # Kubernetes objects in Velero, but do not copy live PostgreSQL files or
    # its ephemeral helper volumes through file-system backup.
    - target:
        group: postgresql.cnpg.io
        version: v1
        kind: Cluster
        name: bifrost-postgres
      patch: |-
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: bifrost-postgres
        spec:
          inheritedMetadata:
            annotations:
              backup.velero.io/backup-volumes-excludes: pgdata,scratch-data,shm,plugins
