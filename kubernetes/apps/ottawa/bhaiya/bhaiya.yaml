---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bhaiya
  namespace: flux-system
  labels:
    notifications.keiretsu.top/github-status: disabled
spec:
  # Do not set targetNamespace. The activation overlay already namespaces
  # every namespaced object, including home/bhaiya-gateway-editor. A Flux
  # targetNamespace would rewrite that Role/RoleBinding into bhaiya.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: garage
    - name: cnpg-system
    - name: garage-keys
    - name: agent-sandbox
    - name: cert-manager
  path: ./gitops/provider-fence-activation
  prune: true
  sourceRef:
    kind: GitRepository
    name: bhaiya
  interval: 10m
  retryInterval: 1m
  # Bhaiya's MCP and SSH edges may legitimately drain for 930 seconds. Keep
  # enough room for their 1053-second Deployment progress budget plus Flux
  # apply/status propagation; the previous 5-minute timeout failed the whole
  # Kustomization before a healthy long-lived-session rollout could finish.
  timeout: 20m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: bhaiya-payments
      namespace: bhaiya
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: bhaiya-payments
      namespace: bhaiya
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: bhaiya-payments-firefly
      namespace: bhaiya
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: common-settings
      - kind: ConfigMap
        name: cluster-settings
        optional: true
