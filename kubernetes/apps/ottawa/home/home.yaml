---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-tailscale-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/tailscale-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-homer
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/homer
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-local-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/local-gateway
  patches:
    # Public Envoy VIP: Maglev + DSR, externalTrafficPolicy Cluster (handoff
    # step 2 of 2; step 1 made the old Service ClusterIP so the VIP is free).
    # This is what lets the base 2 public replicas share the VIP: the 1-replica
    # stopgap (#3449) is gone. See
    # docs/agent-knowledge/ssh-public-path-investigation-20260909.md.
    # UDM ECMP (`maximum-paths 4`) moves established flows between nodes; Maglev
    # picks the same backend on every node and DSR keeps the client tuple (real
    # client IP, existing socket), so a moved flow is not reset. Cilium honours
    # forwarding-mode / lb-algorithm only at Service creation, hence the rename.
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy
          value: Cluster
        - op: add
          path: /spec/provider/kubernetes/envoyService/name
          value: envoy-home-public-dsr
        - op: add
          path: /spec/provider/kubernetes/envoyService/annotations
          value:
            service.cilium.io/forwarding-mode: dsr
            service.cilium.io/lb-algorithm: maglev
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-dnsrecords
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: home-local-gateway
  path: ./kubernetes/apps/base/home/home/dnsrecords
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
