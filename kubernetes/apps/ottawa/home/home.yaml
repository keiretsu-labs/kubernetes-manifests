---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-homepage
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
    - name: home-homer
  path: ./kubernetes/apps/base/home/home/homepage
  prune: true
  sourceRef:
    kind: GitRepository
