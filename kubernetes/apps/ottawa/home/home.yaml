---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-tailscale-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/tailscale-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-homer
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/homer
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-local-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/local-gateway
  patches:
    # Public Envoy VIP: Maglev + DSR, externalTrafficPolicy Cluster.
    # Base replicas=2 restored (drops #3449 1-replica stopgap). Supersedes #3453/#3480.
    # UDM ECMP moves flows; Maglev+DSR keep client tuple so second advertiser is safe.
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy
          value: Cluster
        - op: add
          path: /spec/provider/kubernetes/envoyService/name
          value: envoy-home-public-dsr
        - op: add
          path: /spec/provider/kubernetes/envoyService/annotations
          value:
            service.cilium.io/forwarding-mode: dsr
            service.cilium.io/lb-algorithm: maglev
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-dnsrecords
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: home-local-gateway
  path: ./kubernetes/apps/base/home/home/dnsrecords
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
