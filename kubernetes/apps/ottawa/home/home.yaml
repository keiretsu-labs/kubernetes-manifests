  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-local-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/local-gateway
  # One public Envoy replica = one BGP next hop for the public VIP.
  #
  # The UDM reaches 10.169.10.15/32 over Cilium BGP with `maximum-paths 4`, and
  # with externalTrafficPolicy: Local every node holding a ready public Envoy
  # advertises the /32. Two replicas (rei + shiro) gave the UDM two next hops,
  # and it moves established WAN flows between them mid-stream. Hubble on
  # 2026-10-06 showed 10/10 dropped public :22 sessions SYN'd on rei, then
  # their next packets arriving at shiro, where the shiro Envoy has no socket
  # and answers RST (client: "Connection closed by remote host" / exit 255;
  # rei Envoy: downstream RemoteReset). Several flows of different ages moved
  # in the same second, so this is a UDM next-hop event, not a per-flow timer.
  # With a single advertiser the UDM has nothing to move a flow to.
  #
  # Trade-off: no second public Envoy. A pod restart is a few seconds of
  # public-ingress outage, and a lost node waits out the default 300s taint
  # tolerations before the pod reschedules. Keeping two replicas needs
  # flow-consistent forwarding instead (Cilium Maglev + DSR with
  # externalTrafficPolicy: Cluster). Plain Cluster/SNAT was A/B'd in #2761 /
  # #2980 and did not help: SNAT changes the source tuple the backend sees, so
  # a moved flow still misses its socket.
  # See docs/agent-knowledge/ssh-public-path-investigation-20260909.md.
  patches:
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/envoyDeployment/replicas
          value: 1
    # Public Envoy VIP: Maglev + DSR, externalTrafficPolicy Cluster.
    # UDM ECMP (`maximum-paths 4`) can move established flows between nodes;
    # Maglev picks the same backend on every node and DSR keeps the client
    # tuple, so a moved flow lands on its existing socket (no RST). Cilium only
    # honours the annotations from Service creation, so the Service is renamed:
    # Envoy Gateway creates envoy-home-public-dsr with the annotations and
    # deletes the old Service (DeleteAllExcept); LB-IPAM hands the pinned VIP
    # to the new Service once the old one is gone. Needs the cilium agent
    # flags (bpf.lbModeAnnotation / lbAlgorithmAnnotation / dsrDispatch) rolled
    # first. Runbook + rollback: docs/ops/ottawa-public-envoy-maglev-dsr.md.
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy
          value: Cluster
        - op: add
          path: /spec/provider/kubernetes/envoyService/name
          value: envoy-home-public-dsr
        - op: add
          path: /spec/provider/kubernetes/envoyService/annotations
          value:
            service.cilium.io/forwarding-mode: dsr
            service.cilium.io/lb-algorithm: maglev
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-dnsrecords
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: home-local-gateway
  path: ./kubernetes/apps/base/home/home/dnsrecords
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
