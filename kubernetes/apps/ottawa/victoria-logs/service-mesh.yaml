apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-mesh
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9428
      protocol: TCP
      targetPort: http
  selector:
    app: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
---
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: victoria-logs-mesh
  namespace: monitoring
