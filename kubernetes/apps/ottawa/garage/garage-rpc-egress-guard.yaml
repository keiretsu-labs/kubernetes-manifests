---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-rpc-egress-guard
  namespace: flux-system
spec:
  dependsOn:
    - name: garage
  commonMetadata:
    labels:
      app.kubernetes.io/name: garage-rpc-egress-guard
  path: ./kubernetes/apps/base/garage/garage-rpc-egress-guard-ottawa
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
