---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app envoy-ai-gateway-system-routes
  namespace: flux-system
spec:
  # Routes intentionally live in cliproxy (Gateway + AIGatewayRoute + Backend).
  # Separate from install KS so targetNamespace does not rewrite them into
  # envoy-ai-gateway-system.
  targetNamespace: cliproxy
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-ai-gateway-system-install
  path: ./kubernetes/apps/base/envoy-ai-gateway-system/routes
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 5m
