---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app envoy-ai-gateway-system-grants
  namespace: flux-system
spec:
  # Separate from the routes KS purely so targetNamespace can differ: the
  # grant has to exist in the namespace holding the Service it authorizes.
  targetNamespace: envoy-gateway-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-ai-gateway-system-install
  path: ./kubernetes/apps/base/envoy-ai-gateway-system/grants
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 5m
