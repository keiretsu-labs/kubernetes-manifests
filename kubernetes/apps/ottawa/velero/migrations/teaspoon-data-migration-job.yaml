apiVersion: batch/v1
kind: Job
metadata:
  name: teaspoon-data-migration-v5
  namespace: bhaiya
  labels:
    app.kubernetes.io/name: teaspoon-data-migration
    app.kubernetes.io/part-of: bhaiya-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teaspoon-data-migration
        app.kubernetes.io/part-of: bhaiya-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  bhaiya.corp/workload: workspace
                  bhaiya.corp/workspace: teaspoon
              topologyKey: kubernetes.io/hostname
      securityContext:
        # The legacy PVC contains root-owned files created by its init
        # containers. This one-shot, source-read-only copy job needs DAC read
        # access to preserve those files; it has no service account or network.
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: oci.cdn.keiretsu.top/corp/workspace:0.3.145
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              source=/mnt/source
              target=/mnt/target

              printf 'source_usage='
              du -sh "$source" | cut -f1
              printf 'target_usage_before='
              du -sh "$target" | cut -f1

              # The source is a Velero-restored snapshot and remains read-only.
              # The active workspace must be quiesced while this job runs so
              # SQLite sidecars and other durable files cannot change during
              # the copy. Keep target-only files for rollback-safe merging.
              # lost+found is filesystem metadata, not workspace data.
              find "$source" -xdev -mindepth 1 ! -path "$source/lost+found" ! -path "$source/lost+found/*" -printf '%y %P\n' | sort > /tmp/source-entries
              find "$source" -xdev -type f ! -path "$source/lost+found/*" -printf '%s %P\n' | sort > /tmp/source-files
              source_entries=$(wc -l < /tmp/source-entries | tr -d ' ')
              source_files=$(wc -l < /tmp/source-files | tr -d ' ')
              echo "source_entry_count=$source_entries"
              echo "source_file_count=$source_files"

              for source_entry in "$source"/* "$source"/.[!.]* "$source"/..?*; do
                if [ ! -e "$source_entry" ] && [ ! -L "$source_entry" ]; then
                  continue
                fi
                source_entry_name=$(basename "$source_entry")
                if [ "$source_entry_name" = 'lost+found' ]; then
                  continue
                fi
                cp -a "$source_entry" "$target/"
              done

              # gh historically lived below a nested home directory in the
              # restored PVC. Normalize it to the active image's XDG path so
              # an ordinary `gh` invocation uses the migrated account.
              gh_user() {
                awk '$1 == "user:" { print $2; exit }' "$1"
              }
              source_gh=''
              for candidate in "$source/.config/gh/hosts.yml" "$source/home/.config/gh/hosts.yml"; do
                if [ -f "$candidate" ]; then
                  source_gh="$candidate"
                  break
                fi
              done
              if [ -n "$source_gh" ]; then
                echo 'source_github_cli_config=present'
                source_account=$(gh_user "$source_gh")
                echo "source_github_cli_account=$source_account"
                if [ "$source_account" != 'rajsinghtechbot' ]; then
                  echo 'github_cli_account_mismatch=source'
                  exit 1
                fi
                mkdir -p "$target/.config/gh"
                cp -a "$(dirname "$source_gh")/." "$target/.config/gh/"
              else
                echo 'source_github_cli_config=absent'
              fi

              if [ ! -f "$target/.config/gh/hosts.yml" ]; then
                for candidate in "$target/home/.config/gh/hosts.yml" "$target/.config/gh/hosts.yml"; do
                  if [ -f "$candidate" ]; then
                    mkdir -p "$target/.config/gh"
                    cp -a "$(dirname "$candidate")/." "$target/.config/gh/"
                    break
                  fi
                done
              fi
              if [ ! -f "$target/.config/gh/hosts.yml" ]; then
                echo 'target_github_cli_config=absent'
                exit 1
              fi
              target_account=$(gh_user "$target/.config/gh/hosts.yml")
              echo 'target_github_cli_config=present'
              echo "target_github_cli_account=$target_account"
              if [ "$target_account" != 'rajsinghtechbot' ]; then
                echo 'github_cli_account_mismatch=target'
                exit 1
              fi

              find "$target" -xdev -mindepth 1 ! -path "$target/lost+found" ! -path "$target/lost+found/*" -printf '%y %P\n' | sort > /tmp/target-entries
              find "$target" -xdev -type f ! -path "$target/lost+found/*" -printf '%s %P\n' | sort > /tmp/target-files
              missing_entries=$(comm -23 /tmp/source-entries /tmp/target-entries)
              missing_files=$(comm -23 /tmp/source-files /tmp/target-files)
              if [ -n "$missing_entries" ] || [ -n "$missing_files" ]; then
                printf '%s\n' "$missing_entries" | sed '/^$/d' | head -20 | sed 's/^/missing_after_copy=/'
                printf '%s\n' "$missing_files" | sed '/^$/d' | head -20 | sed 's/^/file_mismatch_after_copy=/'
                echo 'copy_verification=failed'
                exit 1
              fi
              target_files=$(wc -l < /tmp/target-files | tr -d ' ')
              echo "target_file_count=$target_files"
              echo 'copy_verification=passed'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: source
              mountPath: /mnt/source
              readOnly: true
            - name: target
              mountPath: /mnt/target
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: teaspoon-data-migration-source
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: ws-teaspoon-home
        - name: tmp
          emptyDir: {}
