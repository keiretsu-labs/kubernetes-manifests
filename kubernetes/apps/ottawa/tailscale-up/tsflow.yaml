apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-up-tsflow
  namespace: flux-system
spec:
  targetNamespace: tailscale-up
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: garage-bucket
    - name: garage-reference-grants
  path: ./kubernetes/apps/base/tailscale-up/tsflow
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 5m
