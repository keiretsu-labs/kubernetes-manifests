---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-operator
  namespace: flux-system
spec:
  targetNamespace: tailscale
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/tailscale/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  dependsOn:
    - name: priority-classes
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-operator-resources
  namespace: flux-system
spec:
  targetNamespace: tailscale
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/tailscale/resources-eks
  dependsOn:
    - name: tailscale-operator
    - name: priority-classes
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  postBuild:
    substitute:
      TAILSCALE_INGRESS_PROXY_CLASS: common
  interval: 30m
  retryInterval: 1m
  timeout: 5m
