---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-system-app
  namespace: flux-system
spec:
  targetNamespace: tailscale-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/tailscale-system/tailscale-system-app-eks
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  dependsOn:
    - name: tailscale-operator
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
