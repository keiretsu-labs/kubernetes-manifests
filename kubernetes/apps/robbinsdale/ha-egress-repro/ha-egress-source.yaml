---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ha-egress-source
  namespace: flux-system
spec:
  targetNamespace: ha-egress-repro
  commonMetadata:
    labels:
      app.kubernetes.io/name: ha-egress-source
  dependsOn:
    - name: tailscale-operator-resources
  path: ./kubernetes/apps/base/ha-egress-repro/ha-egress-source
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 10m
