---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboard-prune
  namespace: flux-system
spec:
  path: ./kubernetes/apps/base/monitoring/grafana-dashboard-prune-robbinsdale
  prune: true
  force: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
