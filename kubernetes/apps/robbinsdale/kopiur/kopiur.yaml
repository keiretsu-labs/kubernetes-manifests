---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur
  namespace: flux-system
spec:
  targetNamespace: kopiur-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur
      app.kubernetes.io/part-of: kopiur
  path: ./kubernetes/apps/base/kopiur/kopiur
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-production
  namespace: flux-system
spec:
  dependsOn:
    - name: kopiur
    - name: kopiur-robbinsdale-repo
    - name: garage-kopiur-robbinsdale-bucket
    - name: home-apps
    - name: media-apps
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur-production
      app.kubernetes.io/part-of: kopiur
  path: ./kubernetes/apps/base/kopiur/kopiur-robbinsdale-policies
  prune: true
  # A policy status is not a safe Flux readiness gate before its first
  # scheduled snapshot and restore proof exist.
  wait: false
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 10m
