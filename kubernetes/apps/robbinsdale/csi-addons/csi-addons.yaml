---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app csi-addons
  namespace: flux-system
  labels:
    notifications.keiretsu.top/github-status: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-operator
  path: ./deploy/controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: csi-addons
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  # Upstream deploy/controller ships the controller as :latest. Pin it to the
  # digest this cluster already runs so the image only changes via a reviewed PR.
  images:
    - name: quay.io/csiaddons/k8s-controller
      digest: sha256:1f18e6db00c53f3220880fe1521c5a18b8a11f66ad510d40a686c3d508c01509
