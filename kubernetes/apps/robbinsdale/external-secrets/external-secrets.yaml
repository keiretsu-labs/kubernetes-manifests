---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-secrets-install
  namespace: flux-system
spec:
  targetNamespace: external-secrets
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/external-secrets/external-secrets/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-secrets-config
  namespace: flux-system
spec:
  targetNamespace: external-secrets
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/external-secrets/external-secrets/config
  dependsOn:
    - name: external-secrets-install
  # The shared Kubernetes provider is namespace-scoped. Robbinsdale's
  # Woodpecker consumer uses this existing store name for Ottawa's woodpecker
  # namespace; Ottawa's source-side reader is declared with the app.
  patches:
    - target:
        group: external-secrets.io
        version: v1
        kind: ClusterSecretStore
        name: kubernetes-ottawa
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/remoteNamespace
          value: woodpecker
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
