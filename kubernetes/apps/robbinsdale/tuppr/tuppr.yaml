---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tuppr
  namespace: flux-system
spec:
  targetNamespace: system-upgrade
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cert-manager
  path: ./kubernetes/apps/base/tuppr/tuppr-app/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  # Keep the controller paused while Titan's RBD recovery is validated.
  # This also prevents the interrupted Tank rollout from being recreated.
  patches:
    - patch: |-
        - op: add
          path: /spec/suspend
          value: true
      target:
        group: helm.toolkit.fluxcd.io
        version: v2
        kind: HelmRelease
        name: tuppr
