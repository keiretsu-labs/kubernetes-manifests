---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app woodpecker-secret-sync
  namespace: flux-system
spec:
  targetNamespace: woodpecker
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-config
  path: ./kubernetes/apps/base/woodpecker/woodpecker-robbinsdale/secret-sync
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: woodpecker-default-agent-secret
      namespace: woodpecker
  interval: 30m
  retryInterval: 1m
  timeout: 10m
