---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app woodpecker-step-cpu-request
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/woodpecker/woodpecker-step-cpu-request
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 1m
  retryInterval: 1m
  timeout: 5m
