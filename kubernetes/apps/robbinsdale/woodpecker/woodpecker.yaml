---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app woodpecker
  namespace: flux-system
spec:
  targetNamespace: woodpecker
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: woodpecker-secret-sync
  path: ./kubernetes/apps/base/woodpecker/woodpecker-robbinsdale/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
