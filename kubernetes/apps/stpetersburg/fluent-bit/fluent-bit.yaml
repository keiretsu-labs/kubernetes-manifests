---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app fluent-bit
  namespace: flux-system
spec:
  targetNamespace: fluent-bit
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: victoria-logs
  path: ./kubernetes/apps/base/fluent-bit/fluent-bit
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  patches:
    - target:
        group: grafana.integreatly.org
        version: v1beta1
        kind: GrafanaDashboard
      patch: |-
        apiVersion: grafana.integreatly.org/v1beta1
        kind: GrafanaDashboard
        metadata:
          name: remove-without-grafana
        $$patch: delete
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
