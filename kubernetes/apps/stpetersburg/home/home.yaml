---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-local-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/local-gateway
  # Advertise the private VIP from every node while Envoy remains on the two
  # Spark nodes. Cluster forwarding avoids placing ingress on memory-pressured
  # orin-0; the trade-off is that Envoy backends see the forwarding node IP.
  patches:
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: private
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy
          value: Cluster
    # St. Pete's orin-0 is request-exhausted. Keep the public Envoy's existing
    # CPU request and sidecar request, but lower only the data-plane memory
    # request; the generated deployment has no memory limit today, so none is
    # changed here. The 2-replica 25% surge rollout can use Spark-1 headroom.
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: add
          path: /spec/provider/kubernetes/envoyDeployment/container
          value:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
        # orin-0 is memory-request-exhausted and the base topologySpread (maxSkew 1,
        # DoNotSchedule) blocks a surge pod on the Sparks, so a 25% surge rollout
        # deadlocks (seen 2026-10-06 with #3452). Replace one pod at a time instead.
        - op: add
          path: /spec/provider/kubernetes/envoyDeployment/strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
    # Public Envoy VIP: Maglev + DSR, externalTrafficPolicy Cluster (handoff
    # step 2 of 2; step 1 made the old Service ClusterIP so the VIP is free).
    # UDM ECMP (`maximum-paths 4`) moves established flows between nodes; Maglev
    # picks the same backend on every node and DSR keeps the client tuple (real
    # client IP, existing socket), so a moved flow is not reset. Cilium honours
    # forwarding-mode / lb-algorithm only at Service creation, hence the rename.
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy
          value: Cluster
        - op: add
          path: /spec/provider/kubernetes/envoyService/name
          value: envoy-home-public-dsr
        - op: add
          path: /spec/provider/kubernetes/envoyService/annotations
          value:
            service.cilium.io/forwarding-mode: dsr
            service.cilium.io/lb-algorithm: maglev
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
