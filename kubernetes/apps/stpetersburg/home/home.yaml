---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-tailscale-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/tailscale-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-homer
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/homer
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-local-gateway
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: envoy-gateway-system-install
  path: ./kubernetes/apps/base/home/home/local-gateway
  # Advertise the private VIP from every node while Envoy remains on the two
  # Spark nodes. Cluster forwarding avoids placing ingress on memory-pressured
  # orin-0; the trade-off is that Envoy backends see the forwarding node IP.
  patches:
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: private
      patch: |-
        - op: replace
          path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy
          value: Cluster
    # St. Pete's orin-0 is request-exhausted. Keep the public Envoy's existing
    # CPU request and sidecar request, but lower only the data-plane memory
    # request; the generated deployment has no memory limit today, so none is
    # changed here. The 2-replica 25% surge rollout can use Spark-1 headroom.
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: add
          path: /spec/provider/kubernetes/envoyDeployment/container
          value:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
        # orin-0 is memory-request-exhausted and the base topologySpread (maxSkew 1,
        # DoNotSchedule) blocks a surge pod on the Sparks, so a 25% surge rollout
        # deadlocks (seen 2026-10-06 with #3452). Replace one pod at a time instead.
        - op: add
          path: /spec/provider/kubernetes/envoyDeployment/strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
    # Maglev+DSR handoff, step 1 of 2: make the public Envoy Service ClusterIP so
    # the pinned VIP and its Cilium LB frontends are released in place (same
    # Service object). Step 2 (next PR) renames it to envoy-home-public-dsr as
    # LoadBalancer + DSR + Maglev. Doing it in one step livelocks Cilium v1.20.2:
    # "frontend already owned by another service" (Ottawa #3451, 2026-10-06).
    # Public ingress for this cluster is down between step 1 and step 2.
    - target:
        group: gateway.envoyproxy.io
        version: v1alpha1
        kind: EnvoyProxy
        name: public
      patch: |-
        - op: add
          path: /spec/provider/kubernetes/envoyService/type
          value: ClusterIP
        - op: remove
          path: /spec/provider/kubernetes/envoyService/loadBalancerIP
        - op: remove
          path: /spec/provider/kubernetes/envoyService/externalTrafficPolicy
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
