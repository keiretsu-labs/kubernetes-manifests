apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero
  namespace: flux-system
spec:
  targetNamespace: velero-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: velero
  path: ./kubernetes/apps/base/velero/velero
  dependsOn:
    - name: garage-velero-bucket
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  patches:
    - target:
        group: grafana.integreatly.org
        version: v1beta1
        kind: GrafanaDashboard
      patch: |-
        apiVersion: grafana.integreatly.org/v1beta1
        kind: GrafanaDashboard
        metadata:
          name: remove-without-grafana
        $$patch: delete
    - target:
        group: helm.toolkit.fluxcd.io
        version: v2
        kind: HelmRelease
        name: velero
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: velero
        spec:
          values:
            configuration:
              repositoryMaintenanceJob:
                repositoryConfigData:
                  # All kopia-maintain jobs were landing on spark-0 every cycle
                  # (default scheduler behavior, not an explicit affinity), stacking
                  # transient limits onto a GPU inference node. agents-garage-kopia
                  # and bhaiya-garage-kopia were also stale BackupRepository objects left
                  # over from before the per-cluster S3 prefix split (2026-07-25) - neither
                  # "agents" nor "bhaiya" namespace, Schedule, or Backup exists in this
                  # cluster - so those were deleted outright rather than node-pinned.
                  # Pin two of the three real repos to spark-1 so maintenance is spread
                  # across the worker nodes instead of stacking on spark-0. qwen38 now
                  # spans both GPUs; the namespace LimitRange bounds each job at 2Gi.
                  repositories:
                    home-assistant-garage-kopia:
                      loadAffinity:
                        - nodeSelector:
                            matchExpressions:
                              - key: kubernetes.io/hostname
                                operator: In
                                values: ["spark-1"]
                    home-garage-kopia:
                      loadAffinity:
                        - nodeSelector:
                            matchExpressions:
                              - key: kubernetes.io/hostname
                                operator: In
                                values: ["spark-1"]
