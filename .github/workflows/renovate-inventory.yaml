name: Renovate inventory

on:
  pull_request_target:
    branches: [main]
    paths:
      - "clusters/talos-*/bootstrap/talos/topf.yaml"
      - "clusters/talos-*/flux/vars/cluster-settings.yaml"
      - "kubernetes/apps/**"
      - "docs/reference/inventory.md"

permissions:
  contents: read

concurrency:
  group: renovate-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    # Bot inventory regen; observed 100 runs max 3.5m -- 15m ample, backstops
    # a wedged regen outside working hours (renovate automerge window).
    timeout-minutes: 15
    steps:
      # pull_request_target has access to credentials. Never execute scripts
      # from the PR head; only inventory data is read from that checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Regenerate inventory from the Renovate head
        env:
          KMAN_INVENTORY_ROOT: ${{ github.workspace }}/head
        run: |
          python3 -m pip install --quiet 'pyyaml==6.0.3'
          trusted/tools/gen-inventory.sh

      - name: Commit inventory as keiretsu-kman-bot
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RENOVATE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git -C head diff --quiet -- docs/reference/inventory.md; then
            echo "Inventory is already current"
            exit 0
          fi
          git -C head config user.name 'keiretsu-kman-bot[bot]'
          git -C head config user.email '340786697+keiretsu-kman-bot[bot]@users.noreply.github.com'
          git -C head add docs/reference/inventory.md
          git -C head commit -m 'chore: regenerate deployment inventory'
          git -C head push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/${RENOVATE_HEAD_REF}"
