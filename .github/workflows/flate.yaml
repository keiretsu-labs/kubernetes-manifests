name: flate

on:
  push:
    branches: [main]
    paths:
      - "clusters/**"
      - "kubernetes/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/flate.yaml"
  pull_request:
    branches: [main]
    paths:
      - "clusters/**"
      - "kubernetes/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/flate.yaml"
  workflow_dispatch:

concurrency:
  group: flate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mimir-rule-tests:
    name: Mimir rule fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned promtool
        env:
          PROMETHEUS_VERSION: 3.14.0
          PROMETHEUS_SHA256: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
        run: |
          set -euo pipefail
          asset="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${asset}"
          curl --fail --silent --show-error --location --retry 3 "$url" -o "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$PROMETHEUS_SHA256" "$RUNNER_TEMP/$asset" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" "$RUNNER_TEMP/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run all Mimir rule fixtures
        run: kubernetes/apps/base/mimir/mimir-ottawa/rules/tests/run.sh

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cluster: [talos-ottawa, talos-robbinsdale, talos-stpetersburg]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: home-operations/flate/action@v0.6.5
        with:
          cache: true
      - name: render gate
        # check.sh is the same bounded gate agents run locally. Both paths use
        # Flate's changed-only baseline: the action exports FLATE_BASE=main,
        # while local checkouts select their default-remote merge-base.
        run: tools/check.sh ${{ matrix.cluster }}

  diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        cluster: [talos-ottawa, talos-robbinsdale, talos-stpetersburg]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: home-operations/flate/action@v0.6.5
        with:
          cache: true
      - name: flate diff
        id: diff
        run: |
          set +e
          tools/flate.sh diff all \
            --path clusters/${{ matrix.cluster }}/flux/config \
            --base origin/main \
            --no-progress \
            -o github > diff.txt 2>diff.err
          FLATE_EXIT=$?
          set -e
          # -o github emits text for GitHub's diff lexer — it must live inside a
          # ```diff fence or the '# resource' lines render as markdown headings
          {
            echo "### flate diff — ${{ matrix.cluster }}"
            if [ "$FLATE_EXIT" -ne 0 ]; then
              echo "**flate diff failed (exit $FLATE_EXIT)**"
              echo '```'
              tail -c 4000 diff.err
              echo '```'
            elif [ ! -s diff.txt ]; then
              echo "No rendered changes."
            else
              echo '```diff'
              head -c 58000 diff.txt
              if [ "$(wc -c < diff.txt)" -gt 58000 ]; then
                echo ""
                echo "# ... truncated; run 'make diff' locally for the full diff."
              fi
              echo '```'
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # informational only: a diff failure (e.g. unrenderable base tree) is
          # surfaced via the PR comment and a warning annotation; the test job
          # is the merge gate
          if [ "$FLATE_EXIT" -ne 0 ]; then
            echo "::warning::flate diff exited $FLATE_EXIT for ${{ matrix.cluster }} — see the sticky PR comment"
          fi
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: flate-diff-${{ matrix.cluster }}
          path: comment.md

  tool-self-tests:
    name: offline tool self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run offline tool self-tests
        run: tools/tests/run.sh
