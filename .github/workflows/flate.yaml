name: flate

on:
  push:
    branches: [main]
    paths:
      - "clusters/**"
      - "kubernetes/**"
      - "tools/**"
      - "docs/**"
      - "README.md"
      - "Makefile"
      - ".github/workflows/flate.yaml"
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flate: ${{ steps.filter.outputs.flate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) echo "flate=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if git diff --name-only "$base" HEAD \
            | grep -qE '^(clusters/|kubernetes/|tools/|docs/|README\.md$|Makefile$|\.github/workflows/flate\.yaml$)'; then
            echo "flate=true" >> "$GITHUB_OUTPUT"
          else
            echo "flate=false" >> "$GITHUB_OUTPUT"
          fi

  mimir-rule-tests:
    name: Mimir rule fixtures
    needs: changes
    if: needs.changes.outputs.flate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned promtool
        env:
          PROMETHEUS_VERSION: 3.14.0
          PROMETHEUS_SHA256: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
        run: |
          set -euo pipefail
          asset="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${asset}"
          curl --fail --silent --show-error --location --retry 3 "$url" -o "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$PROMETHEUS_SHA256" "$RUNNER_TEMP/$asset" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" "$RUNNER_TEMP/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run all Mimir rule fixtures
        run: kubernetes/apps/base/mimir/mimir-ottawa/rules/tests/run.sh

  test:
    needs: changes
    if: needs.changes.outputs.flate == 'true'
    runs-on: ubuntu-latest
    # 15m ~= 5x the worst observed whole-workflow wall (6.2m incl. all jobs);
    # the in-script KMAN_CHECK_TIMEOUT=120s guard fires long before this.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cluster: [talos-ottawa, talos-robbinsdale, talos-stpetersburg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install pinned aqua for the generated-data gate
        env:
          AQUA_VERSION: v2.64.0
          AQUA_SHA256: b276e927ee2f4dc214831708c0843a91007bafa06f2f9fcd6ee1fd73fd165598
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquaproj/aqua/releases/download/${AQUA_VERSION}/aqua_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/aqua.tar.gz"
          printf '%s  %s\n' "${AQUA_SHA256}" "$RUNNER_TEMP/aqua.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/aqua.tar.gz" -C "$RUNNER_TEMP" aqua
          install -m 0755 "$RUNNER_TEMP/aqua" /usr/local/bin/aqua
      - uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true
      - name: render gate
        # check.sh is the same bounded gate agents run locally. Both paths use
        # Flate's changed-only baseline: the action exports FLATE_BASE=main,
        # while local checkouts select their default-remote merge-base.
        run: tools/check.sh ${{ matrix.cluster }}

  diff:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.flate == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        cluster: [talos-ottawa, talos-robbinsdale, talos-stpetersburg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true
      - name: flate diff
        id: diff
        run: |
          set +e
          tools/flate.sh diff all \
            --path clusters/${{ matrix.cluster }}/flux/config \
            --base origin/main \
            --no-progress \
            -o github > diff.txt 2>diff.err
          FLATE_EXIT=$?
          set -e
          # -o github emits text for GitHub's diff lexer — it must live inside a
          # ```diff fence or the '# resource' lines render as markdown headings
          {
            echo "### flate diff — ${{ matrix.cluster }}"
            if [ "$FLATE_EXIT" -ne 0 ]; then
              echo "**flate diff failed (exit $FLATE_EXIT)**"
              echo '```'
              tail -c 4000 diff.err
              echo '```'
            elif [ ! -s diff.txt ]; then
              echo "No rendered changes."
            else
              echo '```diff'
              head -c 58000 diff.txt
              if [ "$(wc -c < diff.txt)" -gt 58000 ]; then
                echo ""
                echo "# ... truncated; run 'make diff' locally for the full diff."
              fi
              echo '```'
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # informational only: a diff failure (e.g. unrenderable base tree) is
          # surfaced via the PR comment and a warning annotation; the test job
          # is the merge gate
          if [ "$FLATE_EXIT" -ne 0 ]; then
            echo "::warning::flate diff exited $FLATE_EXIT for ${{ matrix.cluster }} — see the sticky PR comment"
          fi
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: flate-diff-${{ matrix.cluster }}
          path: comment.md

  tool-self-tests:
    name: offline tool self-tests
    needs: changes
    if: needs.changes.outputs.flate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run offline tool self-tests
        run: tools/tests/run.sh

  cnpg-extensions:
    name: CNPG extension load test
    needs: changes
    if: needs.changes.outputs.flate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: CREATE EXTENSION for every image-volume extension on its Cluster's imageName
        run: tools/check-cnpg-extensions.sh

  flate-gate:
    name: flate-gate
    needs: [changes, mimir-rule-tests, test, tool-self-tests, cnpg-extensions]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless every gated job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
