name: aqua-checksums

on:
  # Same-repo Renovate checksum commits use github-actions[bot], whose
  # pull_request runs require manual contributor approval. pull_request_target
  # covers that path. Fork PRs are verified on pull_request (unprivileged,
  # approval-gated); verify never checks out a fork under pull_request_target.
  pull_request:
    branches: [main]
    paths:
      - "aqua.yaml"
      - "aqua-checksums.json"
      - ".github/workflows/aqua-checksums.yaml"
  pull_request_target:
    branches: [main]
    paths:
      - "aqua.yaml"
      - "aqua-checksums.json"
      - ".github/workflows/aqua-checksums.yaml"
  push:
    branches: [main]
    paths:
      - "aqua.yaml"
      - "aqua-checksums.json"
      - ".github/workflows/aqua-checksums.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqua-checksums-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    # Checksum regen; observed max 12.4m whole-wf -- 15m per job backstops
    # the aqua update-checksum network path.
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          enable_aqua_install: false

      - name: Update generated checksums on Renovate branches
        run: aqua update-checksum --prune

      - name: Commit generated checksums on Renovate branches
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RENOVATE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- aqua-checksums.json; then
            echo "Aqua checksums are already current"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aqua-checksums.json
          git commit -m "chore(deps): update aqua checksums"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/${RENOVATE_HEAD_REF}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not reliably emit another pull_request_target
      # event. Dispatch checks at the new head so required contexts report.
      - name: Run checks on the Renovate head
        env:
          GH_TOKEN: ${{ github.token }}
          RENOVATE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run validate.yaml --ref "$RENOVATE_HEAD_REF" -f pr_number="$PR_NUMBER"
          gh workflow run aqua-checksums.yaml --ref "$RENOVATE_HEAD_REF"

  verify:
    # Fork heads run only on pull_request (no base secrets, approval-gated).
    # Same-repo heads, including post-checksum dispatches, stay on
    # pull_request_target / push / workflow_dispatch.
    if: >-
      always() &&
      (needs.update.result == 'success' || needs.update.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository) ||
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      )
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Immutable commit. Prefer the SHA the update job just pushed; never
          # a floating fork ref. Fork jobs are pull_request-only (public clone).
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.update.outputs.sha || github.event.pull_request.head.sha || github.sha }}

      - name: Install Aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          enable_aqua_install: false

      - name: Verify checksums
        run: |
          cp aqua-checksums.json /tmp/aqua-checksums.before.json
          aqua update-checksum --prune
          diff -u /tmp/aqua-checksums.before.json aqua-checksums.json
