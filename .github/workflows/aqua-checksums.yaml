name: aqua-checksums

on:
  # Checksum commits use github-actions[bot], whose pull_request runs require
  # manual contributor approval. The base workflow handles PRs without that gate.
  pull_request_target:
    branches: [main]
    paths:
      - "aqua.yaml"
      - "aqua-checksums.json"
      - ".github/workflows/aqua-checksums.yaml"
  push:
    branches: [main]
    paths:
      - "aqua.yaml"
      - "aqua-checksums.json"
      - ".github/workflows/aqua-checksums.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqua-checksums-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          enable_aqua_install: false

      - name: Update generated checksums on Renovate branches
        run: aqua update-checksum --prune

      - name: Commit generated checksums on Renovate branches
        env:
          RENOVATE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- aqua-checksums.json; then
            echo "Aqua checksums are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aqua-checksums.json
          git commit -m "chore(deps): update aqua checksums"
          git push origin "HEAD:${RENOVATE_HEAD_REF}"

      # GITHUB_TOKEN pushes do not reliably emit another pull_request_target
      # event. Dispatch checks at the new head so required contexts report.
      - name: Run checks on the Renovate head
        env:
          GH_TOKEN: ${{ github.token }}
          RENOVATE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run validate.yaml --ref "$RENOVATE_HEAD_REF" -f pr_number="$PR_NUMBER"
          gh workflow run aqua-checksums.yaml --ref "$RENOVATE_HEAD_REF"

  verify:
    if: >-
      always() &&
      (needs.update.result == 'success' || needs.update.result == 'skipped')
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # The update job may have pushed a new checksum commit.
          ref: ${{ github.event.pull_request.head.ref || github.sha }}
          persist-credentials: false

      - name: Install Aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          enable_aqua_install: false

      - name: Verify checksums
        run: |
          cp aqua-checksums.json /tmp/aqua-checksums.before.json
          aqua update-checksum --prune
          diff -u /tmp/aqua-checksums.before.json aqua-checksums.json
