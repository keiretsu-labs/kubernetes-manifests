name: Build & Push Garage WebAdmin Image

on:
  push:
    branches: ["main"]
    paths:
      - "garage-webadmin/Dockerfile"
      - "garage-webadmin/nginx.conf.template"
      - "garage-webadmin/overlay/**"
      - "garage-webadmin/source.env"
      - ".github/workflows/garage-webadmin-build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/garage-webadmin

concurrency:
  # Serialize the registry publisher: rapid pushes to the image paths must not
  # race two builds onto the same tags. Later commits supersede earlier ones.
  group: garage-webadmin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone garage-webadmin source
        run: |
          set -a
          source garage-webadmin/source.env
          set +a
          GARAGE_WEBADMIN_REV="${GARAGE_WEBADMIN_REF#*@}"
          git clone --filter=blob:none --no-checkout "$GARAGE_WEBADMIN_REPOSITORY" /tmp/garage-webadmin
          git -C /tmp/garage-webadmin checkout --detach "$GARAGE_WEBADMIN_REV"

      - name: Copy build files into source
        run: |
          cp garage-webadmin/Dockerfile /tmp/garage-webadmin/Dockerfile
          cp garage-webadmin/nginx.conf.template /tmp/garage-webadmin/nginx.conf.template
          cp -r garage-webadmin/overlay /tmp/garage-webadmin/overlay

      - name: Compute tags
        id: tags
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: /tmp/garage-webadmin
          platforms: linux/amd64
          outputs: type=docker,dest=amd64.tar
          cache-from: type=gha,scope=garage-webadmin-amd64
          cache-to: type=gha,scope=garage-webadmin-amd64,mode=max
          provenance: false

      - name: Build arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: /tmp/garage-webadmin
          platforms: linux/arm64
          outputs: type=docker,dest=arm64.tar
          cache-from: type=gha,scope=garage-webadmin-arm64
          cache-to: type=gha,scope=garage-webadmin-arm64,mode=max
          provenance: false

      - name: Push per-arch images with skopeo
        run: |
          set -e
          for ARCH in amd64 arm64; do
            skopeo copy \
              "docker-archive:${ARCH}.tar" \
              "docker://${{ env.IMAGE }}:build-${ARCH}"
          done

      - name: Create and push multi-arch manifest
        run: |
          set -e
          for TAG in "${{ steps.tags.outputs.sha }}" "latest"; do
            crane index append \
              --manifest "${{ env.IMAGE }}:build-amd64" \
              --manifest "${{ env.IMAGE }}:build-arm64" \
              --tag "${{ env.IMAGE }}:${TAG}"
          done
