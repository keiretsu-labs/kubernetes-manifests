name: Validate YAML

on:
  # In-repository Renovate branches receive checksum commits from
  # github-actions[bot]. GitHub's contributor approval gate blocks pull_request
  # runs for those commits, including this required check.
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Skip non-Renovate PRs
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'renovate/')
        run: echo "Not a Renovate PR, skipping validation"

      - uses: actions/checkout@v7
        if: >-
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'renovate/')
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install PyYAML
        if: >-
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'renovate/')
        run: pip3 install pyyaml --quiet

      - name: Validate changed YAML files
        if: >-
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'renovate/')
        run: |
          files=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only \
            | grep -E '\.ya?ml$' || true)
          if [ -z "$files" ]; then
            echo "No YAML files changed"
            exit 0
          fi
          failed=0
          for f in $files; do
            if [ -f "$f" ]; then
              if python3 -c "import yaml,sys; sys.setrecursionlimit(100000); list(yaml.safe_load_all(open(sys.argv[1])))" "$f" 2>&1; then
                echo "OK: $f"
              else
                echo "FAIL: $f"
                failed=1
              fi
            fi
          done
          exit $failed
        env:
          GH_TOKEN: ${{ github.token }}
