name: Validate YAML

on:
  # Keep a check on PRs that edit this workflow while changing trigger types.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate.yaml"
  # In-repository Renovate branches receive checksum commits from
  # github-actions[bot]. GitHub's contributor approval gate blocks pull_request
  # runs for those commits, including this required check.
  pull_request_target:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Renovate PR to validate after a checksum commit
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  # workflow_dispatch check runs are not matched by the main ruleset, so the
  # dispatched run also reports the required `validate` context as a commit
  # status (attributed to GitHub Actions, integration 15368).
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    # Required merge check; a hung pip/pyyaml step would stall every PR.
    # Observed: 100 runs, max 2.5m -- 10m is ~4x ceiling with pip headroom.
    timeout-minutes: 10
    steps:
      - name: Confirm dispatch matches the Renovate PR
        id: dispatch-guard
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECT_REF: ${{ github.ref_name }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECT_REF" == renovate/* ]]; then
            echo "dispatch ref '$EXPECT_REF' is not a renovate/* branch"
            exit 1
          fi
          info=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid,author)
          head_ref=$(printf '%s' "$info" | jq -r .headRefName)
          head_sha=$(printf '%s' "$info" | jq -r .headRefOid)
          author=$(printf '%s' "$info" | jq -r .author.login)
          if [ "$head_ref" != "$EXPECT_REF" ]; then
            echo "PR #$PR_NUMBER headRefName '$head_ref' != dispatch ref '$EXPECT_REF'"
            exit 1
          fi
          if [ "$head_sha" != "$EXPECT_SHA" ]; then
            # Checksum commits can land on the branch before the PR head OID
            # refreshes. The dispatch SHA must be that head or a descendant.
            cmp_status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${head_sha}...${EXPECT_SHA}" --jq .status)
            case "$cmp_status" in
              identical|ahead) ;;
              *)
                echo "PR #$PR_NUMBER headRefOid '$head_sha' is not an ancestor of dispatch sha '$EXPECT_SHA' (compare $cmp_status)"
                exit 1
                ;;
            esac
          fi
          case "$author" in
            renovate\[bot\]|app/renovate) ;;
            *)
              echo "PR #$PR_NUMBER author '$author' is not renovate[bot]"
              exit 1
              ;;
          esac
          echo "dispatch matches renovate PR #$PR_NUMBER @ $head_sha"

      - name: Skip non-Renovate PRs
        if: >-
          !(
            (github.event_name == 'pull_request_target' &&
              github.event.pull_request.user.login == 'renovate[bot]' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              startsWith(github.head_ref, 'renovate/')) ||
            github.event_name == 'merge_group' ||
            (github.event_name == 'workflow_dispatch' &&
              steps.dispatch-guard.outcome == 'success')
          )
        run: echo "Not a Renovate PR, skipping validation"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: >-
          (github.event_name == 'pull_request_target' &&
            github.event.pull_request.user.login == 'renovate[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.head_ref, 'renovate/')) ||
          github.event_name == 'merge_group' ||
          (github.event_name == 'workflow_dispatch' &&
            steps.dispatch-guard.outcome == 'success')
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          persist-credentials: false

      - name: Install PyYAML
        if: >-
          (github.event_name == 'pull_request_target' &&
            github.event.pull_request.user.login == 'renovate[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.head_ref, 'renovate/')) ||
          github.event_name == 'merge_group' ||
          (github.event_name == 'workflow_dispatch' &&
            steps.dispatch-guard.outcome == 'success')
        run: pip3 install 'pyyaml==6.0.3' --quiet

      - name: Validate changed YAML files
        if: >-
          (github.event_name == 'pull_request_target' &&
            github.event.pull_request.user.login == 'renovate[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.head_ref, 'renovate/')) ||
          github.event_name == 'merge_group' ||
          (github.event_name == 'workflow_dispatch' &&
            steps.dispatch-guard.outcome == 'success')
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            files=$(git diff --name-only "${{ github.event.merge_group.base_sha }}" HEAD \
              | grep -E '\.ya?ml$' || true)
          else
            files=$(gh pr diff "${{ github.event.pull_request.number || inputs.pr_number }}" --name-only \
              | grep -E '\.ya?ml$' || true)
          fi
          if [ -z "$files" ]; then
            echo "No YAML files changed"
            exit 0
          fi
          failed=0
          for f in $files; do
            if [ -f "$f" ]; then
              if python3 -c "import yaml,sys; sys.setrecursionlimit(100000); list(yaml.safe_load_all(open(sys.argv[1])))" "$f" 2>&1; then
                echo "OK: $f"
              else
                echo "FAIL: $f"
                failed=1
              fi
            fi
          done
          exit $failed
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report required validate status for dispatched runs
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          steps.dispatch-guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=validate \
            -f description="Validate YAML (dispatched for PR #${{ inputs.pr_number }})" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
