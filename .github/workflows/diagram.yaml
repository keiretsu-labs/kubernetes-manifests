name: architecture diagram

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/architecture.svg"
      - "clusters/**"
      - "kubernetes/**"
      - "tools/check-diagram.sh"
      - "tools/render-diagram.sh"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/architecture.svg"
      - "clusters/**"
      - "kubernetes/**"
      - "tools/check-diagram.sh"
      - "tools/render-diagram.sh"
  workflow_dispatch:

concurrency:
  group: diagram-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagram:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ships graphviz, but install explicitly so the gate always
      # reports syntax=dot rather than silently degrading to the structural
      # fallback if that image changes.
      - name: Install graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      # Syntax, secret scan, on-disk coverage, and whether the committed SVG
      # was rendered from the DOT currently in the README.
      - name: Check the embedded architecture diagram
        run: tools/check-diagram.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: architecture-diagram
          path: docs/architecture.svg
          if-no-files-found: warn
