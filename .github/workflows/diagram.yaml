name: architecture diagram

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/diagrams/**"
      - "docs/reference/architecture.md"
      - "docs/reference/inventory.md"
      - "clusters/**"
      - "kubernetes/**"
      - "tools/check-diagram.sh"
      - "tools/render-diagram.sh"
      - "tools/gen-inventory.sh"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/diagrams/**"
      - "docs/reference/architecture.md"
      - "docs/reference/inventory.md"
      - "clusters/**"
      - "kubernetes/**"
      - "tools/check-diagram.sh"
      - "tools/render-diagram.sh"
      - "tools/gen-inventory.sh"
  workflow_dispatch:

concurrency:
  group: diagram-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagram:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ubuntu-latest ships graphviz, but install explicitly so the gate always
      # reports syntax=dot rather than silently degrading to the structural
      # fallback if that image changes.
      - name: Install graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      # Syntax, secret scan, SVG-matches-source stamps, inventory freshness,
      # on-disk coverage, and README-to-diagram links.
      - name: Check the architecture diagrams
        run: tools/check-diagram.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: architecture-diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
