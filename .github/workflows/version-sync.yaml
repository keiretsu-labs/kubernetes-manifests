name: version-sync

# Runs on push to main as well as pull_request: the drift this catches has come
# from direct pushes that bypass PR gates, so a pull_request-only trigger would
# miss it.
on:
  push:
    branches: [main]
    paths:
      - "clusters/*/bootstrap/talos/talconfig.yaml"
      - "kubernetes/apps/base/tuppr/**"
      - "kubernetes/apps/base/rook-ceph/**"
      - "kubernetes/apps/base/mimir/**"
      - "kubernetes/apps/base/monitoring/grafana/dashboards/mimir/**"
      - "kubernetes/apps/base/monitoring/kromgo/**"
      - "kubernetes/apps/base/open-cluster-management/**"
      - "kubernetes/apps/base/open-cluster-management-agent/**"
      - "kubernetes/apps/base/flux-system/flux-system-common/flux-operator/**"
      - "kubernetes/apps/base/flux-system/flux-system-common/flux-instance/**"
      - "kubernetes/apps/base/kube-system/cilium-*/app/**"
      - "kubernetes/apps/base/envoy-gateway-system/envoy-gw-common/install/**"
      - "kubernetes/apps/base/teslamate/**"
      - "kubernetes/apps/base/monitoring/grafana/dashboards/teslamate/**"
      - "clusters/common/flux/repositories/helm/csi-driver-smb.yaml"
      - "kubernetes/apps/base/csi-driver-smb/**"
      - "kubernetes/apps/base/snapshot-controller/**"
      - "kubernetes/apps/base/media/media-*/kometa/**"
      - "tools/check-versions.sh"
      - ".github/workflows/version-sync.yaml"
  pull_request:
    branches: [main]
    paths:
      - "clusters/*/bootstrap/talos/talconfig.yaml"
      - "kubernetes/apps/base/tuppr/**"
      - "kubernetes/apps/base/rook-ceph/**"
      - "kubernetes/apps/base/mimir/**"
      - "kubernetes/apps/base/monitoring/grafana/dashboards/mimir/**"
      - "kubernetes/apps/base/monitoring/kromgo/**"
      - "kubernetes/apps/base/open-cluster-management/**"
      - "kubernetes/apps/base/open-cluster-management-agent/**"
      - "kubernetes/apps/base/flux-system/flux-system-common/flux-operator/**"
      - "kubernetes/apps/base/flux-system/flux-system-common/flux-instance/**"
      - "kubernetes/apps/base/kube-system/cilium-*/app/**"
      - "kubernetes/apps/base/envoy-gateway-system/envoy-gw-common/install/**"
      - "kubernetes/apps/base/teslamate/**"
      - "kubernetes/apps/base/monitoring/grafana/dashboards/teslamate/**"
      - "clusters/common/flux/repositories/helm/csi-driver-smb.yaml"
      - "kubernetes/apps/base/csi-driver-smb/**"
      - "kubernetes/apps/base/snapshot-controller/**"
      - "kubernetes/apps/base/media/media-*/kometa/**"
      - "tools/check-versions.sh"
      - ".github/workflows/version-sync.yaml"
  workflow_dispatch:

concurrency:
  group: version-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: pip3 install pyyaml --quiet

      - name: Check coupled version invariants
        run: tools/check-versions.sh
